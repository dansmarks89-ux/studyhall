<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice test</title>
<meta name="robots" content="noindex">
<style>
:root{--paper:#FDFBFA;--panel:#FFFFFF;--ink:#1B2330;--muted:#5D6672;--line:#E6E0DD;--trace:#0D6B5B;--bad:#B42318;--focus:#1E4FC2;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#11151B;--panel:#181E26;--ink:#E7EBF0;--muted:#9AA3AF;--line:#29313C;--trace:#3FC6A7;--bad:#F07063;--focus:#7EA2FF;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#11151B;--panel:#181E26;--ink:#E7EBF0;--muted:#9AA3AF;--line:#29313C;--trace:#3FC6A7;--bad:#F07063;--focus:#7EA2FF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0} h2{font-size:1.1rem;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
button,select{font:inherit;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
button{cursor:pointer;font-weight:600} button:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.bad{color:var(--bad)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:6px;overflow-wrap:anywhere}
meter{width:100%;height:14px}
audio{width:100%}
</style>
<script src="../shared/supabase.js"></script>
<script src="../shared/sh.js"></script>
<script src="../shared/voice.js"></script>
</head>
<body>
<main class="wrap">
  <h1>Voice test</h1>
  <p class="sub" id="who">Checking sign-in…</p>

  <section class="card">
    <label class="row">Course
      <select id="course">
        <option value="spanish">Spanish</option>
        <option value="cantonese">Cantonese</option>
        <option value="korean">Korean</option>
        <option value="vocab">Word Power (English)</option>
      </select>
    </label>
    <div id="picker" class="row"></div>
  </section>

  <section class="card">
    <div class="row"><h2>Voices</h2><button type="button" id="list">List voices</button></div>
    <p class="sub" id="lstat"></p>
    <ul id="voices"></ul>
  </section>

  <section class="card">
    <h2>Speaking</h2>
    <div class="row"><button type="button" id="rec">Record</button><button type="button" id="cancel" hidden>Cancel</button></div>
    <meter id="level" min="0" max="1" value="0"></meter>
    <p class="sub" id="mstat"></p>
    <audio id="back" controls hidden></audio>
    <p id="heard"></p>
  </section>
</main>
<script>
"use strict";
const SAMPLE = {
  spanish: "Hola, soy su cardiólogo. ¿Cómo se siente hoy?",
  cantonese: "你好，我學緊廣東話。",
  korean: "안녕하세요. 한국어를 배우고 있어요.",
  vocab: "The committee reached a unanimous decision."
};
const LANG = { spanish: "es-MX", cantonese: "zh-HK", korean: "ko-KR", vocab: "en-US" };
const $ = id => document.getElementById(id);
const courseSel = $("course");
let rec = null;

function deviceSpeak(text, rate) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANG[courseSel.value];
  u.rate = rate || 1;
  speechSynthesis.speak(u);
}
function setCourse() {
  SHVoice.stop();
  SHVoice.setup({ course: courseSel.value, fallback: deviceSpeak });
  SHVoice.picker($("picker"), { sample: SAMPLE[courseSel.value] });
  $("voices").textContent = ""; $("lstat").textContent = ""; $("heard").textContent = "";
}
function status(el, text, bad) { el.textContent = text; el.classList.toggle("bad", !!bad); }

SH.currentUser().then(u => status($("who"), u ? "Signed in as " + u.email : "Not signed in: sign in on the Study Hall home page first.", !u))
  .catch(() => status($("who"), "Couldn't check sign-in.", true));
courseSel.onchange = setCourse;
setCourse();

$("list").onclick = async () => {
  status($("lstat"), "Loading…");
  const list = await SHVoice.voices();
  const ul = $("voices"); ul.textContent = "";
  status($("lstat"), list.length ? list.length + " voices" : "No server voices (offline, signed out, or not invited).", !list.length);
  for (const v of list) {
    const li = document.createElement("li"), s = document.createElement("span"), b = document.createElement("button");
    s.textContent = v.label + " — " + v.provider + ", " + v.gender + " (" + v.id + ")";
    b.type = "button"; b.textContent = "Play";
    b.onclick = async () => { const r = await SHVoice.play(SAMPLE[courseSel.value], { voice: v.id }); status($("lstat"), v.label + ": " + r, r !== "clip"); };
    li.append(s, b); ul.append(li);
  }
};

function recording(on) {
  $("rec").textContent = on ? "Stop" : "Record";
  $("cancel").hidden = !on;
  if (!on) $("level").value = 0;
}
async function finished(blob) {
  recording(false); rec = null;
  if (!blob) { status($("mstat"), "Cancelled."); return; }
  const back = $("back");
  if (back.src) URL.revokeObjectURL(back.src);
  back.src = URL.createObjectURL(blob); back.hidden = false;
  status($("mstat"), "Recorded " + ((blob.size - 44) / 32000).toFixed(1) + " s. Transcribing…");
  try {
    const r = await SHVoice.listen(blob);
    status($("mstat"), "Done.");
    $("heard").textContent = r.text ? "Heard: “" + r.text + "” (confidence " + r.confidence.toFixed(2) + ")" : "Nothing was heard.";
  } catch (e) { status($("mstat"), "Transcribe failed: " + (e.code || "error") + ". " + e.message, true); }
}
$("rec").onclick = () => {
  if (rec) { rec.stop(); return; }
  if (!SHVoice.mic.supported) { status($("mstat"), "This browser can't record.", true); return; }
  $("heard").textContent = "";
  status($("mstat"), "Starting the microphone…");
  SHVoice.mic.start({ onLevel: l => { $("level").value = l; } }).then(r => {
    rec = r; recording(true);
    status($("mstat"), "Listening… it stops by itself after a pause.");
    r.done.then(finished);
  }, e => status($("mstat"), "Microphone: " + (e.code || "error") + ". " + e.message, true));
};
$("cancel").onclick = () => { if (rec) rec.cancel(); };
</script>
</body>
</html>
