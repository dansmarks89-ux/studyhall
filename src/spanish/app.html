<!doctype html>
<html lang="en" data-app="spanish">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinic Spanish</title>
<meta name="description" content="Everyday and clinic Spanish in two step-by-step paths, with a placement test and spaced review.">
<meta name="theme-color" content="#F2F3FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<link rel="stylesheet" href="../shared/ui.css">
<script src="../shared/ui.js"></script>
<style>
/* Layout: Learn (the path), Practice and Settings tabs; lessons, practice and checks run full screen with a bottom answer sheet. */
main{flex:1;display:flex;flex-direction:column;gap:18px;margin:0 calc(-1 * var(--gx));padding:0 var(--gx);overflow-x:clip}  /* clip: cards slide in from the side without a sideways scroll */
h3{font-size:15px;font-weight:700;color:var(--ink-2)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0;border:0;background:none;color:var(--ink-2);font:700 17px var(--font);text-decoration:none;cursor:pointer}
.back svg,.x svg{stroke-width:2.5}
.back svg{width:20px;height:20px}
.hero{display:flex;align-items:center;gap:16px}
.sub{font-size:15px;color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.sh-tile .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sh-tile .t{font-weight:800}
.sh-tile .d{color:var(--ink-2);font-size:15px}
.sh-tile .sh-tag{flex:none}
.sh-ic svg{width:22px;height:22px}
h2.sect{font-size:18px;margin-top:6px}
.linkbtn{font:inherit;font-weight:700;color:var(--accent-ink);background:none;border:0;padding:0;min-height:44px;cursor:pointer;text-decoration:underline;text-align:left}
.note{border-radius:14px;padding:10px 14px;font-size:15px;background:var(--surface-2)}
.note.warn{background:var(--gold);color:var(--on-gold)}
.note ol{margin:6px 0 0;padding-left:20px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
label.c{display:flex;gap:10px;align-items:center;min-height:44px}
.sh-voice{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
/* Learn */
.go{gap:12px}
.go .what{display:flex;flex-direction:column;gap:2px}
.go .what b{font-size:19px;line-height:1.25}
.unit-h{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;min-height:44px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.unit-h b{font-size:18px;font-weight:800;line-height:1.25}
.unit-h .sub{font-size:14px}
.sh-path > li.locked .unit-h .sub{color:var(--ink-2)}
.unit-in{display:flex;flex-direction:column;gap:10px}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 12px;border:var(--bw) solid var(--border);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);font:700 16px/1.25 var(--font);text-align:left;cursor:pointer;transition:transform .08s ease,box-shadow .08s ease}
.lesson:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
.lesson.next{background:var(--accent-soft)}
.lesson:disabled{background:transparent;box-shadow:none;color:var(--ink-2);cursor:default}
.lesson .ck{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:var(--bw) solid var(--border);font:800 14px/1 var(--font);background:var(--surface)}
.lesson.done .ck{background:var(--good);color:var(--on-good)}
.lesson.next .ck{background:var(--accent);color:var(--on-accent)}
.lesson .tx{flex:1;min-width:0}
.lesson .tx span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-weight:400;font-size:14px;color:var(--ink-2)}
.lesson.hl{animation:hl 1.6s ease both}
@keyframes hl{0%,40%{box-shadow:0 0 0 4px var(--focus)}}
/* sessions */
.qtop{display:flex;align-items:center;gap:12px}
.qtop .sh-progress{flex:1}
.x{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;margin-left:-10px;border:0;border-radius:12px;background:transparent;color:var(--ink-2);cursor:pointer}
.x svg{width:24px;height:24px}
.q{display:flex;flex-direction:column;gap:14px}
#ex{flex:1}
.dock{position:sticky;bottom:max(16px, env(safe-area-inset-bottom));margin-top:auto}  /* "Got it" sits at the bottom, where the answer sheet's Continue appears */
.prompt{font-size:26px;font-weight:800;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.qen{font-size:17px;color:var(--ink-2)}
.gap{display:inline-block;min-width:3em;border-bottom:3px solid var(--ink);background:var(--accent-soft);border-radius:6px 6px 0 0}
.opts{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.sh-opt.picked{background:var(--accent-soft)}
.answer{display:flex;gap:10px}
.answer input{flex:1;min-width:0;font-size:19px}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.accents button{width:44px;height:44px;border:var(--bw) solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink);font:700 18px var(--font);cursor:pointer}
.built{min-height:60px;border-bottom:3px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-height:44px;padding:6px 14px;border:var(--bw) solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);font:700 18px var(--font);cursor:pointer}
.tile.used{visibility:hidden}
.bank.done .tile.used{display:none}
.bank.done .tile{opacity:.45}
.bigplay{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.word{display:flex;align-items:center;justify-content:space-between;gap:14px}
.word b{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.mean{font-size:22px;font-weight:800}
.exl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.exl li{display:flex;gap:12px;align-items:flex-start;padding:12px;border:var(--bw) solid var(--border);border-radius:16px;background:var(--surface)}
.exl li > span{display:flex;flex-direction:column;gap:2px;min-width:0}
.exl .es{font-weight:700}
.exl .en{color:var(--ink-2);font-size:15px}
.gram p{max-width:62ch}
.fb{display:flex;flex-direction:column;gap:10px}
.fb .ans{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}
.fb .why{font-size:16px}
.sh-sheet .exl li{background:var(--surface)}
.dl{display:flex;flex-direction:column;gap:10px}
.line{max-width:88%;border-radius:16px;padding:10px 12px;background:var(--surface);border:var(--bw) solid var(--border);display:flex;flex-direction:column;gap:2px}
.line .who{font-size:14px;font-weight:700;color:var(--ink-2)}
.line .es{font-size:18px;font-weight:600}
.line .en{color:var(--ink-2);font-size:15px}
.line.me{align-self:flex-end;background:var(--accent-soft)}
.corr{font-size:15px;border-left:4px solid var(--gold);padding:4px 10px;align-self:flex-end;max-width:88%}
.corr.good{border-color:var(--good)}
.goals{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.goals li{display:flex;gap:10px;align-items:baseline}
.goals li::before{content:"";width:14px;height:14px;border:var(--bw) solid var(--border);border-radius:4px;flex:none;transform:translateY(2px)}
.goals li.done::before{background:var(--good)}
.mic-zone{display:flex;flex-direction:column;align-items:center;gap:16px;margin:auto 0;padding:12px 0}
.mic-zone .sh-bars{visibility:hidden}
.mic-zone.live .sh-bars{visibility:visible}
.mic-zone p{font-weight:700;text-align:center}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.sh-btn.live{background:var(--ink);color:var(--bg)}
mark.dmiss{background:var(--gold);color:var(--on-gold);border-radius:4px;padding:0 2px;text-decoration:underline}
mark.dextra{background:transparent;color:var(--bad);text-decoration:line-through}
.forms{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0;padding:12px 14px;border:var(--bw) solid var(--border);border-radius:16px;background:var(--surface)}
.forms dt{color:var(--ink-2);font-size:15px;align-self:center}
.forms dd{margin:0;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.grades{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.miss{display:flex;flex-direction:column;gap:3px;padding-top:10px;border-top:1px solid var(--surface-2)}
.miss:first-of-type{border-top:0;padding-top:0}
.miss .es{font-weight:700}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--surface-2);vertical-align:middle}
th{color:var(--ink-2);font-weight:700}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:block;height:10px;min-width:60px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%}
.gb{border-left:4px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:8px}
.adv-in{display:flex;flex-direction:column;gap:14px;margin-top:10px}
details.more > .list{margin-top:12px}
.adv-in > .sh-btn.sm{align-self:flex-start}
.adv-in h3{font-size:17px;color:var(--ink);margin-top:8px}
.lenseg .sh-seg > button{font-size:14px;padding:0 4px}
@media (max-width:400px){.prompt{font-size:23px}.word b{font-size:34px}}
</style>
<!--HOSTED-->
</head>
<body>
<div class="sh-wrap">
  <div id="voicewarn" class="note warn" hidden></div>
  <div id="astatus" class="note warn" role="status" hidden></div>
  <main id="view"></main>
</div>
<nav class="sh-tabs" id="tabs" aria-label="Sections" hidden>
  <button type="button" data-tab="learn">Learn</button>
  <button type="button" data-tab="practice">Practice</button>
  <button type="button" data-tab="settings">Settings</button>
</nav>
<dialog class="sh-dialog" id="dlg"><div class="sh-dialog-in" id="dlgin"></div></dialog>
<script>
"use strict";
/* ================= content ================= */
const LEVELS = __LEVELS__;
const LV = Object.fromEntries(LEVELS.map(l=>[l.id,l]));
/* The two paths, built by build.py: units (a level, or a word set) split into lessons of about 6 or 10 words. */
const PATH = __PATH__, UNITS = PATH.units;
const PATHS = {every:{name:"Everyday", long:"Everyday conversation"}, clinic:{name:"Clinic", long:"Spanish for the clinic"}};
const DR = __DRILLS__;
const CONJ = __CONJ__;   // verb tables: conj.json ∪ conj2.json; reflexive verbs keyed as taught ("sentarse")
const VERBS = __VERBS__;
const V2_SRC = __VOCAB2__;
const VB_SRC = __VERBLESSONS__;   // the verb lessons (data/verbs.json): a separate file on the hosted page
const HOSTED = !!window.SH;
const PASS = 0.9, TEST_SIZE = 30;      // a level's test (and its unit check)
const WPASS = 0.8, WTEST_SIZE = 20;    // the check of an Everyday or more-clinic-words set
/* Lesson plan per length: up to PATH.size new words (two recognition questions and one recall each), grammar and verb
   questions, sets of sentences (build, shadow, say) and up to rev reviews. min = how long it takes, at about 20 s a
   question and 25 s a new-word card (reviews counted at half their cap). */
const LEN = {short:{n:"Short", gram:2, sent:1, rev:6}, long:{n:"Long", gram:3, sent:2, rev:10}};
for(const ln in LEN){ const L=LEN[ln], w=PATH.size[ln]; L.min=Math.round(((3*w + L.gram + 3*L.sent + L.rev/2)*20 + 25*w)/60); }
const lenLabel = ln => `${LEN[ln].n} (about ${LEN[ln].min} min)`;
const LESSON_PTS = 100;   // a finished lesson (the same bonus as the Cantonese and Korean courses)

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = SHUI.esc;
const tidy = s => s.replace(/([?!…])\.(?=\s|$)/g,"$1");   // "*¿qué?* = what?." -> "… what?"
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
const playBtn = say => `<button class="sh-play mini" type="button" data-say="${esc(say)}" aria-label="Play: ${esc(say)}">${SHUI.icon("play")}</button>`;
const bigPlay = say => `<div class="bigplay"><button class="sh-play" type="button" data-say="${esc(say)}" aria-label="Play">${SHUI.icon("play")}</button><button class="sh-btn sm" type="button" data-say="${esc(say)}" data-rate="0.65">Slower</button></div>`;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const plural = (n, one) => `${n} ${one}${n===1?"":"s"}`;
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v, (key,x)=>x instanceof Set?[...x]:x)); }catch(e){} }
};
function seeded(str){
  let h=2166136261>>>0; for(let i=0;i<str.length;i++) h=Math.imul(h^str.charCodeAt(i),16777619)>>>0;
  return ()=>{ h=(h+0x6D2B79F5)>>>0; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; };
}
const sshuffle = (a,R) => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const hashStr = s => { let h=5381; for(let i=0;i<s.length;i++) h=(h*33+s.charCodeAt(i))>>>0; return h.toString(36); };
const lc = s => String(s).toLowerCase();
function dialog(html, wire){ $("dlgin").innerHTML=html; wire($("dlgin")); $("dlg").showModal(); }
function confirmDlg(title, text, ok, onOk){
  dialog(`<h2>${esc(title)}</h2><p>${esc(text)}</p><button class="sh-btn primary block" type="button" id="dOk">${esc(ok)}</button><button class="sh-btn block" type="button" id="dNo">Cancel</button>`,
    d=>{ d.querySelector("#dOk").onclick=()=>{ $("dlg").close(); onOk(); }; d.querySelector("#dNo").onclick=()=>$("dlg").close(); });
}
$("dlg").addEventListener("click", e=>{ if(e.target===$("dlg")) $("dlg").close(); });

/* ================= audio: Study Hall voices (shared/voice.js, hosted page) or the device's voices ================= */
const S0 = store.get("csc:settings",{});
const S = {voice:S0.voice||"", rate:S0.rate||"0.85", auto:S0.auto!==false, autoSend:S0.autoSend!==false};
const saveS = () => store.set("csc:settings", S);
let voices=[], lastSay="", speakSeq=0;
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
const SHV = window.SHVoice || null;
function astatus(msg){ const el=$("astatus"); el.textContent=msg; el.hidden=!msg; }
function loadVoices(){
  voices = synth.getVoices().filter(v=>/^es([-_]|$)/i.test(v.lang));
  const rank = v => /es[-_]MX/i.test(v.lang)?0 : /es[-_]US/i.test(v.lang)?1 : /es[-_]419/i.test(v.lang)?2 : /es[-_](CO|AR|CL|PE|VE|PR|CR|GT|HN|NI|SV|PA|DO|BO|EC|PY|UY|CU)/i.test(v.lang)?3 : 4;
  voices.sort((a,b)=>rank(a)-rank(b) || (b.localService===true)-(a.localService===true));
  if(voices.length && !voices.some(v=>v.voiceURI===S.voice)){ S.voice=voices[0].voiceURI; saveS(); }
  if(voices.length) $("voicewarn").hidden=true;
  fillVoices();
}
function fillVoices(){
  const sel=$("s-voice"); if(!sel) return;
  sel.innerHTML = voices.length ? voices.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join("") : '<option value="">No Spanish voice found</option>';
  sel.value=S.voice;
}
/* Every playback goes through speak(): the chosen Study Hall voice (a recorded clip; on any failure
   voice.js falls back to the device voice), or the device voice when this page has no voice module. */
function speak(text, rate){
  if(!text) return;
  lastSay = text;
  const t = String(text).replace(/___/g," … ").replace(/…/g," ");
  if(SHV){ ++speakSeq; if(synth) synth.cancel(); SHV.play(t,{rate:rate || +S.rate}); return; }
  deviceSpeak(t, rate);
}
const AUDIO_FAIL = "Couldn't play the audio. Check your connection or the silent switch.";
function stopAudio(){ ++speakSeq; if(synth) synth.cancel(); if(SHV) SHV.stop(); }
function deviceSpeak(text, rate){
  if(!synth){ astatus("This browser has no speech engine. Open the page in Chrome, Safari or Edge to hear audio."); return; }
  const seq = ++speakSeq;
  synth.cancel();
  const v = voices.find(v=>v.voiceURI===S.voice) || voices[0];
  // Chrome can silently drop a request made in the same moment as cancel(), so wait briefly.
  setTimeout(()=>{
    if(seq!==speakSeq) return;
    const u = new SpeechSynthesisUtterance(text);
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang="es-MX";
    u.rate = rate || +S.rate;
    let started=false;
    u.onstart=()=>{ started=true; if(seq===speakSeq) astatus(""); };
    u.onerror=e=>{ if(seq===speakSeq && e.error!=="interrupted" && e.error!=="canceled") astatus(AUDIO_FAIL); };
    synth.speak(u);
    if(synth.paused) synth.resume();
    setTimeout(()=>{ if(seq===speakSeq && !started) astatus(AUDIO_FAIL); }, 4000);
  },120);
}
const autoSay = t => { if(S.auto) speak(t); else lastSay=t; };
if(synth){ loadVoices(); synth.addEventListener("voiceschanged", loadVoices); }
setTimeout(()=>{
  if(SHV) return;
  if(!synth){ $("voicewarn").innerHTML="<b>This browser can't play speech.</b> Open this page in Chrome, Safari or Edge to hear the audio."; $("voicewarn").hidden=false; return; }
  if(!voices.length){ $("voicewarn").innerHTML=`<b>No Spanish voice found on this device.</b> Audio needs a Spanish voice installed.
    <ol><li><b>Mac:</b> System Settings, Accessibility, Spoken Content, System voice, Manage Voices, Spanish: tick a Mexico or United States voice.</li>
    <li><b>iPhone / iPad:</b> Settings, Accessibility, Spoken Content, Voices, Spanish: download a Mexico or United States voice.</li>
    <li>Reload this page, open Settings, then Advanced, and press Test the device voice.</li></ol>`; $("voicewarn").hidden=false; }
},1600);
const SAMPLE = "Hola, soy su cardiólogo. ¿Cómo se siente hoy?";
if(SHV) SHV.setup({course:"spanish", fallback:deviceSpeak});
document.addEventListener("click",e=>{ const b=e.target.closest("[data-say]"); if(b){ e.preventDefault(); speak(b.dataset.say, b.dataset.rate?+b.dataset.rate:undefined); } });

/* ================= progress: this browser + the account ================= */
/* course doc P: test results per level / set (lv) and old answer counts (it).
   learner doc LR: review schedule (srs, in shards), skills (sk), words (w), mistakes (log), intro cards (intro), and the path:
   path (current path id), len (lesson length), ts (when those two were set), done (lesson ids), checks (unit ids passed or
   tested out), placed (when the learner chose a start: date, path, unit; test: by the placement test), pts (points),
   vb (verb lessons: verb -> {at: first day, t: tenses practiced, n: lessons}), vn (path lessons finished since the last verb
   lesson), vlast ("new" or "rev": what the last verb lesson was), vts (when vn / vlast changed), vall (verb lessons use every
   tense, not only those reached; set with path and len). pos (unit + lesson per path) is written to the account
   for other pages, worked out from done + checks. resetAt: when the learner last started over (older docs are ignored). */
function freshLR(){ return {v:2, srs:{}, sk:{}, w:{}, log:[], diag:null, mig:{}, intro:{}, path:"", len:"short", ts:0, done:new Set(), checks:new Set(), placed:null, pts:0, vb:{}, vn:0, vlast:"", vts:0, vall:false, resetAt:0}; }
function loadLR(o){ const r=Object.assign(freshLR(), o); r.done=new Set(o.done||[]); r.checks=new Set(o.checks||[]); return r; }
let P = Object.assign({lv:{}, it:{}}, store.get("csc:progress",{}));
let LR = loadLR(store.get("csc:learner",{}));
let db=null, uid=null, dirtyDocs=new Set(), syncing=false, syncT=null, syncDue=0, statsSent="";
let syncText = "Progress is saved in this browser.";
const SHARDS = ["srs-L","srs-V","srs-J","srs-T","srs-W","srs-B"], DOCS = ["course","learner","log",...SHARDS];
function persist(){ store.set("csc:progress",P); store.set("csc:learner",LR); }
function mergeP(r){
  for(const id in r.lv||{}){ const a=P.lv[id]||{}, b=r.lv[id]; P.lv[id]={best:Math.max(a.best||0,b.best||0), passed:!!(a.passed||b.passed), tests:Math.max(a.tests||0,b.tests||0), at:Math.max(a.at||0,b.at||0)}; }
  for(const id in r.it||{}){ const a=P.it[id], b=r.it[id]; if(!a || (b[0]||0)>(a[0]||0)) P.it[id]=b; }
}
function saveP(){ store.set("csc:progress",P); dirtyDocs.add("course"); syncSoon(15000); }
function saveLR(){ store.set("csc:learner", LR); syncSoon(30000); }  // batched: every sync downloads all progress documents; leaving the page syncs at once
function syncSoon(ms){ if(!db) return; const due=Date.now()+ms; if(syncT && syncDue>Date.now() && syncDue<=due) return; clearTimeout(syncT); syncDue=due; syncT=setTimeout(sync,ms); }  // never pushes an earlier pending sync later
/* Read the account copy and merge it into this device. Runs before every write, so a page
   left open on one device never overwrites newer work done on another. */
async function pull(){
  const qs=await db.collection("data/users/"+uid).get(), docs={};
  qs.docs.forEach(d=>{ docs[d.id]=d.data(); });
  const at=(docs.learner&&docs.learner.resetAt)||0;
  if(at>LR.resetAt){ P={lv:{}, it:{}}; LR=freshLR(); LR.resetAt=at; dirtyDocs.clear(); }   // started over on another device
  for(const id in docs){
    const body=docs[id]; if(!body || id==="stats" || (body.resetAt||0)<LR.resetAt) continue;   // written before the last start-over
    if(id==="course") mergeP(body); else if(mergeLR(id, body)) dirtyDocs.add(id);
  }
  mapOldProgress(); persist();
  return new Set(Object.keys(docs));
}
async function sync(){
  if(!db || syncing || (!dirtyDocs.size && JSON.stringify(statsDoc())===statsSent)) return;
  syncing=true; let names=[];
  const col=db.collection("data/users/"+uid);
  try{
    await pull(); names=[...dirtyDocs]; dirtyDocs.clear();
    for(const n of names) await col.doc(n).set(docBody(n));
    const st=statsDoc(), key=JSON.stringify(st);
    if(key!==statsSent){ await col.doc("stats").set(Object.assign({}, st, {at:Date.now()})); statsSent=key; }
    syncText="Progress synced to your account.";
  }
  catch(e){ names.forEach(n=>dirtyDocs.add(n)); syncText="Couldn't sync just now; progress is kept in this browser."; }
  finally{ syncing=false; if(dirtyDocs.size) syncT=setTimeout(sync,5000); }
}
/* Leaving the page saves; coming back to it pulls in anything done on another device. */

});

    const user=await window.claude.use("user"), d=await window.claude.use("db");
    const id=user && d ? await user.id() : null; if(!id) return;
    db=d; uid=id;
    const have=await pull();
    DOCS.forEach(n=>{ if(!have.has(n) && JSON.stringify(docBody(n)).length>60) dirtyDocs.add(n); });
    syncText="Progress synced to your account.";
  }catch(e){ db=null; syncText="Progress is saved in this browser (account sync is unavailable)."; }

    done:[...LR.done], checks:[...LR.checks], placed:LR.placed, pts:LR.pts, vb:LR.vb, vn:LR.vn, vlast:LR.vlast, vts:LR.vts, vall:LR.vall,

function mergeLR(name, d){
  let ch=false;
  if(name==="learner"){
    for(const m of ["sk","w"]) for(const k in d[m]||{}){ const a=LR[m][k], b=d[m][k]; if(!a || b[1]>a[1]){ LR[m][k]=b; } else if(a[1]>b[1]) ch=true; }
    if(d.diag && (!LR.diag || d.diag.day>LR.diag.day)) LR.diag=d.diag; else if(LR.diag && (!d.diag || LR.diag.day>d.diag.day)) ch=true;
    for(const k in d.mig||{}) LR.mig[k] = k==="card" ? Math.max(LR.mig.card||0, d.mig.card||0) : LR.mig[k]||d.mig[k];   // card: 1 = show, 2 = answered
    if((LR.mig.card||0)>((d.mig||{}).card||0)) ch=true;
    const ri=d.intro||{};
    for(const k in ri) if(!LR.intro[k]) LR.intro[k]=ri[k];
    for(const k in LR.intro) if(!ri[k]){ ch=true; break; }
    for(const f of ["done","checks"]){ const b=new Set(d[f]||[]); b.forEach(x=>LR[f].add(x)); if(LR[f].size>b.size) ch=true; }
    if(d.placed && (!LR.placed || d.placed.at>LR.placed.at)) LR.placed=d.placed; else if(LR.placed && (!d.placed || LR.placed.at>d.placed.at)) ch=true;
    if((d.pts||0)>LR.pts) LR.pts=d.pts; else if(LR.pts>(d.pts||0)) ch=true;
    if((d.ts||0)>LR.ts){ LR.path=d.path; LR.len=d.len; LR.vall=!!d.vall; LR.ts=d.ts; } else if(LR.ts>(d.ts||0)) ch=true;
    const rv=d.vb||{};
    for(const v in rv){ const a=LR.vb[v], b=rv[v];
      const m=a ? {at:Math.min(a.at,b.at), t:[...new Set(a.t.concat(b.t))], n:Math.max(a.n,b.n)} : b;
      if(a && (m.t.length>b.t.length || m.at<b.at || m.n>b.n)) ch=true;
      LR.vb[v]=m; }
    if(Object.keys(LR.vb).some(v=>!rv[v])) ch=true;
    if((d.vts||0)>LR.vts){ LR.vn=d.vn||0; LR.vlast=d.vlast||""; LR.vts=d.vts; } else if(LR.vts>(d.vts||0)) ch=true;
  } else if(name==="log"){
    const seen=new Set((d.e||[]).map(e=>e.t+"|"+e.id)), mine=new Set(LR.log.map(e=>e.t+"|"+e.id));
    if(LR.log.some(e=>!seen.has(e.t+"|"+e.id))) ch=true;
    LR.log = LR.log.concat((d.e||[]).filter(e=>!mine.has(e.t+"|"+e.id))).sort((a,b)=>a.t-b.t).slice(-LOG_MAX);
  } else if(name.startsWith("srs-")){
    const rr=d.r||{};
    for(const id in rr){ const a=LR.srs[id], b=rr[id]; if(!a || b[2]>a[2] || (b[2]===a[2] && b[4]>a[4])) LR.srs[id]=b; }
    for(const id in LR.srs) if(shardOf(id)===name){ const b=rr[id], a=LR.srs[id]; if(!b || a[2]>b[2]) { ch=true; break; } }
  }
  return ch;
}
function migrateLegacy(){
  if(LR.mig.legacy) return;

    if(!ALL[id] || LR.srs[id]) continue;

    LR.srs[id]=[b, d+1+(k++%5), n, c, d-1]; dirtyDocs.add(shardOf(id));
  }

}
/* Old progress on the paths: a passed level or word set is a passed unit; a lesson whose words were all met
   before the paths existed counts as done (checked once, when the account and the Everyday words are in).
   A learner who had progress then gets a one-time card on Learn offering the level check (mig.card = 1). */
function mapOldProgress(){
  let ch=false;
  for(const u in UNITS){ const old=P.lv[UNITS[u].kind==="level"?u:UNITS[u].set]; if(old && old.passed && !LR.checks.has(u)){ LR.checks.add(u); ch=true; } }
  if(!LR.mig.path && boot.acct && V2.state==="ok"){
    for(const u in UNITS) for(const ln in LEN) UNITS[u].lessons[ln].forEach(ls=>{ if(ls.w.every(k=>WORD[k] && isIntroduced(k))) LR.done.add(ls.id); });
    if(Object.keys(LR.srs).length && !LR.mig.card) LR.mig.card=1;
    LR.mig.path=true; ch=true;
  }
  if(ch){ dirtyDocs.add("learner"); saveLR(); }
}

function drillTest(id){

/* Questions for one set, the same every time for the same content (seeded by the set id). Ids come from
   entry ids, so editing the content never moves progress to another word. Answer is always option 0. */
function v2Items(set){
  const R=seeded(set.id), E=set.entries, out=[];
  const same=(a,b)=> lc(a.w)===lc(b.w) || lc(a.en)===lc(b.en) || (a.type||[]).some(t=>(b.type||[]).some(u=>lc(u)===lc(t)));

    const key=`${set.lv}:${e.id}`, base="v:"+key, ex=e.ex.map(x=>[x.es,x.en]), say=cleanSay(e.w);
    const why=tidy(`*${e.w}* = ${e.en}.`)+(e.note?" "+e.note:""), tag={w:[key], sk:["s:vocab"]};
    WORD[key]={w:e.w, en:e.en, note:e.note||"", pos:e.pos, ex, set:set.id};

    for(const o of ranked(e)){ if(seenEn.has(lc(o.en)) || seenW.has(lc(o.w))) continue; seenEn.add(lc(o.en)); seenW.add(lc(o.w)); d.push(o); if(d.length===3) break; }
    if(d.length===3){
      out.push({t:"mc", id:base+":se", q:`What does *${e.w}* mean?`, opts:[e.en,...d.map(o=>o.en)], a:0, optsEn:true, why, more:ex, say, k:"v2e", oe:WRONG, ...tag});
      out.push({t:"mc", id:base+":es", q:`Which is Spanish for “${e.en}”?`, opts:[e.w,...d.map(o=>o.w)], a:0, why, more:ex, say, k:"e2v", oe:WRONG, ...tag});
      out.push({t:"listen", id:base+":ls", say, opts:[e.en,...d.map(o=>o.en)], a:0, why, more:ex, k:"listen", oe:WRONG, w:[key], sk:["s:listen","s:vocab"]});
    }
    if(e.type && e.type.length) out.push({t:"fill", id:base+":ty", q:"___", prompt:`Type the Spanish for: ${e.en}`, en:"", hint:"", a:e.type, show:e.type[0], say:e.type[0], why, more:ex, k:"type", ...tag});
    e.ex.forEach((x,i)=>{
      const j=x.es.indexOf(x.hit); if(!x.hit || j<0) return;

  }

    if(x){ const others=W.ex.filter(e=>e!==x).map(e=>e[0]).concat(Object.values(WORD).filter(o=>o.set===W.set && o!==W).slice(0,8).flatMap(o=>o.ex.map(e=>e[0])));
      it=tilesItem(id, x[0], x[1], others, [m[1]], ["s:order"]); }

  else if((m=id.match(/^v([ctlw]):(.+:[0-9a-z]+)$/))){ const x=VB.sid[m[2]]; if(x) it=vsItem(m[1], x); }

/* Build-the-sentence from a Spanish sentence: its words plus two from other sentences (picked the same way every time). */

/* ---------- verbs: conjugation tables for every taught verb, tenses opened by grammar progress ---------- */
const TENSE_ORDER = ["Present","Preterite","Imperfect","ir a","Future","Present perfect","Present subjunctive","Command (+)","Command (−)","Conditional","Imperfect subjunctive"];
const TLABEL = {"ir a":"ir a + infinitive","Command (+)":"Command","Command (−)":"Negative command"};
const CPERS = ["","tú","usted","nosotros","ustedes"];
const REFL = ["me","te","se","nos","se"];
/* Correct but rude or odd as affirmative commands ("muérete" / "muera" = "drop dead" / "die", "cállate" = "shut up", "búrlate",
   "véngate", "sufra", "orínate", "desmáyate", "acumúlate"): left out of affirmative command drills. Their negative commands
   are useful in the clinic ("no se muera", "no se desmaye") and stay. */
const NO_COMMAND = new Set(["morirse","morir","orinarse","desmayarse","acumularse","callarse","burlarse","vengarse","sufrir"]);
const isCmd = t => t.startsWith("Command");
/* Verbs of the gustar pattern agree with the thing liked, not the person: no person-by-person drills for them. */
const GUSTAR = new Set(["gustar","encantar","doler","importar","interesar","fascinar","apetecer"]);
/* A taught headword's verb table: "llamarse (me llamo / se llama)" -> llamarse, "levantarse / pararse" -> levantarse,
   "acordarse de" -> acordarse. Phrases ("tener sed") have no table. */
function verbOf(k){
  const W=WORD[k]; if(!W || W.phrase || (W.pos ? W.pos!=="verb" : !/^to /.test(W.en))) return null;
  return W.w.replace(/\s*\(.*?\)/g,"").split(" / ").map(h=>h.trim().replace(/\s+(de|con|que|a|en)$/,"")).find(h=>CONJ[h]) || null;

/* The five forms (yo … ustedes) of a verb in a tense; "" where the form doesn't exist (yo commands, soler's future). */
function vforms(v, t){
  if(t==="ir a"){ const b=base(v); return CONJ.ir[0].map((f,p)=> v===b ? `${f} a ${v}` : `${REFL[p]} ${f} a ${b}`); }
  if(t==="Command (+)" && NO_COMMAND.has(v)) return ["","","","",""];
  return CONJ[v][TENSES.indexOf(t)].map(f=> f && t==="Command (−)" ? "no "+f : f);
}
const persLabel = (t, p) => isCmd(t) ? CPERS[p] : PERS[p];
const tenseUse = t => t==="ir a" ? "What is going to happen: a form of ir, then a, then the infinitive." : DR.use[t];
function verbItem(v, t, p, pick){
  if(!CONJ[v] || !TSK[t]) return null;
  const F=vforms(v,t), f=F[p]; if(!f) return null;
  const tl=TLABEL[t]||t, why=`**${tl}.** ${tenseUse(t)} *${v}*: ${F.filter(Boolean).join(", ")}.`;
  const tag={tn:t, sk:[TSK[t]], lem:v, pn:p, say:f, why};
  if(pick){
    const R=seeded(`${v}:${t}:${p}`), seen=new Set([f]), opts=[f];
    const cands=sshuffle(F.filter(Boolean),R).concat(sshuffle(TENSE_ORDER.filter(x=>x!==t).map(x=>vforms(v,x)[p]).filter(Boolean),R));
    for(const c of cands){ if(opts.length<4 && !seen.has(c)){ seen.add(c); opts.push(c); } }
    if(opts.length<3) return null;
    return Object.assign({t:"mc", id:`cjp:${v}:${t}:${p}`, q:`*${v}*, ${tl}, ${persLabel(t,p)}`, opts, a:0, k:"vpick"}, tag);
  }
  if(ITEM[`cj:${v}:${t}:${p}`]) return ITEM[`cj:${v}:${t}:${p}`];
  const a=[f]; if(t==="Command (−)") a.push(f.slice(3));                       // "no" may be left out
  if(t==="ir a" && v!==base(v)) a.push(`${CONJ.ir[0][p]} a ${base(v)}${REFL[p]}`);  // voy a sentarme
  return Object.assign({t:"fill", id:`cj:${v}:${t}:${p}`, q:"___", prompt:`${v}, ${tl}, ${persLabel(t,p)}`, en:"", hint:"", a, show:f, k:"conj"}, tag);

/* A tense is open once the lesson with the grammar note that teaches it is done (or its unit passed);
   inLesson = the lesson being built, so the tense its own grammar card teaches is drilled right away. */
function tenseOpen(t, inLesson){
  return (PATH.tenses[t]||[]).some(([u,gi])=>LR.checks.has(u) || Object.values(UNITS[u].lessons).some(L=>L.some(ls=>(ls.g||[]).includes(gi) && (LR.done.has(ls.id) || ls===inLesson))));

/* Verb questions: for each verb, pick a form (the newest open tense first), then type a form in another tense or person. */
function verbQuestions(verbs, n, inLesson){
  const open=TENSE_ORDER.filter(t=>tenseOpen(t,inLesson)); if(!open.length) return [];
  const out=[];
  for(const v of verbs){
    if(out.length>=2*n) break;
    if(isThird(v)) continue;
    const ts=open.filter(t=>vforms(v,t).some(Boolean)); if(!ts.length) continue;
    const t1=out.length ? ts[Math.floor(Math.random()*ts.length)] : ts[ts.length-1], t2=ts[Math.floor(Math.random()*ts.length)];
    const ps=t=>shuffle([0,1,2,3,4].filter(p=>vforms(v,t)[p]));
    const p1=ps(t1)[0], p2=ps(t2).find(p=>t2!==t1 || p!==p1);
    const a=itemFor(`cjp:${v}:${t1}:${p1}`), b=p2===undefined ? null : itemFor(`cj:${v}:${t2}:${p2}`);
    if(a) out.push(a); if(b) out.push(b);

/* Verbs met most recently (for lessons without a verb, and for verb practice): verbs of words met and verbs of verb lessons. */
function recentVerbs(n){
  const met=Object.keys(LR.intro).map(k=>[verbOf(k), LR.intro[k]]).concat(Object.entries(LR.vb).map(([v,o])=>[v, o.at]));
  const out=[];
  // (CONJ: a verb synced from a newer build may lack a table here)
  for(const [v] of met.filter(x=>x[0] && CONJ[x[0]]).sort((a,b)=>b[1]-a[1])){ if(!isThird(v) && !out.includes(v)) out.push(v); if(out.length>=n) break; }
  return out;

/* ---------- verb lessons: one verb in the tenses reached (data/verbs.json; content/verbs/VERBS.md) ----------
   Every VERB_EVERY finished path lessons, Continue starts a verb lesson. The verb is the most useful one (the path's order)
   not studied yet, or, every other time while there is one, a verb studied before that has tenses reached since ("rev").
   A lesson works through up to VCAP tenses not yet practiced with that verb (then ones practiced before). */
const VB = {state:"loading", order:null, verbs:null, sid:{}};   // sid: "verb:hash of the sentence" -> sentence (s.v = its verb)
function addVB(d){ VB.order=d.order; VB.verbs=d.verbs; for(const v in d.verbs) d.verbs[v].s.forEach(x=>{ x.v=v; VB.sid[v+":"+hashStr(x.es)]=x; }); }

}
const vAvail = v => reachedTenses().filter(t=>vAllowed(v,t) && vPersons(v,t).length && vSents(v,t).length);
const vbFresh = v => { const had=(LR.vb[v]||{t:[]}).t; return vAvail(v).filter(t=>!had.includes(t)); };
function vbNext(){

  const order=VB.order[pathId()], fresh=order.find(v=>!LR.vb[v] && vAvail(v).length), back=order.find(v=>LR.vb[v] && vbFresh(v).length);
  return back && (LR.vlast==="new" || !fresh) ? {v:back, mode:"rev"} : fresh ? {v:fresh, mode:"new"} : null;

const vbDue = () => LR.vn>=VERB_EVERY ? vbNext() : null;
/* One sentence as a question. kind c: type the verb into it (the English shown); t: build it from tiles; l: hear it, pick the
   meaning; w: which tense? (no English; the clue decides; options = the same person in tenses reached that are wrong there). */
function vsItem(kind, x){

  const why=`**${tl}.** ${tenseUse(x.t)}${x.clue?` The clue: *${x.clue}*.`:""}`;
  const tag={tn:x.t, lem:v, pn:x.p, sk:[TSK[x.t]].concat(x.k==="obj"?["g:objpron"]:[]), say:x.es, more:[]};
  if(kind==="c"){

    const a=new Set([ans]);

    const hint=[v, isThird(v) ? "" : persLabel(x.t,x.p), x.k==="obj" ? "with its pronoun" : ""].filter(Boolean).join(", ");   // "you" can be tú or usted
    return Object.assign({t:"fill", id, q:x.es.slice(0,i)+"___"+x.es.slice(i+ans.length), en:x.en, hint, a:[...a], show:x.es, why, k:"vcz"}, tag);
  }
  if(kind==="t") return Object.assign(tilesItem(id, x.es, x.en, VB.verbs[v].s.filter(o=>o!==x).map(o=>o.es), null, tag.sk), tag, {why});

    for(const o of sshuffle(VB.verbs[v].s,R).sort((a,b)=>(b.t===x.t)-(a.t===x.t))){ if(opts.length<4 && !seen.has(lc(o.en))){ seen.add(lc(o.en)); opts.push(o.en); } }
    return Object.assign({t:"listen", id, opts, a:0, why, k:"vlisten"}, tag, {sk:["s:listen", TSK[x.t]]});

function startVerbLesson(v, mode, back){

    const next=()=>{ while(si<ss.length){ const x=ss[si++]; if(!usedS.has(x.es)) return x; } return null; };
    // verbs said of things have no person drills: their sentences, typed and heard by turns (the statement too when it's the only tense)
    const plan=isThird(v) ? (focus.length>1 ? ["cz","l"] : ["cz","l","cz"]) : ["pick","cz","type","pick","type","cz","pick"];   // at most two sentences typed
    for(const kd of plan){
      if(n>=per) break;
      let it=null;
      if(kd==="cz" || kd==="l"){ const x=next(); it=x && vsItem(kd==="cz"?"c":"l", x); }
      else if(pi<ps.length) it=itemFor(`${kd==="pick"?"cjp":"cj"}:${v}:${t}:${ps[pi++]}`);
      if(add(it, TLABEL[t]||t)) n++;
    }
    if(!j) from=seq.length;   // reviews go after the first tense
  });
  // sentence types, from the tenses reached (today's first): a question and an object-pronoun sentence from tiles, a negative by ear, a command
  const pool=avail.flatMap(t=>vSents(v,t)), inFocus=x=>focus.includes(x.t);
  const pref=list=>sshuffle(list,R).sort((a,b)=>inFocus(b)-inFocus(a));
  let n=0;
  for(const [k,qk] of [["q","t"],["neg","l"],["obj","t"],["cmd","c"],["q","l"],["neg","t"],["obj","c"],["stmt","l"]]){
    if(n>=Q.sent) break;
    const x=pref(pool.filter(o=>o.k===k && !usedS.has(o.es)))[0];
    if(x && add(vsItem(qk==="t" && !fitsTiles(x.es) ? "c" : qk, x), "Sentences")) n++;
  }
  // which tense?
  let w=0;
  for(const x of pref(pool.filter(o=>o.k==="stmt" && !usedS.has(o.es)))){ if(w>=Q.which) break; if(add(vsItem("w",x), "Which tense?")) w++; }
  // say it: the sentences with the fewest untaught words; in units 1-3 one with untaught words is shadowed (the model plays first)
  const K=knownSet(introducedWords(), [v]);
  const early=pathUnits().indexOf(curUnit())<3 && !!curUnit();
  const says=sshuffle(pool.concat(E.uses.map(u=>({es:u.x, en:u.xen}))).filter(x=>!usedS.has(x.es) && x.es.split(/\s+/).length<=14),R)
    .map(x=>({x, n:unknownIn(x.es,K)})).sort((a,b)=>a.n-b.n).slice(0,Q.say);
  says.forEach(({x,n:u},j)=>add({t:"say", id:"say:"+hashStr(x.es), es:x.es, en:x.en, nosrs:true, sk:["s:speak"], shadow:j%2===1 || (early && u>0)}, "Say it"));
  // reviews (about 30%): other verbs first, at most 3 on words the placement test let the learner skip
  const isV=it=>/^srs-[JB]$/.test(shardOf(it.id));
  let nOut=0;
  const due=dueItems(new Set(Object.keys(step))).filter(it=>it.lem!==v && (!testedOut(it.id) || nOut++<3));
  const rev=due.filter(isV).concat(due.filter(it=>!isV(it))).slice(0, LEN[ln].rev), n0=seq.length-from;
  rev.forEach((it,j)=>{ seq.splice(from+Math.floor((j+0.5)*n0/rev.length)+j, 0, it); step[it.id]="Review"; });
  launch({kind:"verb", title:`Verb: ${v}`, verb:v, mode, focus, units:spread(seq), src:"verb", requeue:true, step, back});
}

function itemAvailable(id){
  const a=ALL[id]; if(!a) return false;
  if(LR.srs[id] || a.card || a.gen) return true;
  if(a.lv) return unitReached(a.lv);
  if((a.it.w||[]).length && !a.it.w.some(isIntroduced)) return false;   // words not met yet
  return (SETS_OF[id]||[]).some(drillUnlocked);
}
function shardOf(id){
  if(/^[CM]\d-/.test(id)) return "srs-L";
  if(/^(v|p|tl):/.test(id)) return "srs-V";
  if(/^cjp?:/.test(id)) return "srs-J";
  if(/^v[ctlw]:/.test(id)) return "srs-B";   // verb-lesson sentences
  if(id.startsWith("wt:")||id.startsWith("fc:")) return "srs-W";
  return "srs-T";

/* ---------- classifying a wrong answer ---------- */
const PRON = new Set(["me","te","se","nos","le","les","lo","la","los","las","no"]);
const vtoks = s => norm(s).split(" ").filter(w=>w && !PRON.has(w));
function classifyForm(lem, tn, pn, text){
  const tb=CONJ[lem]; if(!tb || !tn || pn===undefined || pn===null) return null;
  const A=" "+vtoks(text).join(" ")+" "; let hits=[];
  const scan = f2 => tb.forEach((row,ti)=>row.forEach((f,pi)=>{ if(f && f2(A).includes(" "+f2(f)+" ")) hits.push([TENSES[ti],pi]); }));
  scan(x=>x); if(!hits.length) scan(strip);
  if(!hits.length) return null;
  if(hits.some(h=>h[0]===tn && h[1]===pn)) return null;
  const same=hits.find(h=>h[0]===tn);
  if(same) return ((pn===2&&same[1]===1)||(pn===1&&same[1]===2)) ? "register" : "person";
  const other=hits.filter(h=>h[0]!==tn).sort((a,b)=>(a[1]!==pn)-(b[1]!==pn))[0];
  return other ? "tense:"+other[0] : null;
}
const CAT = {person:["g:person","g:irreg"], register:["g:register","t:cmd"], serestar:["g:serestar"], pronoun:["g:objpron","g:reflex","t:cmd"],
  agree:["g:agree"], prep:["g:prep","g:time"], word:["s:vocab","s:phrase","g:connect","g:questions","g:neg","g:compare","g:time","g:gustar"],
  question:["g:questions"], neg:["g:neg"], order:["s:order"], listen:["s:listen","s:vocab"]};
const OWN = {person:"g:person", register:"g:register", serestar:"g:serestar", pronoun:"g:objpron", agree:"g:agree", prep:"g:prep",
  order:"s:order", question:"g:questions", neg:"g:neg"};
function blamed(sk, err, tn){
  const type=err.split(":")[0];
  let b = sk.filter(s => (type==="tense"||type==="infl") ? s.startsWith("t:") : (CAT[type]||[]).includes(s));
  if(!b.length && !OWN[type] && !(tn && (type==="tense"||type==="infl"))) b=sk.slice();
  if(OWN[type] && !b.includes(OWN[type])) b.push(OWN[type]);
  if(tn && TSK[tn] && (type==="tense"||type==="person"||type==="register") && !b.includes(TSK[tn])) b.push(TSK[tn]);
  return b;
}
function bump(map, key, ok){
  const r=map[key]||[0,0,0]; const n=r[1]+1, a=r[1]===0 ? (ok?1:0) : r[0]+Math.max(1/n,0.15)*((ok?1:0)-r[0]);
  map[key]=[Math.round(a*1000)/1000, n, today()];
}
// LR.w: word tag -> [accuracy, answers, last day, days with a right answer, last such day]
function bumpWord(k, ok){
  const r=LR.w[k]||[], d=today(); bump(LR.w,k,ok);
  const x=LR.w[k]; x[3]=r[3]||0; x[4]=r[4]===undefined ? -1 : r[4];
  if(ok && x[4]!==d){ x[3]++; x[4]=d; }
}

/* ---------- recording one answered exercise ---------- */
function recordUnit(it, res, ctx){
  if(!it || !res.length || (ctx && ctx.noRecord)) return;
  const d=today(), allOk=res.every(x=>x.ok);
  if(!it.nosrs){   // "Say it" units feed the skill record and log but have no review schedule
    const r=LR.srs[it.id]||[0,d,0,0,d], g=res[0].grade;
    let b=r[0];
    if(g!==undefined) b = g===0 ? 0 : g===1 ? Math.max(1,b) : g===2 ? b+1 : b+2;
    else b = allOk ? b+1 : 0;
    b=Math.min(b,6);
    LR.srs[it.id]=[b, d+INT[b], r[2]+1, r[3]+(allOk?1:0), d];
    dirtyDocs.add(shardOf(it.id));
  }
  const src=(ctx&&ctx.src)||"practice";
  res.forEach(x=>{
    const sk=x.sk||it.sk||[], tn=x.tn||it.tn||"", err=x.ok?"":(x.err||"other");
    if(x.ok){ sk.forEach(s=>bump(LR.sk,s,true)); }
    else if(err==="accent"){ sk.forEach(s=>bump(LR.sk,s,true)); }
    else blamed(sk,err,tn).forEach(s=>bump(LR.sk,s,false));
    if(x.typed && x.hasAcc) bump(LR.sk,"s:accents", err!=="accent");
    (it.w||[]).forEach(w=>bumpWord(w,x.ok||err==="accent"));
    const e={t:Date.now(), id:it.id, ok:x.ok?1:0, e:err, s:src};
    if(tn) e.tn=tn;
    if(!x.ok){ e.y=String(x.your||"").slice(0,70); e.r=String(x.right||"").slice(0,70); e.q=String(x.q||"").slice(0,100); }
    LR.log.push(e);
  });
  if(LR.log.length>LOG_MAX) LR.log=LR.log.slice(-LOG_MAX);
  dirtyDocs.add("learner"); dirtyDocs.add("log"); saveLR();
}
function logTalk(errs){
  const t=Date.now();
  errs.forEach((x,i)=>{ const s=SKILLS[x.skill]?x.skill:"s:phrase"; LR.log.push({t:t+i, id:"talk", ok:0, e:"talk:"+s, s:"talk", y:String(x.said||"").slice(0,120), r:String(x.fix||"").slice(0,120), q:String(x.why||"").slice(0,120)}); });

}

/* ---------- reading the record ---------- */
function skillRows(){
  return Object.entries(LR.sk).filter(([s])=>SKILLS[s]).map(([s,[a,n,last]])=>({id:s, a, n, last, ready:n>=MIN_N}))
    .sort((x,y)=> (y.ready-x.ready) || (x.a-y.a) || (y.n-x.n));
}
const weakSkills = () => skillRows().filter(r=>r.ready && r.a<WEAK);
function recentLog(days, f){ const cut=Date.now()-days*864e5; return LR.log.filter(e=>e.t>=cut && (!f || f(e))); }
function confusions(days){
  const m=new Map();
  recentLog(days, e=>!e.ok && e.s!=="talk" && e.e && e.e!=="other").forEach(e=>{
    let key;
    if(e.e.startsWith("tense:")){ if(!e.tn || e.e.slice(6)===e.tn) return; key=e.tn+">"+e.e.slice(6); }
    else if(["register","serestar","pronoun","agree","accent","person","prep","order","question","neg","infl"].includes(e.e)) key=e.e;
    else return;
    const c=m.get(key)||{key, n:0, ex:[]}; c.n++; if(e.y) c.ex.unshift(e); m.set(key,c);
  });
  return [...m.values()].filter(c=>c.n>=2).sort((a,b)=>b.n-a.n);
}
const CONF = {
  "Preterite>Imperfect":["Imperfect used where the preterite was needed","A single finished event at a definite time takes the preterite (*ayer me desmayé*). Save the imperfect for background, habits and \"used to\" (*de niño me desmayaba*). Look for clue words like *ayer, anoche, de repente, una vez*."],
  "Imperfect>Preterite":["Preterite used where the imperfect was needed","Background, ongoing states and habits take the imperfect: what was going on, what used to happen, age and time (*estaba en casa cuando…*, *antes caminaba mucho*). Clue words: *antes, siempre, mientras, de niño, todos los días*."],
  "Present subjunctive>Present":["Indicative used where the subjunctive was needed","After wanting, asking, advising, hoping or doubting about someone else's action (*quiero que, es importante que, ojalá, para que, antes de que*), the second verb goes in the subjunctive: *Es importante que tome…*, not *toma*."],
  "Present>Present subjunctive":["Subjunctive used where a plain statement was needed","No trigger, no subjunctive. Facts, questions and things you know or believe take the indicative: *Creo que tiene fibrilación*, *Sé que toma la pastilla*."],
  "Imperfect subjunctive>Present subjunctive":["Present subjunctive in a past or imaginary frame","When the trigger is in the past (*me pidió que, quería que*) or the sentence is imaginary (*si…, como si*), use the imperfect subjunctive: *Me pidió que llegara temprano*."],
  "Present subjunctive>Imperfect subjunctive":["Imperfect subjunctive where the present subjunctive fits","A trigger in the present (*quiero que, es importante que*) takes the present subjunctive: *Quiero que descanse*."],
  "Imperfect subjunctive>Conditional":["Conditional used after si","After *si* meaning \"if\", never the conditional. The imaginary condition takes the imperfect subjunctive and the result takes the conditional: *Si tuviera fiebre, llamaría*."],
  "Conditional>Imperfect subjunctive":["Imperfect subjunctive where \"would\" was needed","The result half of an imaginary sentence, polite requests and advice take the conditional: *¿Podría…?*, *Yo en su lugar dejaría de fumar*."],
  "Future>Conditional":["Conditional used for a plain future","*Will* = future (*tendrá, llegará*). *Would* = conditional (*tendría*)."],
  "Conditional>Future":["Future used where \"would\" was needed","*Would* (polite, hypothetical, advice) = conditional: *tendría, podría, sería*."],
  "Preterite>Present perfect":["Present perfect used for a finished past event","In Latin America a finished event with a past time (*ayer, la semana pasada, en 2019*) takes the preterite: *Ayer tuve dolor*, not *he tenido*."],
  "Present perfect>Preterite":["Preterite used for \"ever / yet / lately\"","Experiences and time up to now (*alguna vez, ya, todavía no, últimamente, esta semana*) take the present perfect: *¿Alguna vez se ha desmayado?*"],
  "Pluperfect>Preterite":["Preterite used where \"had done\" was needed","For an event that came before another past event, use *había* + participle: *Cuando llegué, ya se había ido*."],
  "Command (+)>Present":["Statement used where a command was needed","Usted commands use the subjunctive form: *tome, respire, siéntese*, not *toma / respira*."],
  "Command (−)>Present":["Statement used where a negative command was needed","Negative commands are *no* + subjunctive: *no tome, no se mueva*."],
  register:["Tú used where usted was needed (or the reverse)","With patients and strangers use usted: verb in the él/ella form (*¿Tiene…?*, *tome*) and *su*, *le*, *se*. Use tú with friends and family."],
  serestar:["Ser and estar mixed up","*Ser* = what something is (identity, profession, origin, time, events). *Estar* = state, location and how someone is now (*está cansado, está en el hospital*)."],
  pronoun:["Wrong pronoun or pronoun position","Pronouns go before a conjugated verb (*se lo doy*) and attach to infinitives, gerunds and affirmative commands (*dígame, acuéstese*). Before *lo/la*, *le* becomes *se*."],
  agree:["Gender or number agreement","Articles, adjectives and possessives match the noun: *la presión alta*, *los pies hinchados*."],
  accent:["Accent marks","The letters were right but an accent was missing or wrong. Accents change meaning (*tomo* I take / *tomó* he took) and mark commands with pronouns (*acuéstese*)."],
  person:["Wrong person on the verb","The ending must match who does it: *yo tomo*, *usted toma*, *nosotros tomamos*, *ellos toman*."],
  prep:["Prepositions","Spanish prepositions don't map one-to-one to English: *pensar en*, *depender de*, *llegar a*, *desde hace*."],
  order:["Word order","Spanish usually goes subject–verb–object, with pronouns before the conjugated verb and *no* right before the verb (or its pronoun)."],
  question:["Question words","*¿Qué?* what, *¿cuál?* which/what (before *es*), *¿cuándo?*, *¿dónde?*, *¿cuánto?*, *¿por qué?*; all carry accents."],
  neg:["Negation","*No* goes before the verb; with *nunca, nada, nadie* Spanish keeps the double negative: *No tomo nada*."],
  infl:["Infinitive or gerund where a conjugated verb was needed","After a subject, the verb must be conjugated. Use the infinitive after another verb (*quiero tomar*) or a preposition (*antes de comer*)."]
};
function confText(key){
  if(CONF[key]) return CONF[key];

  return [key,""];
}

function reviewState(ids){

  const ev=LR.log.filter(e=>ids.has(e.id)).slice(-20);

/* Due reviews (whole-tense cards stay in Verb cards), weakest first: weak skills, then low box, then most overdue. */
function dueItems(exclude){
  const d=today(), weak=new Set(weakSkills().slice(0,3).map(r=>r.id)), out=[];
  for(const id in LR.srs){ if(LR.srs[id][1]>d || (exclude && exclude.has(id))) continue; const it=itemFor(id); if(it && it.t!=="wt") out.push(it); }
  const w=it=>(it.sk||[]).some(s=>weak.has(s)) ? 0 : 1;

function coveredWords(u){ const s=new Set(); for(const ln in LEN) UNITS[u].lessons[ln].forEach(ls=>{ if(LR.done.has(ls.id)) ls.w.forEach(k=>s.add(k)); }); return s; }

function posOf(p){ const ids=pathUnits(p), u=curUnit(p); if(!u) return {u:ids.length, l:0}; const ls=curLesson(u); return {u:ids.indexOf(u), l:ls ? lessonsOf(u).indexOf(ls) : lessonsOf(u).length}; }

/* "no entiendo, ¿cómo?, ¿cuánto?": a lesson's first three words, without notes, alternatives or end punctuation */
function cleanWord(W){

/* Tested out (placement): the unit counts as passed, its words as met, and one question per word gets a long
   review interval (spread over 2 to 6 weeks) so they come back now and then to confirm, not hammered. */
function testOut(units){
  const d=today(); let k=0;
  units.forEach(u=>{
    LR.checks.add(u);
    unitWords(u).forEach(w=>{
      if(!LR.intro[w]) LR.intro[w]=d;
      const it=wordQ(w,["v2e","e2v"]);
      if(it && !LR.srs[it.id]){ LR.srs[it.id]=[4, d+14+(k++%28), 1, 1, d]; dirtyDocs.add(shardOf(it.id)); }
    });
  });

}
/* a word's question of the first kind in kinds that it has (lesson-only kinds are made on the spot) */
function wordQ(k, kinds){
  const its=(WORDITEMS[k]||[]).map(id=>ITEM[id]), m=k.match(/^(\w+):p(\d+)$/);
  for(const kd of kinds){
    const it=its.find(i=>i.k===kd); if(it) return it;
    if(m && kd==="listen") return itemFor(`p:${m[1]}:${m[2]}:ls`);
    if(m && kd==="tl") return itemFor(`p:${m[1]}:${m[2]}:tl`);
    if(kd==="cz"){ const ex=its.find(i=>i.k==="ex"); if(ex) return itemFor(ex.id.replace(/:ex(\d*)$/,":cz$1")); }
  }
  return null;
}

/* ---------- placement: walk the path's units in blocks of 5 questions ----------
   ≥4/5: the unit is known, skip ahead 2 units (1 once near the boundary); 3/5: test the next unit once more (it decides);
   ≤2/5: stop there (if units were skipped just before, test those first). Stops after 15 minutes or 60 questions. */
function placeItems(u){
  const ws=shuffle(unitWords(u).filter(k=>WORD[k])), out=[], used=new Set();
  const take=kinds=>{ for(const k of ws){ if(used.has(k)) continue; const it=wordQ(k,kinds); if(it){ used.add(k); out.push(it); return; } } };
  take(["listen"]); take(["v2e"]); take(["e2v"]); take(["v2e","e2v"]);
  const g = UNITS[u].kind==="level" ? shuffle(LV[u].items.filter(i=>i.t==="mc"||i.t==="fill"))[0] : null;
  if(g) out.push(g); else take(["ex"]);
  return out;
}
function startPlacement(){
  if(V2.state!=="ok") return wordsWait();   // the Everyday path is mostly word sets; without them the test would place too low
  const pl={path:pathId(), i:0, step:2, last:-1, border:null, ceil:null, t0:Date.now(), u:null, from:0};
  launch({kind:"place", title:"Find my level", units:[], more:r=>placeMore(r,pl), onEnd:r=>placeDone(pl)});
}
function placeMore(r, pl){
  const ids=pathUnits(pl.path);
  if(pl.u!==null){   // score the block just answered
    const s=r.results.slice(pl.from).filter(x=>x.ok).length, i=pl.i;
    if(s>=4){ pl.border=null; pl.last=i; pl.i=i+pl.step; }
    else if(s===3 && pl.border===null){ pl.border=i; pl.step=1; pl.i=i+1; }
    else if(pl.border!==null){ pl.stop=pl.border; }
    else if(i-pl.last>1){ pl.ceil=i; pl.step=1; pl.i=pl.last+1; }   // units were skipped: test them before stopping here
    else pl.stop=i;
    if(pl.ceil!==null && pl.i>=pl.ceil && pl.stop===undefined) pl.stop=pl.border!==null ? pl.border : pl.ceil;
  }
  if(pl.stop===undefined && (pl.i>=ids.length || r.results.length>=60 || Date.now()-pl.t0>15*60000)) pl.stop=Math.min(pl.border!==null?pl.border:pl.i, ids.length);
  if(pl.stop!==undefined) return null;
  pl.u=ids[pl.i]; pl.from=r.results.length;
  const items=placeItems(pl.u);
  if(!items.length) pl.stop=pl.i;
  return items;
}
function placeDone(pl){
  const st = pl.stop!==undefined ? pl.stop : (pl.border!==null ? pl.border : pl.last+1);
  go({name:"placed", st:Math.max(0,st), path:pl.path});
}

    <ul class="list" id="pList" hidden>${ids.slice(0,st).map((x,k)=>`<li><button class="sh-tile" type="button" data-k="${k}"><span class="sh-ic" aria-hidden="true">${k+1}</span><span class="tx"><span class="t">Unit ${k+1} · ${esc(UNITS[x].title)}</span><span class="d">${plural(lessonsOf(x).length,"lesson")}</span></span></button></li>`).join("")}</ul></section>`;

/* ---------- what the learner has been taught: lesson sentences use only these words where they can ---------- */
const FUNC = new Set("a al algo con como cómo cuál cuándo cuánto de del dónde e el él ella ellas ellos en es esa ese eso esta este esto está están estoy hay la las le les lo los me mi mis muy más ni no nos o para pero por porque qué que quién se sí si sin su sus también te tu tú tus un una uno unos unas usted ustedes y ya yo".split(" ").map(strip));
/* the words met (and every form of their verbs, and of verbs), plus FUNC; compared lowercase without accents */
function knownSet(keys, verbs=[]){
  const K=new Set(FUNC), add=s=>String(s).toLowerCase().split(/[^\p{L}]+/u).forEach(t=>{ if(t) K.add(strip(t)); });
  for(const k of keys){ const W=WORD[k]; if(!W) continue; add(cleanSay(W.w)); const v=verbOf(k); if(v) CONJ[v].forEach(row=>row.forEach(add)); }
  verbs.forEach(v=>CONJ[v].forEach(row=>row.forEach(add)));
  return K;
}
/* how many words of a sentence haven't been taught (plurals and gender forms of a known word count as known, and so do
   names: words with a capital inside the sentence) */
function unknownIn(es, K){
  return tokens(es).filter((t,i)=>{ if(i && /^\p{Lu}/u.test(t)) return false; const w=strip(t.toLowerCase());
    return ![w, w.replace(/s$/,""), w.replace(/es$/,""), w.replace(/[ao]s?$/,"o"), w.replace(/[ao]s?$/,"a")].some(x=>K.has(x)); }).length;
}
/* type the word into the example with the fewest untaught words (none when even that one has more than max) */
function exampleGap(k, K, max){
  const best=(WORDITEMS[k]||[]).map(id=>ITEM[id]).filter(i=>i && i.k==="ex").map(it=>({it, n:unknownIn(it.say,K)})).sort((a,b)=>a.n-b.n)[0];
  return best && best.n<=max ? itemFor(best.it.id.replace(/:ex(\d*)$/,":cz$1")) : null;
}
/* tested out by the placement test and never answered since (see testOut) */
const testedOut = id => { const r=LR.srs[id]; return !!r && r[0]>=4 && r[2]<=1; };
/* No question about the same word twice in a row and no four questions of one format in a row: a question that breaks
   this trades places with the nearest later one that fits (never moving past a card, so a word still follows its card). */
function spread(seq){
  const out=[], rest=seq.slice(), wd=u=>(u.w||[])[0], fmt=u=>u.k||u.t;
  const fits=u=>{
    if(!isQ(u)) return true;
    const run=[]; for(let i=out.length-1; i>=0 && isQ(out[i]) && run.length<3; i--) run.push(out[i]);
    if(run[0] && wd(u) && wd(run[0])===wd(u)) return false;
    return !(run.length===3 && run.every(x=>fmt(x)===fmt(u)));
  };
  while(rest.length){
    let j=0;
    if(!fits(rest[0])) for(let k=1; k<rest.length && isQ(rest[k]); k++) if(fits(rest[k])){ j=k; break; }
    out.push(rest.splice(j,1)[0]);
  }
  return out;
}

/* ---------- a lesson: the new words in groups of 2-3 (their cards, then two recognition questions each), then recall,
   grammar and verbs, and sentences (build one, shadow one, say one; long lessons two of each); due reviews mixed through ---------- */
async function startLesson(u, ls){
  const U=UNITS[u], lvl=U.kind==="level" ? LV[u] : null, L=LEN[LR.len==="long"?"long":"short"], R=seeded(ls.id);
  const words=ls.w.filter(k=>WORD[k]), mine=new Set(ls.w), K=knownSet(introducedWords().concat(words));
  const early=Math.min(...Object.keys(PATHS).map(p=>pathUnits(p).indexOf(u)).filter(i=>i>=0)) < 3;   // units 1-3
  // recognition: two per word, the formats rotating from word to word; recall: one per word, typing and the example gap taking
  // turns (in units 1-3 the gap only in a sentence with at most one untaught word)
  const REC=["listen","v2e","e2v"];
  const recog=words.map((k,i)=>{ const out=[]; for(let j=0; j<3 && out.length<2; j++){ const it=wordQ(k,[REC[(i+j)%3]]); if(it) out.push(it); } return out; });
  const recall=words.map((k,i)=>{ for(const kd of i%2 ? ["cz","type","tl"] : ["type","cz","tl"]){ const it=kd==="cz" ? exampleGap(k, K, early ? 1 : Infinity) : wordQ(k,[kd]); if(it) return it; } return null; }).filter(Boolean);
  const fewest=list=>sshuffle(list,R).sort((a,b)=>a.n-b.n);
  // grammar and verbs: the lesson's grammar cards, then the level's own questions (on these words first, then the ones with
  // the fewest untaught words) and verb forms, taking turns
  const lvQ=lvl ? lvl.items.filter(i=>i.t==="mc"||i.t==="fill") : [], onMine=i=>(i.w||[]).some(k=>mine.has(k));
  const inLv=[...sshuffle(lvQ.filter(onMine),R), ...fewest(lvQ.filter(i=>!onMine(i)).map(it=>({it, n:unknownIn(fillSentence(it.q, it.t==="mc"?it.opts[it.a]:it.a[0]),K)}))).map(x=>x.it)];
  const lessonVerbs=[...new Set(words.map(verbOf).filter(Boolean))];
  const vq=verbQuestions(lessonVerbs.length?lessonVerbs:recentVerbs(3), L.gram, ls), grammar=[];
  for(let j=0; grammar.length<L.gram && (j<inLv.length || j<vq.length); j++) [inLv[j], vq[j]].forEach(it=>{ if(it && grammar.length<L.gram) grammar.push(it); });
  const cards=(ls.g||[]).map(gi=>({t:"gram", id:`gram:${u}:${gi}`, lv:u, gi}));
  // sentences, the ones with the fewest untaught words first. In units 1-3, "Say it" from the English only when every word
  // was taught; otherwise the learner shadows the shortest example (the model plays first).
  const exs=words.flatMap(k=>WORD[k].ex.map((x,i)=>({k, i, es:x[0], en:x[1], n:unknownIn(x[0],K)})));
  const tiles=fewest([...(lvl ? lvl.items.filter(i=>i.t==="tiles" && (i.w||[]).some(k=>mine.has(k))).map(it=>({it, n:unknownIn(it.a,K)-0.5})) : []),
    ...exs.filter(x=>fitsTiles(x.es)).map(x=>({it:itemFor(`tl:${x.k}:${x.i}`), n:x.n}))]).map(x=>x.it).filter(Boolean).slice(0,L.sent);   // (the level's own sentences win ties)
  const used=new Set(tiles.map(t=>t.a)), sayable=fewest(exs.filter(x=>!used.has(x.es) && x.es.split(/\s+/).length<=14 && !/…|___|[(/]/.test(x.es)));
  const shortest=sayable.slice().sort((a,b)=>a.es.length-b.es.length);
  const sayU=(x,shadow)=>{ used.add(x.es); return {t:"say", id:"say:"+hashStr(x.es), es:x.es, en:x.en, nosrs:true, sk:["s:speak"], shadow}; };
  const sents=[];
  for(let j=0; j<L.sent; j++){
    if(tiles[j]) sents.push(tiles[j]);
    const sh=sayable.find(x=>!used.has(x.es)); if(sh) sents.push(sayU(sh,true));
    const sy=sayable.find(x=>!used.has(x.es)); if(!sy) continue;
    sents.push(early && sy.n ? sayU(shortest.find(x=>!used.has(x.es)) || sy, true) : sayU(sy,false));
  }
  // reviews: up to L.rev (about 30% of the lesson), at most 3 of them on words the placement test let the learner skip
  const qs=[...recog.flat(), ...recall, ...grammar, ...sents];
  let nOut=0;
  const due=dueItems(new Set(qs.map(x=>x.id))).filter(it=>!(it.w||[]).some(k=>mine.has(k)) && (!testedOut(it.id) || nOut++<3));
  const rev=due.slice(0, L.rev);
  // order: cards for 2-3 words and their recognition questions, the next 2-3 words, …; then recall, grammar, sentences
  const ng=Math.ceil(words.length/3), seq=[];
  let from=0;   // reviews go after the first group
  for(let g=0; g<ng; g++){
    const idx=words.map((_,i)=>i).slice(Math.floor(words.length*g/ng), Math.floor(words.length*(g+1)/ng));
    idx.forEach(i=>{ if(!isIntroduced(words[i])) seq.push({t:"intro", k:words[i], id:"intro:"+words[i]}); });
    for(let r=0; r<2; r++) idx.forEach(i=>{ if(recog[i][r]) seq.push(recog[i][r]); });
    if(!g) from=seq.length;
  }
  seq.push(...recall, ...cards, ...grammar, ...sents);
  const n0=seq.length-from;
  rev.forEach((it,j)=>seq.splice(from+Math.floor((j+0.5)*n0/rev.length)+j, 0, it));   // spread evenly
  const talk = await getSample() ? [{t:"talk", id:"talk:"+ls.id}] : [];
  const step={}, name=(list,n)=>list.forEach(it=>{ step[it.id]=n; });   // the label above each question: which part of the lesson it is
  name(recog.flat(),"Recognize"); name(recall,"Recall"); name(grammar,"Grammar and verbs"); name(sents,"Sentences"); name(rev,"Review");
  launch({kind:"lesson", title:lessonTitle(u,ls), unit:u, lesson:ls, units:[...spread(seq), ...talk], src:"lesson", requeue:true, step});
}

function weightedPick(pool, n){
  const d=today();
  const w = pool.map(i=>{ const r=LR.srs[i.id]; if(!r) return 3; if(r[0]===0) return 4; if(r[1]<=d) return 3; return 1+2*(1-r[3]/Math.max(1,r[2])); });

}

    // a missed question comes back once a few questions later (not next to its own word), while the run stays within 1.4x
    // its planned length; after that it waits for the reviews
    if(r.requeue && res.length && !res.every(x=>x.ok) && !u._again && r.total+decisions(u)<=r.max){
      const wd=x=>x && (x.w||[])[0], w=wd(u); let p=Math.min(r.i+4, r.units.length);
      while(w && p<r.units.length && (wd(r.units[p-1])===w || wd(r.units[p])===w)) p++;
      r.units.splice(p, 0, Object.assign({}, u, {_again:true})); r.total+=decisions(u); }

}
function quitRun(){
  const r=run;
  if(r.kind==="place") return confirmDlg("Stop the test?", "You'll start where the questions so far put you.", "Stop and see my result", ()=>r.onEnd(r));
  if(r.kind==="test") return confirmDlg("Leave the check?", "This attempt won't be saved.", "Leave", ()=>go(r.back));
  if(r.kind==="lesson" || r.kind==="verb") return confirmDlg("Leave this lesson?", "Your answers so far are saved, but the lesson won't count as done until you finish it.", "Leave", ()=>go(r.back || {name:"learn", hl:true}));
  if(r.results.length) return endRun(true);
  go(r.back);
}
/* Points: recognition right 10, typed / spoken / built right 15. Checks add theirs at the end (no feedback while answering). */
function earn(it, ok){
  if(!ok || run.kind==="place" || run.noRecord) return;
  const n = it.t==="fill" || it.t==="tiles" || it.t==="say" ? 15 : 10;
  if(run.kind==="test") run.owed+=n; else { SHUI.points.award(LR, n, $("qpts")); dirtyDocs.add("learner"); }
}
function endRun(early){
  const r=run;
  if(r.kind==="place") return r.onEnd(r);
  const right=r.results.filter(x=>x.ok).length, total=r.results.length, score=total ? right/total : 0;
  let title=early?"Session ended":"Session done", note="", passed=false, firstPass=false;
  if(r.kind==="lesson" && !early){ if(!LR.done.has(r.lesson.id)){ LR.vn++; LR.vts=Date.now(); } LR.done.add(r.lesson.id); SHUI.points.award(LR, LESSON_PTS); title="Lesson done"; const u=r.unit; if(!curLesson(u) && !LR.checks.has(u)) note="That was the last lesson in this unit. The unit check is ready on your path."; }
  if(r.kind==="verb" && !early){
    const o=LR.vb[r.verb]||{at:today(), t:[], n:0};
    LR.vb[r.verb]={at:o.at, t:[...new Set(o.t.concat(r.focus))], n:o.n+1};
    if(r.mode!=="again"){ LR.vlast=r.mode; LR.vts=Date.now(); if(!r.back) LR.vn=0; }   // an extra one from Practice doesn't move the path's
    SHUI.points.award(LR, LESSON_PTS); title="Verb lesson done";
  }
  if(r.kind==="test"){
    SHUI.points.award(LR, r.owed);
    passed = score>=r.pass-1e-9;
    const p=P.lv[r.rec]||{best:0,passed:false,tests:0};
    P.lv[r.rec]={best:Math.max(p.best||0,score), passed:!!(p.passed||passed), tests:(p.tests||0)+1, at:Date.now()}; saveP();
    if(passed && r.unit && !LR.checks.has(r.unit)){ LR.checks.add(r.unit); SHUI.points.award(LR, 50); firstPass=true; }
    title = passed ? (r.unit?"Unit passed!":"Passed!") : "Not yet";
    note = passed ? (firstPass ? "The next unit is open." : "") : `You need ${Math.ceil(r.pass*total)} of ${total} to pass. Each attempt draws new questions.`;
  }
  dirtyDocs.add("learner"); saveLR(); sync();
  view={name:"results"}; $("tabs").hidden=true;
  const misses=r.results.filter(x=>!x.ok);
  const toLearn = () => go({name:"learn", hl:true});
  const actions = r.kind==="lesson" || r.kind==="verb" ? [{label:"Continue", primary:true, onClick:r.back ? ()=>go(r.back) : toLearn}]
    : r.kind==="test" ? (passed ? [{label:"Continue", primary:true, onClick:toLearn}] : [{label:"Try again", primary:true, onClick:r.retry}, {label:"Back", onClick:()=>go(r.back)}])
    : [{label:"Done", primary:true, onClick:()=>go(r.back)}, {label:"Practice again", onClick:r.retry}];
  if(r.talk) actions.splice(1,0,{label:"Start a spoken conversation", onClick:()=>startTalk(LV[r.talk], 0, true, {back:{name:"practice"}})});
  SHUI.results($("view"), {score:right, total, points:(LR.pts-r.pts0)||null, newWords:r.kind==="lesson"&&r.intros||null, spoken:r.spoken||null,   // stats at 0 are left out
    levelBefore:SHUI.points.levelOf(r.pts0), levelAfter:SHUI.points.levelOf(LR.pts), title, note,
    review:r.kind==="test" ? [] : [...new Map(misses.filter(m=>m.right).map(m=>[lc(m.right),m.right])).values()].slice(0,12), actions});
  if(r.kind==="test" && misses.length) $("view").querySelector(".sh-actions").insertAdjacentHTML("beforebegin",
    `<section class="sh-card"><h2>What you missed</h2>${misses.map(m=>`<div class="miss"><span class="sub">${md(m.q)}</span><span>You: <span class="es">${esc(m.your)}</span></span><span class="row">Answer: <span class="es">${esc(m.right)}</span>${m.say?playBtn(m.say):""}</span>${m.why?`<span class="sub">${md(m.why)}</span>`:""}</div>`).join("")}</section>`);
}

/* ---------- answer feedback: the bottom sheet ---------- */
function sheet(state, title, body, onNext, label){
  const el=document.createElement("div");
  el.className="sh-sheet "+(state==="ok"?"good":state==="no"?"bad":""); el.setAttribute("role","status");
  el.innerHTML=`<div class="sh-verdict">${state==="ok"?SHUI.icon("check"):state==="no"?SHUI.icon("close"):""}<span>${esc(title)}</span></div><div class="fb">${body}</div><button class="sh-btn block ${state==="ok"?"good":"primary"}" type="button" id="next">${esc(label||"Continue")}</button>`;
  $("view").appendChild(el);
  if(run) moveBar(100*(run.i+1)/run.units.length);
  $("next").focus({preventScroll:true});
  /* The sheet covers the bottom of the screen; the page can scroll by its height (it sits in the page flow), so scroll
     just enough to show the chosen and the right option above it. */
  const keep=[...$("view").querySelectorAll(".sh-opt.right,.sh-opt.reveal,.sh-opt.wrong")].map(b=>b.getBoundingClientRect());
  if(keep.length){
    const top=Math.min(...keep.map(r=>r.top)), dy=Math.min(Math.max(...keep.map(r=>r.bottom))+12-(innerHeight-el.offsetHeight), top-72);
    if(dy>0) window.scrollBy({top:dy, behavior:SHUI.reducedMotion()?"auto":"smooth"});
  }
  $("next").onclick=()=>{ el.remove(); onNext(); };
}
const verdict = st => st==="ok" ? "Correct!" : st==="close" ? "Almost: check the accents" : "Not quite";
/* the answer, what the learner gave when it was wrong ("You chose: …"), the explanation and one more example */
function answerBody(correct, why, say, more, gave){
  return `${correct?`<p class="ans">${esc(correct)}${say?playBtn(say):""}</p>`:""}${gave?`<p class="sub">${esc(gave[0])}: <b>${esc(gave[1])}</b></p>`:""}${why?`<p class="why">${md(why)}</p>`:""}${(more||[]).length?exList(more.slice(0,1)):""}`;
}
/* A word question's answer line gives the meaning once ("¿qué? = what?"), so its explanation drops those same words. */
function meaningOf(it){
  const W=/^(v|p):/.test(it.id) && WORD[(it.w||[])[0]]; if(!W) return null;
  const pre=tidy(`*${W.w}* = ${W.en}`), why=it.why||"";
  return {w:W.w, en:W.en, why: why.startsWith(pre) ? why.slice(pre.length).replace(/^\.?\s*/,"") : why};
}
