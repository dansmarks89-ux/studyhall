/* ---------- microphone (shared/voice.js on the hosted page) ---------- */
const MIC = {rec:null, stop:null, off:false};   // off: permission denied or no microphone, so "Say it" becomes listen-and-repeat
const micOK = () => !!(SHV && SHV.mic && SHV.mic.supported) && !MIC.off;
function micCancel(){ const r=MIC.rec; MIC.rec=null; MIC.stop=null; if(r) r.cancel(); }
function micError(e){
  const c=e&&e.code;
  if(c==="mic_denied") return "Microphone access is turned off for this site. Allow it in your browser settings to speak your answers.";
  if(c==="mic_unavailable") return "No microphone was found on this device.";
  if(c==="offline") return "You're offline. Checking speech needs the internet; you can type instead.";
  if(c==="rate_limited") return "Today's limit for speech checks was reached. Type instead, or try again tomorrow.";
  if(c==="session_expired") return "You were signed out. Reload the page to sign in again.";
  if(c==="not_granted") return "Speech checking isn't turned on for your account.";
  return "Speech checking didn't work just now. Try again, or type instead.";
}
/* Tap to record, tap again (or stop talking) to finish; the transcript goes to onText(text).
   label: the element whose text shows the state (its idle text is label.dataset.idle); onState(state) for extra UI. */
function micButton(btn, label, status, onText, onFail, onState){
  const set=(state, text)=>{ btn.classList.toggle("live", state==="rec"); btn.disabled=state==="wait"; label.textContent=text||label.dataset.idle; if(onState) onState(state); };
  btn.onclick=async()=>{
    if(MIC.stop) return MIC.stop();
    stopAudio(); status.textContent="";
    let rec=null, ended=false, early=false;
    const fail=e=>{ if(!btn.isConnected) return; set("idle"); status.textContent=micError(e); if(onFail) onFail(e); };
    const finish=async()=>{
      if(ended) return; if(!rec){ early=true; return; }
      ended=true; MIC.stop=null; MIC.rec=null; set("wait","Checking…");
      try{
        const blob=await rec.stop(); if(!blob){ set("idle"); return; }   // cancelled
        const r=await SHV.listen(blob); if(!btn.isConnected) return; set("idle"); onText(String((r&&r.text)||"").trim());
      }catch(e){ fail(e); }
    };
    MIC.stop=finish; set("rec","Listening… tap when you finish");
    try{ rec=await SHV.mic.start({maxMs:20000, silenceMs:1600}); }
    catch(e){ MIC.stop=null; return fail(e); }
    if(MIC.stop!==finish){ rec.cancel(); return; }   // cancelled while starting
    MIC.rec=rec;
    rec.done.then(finish);   // ends by itself after a pause in speech (or maxMs)
    if(early) finish();
  };
}

/* ---------- "Say it" (from the English) and shadowing (repeat after the model) ---------- */
const NUM_U=["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
const NUM_T=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
const NUM_H=["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
function numEs(n){
  if(n<30) return NUM_U[n];
  if(n<100) return NUM_T[Math.floor(n/10)]+(n%10?" y "+NUM_U[n%10]:"");
  if(n<1000) return n===100 ? "cien" : NUM_H[Math.floor(n/100)]+(n%100?" "+numEs(n%100):"");
  const k=Math.floor(n/1000); return (k===1?"mil":numEs(k)+" mil")+(n%1000?" "+numEs(n%1000):"");
}
const UNO = new Set(["uno","un","una"]);
/* Words for comparing speech: lowercase, no punctuation, accents removed, digits written out (the recognizer writes "2", "8:30"). */
function sayToks(s){
  return String(s).replace(/(\d+):00\b/g,"$1").replace(/(\d+):(\d\d)\b/g,"$1 y $2").split(/\s+/).flatMap(raw=>{
    const b=raw.toLowerCase().replace(/[¿?¡!.,;:…"“”()«»]/g,"").replace(/^[-'’]+|[-'’]+$/g,""); if(!b) return [];
    const num=/^\d{1,4}$/.test(b), words=num ? numEs(+b).split(" ") : [b];
    return words.map((w,i)=>({raw:i?"":raw, key:strip(w), num}));
  });
}
/* Word-level Levenshtein similarity, plus the target and heard text with missing / extra words marked. */
function sayScore(target, heard){
  const A=sayToks(target), B=sayToks(heard), n=A.length, m=B.length;
  const eq=(a,b)=>a.key===b.key || ((a.num||b.num) && UNO.has(a.key) && UNO.has(b.key));
  const D=Array.from({length:n+1},(_,i)=>Array.from({length:m+1},(_,j)=>i?(j?0:i):j));
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) D[i][j]=Math.min(D[i-1][j]+1, D[i][j-1]+1, D[i-1][j-1]+(eq(A[i-1],B[j-1])?0:1));
  const missA=new Array(n).fill(false), extraB=new Array(m).fill(false);
  for(let i=n,j=m;i>0||j>0;){
    if(i>0 && j>0 && D[i][j]===D[i-1][j-1]+(eq(A[i-1],B[j-1])?0:1)){ if(!eq(A[i-1],B[j-1])){ missA[i-1]=true; extraB[j-1]=true; } i--; j--; }
    else if(i>0 && D[i][j]===D[i-1][j]+1){ missA[i-1]=true; i--; }
    else { extraB[j-1]=true; j--; }
  }
  const html=(T,mark,cls)=>{ const g=[]; T.forEach((t,i)=>{ if(t.raw) g.push({raw:t.raw, bad:mark[i]}); else if(mark[i]) g[g.length-1].bad=true; });
    return g.map(x=>x.bad?`<mark class="${cls}">${esc(x.raw)}</mark>`:esc(x.raw)).join(" "); };
  return {score: n||m ? 1-D[n][m]/Math.max(n,m) : 0, target:html(A,missA,"dmiss"), heard:html(B,extraB,"dextra")};
}
function mountSay(ex, it, done){
  let best=null, paid=false;   // points once, however many tries
  const head = it.shadow ? `<span class="sh-label">Repeat after the model</span><p class="prompt">${esc(it.es)}</p><p class="qen">${esc(it.en)}</p>${bigPlay(it.es)}`
    : `<span class="sh-label">Say it in Spanish</span><p class="prompt">${esc(it.en)}</p>`;
  const result=(ok, heard)=>[{id:it.id, ok, err:ok?"":"speak", q:(it.shadow?"(repeat) ":"(say it) ")+it.en, your:heard, right:it.es, say:it.es}];
  /* no microphone: play the model, the learner repeats it and rates themselves */
  const repeat=msg=>{
    ex.innerHTML=(it.shadow?head:`<span class="sh-label">Listen and repeat</span><p class="prompt">${esc(it.es)}</p><p class="qen">${esc(it.en)}</p>${bigPlay(it.es)}`)
      +(msg?`<p class="note" role="status">${esc(msg)}</p>`:"")+`<p class="sub">Play it, then say it out loud.</p>
      <button class="sh-btn primary block" type="button" id="saidIt">I said it</button><div class="pair"><button class="sh-btn" type="button" id="notYet">Not yet</button><button class="sh-btn" type="button" id="saySkip">Skip</button></div>`;
    speak(it.es);
    $("saidIt").onclick=()=>{ earn(it,true); done(result(true,"(said it aloud)")); };
    $("notYet").onclick=()=>done(result(false,"(not yet)"));
    $("saySkip").onclick=()=>done([]);
  };
  if(!micOK()) return repeat("");
  ex.innerHTML=head+`<div class="mic-zone" id="mz"><div class="sh-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <button class="sh-mic" type="button" id="sayMic" aria-label="Microphone">${SHUI.icon("mic")}</button><p id="sayLbl" data-idle="Tap to speak">Tap to speak</p><p class="sub" id="sayStatus" role="status"></p></div>
    <form class="answer" id="sayTyped" hidden><input type="text" id="sayIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type it in Spanish" aria-label="Type it in Spanish"><button class="sh-btn primary" type="submit">Check</button></form>
    <div class="pair"><button class="sh-btn" type="button" id="sayType">Type instead</button><button class="sh-btn" type="button" id="saySkip">Skip</button></div>`;
  if(it.shadow) speak(it.es);
  const judge=(text, typed)=>{
    const r=sayScore(it.es, text), st=r.score>=0.85?"ok":r.score>=0.6?"close":"no";
    if(!best || r.score>=best.score) best={score:r.score, heard:text, st};
    if(st==="ok" && !paid){ paid=true; earn(it,true); }
    const old=document.querySelector(".sh-sheet"); if(old) old.remove();   // the mic stays usable above the sheet
    sheet(st, !text?"Nothing heard":st==="close"?"Close":verdict(st),
      `<p class="ans">${st==="close"?r.target:esc(it.es)}${playBtn(it.es)}</p>
      ${text?`<p class="sub">${typed?"You typed":"We heard"}: ${st==="close"?r.heard:esc(text)}</p>`:`<p class="sub">Try again a little closer to the microphone, or type it.</p>`}
      ${st==="close"?`<p class="sub"><mark class="dmiss">Marked</mark>: missing or different. <mark class="dextra">Crossed out</mark>: extra.</p>`:""}
      ${st==="ok"?"":`<button class="sh-btn" type="button" id="again">Try again</button>`}`,
      ()=>{ micCancel(); done(result(best.st==="ok", best.heard)); });
    autoSay(it.es);
    if($("again")) $("again").onclick=()=>{ document.querySelector(".sh-sheet").remove(); };
  };
  micButton($("sayMic"), $("sayLbl"), $("sayStatus"), text=>judge(text,false), e=>{ if(e && (e.code==="mic_denied"||e.code==="mic_unavailable")){ MIC.off=true; repeat(micError(e)); } },
    st=>$("mz").classList.toggle("live", st==="rec"));
  $("sayType").onclick=()=>{ $("sayTyped").hidden=false; $("sayIn").focus(); };
  $("sayTyped").onsubmit=e=>{ e.preventDefault(); const v=$("sayIn").value.trim(); if(v) judge(v,true); };
  $("saySkip").onclick=()=>{ micCancel(); done([]); };
}

/* ================= talk: AI role-play ================= */
let talk=null, sampleFn=undefined;
async function getSample(){ if(sampleFn!==undefined) return sampleFn; try{ sampleFn = (window.claude&&window.claude.use) ? await window.claude.use("sample") : null; }catch(e){ sampleFn=null; } return sampleFn; }
/* voice: every reply is read aloud and the microphone comes first. o: {back, rp (a made-up scenario), words (lesson words), max (learner turns), onDone} */
function startTalk(l, i, voice, o){
  stopAudio(); micCancel();
  const r=o.rp || l.roleplay[i];
  talk={l, r, voice:!!voice, o, lines:[{who:"them", es:r.opening, en:""}], done:new Set(), busy:false, ctl:null, turns:0};
  go({name:"talk"}); sayReply(r.opening);
}
const sayReply = text => talk.voice ? speak(text) : autoSay(text);
function talkLeave(){ const t=talk; if(t.ctl) t.ctl.abort(); if(t.o.onDone) t.o.onDone(); else go(t.o.back); }
function renderTalk(){
  const t=talk, r=t.r, mic=micOK(), capped=t.o.max && t.turns>=t.o.max;
  $("view").innerHTML=`<div class="qtop"><button class="x" type="button" id="tBack" aria-label="Leave the conversation">${SHUI.icon("close")}</button><span class="sh-label" style="flex:1">${t.o.max?`Talk: ${t.turns} of ${t.o.max} replies`:"Conversation"}</span>${SHUI.chip(LR.pts)}</div>
    <section class="sh-card"><h2>${esc(r.title)}</h2><p>${esc(r.setup)}</p>${t.o.words?`<p class="sub">Today's words: ${esc(t.o.words.join(", "))}</p>`:""}<ul class="goals" id="goals">${r.goals.map((g,i)=>`<li class="${t.done.has(i)?"done":""}">${esc(g)}</li>`).join("")}</ul></section>
    <div class="dl" id="chat"></div>
    <p id="talkstatus" class="sub" role="status"></p>
    ${capped ? `<button class="sh-btn primary block" type="button" id="tDone">${t.o.onDone?"Continue the lesson":"Done"}</button>` : `
    ${t.voice?`<p class="sub">${mic?"Tap Speak, answer out loud, then tap again or just stop talking.":"Speaking isn't available on this device, so type your replies."}</p>`:""}
    <form class="answer" id="tform"><input type="text" id="msg" autocomplete="off" spellcheck="false" placeholder="Your reply in Spanish" aria-label="Your reply in Spanish"><button class="sh-btn${t.voice&&mic?"":" primary"}" type="submit" id="send">Send</button></form>
    ${mic?`<button class="sh-btn${t.voice?" primary":""} block" type="button" id="talkMic">${SHUI.icon("mic")}<span data-idle="Speak">Speak</span></button><label class="c" for="autoSend"><input type="checkbox" id="autoSend"${S.autoSend?" checked":""}> Send automatically after I speak</label>`:""}
    <div class="accents">${["á","é","í","ó","ú","ñ","ü","¿","¡"].map(a=>`<button type="button" data-acc="${a}" aria-label="Insert ${a}">${a}</button>`).join("")}</div>
    <div class="row">${t.o.max?"":`<button class="sh-btn sm" type="button" id="finish">Finish and get feedback</button>`}<button class="sh-btn sm ghost" type="button" id="stop" hidden>Stop</button></div>`}
    <div id="summary"></div>`;
  drawChat();
  $("tBack").onclick=talkLeave;
  if(capped){ $("tDone").onclick=talkLeave; $("tDone").focus({preventScroll:true}); return; }
  const inp=$("msg");

function drawChat(){
  const c=$("chat"); if(!c) return;
  const who = talk.l && talk.l.track==="med" ? "Patient or family" : "Them";
  c.innerHTML = talk.lines.map(x=> x.who==="them"
    ? `<div class="line"><span class="who">${who}</span><span class="es">${esc(x.es)}</span>${x.en?`<details><summary>English</summary><span class="en">${esc(x.en)}</span></details>`:""}<span>${playBtn(x.es)}</span></div>`
    : `<div class="line me"><span class="who">You</span><span class="es">${esc(x.text)}</span></div>${x.fb?(x.fb.ok?`<div class="corr good"><b>Good.</b>${x.fb.corrected?` More natural: <i>${esc(x.fb.corrected)}</i>`:""}${x.fb.note?` <span class="sub">${esc(x.fb.note)}</span>`:""}</div>`:`<div class="corr"><b>Better:</b> <i>${esc(x.fb.corrected)}</i> <span class="sub">${esc(x.fb.note||"")}</span></div>`):""}`).join("");
}
function transcript(){ return talk.lines.map(x=>x.who==="them"?`OTHER PERSON: ${x.es}`:`LEARNER: ${x.text}`).join("\n"); }
function talkError(e){
  const code=e&&e.code;
  if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled") return "Claude isn't available on this page (permission was declined or Claude is turned off for your account). The rest of the course works without it.";
  if(code==="rate_limited") return "Too many requests right now, or your Claude usage limit was reached. Try again in a little while.";
  if(code==="session_expired") return "Your session expired. Sign in to Claude again, then reload this page.";
  if(code==="invalid_json"||code==="empty_completion") return "The reply came back in an unexpected form. Try again.";
  if(code==="cancelled") return "";

/* false once the learner has left this conversation (a late reply must not touch another screen) */
const talkLive = t => talk===t && view.name==="talk";
function grammarOf(l){ return l ? `Course level: ${l.id} "${l.title}". Grammar the learner has studied: ${l.grammar.map(g=>g.h).join("; ")}.` : `Grammar the learner has studied:\n${grammarScope()||"present tense basics"}`; }
async function sendTalk(){
  const t=talk; if(t.busy) return; const inp=$("msg"), text=inp.value.trim(); if(!text) return;
  t.busy=true;   // before the first await, so a double tap or an auto-send can't send the message twice
  const sample=await getSample();
  if(!talkLive(t)){ t.busy=false; return; }
  if(!sample){ t.busy=false; $("talkstatus").textContent="AI isn't available on this page."; return; }
  t.lines.push({who:"me", text}); inp.value=""; drawChat();
  $("send").disabled=true; $("stop").hidden=false; $("talkstatus").textContent="Thinking…";
  const r=t.r;
  const prompt = `You are a role-play partner for a Spanish learner: an American cardiologist.
${grammarOf(t.l)}
Scenario shown to the learner: ${r.setup}
Your character: ${r.persona}
Learner's goals: ${r.goals.map((g,i)=>i+": "+g).join(" | ")}${t.o.words?`\nWords from the learner's lesson today; work several of them in naturally: ${t.o.words.join(", ")}`:""}${steerText()}

Rules:

- "goals_done": indices of the learner's goals that are now accomplished in the conversation so far.
- "errs": for each distinct error in the learner's last message, {"skill": one id from this list, "said": the wrong words, "fix": the corrected words, "why": a few English words}. Skill ids: ${Object.keys(SKILLS).filter(k=>!["s:listen","s:order","s:speak"].includes(k)).map(k=>k+" ("+SKILLS[k][0]+")").join(", ")}. Empty array if none.

Conversation so far:
${transcript()}

Reply with only a JSON object: {"reply":"…","reply_en":"…","ok":true,"corrected":"","note":"","goals_done":[0],"errs":[]}`;
  t.ctl=new AbortController();
  try{
    const out=await sample.json(prompt,{signal:t.ctl.signal, cache:false, modelTier:"default", effort:"low"});
    if(!talkLive(t)) return;
    const last=t.lines[t.lines.length-1];
    last.fb={ok:!!out.ok, corrected:String(out.corrected||""), note:String(out.note||"")};

    if(!out.ok && Array.isArray(out.errs) && out.errs.length) logTalk(out.errs.slice(0,3));
    if(out.reply) t.lines.push({who:"them", es:String(out.reply), en:String(out.reply_en||"")});
    t.turns++;
    if(t.o.max && t.turns>=t.o.max){ t.busy=false; renderTalk(); if(out.reply) sayReply(String(out.reply)); return; }
    $("talkstatus").textContent="";
    drawChat(); document.querySelectorAll("#goals li").forEach((li,i)=>li.classList.toggle("done",t.done.has(i)));

  }catch(e){ if(talkLive(t)) $("talkstatus").textContent=talkError(e); }
  finally{ t.busy=false; if(talkLive(t) && $("send")){ $("send").disabled=false; $("stop").hidden=true; if(!t.voice) $("msg").focus({preventScroll:true}); } }
}

function learnerSummary(){

  const rows=skillRows().filter(r=>r.ready);
  if(rows.length) lines.push("Skill accuracy (recent-weighted, attempts): "+rows.map(r=>`${skName(r.id)} ${Math.round(r.a*100)}% (${r.n})`).join("; "));
  const conf=confusions(14);
  if(conf.length) lines.push("Repeated mistakes, last 14 days:\n"+conf.slice(0,6).map(c=>`- ${confText(c.key)[0]} ×${c.n}`+c.ex.slice(0,2).map(e=>`\n    e.g. "${e.q}" → learner: "${e.y}", correct: "${e.r}"`).join("")).join("\n"));
  const ww=weakWords(); if(ww.length) lines.push("Words often missed: "+ww.map(w=>`${w.e.w} (${w.e.en})`).join(", "));

function importCards(text){
  const o=JSON.parse(text.trim()); const pr=o.progress||o; let n=0;
  const map=(m,id)=>{ const p=id.split(":");
    if(m==="tense"&&p[0]==="t") return `wt:${p[1]}:${p[2]}`;
    if(m==="cloze"&&p[0]==="c") return `fc:${p[1]}:${p[2]}`;
    if(m==="form"&&p[0]==="f"){ const v=VERBS.find(x=>x.v===p[1]); return v&&v.rows[+p[2]] ? `cj:${p[1]}:${v.rows[+p[2]].t}:${p[3]}` : null; }
    return null; };
  for(const m of ["tense","cloze","form"]) for(const id in pr[m]||{}){
    const nid=map(m,id); if(!nid || !ALL[nid]) continue;
    const rec=pr[m][id], cur=LR.srs[nid], last=dayOf(rec.t||Date.now());
    if(cur && cur[4]>=last) continue;
    LR.srs[nid]=[Math.min(Math.max(rec.b|0,0),6), Math.max(dayOf(rec.d||Date.now()), today()), (cur?cur[2]:0)+1, (cur?cur[3]:0)+((rec.b|0)>0?1:0), last];
    dirtyDocs.add(shardOf(nid)); n++;
  }
  if(n){ LR.mig.cards=true; dirtyDocs.add("learner"); saveLR(); }
  return n;
}

      <h3>Verb lessons</h3>${seg([["reached","Tenses I've reached"],["all","All tenses"]], LR.vall?"all":"reached", "vall", "Verb lesson tenses")}<p class="sub">Every ${VERB_EVERY+1}th lesson is about one verb. With all tenses, verb lessons also teach tenses your path hasn't reached yet.</p>
      <h3>Path</h3>${seg(Object.keys(PATHS).map(k=>[k,PATHS[k].name]), pathId(), "path", "Path")}<p class="sub">Each path keeps its own place. Grammar units you finish count in both.</p>
      <h3>Placement test</h3><p class="sub">${pl&&pl.test?`Last placed ${new Date(pl.at).toLocaleDateString()}${pl.unit?`, at ${esc(UNITS[pl.unit].title)}`:""}. `:""}Retaking it never undoes units you've finished.</p><button class="sh-btn sm" type="button" id="s-place">${pl&&pl.test?"Retake":"Take"} the placement test</button></section>
    <section class="sh-card"><h2>Color scheme</h2><p class="sub">One choice for all of Study Hall on this device.</p><div id="themes"></div></section>
    <section class="sh-card"><h2>Voice</h2>${SHV?'<div id="s-picker" class="row"></div>':devVoice}
      <label class="f" for="s-rate">Speed<select id="s-rate"><option value="0.7">Slow</option><option value="0.85">Learner</option><option value="1">Normal</option></select></label>
      <label class="c" for="s-auto"><input type="checkbox" id="s-auto"> Play audio automatically</label>
      ${matchMedia("(pointer: coarse), (hover: none), (any-pointer: coarse)").matches || navigator.maxTouchPoints>0 ? "" :'<p class="sub">Press P to replay the current audio.</p>'}</section>
    <section class="sh-card"><h2>Account</h2><p class="sub">${esc(syncText)}</p><div id="who" class="row"></div></section>
    <details class="sh-card adv"><summary>Advanced</summary><div class="adv-in">${SHV?devVoice:""}
      <button class="sh-btn sm" type="button" id="s-test">Test the device voice</button>
      <p class="sub">${SHV?"Voices other than the device voice are natural recordings made on the Study Hall server the first time a sentence plays, then kept.":"Audio comes from the Spanish voices installed on this device."}</p>
      <h3>Back up or move your progress</h3><p class="sub">Copy everything (path, review schedule, weak spots, answer history) as text, then paste it into this box on another copy of the course and press Import. Importing merges: nothing is lost.</p>
      <div class="row"><button class="sh-btn sm" type="button" id="xCopy">Copy my progress</button><span class="sub" id="xMsg" role="status"></span></div>
      <textarea id="xText" rows="3" placeholder="Paste copied progress here" aria-label="Progress text"></textarea><button class="sh-btn sm" type="button" id="xImp">Import</button></div></details>
    <section class="sh-card"><h2>Reset my progress</h2><p class="sub">Erase all Clinic Spanish progress${db?" on every device":""}. This can't be undone.</p><button class="sh-btn sm" type="button" id="s-reset">Erase my progress</button></section>`;
  $("view").querySelectorAll("[data-len]").forEach(b=>b.onclick=()=>{ setPathPrefs({len:b.dataset.len}); render(); });
  $("view").querySelectorAll("[data-path]").forEach(b=>b.onclick=()=>{ setPathPrefs({path:b.dataset.path}); render(); });
  $("view").querySelectorAll("[data-vall]").forEach(b=>b.onclick=()=>{ setPathPrefs({vall:b.dataset.vall==="all"}); render(); });
  SHUI.theme.picker($("themes"));
  if(SHV) SHV.picker($("s-picker"), {sample:SAMPLE});
  fillVoices();
  $("s-voice").onchange=e=>{ S.voice=e.target.value; saveS(); };
  $("s-rate").value=S.rate; $("s-rate").onchange=e=>{ S.rate=e.target.value; saveS(); };
  $("s-auto").checked=S.auto; $("s-auto").onchange=e=>{ S.auto=e.target.checked; saveS(); };
  $("s-test").onclick=()=>deviceSpeak(SAMPLE);
  $("s-place").onclick=startPlacement;
  $("xCopy").onclick=async()=>{
    const t=exportAll(); let ok=false;
    try{ await navigator.clipboard.writeText(t); ok=true; }catch(e){}
    if(ok) $("xMsg").textContent=`Copied (${Math.round(t.length/1024)} KB). Now paste it into the other copy of the course.`;
    else { const ta=$("xText"); ta.value=t; ta.focus(); ta.select(); $("xMsg").textContent="Your browser blocked copying. The text is selected in the box below: copy it yourself."; }
  };
  $("xImp").onclick=()=>{
    const ta=$("xText");
    try{ const n=importAll(ta.value); ta.value=""; $("xMsg").textContent=`Imported and merged (${n} parts).`; }
    catch(e){ $("xMsg").textContent="That didn't look like copied progress from this course. Copy it again and paste the whole text."; }
  };
  if(HOSTED) SH.currentUser().then(u=>{ if(!u || !$("who")) return;
    $("who").innerHTML=`<span>${esc(u.email)}</span><button class="sh-btn sm" type="button" id="signout">Sign out</button>`;
    $("signout").onclick=async()=>{ await SH.sb.auth.signOut(); location.replace(SH.root); }; }).catch(()=>{});
  $("s-reset").onclick=()=>dialog(`<h2>Reset all progress?</h2><p>Type <b>reset</b> to confirm.</p><input type="text" id="rconf" autocomplete="off" aria-label="Type reset to confirm"><button class="sh-btn block" type="button" id="rgo">Erase everything</button><button class="sh-btn primary block" type="button" id="rno">Cancel</button>`,
    d=>{ d.querySelector("#rno").onclick=()=>$("dlg").close();
      d.querySelector("#rgo").onclick=()=>{ if(d.querySelector("#rconf").value.trim().toLowerCase()!=="reset") return;
        P={lv:{}, it:{}}; LR=freshLR(); LR.resetAt=Date.now(); LR.mig={legacy:true, path:true};
        DOCS.forEach(n=>dirtyDocs.add(n)); persist(); sync(); $("dlg").close(); route(); }; });
}
/* ---------- back up / move progress ---------- */
function exportAll(){ const docs={}; DOCS.forEach(n=>docs[n]=docBody(n)); return JSON.stringify({app:"clinic-spanish", v:1, at:Date.now(), docs}); }
function importAll(text){
  const o=JSON.parse(String(text).trim());
  if(!o || o.app!=="clinic-spanish" || !o.docs) throw new Error("bad");
  const d=o.docs; let n=0;
  DOCS.forEach(k=>{ if(d[k]){ if(k==="course") mergeP(d[k]); else mergeLR(k, d[k]); n++; } dirtyDocs.add(k); });
  mapOldProgress(); persist(); sync();
  return n;
}

/* ================= keys ================= */
document.addEventListener("keydown",e=>{
  if($("dlg").open || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if((e.key==="p"||e.key==="P") && lastSay){ e.preventDefault(); speak(lastSay); return; }
  if(view.name!=="run") return;
  if(/^[1-4]$/.test(e.key)){ const b=document.querySelectorAll(".sh-opt:not(:disabled)")[+e.key-1]; if(b){ e.preventDefault(); b.click(); } }
  else if(e.key==="Enter" && !(e.target && e.target.closest("button,a,summary"))){ const b=$("next")||$("gotIt"); if(b){ e.preventDefault(); b.click(); } }
});

/* ================= start ================= */
route();
connect();
/* The Everyday words load after the page is up; without them the level units and the rest of the course still work. */
(typeof V2_SRC==="string" ? fetch(V2_SRC).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }) : Promise.resolve(V2_SRC))
  .then(d=>{ addV2(d); V2.state="ok"; })
  .catch(()=>{ V2.state="fail"; })
  .then(()=>{ mapOldProgress(); refresh(); });
(typeof VB_SRC==="string" ? fetch(VB_SRC).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }) : Promise.resolve(VB_SRC))
  .then(d=>{ addVB(d); VB.state="ok"; })
  .catch(()=>{ VB.state="fail"; })
  .then(refresh);
</script>
</body>
</html>
