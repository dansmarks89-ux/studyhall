<!doctype html>
<html lang="en" data-app="__COURSE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__NAME__</title>
<meta name="theme-color" content="#F2F3FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=__FONT__:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/ui.css">
<script src="../shared/ui.js"></script>
<style>
/* Cantonese and Korean, one engine. Learn = the path of units and lessons; Practice = reviews, skills, drills, cards,
   conversations; Settings. Colors, type and components come from shared/ui.css; this sheet adds only what the
   languages need: target-language text, tone contours, tiles, dialogue lines and the pronunciation guide. */
:root{--tg:var(__FONTVAR__)}
main{flex:1;display:flex;flex-direction:column;gap:18px;min-width:0}
.sh-wrap{overflow-x:clip}  /* the slide-in between questions never widens the page */
h2.sect{font-size:19px;margin-top:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0;border:0;background:none;color:var(--ink-2);font:700 17px var(--font);text-decoration:none;cursor:pointer}
.back svg,.x svg{stroke-width:2.5}
.back svg{width:20px;height:20px}
.hero{display:flex;align-items:center;gap:16px}
.hero h1 .nat{font-family:var(--tg);font-weight:700;color:var(--accent-ink);margin-left:.25em;font-size:.8em}
.sub{font-size:15px;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.sh-tile .tx2{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sh-tile .t{font-weight:800}
.sh-tile .d{color:var(--ink-2);font-size:15px}
#pRev .sh-icon{flex:none}
.idle{display:flex;align-items:center;gap:14px;padding:14px;border:var(--bw) dashed var(--border);border-radius:20px;color:var(--ink-2)}
.idle .sh-icon{flex:none}
.idle>span{display:flex;flex-direction:column;gap:2px}
details.more>.stack{margin-top:16px}
details.more h2{display:inline}
.sh-tile:disabled{cursor:default;opacity:.6}
.sh-opt.pick{background:var(--accent-soft)}
.linkbtn{font:inherit;font-weight:700;color:var(--accent-ink);background:none;border:0;padding:0;min-height:44px;cursor:pointer;text-decoration:underline}
.astatus{border-radius:14px;padding:10px 14px;font-size:15px;background:var(--gold);color:var(--on-gold)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
label.c{display:flex;gap:10px;align-items:center;min-height:44px}
label.sh-voice{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
#s-picker{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#s-picker label{align-self:stretch}
.sh-voice-note{font-size:15px;color:var(--ink-2)}
/* target-language text */
.tx{display:inline-flex;flex-direction:column;gap:2px;vertical-align:top;min-width:0}
.tg{font-family:var(--tg);font-weight:500;overflow-wrap:anywhere}
.rom{font-size:.8em;font-weight:600;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:0 8px;align-items:flex-end}
.said{font-size:.8em;color:var(--ink-2)} .said .tg{font-weight:400}
.syl{display:inline-flex;align-items:flex-end;gap:1px;white-space:nowrap}
.syl sup{font-size:.72em;color:var(--accent-ink);font-weight:800;align-self:flex-start;line-height:1}
.syl svg{width:.9em;height:.75em;margin-bottom:.15em;flex:none}
svg line.st{stroke:var(--surface-2)} svg path.ct{stroke:var(--accent);fill:none}
.big .tg{font-size:clamp(40px,12vw,56px);font-weight:700;line-height:1.15} .big .rom{font-size:19px}
.mid .tg{font-size:28px;line-height:1.25} .mid .rom{font-size:16px}
.huge .tg{font-size:clamp(72px,24vw,104px);line-height:1.05}
.inl{display:inline;font-family:var(--tg)} .inl .r{font-size:.85em;color:var(--ink-2);margin-left:3px}
/* audio */
.play{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;min-width:36px;min-height:36px;padding:0 10px;border:var(--bw) solid var(--border);border-radius:999px;background:var(--surface);color:var(--accent-ink);font:700 15px var(--font);cursor:pointer;vertical-align:middle;white-space:nowrap}
.play::after{content:"";position:absolute;inset:-5px}
.play svg{width:15px;height:15px;margin:0 -1.5px}  /* the shared play glyph, drawn at the size the old 12px one had */
.listen{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.listen .sh-play{font:800 24px var(--font)}
.slow{min-height:44px}
/* question screen */
.qtop{display:flex;align-items:center;gap:12px}
.qtop .sh-progress{flex:1}
.x{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;margin-left:-10px;border:0;border-radius:12px;background:transparent;color:var(--ink-2);cursor:pointer}
.x svg{width:24px;height:24px}
.q{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.kind{font-size:15px;font-weight:700;color:var(--ink-2)}
.q>.sh-tag{align-self:flex-start}
.prompt{font-size:26px;font-weight:800;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.qen{font-size:17px;color:var(--ink-2)}
.gap{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--ink);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:0 4px}
.opts{display:flex;flex-direction:column;gap:14px}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.tones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opts.tones .sh-opt{flex-direction:column;justify-content:center;gap:2px;padding:10px 6px;text-align:center}
.sh-opt .tg{font-size:22px}
.sh-opt .n{font-size:24px;font-weight:800;color:var(--accent-ink)}
.sh-opt>svg{width:48px;height:30px;flex:none}
.sh-opt .sub{font-size:13px}
.pat{display:inline-flex;align-items:center;gap:4px}
.pat svg{width:36px;height:24px}
.built{min-height:64px;border-bottom:3px solid var(--surface-2);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.tile{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;min-height:52px;padding:6px 12px;border:var(--bw) solid var(--border);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .08s ease,box-shadow .08s ease}
.tile:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
.tile .tg{font-size:22px} .tile .rom{font-size:12px}
.tile.used{visibility:hidden}
.tile:disabled{cursor:default}
.ans{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ans>.tx{flex:1 1 200px}
.sh-seg>button.len{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 6px}
.sh-seg>button.len span{font-weight:500;font-size:14px}
.sh-tile[id^="talk-"] .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.why{color:inherit;font-size:16px}
.sh-sheet .exs{font-size:15px}
.wordhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordhead .tx{flex:1}
.exs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.exs li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:var(--bw) solid var(--border);border-radius:16px}
.exs li>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.exs .tg{font-size:19px}
.exs .en{font-size:15px}
.cta{position:sticky;bottom:0;z-index:5;display:flex;flex-direction:column;gap:12px;margin:auto calc(-1*var(--gx,20px)) calc(-1*var(--gb,0px));padding:12px var(--gx,20px) max(16px,env(safe-area-inset-bottom));background:var(--bg)}
.dl{display:flex;flex-direction:column;gap:10px}
.line{max-width:92%;border-radius:16px;padding:10px 14px;background:var(--surface);border:var(--bw) solid var(--border);display:flex;flex-direction:column;gap:4px}
.line .who{font-size:13px;font-weight:800;color:var(--ink-2)}
.line .en{color:var(--ink-2);font-size:15px}
.line.me{align-self:flex-end;background:var(--accent-soft)}
.line .row{flex-wrap:nowrap;align-items:flex-start}
.corr{font-size:15px;border-left:4px solid var(--gold);padding:4px 12px;align-self:flex-end;max-width:92%;display:flex;flex-direction:column;gap:4px}
.corr.good{border-color:var(--good)}
.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.answer input{flex:1 1 200px;min-width:0;font-family:var(--tg)}
.mic-sm{width:56px;height:56px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:var(--bw) solid var(--border);background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm);cursor:pointer}
.mic-sm svg{width:26px;height:26px;stroke-width:2.2}
.mic-sm.live{background:var(--ink);color:var(--bg)}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.micwrap .sh-bars{visibility:hidden}
.micwrap.live .sh-bars{visibility:visible}
.heard{font-family:var(--tg)}
mark.dmiss{background:var(--bad-soft);color:inherit;border-radius:4px;padding:0 2px;outline:2px solid var(--bad)}
mark.dextra{background:var(--gold);color:var(--on-gold);border-radius:4px;padding:0 2px;text-decoration:line-through}
.btns{display:flex;gap:12px}
.btns>.sh-btn{flex:1}
.goals{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.goals li{display:flex;gap:10px;align-items:baseline}
.goals li::before{content:"";width:14px;height:14px;border:var(--bw) solid var(--border);border-radius:4px;flex:none;transform:translateY(2px)}
.goals li.done::before{background:var(--good)}
.chat{display:flex;flex-direction:column;gap:10px}
.grades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.miss{border-top:var(--bw) solid var(--surface-2);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.miss:first-child{border-top:0;padding-top:0}
/* path */
.cont{gap:12px}
.cont .sh-label{display:block}
.cont h2{font-size:21px}
.sh-path-body .ut{display:flex;flex-direction:column;gap:2px;text-align:left;min-height:44px;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.sh-path-body .ut b{font-size:17px;font-weight:800}
.sh-path-body .ut span{font-size:14px;color:var(--ink-2)}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;text-align:left;border:var(--bw) solid var(--border);border-radius:14px;background:var(--surface);color:var(--ink);font:700 15px/1.3 var(--font);cursor:pointer}
.lesson .ck{flex:none;width:24px;height:24px;border-radius:50%;border:var(--bw) solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--surface)}
.lesson.done .ck{background:var(--good);color:var(--on-good)}
.lesson.next{background:var(--accent-soft);box-shadow:var(--shadow-sm)}
.lesson:disabled{cursor:default;color:var(--ink-2)}
.lesson span:last-child{flex:1;min-width:0;overflow-wrap:anywhere}
.ck svg{width:14px;height:14px;stroke-width:3}
.sh-node svg{width:22px;height:22px;stroke-width:3}
/* reference lists */
.words{list-style:none;margin:0;padding:0}
.words li{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.words li+li{border-top:1px solid var(--surface-2)}
.words li>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.words .tg{font-size:20px}
.words .exs{margin-top:6px}
.gram{display:flex;flex-direction:column;gap:8px}
.gram+.gram{border-top:var(--bw) solid var(--surface-2);padding-top:14px}
.tonechart{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tonechart>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:var(--bw) solid var(--border);border-radius:14px;background:var(--surface);text-align:center}
.tonechart b{font-size:22px;color:var(--accent-ink)} .tonechart svg{width:48px;height:30px} .tonechart span{font-size:13px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .play{min-height:44px;padding:0 12px}
.chips .play .tg{font-size:19px;color:var(--ink)}
.chips .play .r{color:var(--ink-2);font-weight:600}
.lt{font-size:30px;font-family:var(--tg)}
/* tables in weak spots */
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:8px 4px;border-bottom:1px solid var(--surface-2);vertical-align:middle}
td.num{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
/* pronunciation guide (from the original flashcard pages) */
.guide{display:flex;flex-direction:column;gap:18px}
.guide section{background:var(--surface);border:var(--bw) solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.guide h2{font-size:20px}
.guide ol,.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.guide .cjk{font-family:var(--tg);font-size:1.08em}
.guide code{font-weight:800;color:var(--accent-ink)}
.guide .tblwrap{overflow-x:auto;border:var(--bw) solid var(--border);border-radius:14px}
.guide table{min-width:420px}
.guide th,.guide td{text-align:left;padding:8px 10px}
.guide th{font-size:14px;color:var(--ink-2);background:var(--surface-2)}
.guide td.k{font-weight:800;color:var(--accent-ink);white-space:nowrap}
.guide td.h{font-family:var(--tg);font-size:1.3rem}
.guide .callout{border-left:4px solid var(--accent);padding:4px 0 4px 12px}
button.say{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:2px 12px 2px 10px;border:var(--bw) solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);font:600 15px var(--font);cursor:pointer;white-space:nowrap;vertical-align:middle}
button.say svg{width:14px;height:14px;margin:0 -1.5px;color:var(--accent)}
button.say .r{color:var(--ink-2)}
.guide .tones{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.guide .tone{border:var(--bw) solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.guide .tone .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.guide .tone .n{font-size:26px;font-weight:800;color:var(--accent-ink);line-height:1}
.guide .tone svg{width:72px;height:44px;flex:none}
.guide .blocks{display:flex;flex-wrap:wrap;gap:10px}
.guide .block{border:var(--bw) solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:110px}
.guide .block .tgs{font-family:var(--tg);font-size:2.4rem;line-height:1.1}
.guide .block .parts{font-family:var(--tg);color:var(--ink-2)}
:is(.play,.tile,.lesson,.linkbtn,button.say,.mic-sm,.x,.back,.ut,summary):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (max-width:380px){.prompt{font-size:23px}.opts.tones{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
__HOSTED__
</head>
<body>
<div class="sh-wrap">
  <div id="astatus" class="astatus" role="status" hidden></div>
  <main id="view"></main>
</div>
<nav class="sh-tabs" id="tabs" aria-label="Sections" hidden>
  <button type="button" data-tab="learn">Learn</button>
  <button type="button" data-tab="practice">Practice</button>
  <button type="button" data-tab="settings">Settings</button>
</nav>
<dialog id="dlg" class="sh-dialog"><div class="sh-dialog-in" id="dlgin"></div></dialog>
<script>
"use strict";
const C = __CONFIG__;
const D = __DATA__;
const YUE = C.lang === "yue";
const LEVELS = D.levels, LV = Object.fromEntries(LEVELS.map(l=>[l.id,l]));
const DSETS = D.drills.filter(x=>!x._items), DITEMS = Object.fromEntries(D.drills.find(x=>x._items)._items.map(i=>[i.id,i]));
const DS = Object.fromEntries(DSETS.map(s=>[s.id,s]));
const $ = id => document.getElementById(id);
const esc = SHUI.esc;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const K = k => C.course+":"+k;
const store = { get(k,d){ try{ const v=localStorage.getItem(K(k)); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(K(k),JSON.stringify(v)); }catch(e){} } };
const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;
const cps = s => Array.from(s);

/* ---------------- settings (this device) ---------------- */
const S = Object.assign({speed:"0.85", auto:true, romq:true, romCard:!YUE, dev:false, voice:"", cdir:"rec", cnew:"15", clv:"all", autoSend:true}, store.get("settings",{}));
const saveS = () => store.set("settings", S);
const ROM = C.romName;
const romQ = () => S.romq;

/* ---------------- target-language text ---------------- */
const CHAO = {1:[5,5],2:[2,5],3:[3,3],4:[2,1],5:[2,3],6:[2,2]};
function contour(t, w, h, staff){
  const c=CHAO[t]; if(!c) return "";
  const y=v=>(h-2)-(v-1)*(h-4)/4;
  let s=`<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
  if(staff) for(let i=1;i<=5;i++) s+=`<line class="st" x1="0" x2="${w}" y1="${y(i)}" y2="${y(i)}" stroke-width="1"/>`;
  return s+`<path class="ct" d="M${w*.12} ${y(c[0])} L${w*.88} ${y(c[1])}" stroke-width="${Math.max(2,h/9)}" stroke-linecap="round"/></svg>`;
}
function romHTML(r){
  if(!YUE) return esc(r);
  return String(r).split(/\s+/).filter(Boolean).map(tok=>{ const m=tok.match(/^([a-z]+)([1-6])([,.?!]?)$/); if(!m) return `<span class="syl">${esc(tok)}</span>`;
    return `<span class="syl">${m[1]}<sup>${m[2]}</sup>${contour(+m[2],14,12,false)}${m[3]}</span>`; }).join("");
}
// One target text {s, r, p?}; opts {rom, said, cls}
function tx(o, opts){
  opts=opts||{}; if(!o) return "";
  const rom = opts.rom!==false && o.r ? `<span class="rom">${romHTML(o.r)}</span>` : "";
  const said = opts.said!==false && o.p ? `<span class="said">said like <span class="tg" lang="${C.htmlLang}">${esc(o.p)}</span></span>` : "";
  return `<span class="tx ${opts.cls||""}"><span class="tg" lang="${C.htmlLang}">${esc(o.s)}</span>${rom}${said}</span>`;
}
const inl = o => `<span class="inl" lang="${C.htmlLang}">${esc(o.s)}<span class="r">${esc(o.r||"")}</span></span>`;
// Prose with {{json}} tags from the build, plus *italic* / **bold**
function prose(s){
  return String(s||"").split(/(\{\{\{.+?\}\}\})/).map(part=>{
    if(part.startsWith("{{")){ try{ const o=JSON.parse(part.slice(2,-2)); return inl(o)+" "+playBtn(o.s); }catch(e){ return esc(part); } }
    return esc(part).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
  }).join("");
}
const playBtn = (say, label, voice) => `<button class="play" type="button" data-say="${esc(say)}"${voice?` data-voice="${esc(voice)}"`:""} aria-label="${label?esc(label):"Play"}">${SHUI.icon("play")}${label?esc(label):""}</button>`;
const bigPlay = (say, o) => `<div class="listen"><button class="sh-play" type="button" data-say="${esc(say)}"${o&&o.voice?` data-voice="${esc(o.voice)}"`:""} aria-label="Play">${SHUI.icon("play")}</button>${o&&o.slow?`<button class="play slow" type="button" data-say="${esc(say)}" data-rate="0.6">${SHUI.icon("play")}Slower</button>`:""}</div>`;
const exList = exs => exs.length ? `<ul class="exs">${exs.map(x=>`<li>${playBtn(x.s)}<div>${tx(x)}<span class="en sub">${esc(x.en)}</span></div></li>`).join("")}</ul>` : "";

/* ---------------- audio ----------------
   Chosen voice (Settings, hosted only) -> SHVoice.play. Course default -> the page's recorded clips, then the
   everyday-word clips (named like the build names them), then SHVoice.play (the server records or finds the clip).
   Without SHVoice (claude.ai preview) the device voice stands in. */
const sayText = s => String(s).replace(/___/g,"…").replace(/…/g," ").replace(/ \/ /g, YUE?"，":", ").replace(/\s+/g," ").trim();

function astatus(msg){ const el=$("astatus"); el.textContent=msg||""; el.hidden=!msg; }
function clipFor(text, voice){

// SHA-256 (hex), synchronous so a tap starts the clip without waiting (iOS only plays audio started inside the tap).
const SHA_K=[], SHA_H=[];

    for(let i=0;i<64;i++) W[i]=i<16 ? w[j+i] : (r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3)) + W[i-16] + (r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10)) + W[i-7] | 0;

function speak(text, o){

/* Exercises whose ids are made from a word: spell it (sp), a verb form (cj:<word>:<form>), an aspect marker in one of

function itemOf(id){

/* Read the account copy and merge it into this device. Runs before every write, so a page left open on one device
   never overwrites newer work done on another. A reset on another device (a newer ra) starts this one over too. */
async function pull(){
  const qs=await db.collection("data/users/"+uid).get(), docs={};
  qs.docs.forEach(doc=>{ if(doc.id!=="stats") docs[doc.id]=doc.data()||{}; });
  const ra=Math.max(0, ...Object.values(docs).map(d=>d.ra||0));
  if(ra>RA) wipe(ra);
  for(const n in docs){
    if((docs[n].ra||0)<RA){ dirtyDocs.add(n); continue; }
    if(mergeLR(n, docs[n]) && n!=="course") dirtyDocs.add(n);

async function sync(){

  const sd=statsDoc(), sk=JSON.stringify(sd);
  if(!dirtyDocs.size && sk===statsSent) return;
  syncing=true; let names=[];
  try{
    await pull(); names=[...dirtyDocs]; dirtyDocs.clear();
    for(const n of names) await db.collection("data/users/"+uid).doc(n).set(docBody(n));
    const s2=statsDoc(), k2=JSON.stringify(s2);
    if(k2!==statsSent){ await db.collection("data/users/"+uid).doc("stats").set(Object.assign(s2,{at:Date.now()})); statsSent=k2; }
    setSync("Progress saved to your account");

  return out.concat(u.k==="level" ? g : g ? g.it : itemOf(qid(w[4],"vm")));

function placer(start){
  const st={lo:start-1, hi:UNITS.length, cur:start, border:-1, near:false, t0:Date.now(), n:0};
  st.next = res => {
    const r=res.filter(x=>x.ok).length; st.n+=res.length;
    if(st.border>=0){ if(r>=4) st.lo=st.cur; else st.hi=st.border; st.border=-1; st.near=true; }
    else if(r>=4) st.lo=st.cur;
    else if(r<=2){ st.hi=st.cur; st.near=true; }
    else if(st.cur+1<st.hi) st.border=st.cur;
    else { st.hi=st.cur; st.near=true; }
    if(st.n>=60 || Date.now()-st.t0>15*60000) return null;
    if(st.border>=0) return (st.cur=st.border+1);
    if(st.hi-st.lo<=1) return null;
    return (st.cur = st.near ? st.lo+1 : Math.min(st.lo+2, st.hi-1));
  };
  return st;
}

function skillPool(k){
  const all=()=>Object.values(ALL).map(a=>a.it).filter(it=>itemAvailable(it.id));
  if(k==="listen") return all().filter(it=>(it.sk||[]).includes("s:listen"));
  if(k==="vocab") return all().filter(it=>(it.sk||[]).includes("s:vocab")).concat(Object.values(VOC).filter(v=>introduced(v.id) && spellParts(v)).map(v=>itemOf(qid(v,"sp"))));
  if(k==="sound") return SOUND.sets.flatMap(drillItems);
  if(k==="speak"){ const a=sayUnits(4), b=shadowUnits(4); return a.flatMap((x,i)=>[x,b[i]]).filter(Boolean); }
  // grammar forms (verb endings / aspect markers) on words met, plus the open levels' grammar questions
  const on=new Set(formsAt(posO()).map(f=>f.k)), words=Object.values(VOC).filter(v=>introduced(v.id));
  const forms = !on.size ? [] : words.flatMap(v=>[...Object.keys(v.cj||{}).filter(f=>on.has(f)).map(f=>"cj:"+v.id+":"+f), ...(v.ex||[]).map((x,i)=>x.a && on.has(cps(x.s)[x.a[0]]) ? "as:"+v.id+":"+i : null).filter(Boolean)]).map(id=>Object.assign(itemOf(id), id.startsWith("cj:") ? {mode:Math.random()<.5?"pick":"tiles"} : {}));
  return forms.concat(all().filter(it=>it.t==="gap"||it.t==="pick"));
}

  while(k<sents.length && (k===0 || n+sents[k].split(/\s+/).filter(Boolean).length<=45)){ n+=sents[k].split(/\s+/).filter(Boolean).length; k++; }
  return [back(sents.slice(0,k).join("")), back(sents.slice(k).join(""))];
}

// The small label over a question: its step in the lesson (or its kind in Practice); the question itself is the bold line.
const CAT = {vl:"Recognize", vm:"Recognize", ve:"Recognize", listen:"Recognize", sp:"Recall", wg:"Recall", gap:"Grammar", pick:"Grammar", dlg:"Grammar",
  cj:"Verbs", as:"Grammar", tiles:"Sentences", wt:"Sentences", say:"Sentences", shadow:"Sentences", tone:"Tones", tpat:"Tones",
  letter:"Hangul", trio:"Hangul", read:"Hangul", sound:"Hangul", km:"Characters", kh:"Characters", card:"Cards"};
const catOf = it => it.rev ? "Review" : CAT[it.t] || "";
// Distractor vocab: same level first, never near-synonyms (avoid) or identical text/English.
function vocabOptions(v, n){
  if(v.ev) return evOptions(v, n);
  const l=LV[v.lv], bad=new Set([v.i, ...(v.avoid||[])]); l.vocab.forEach((x,j)=>{ if((x.avoid||[]).includes(v.i)) bad.add(j); });
  const ok = x => x.id!==v.id && x.en.toLowerCase()!==v.en.toLowerCase() && x.t.s!==v.t.s;
  const pool=l.vocab.filter((x,j)=>!bad.has(j) && ok(x));
  let pick=shuffle(pool.filter(x=>x.topic===v.topic)).slice(0,2).concat(shuffle(pool.filter(x=>x.topic!==v.topic))).slice(0,n-1);
  if(pick.length<n-1) pick=pick.concat(shuffle(LEVELS.flatMap(L=>L.vocab).filter(x=>ok(x) && !pick.includes(x))).slice(0,n-1-pick.length));
  return shuffle([v,...pick]);
}
// Distractors never share a content word of the English gloss (no near-synonyms); same part of speech first; seeded.
const GSTOP = new Set("the and for with something someone polite casual formal very about from this that one thing also used".split(" "));
const gloss = en => new Set(String(en).toLowerCase().replace(/\([^)]*\)/g," ").split(/[^a-z']+/).filter(x=>x.length>2 && !GSTOP.has(x)));
const unlikeOf = v => { const mine=gloss(v.en), en=v.en.toLowerCase(); return x => x.id!==v.id && x.t.s!==v.t.s && x.en.toLowerCase()!==en && ![...gloss(x.en)].some(g=>mine.has(g)); };
function evOptions(v, n){
  const r=rng(v.set+"|"+v.id), words=ES[v.set].words.filter(unlikeOf(v));
  const pick=sshuffle(words.filter(x=>x.pos===v.pos),r).slice(0,3).concat(sshuffle(words.filter(x=>x.pos!==v.pos),r));
  return shuffle([v,...pick.slice(0,n-1)]);
}
const isPred = v => !YUE && /다$/.test(v.t.s) && /verb|adjective/.test(v.pos||"");
function gapOptions(v, it, ans){
  const r=rng((v.set||v.lv)+"|"+it.id), ok=unlikeOf(v), last=cps(ans.s).pop(), n=cps(ans.s).length;
  let cands;
  if(!v.ev) cands=LEVELS.flatMap(l=>l.vocab).filter(x=>ok(x) && !/___|…|\//.test(x.t.s)).map(x=>({o:{s:x.t.s, r:x.t.r}, near:x.lv===v.lv}));
  else if(isPred(v)) cands=ESETS.flatMap(s=>s.words).filter(x=>ok(x) && isPred(x)).flatMap(x=>x.ex.filter(e=>e.g).map(e=>{ const s=cps(e.s).slice(e.g[0],e.g[1]).join(""); return {o:{s, r:e.g[4]}, near:cps(s).pop()===last}; }));
  else cands=ESETS.flatMap(s=>s.words).filter(x=>ok(x) && x.pos===v.pos).map(x=>({o:{s:x.t.s, r:x.t.r}, near:x.set===v.set}));
  const key=c=>(YUE && cps(c.o.s).length!==n ? 2 : 0)+(c.near?0:1);
  const out=[ans], have=new Set([ans.s]);
  for(const c of sshuffle(cands,r).sort((a,b)=>key(a)-key(b))){ if(out.length>=4) break; if(!have.has(c.o.s) && !c.o.s.includes(ans.s) && !ans.s.includes(c.o.s)){ have.add(c.o.s); out.push(c.o); } }
  return out;
}
function wgUnit(it){
  const v=VOC[it.v], x=v.ex[it.k], g=x.g, ch=cps(x.s), rt=x.r.split(" ");
  const ans={s:ch.slice(g[0],g[1]).join(""), r:YUE?rt.slice(g[2],g[3]).join(" "):g[4]};
  const q={s:ch.slice(0,g[0]).join("")+"___"+ch.slice(g[1]).join(""), r:g[2]<0?"":[...rt.slice(0,g[2]),"___",...rt.slice(g[3])].join(" ")};
  return {t:"gap", id:it.id, sk:it.sk, w:it.w, v:it.v, q, en:x.en, opts:gapOptions(v,it,ans), a:0, why:"", full:x};
}
const CJKRE=/[㐀-䶿一-鿿\u{20000}-\u{3FFFF}]/gu, NONWORD=/[^0-9A-Za-z㐀-䶿一-鿿\u{20000}-\u{3FFFF}]/gu, KO_PUNCT=/[?!,.…~"'“”‘’()]/g;
function wtUnit(it){
  const v=VOC[it.v], x=v.ex[it.k], rt=x.r.split(" ");
  let a;
  if(YUE){ const s=cps(x.s.replace(NONWORD,"")); let o=0, so=0;
    a=v.tl[1].map(n=>{ const t=s.slice(o,o+n).join(""), c=(t.match(CJKRE)||[]).length, r=rt.slice(so,so+c).join(" "); o+=n; so+=c; return {s:t, r}; }); }

function weightedPick(pool, n){
  const d=today();
  const w=pool.map(i=>{ const r=LR.srs[i.id]; if(!r) return 3; if(r[0]===0) return 4; if(r[1]<=d) return 3; return 1+2*(1-r[3]/Math.max(1,r[2])); });
  const out=[], idx=pool.map((_,i)=>i);
  while(out.length<n && idx.length){ const tot=idx.reduce((a,i)=>a+w[i],0); let r=Math.random()*tot, k=0; for(;k<idx.length;k++){ r-=w[idx[k]]; if(r<=0) break; } k=Math.min(k,idx.length-1); out.push(pool[idx[k]]); idx.splice(k,1); }
  return out;
}

/* A mic button: tap to record (the mic starts inside the tap, for iOS), tap again (or pause) to stop, then the transcript
   ("" = nothing heard) goes to o.onText. o = {onState(s), onText(text), onError(e)}; s = "rec" | "busy" | "idle".
   Taps while the mic is starting are ignored; once the button leaves the page the recording is dropped. */
function micButton(b, o){
  const alive=()=>b.isConnected, wrap=b.closest(".micwrap");
  const st=s=>{ if(!alive()) return; b.classList.toggle("live",s==="rec"); if(wrap) wrap.classList.toggle("live",s==="rec"); b.disabled=s==="busy"; b.setAttribute("aria-label", s==="rec"?"Stop recording":"Speak"); o.onState(s); };
  let busy=false;
  b.onclick=async()=>{
    if(REC){ REC.stop(); return; }
    if(busy) return; busy=true;
    try{
      stopAudio();
      const rec=await VOICE.mic.start({});
      if(!alive()) return rec.cancel();
      REC=rec; st("rec");
      const blob=await rec.done;
      if(REC===rec) REC=null;
      if(!blob || !alive()) return st("idle");
      st("busy");
      const text=(await VOICE.listen(blob)).text.trim();
      st("idle"); if(alive()) o.onText(text);
    }catch(e){ st("idle"); if(alive()) o.onError(e); }
    finally{ busy=false; }
  };
}

const PUNCT = /[\p{P}\p{S}\s]/u;

const ZD="零一二三四五六七八九", KS="영일이삼사오육칠팔구";
function zhNum(n){ if(n<10) return ZD[n]; if(n<100) return (n>=20?ZD[Math.floor(n/10)]:"")+"十"+(n%10?ZD[n%10]:""); if(n<1000) return ZD[Math.floor(n/100)]+"百"+(n%100?(n%100<10?"零":n%100<20?"一":"")+zhNum(n%100):""); if(n<10000) return ZD[Math.floor(n/1000)]+"千"+(n%1000?(n%1000<100?"零":"")+zhNum(n%1000):""); return String(n); }
function koSino(n){ if(!n) return "영"; let s=""; for(const [v,w] of [[10000,"만"],[1000,"천"],[100,"백"],[10,"십"]]){ const q=Math.floor(n/v); if(q){ s+=(q>1?koSino(q):"")+w; n%=v; } } return s+(n?KS[n]:""); }
const KN=["","하나","둘","셋","넷","다섯","여섯","일곱","여덟","아홉"], KA=["","한","두","세","네","다섯","여섯","일곱","여덟","아홉"], KT=["","열","스물","서른","마흔","쉰","예순","일흔","여든","아흔"];
const koNative = (n, attr) => n<1||n>99 ? "" : (attr && n===20 ? "스무" : KT[Math.floor(n/10)]+(attr?KA:KN)[n%10]);

function alignKeys(a, b){  // edit distance, and which characters line up (for the diff)
  const n=a.length, m=b.length, D=Array.from({length:n+1},(_,i)=>{ const r=new Array(m+1).fill(0); r[0]=i; return r; });
  for(let j=1;j<=m;j++) D[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) D[i][j]=Math.min(D[i-1][j]+1, D[i][j-1]+1, D[i-1][j-1]+(a[i-1]===b[j-1]?0:1));

  return Object.assign(best, {v: best.sc>=0.85 ? "ok" : best.sc>=(YUE?0.5:0.6) ? "close" : "no"});
}

function importOld(text){
  const o=JSON.parse(String(text).trim()); if(!o || !o.srs) throw new Error("bad");
  const byOld={}; Object.values(VOC).forEach(v=>{ if(v.old) byOld[v.old]=v; });
  let n=0;
  for(const key in o.srs){
    const dir=key.split("vocab-")[1]; if(!dir || !CDIRS.some(d=>d[0]===dir)) continue;
    for(const oid in o.srs[key]){
      const v=byOld[oid]; if(!v) continue; const rec=o.srs[key][oid], nid=cardId(dir,v.id), cur=LR.srs[nid];
      const box = !rec.reps ? 0 : rec.ivl<=1?1 : rec.ivl<=2?2 : rec.ivl<=5?3 : rec.ivl<=12?4 : rec.ivl<=30?5 : 6;
      const last=dayOf(rec.due ? rec.due - rec.ivl*864e5 : Date.now());
      if(cur && cur[4]>=last) continue;
      LR.srs[nid]=[box, Math.max(dayOf(rec.due||Date.now()), today()), (cur?cur[2]:0)+Math.max(1,rec.reps|0), (cur?cur[3]:0)+Math.max(0,(rec.reps|0)-(rec.lapses|0)), last];
      dirtyDocs.add("srs-C"); n++;
    }
  }
  if(n){ LR.mig.cards=true; dirtyDocs.add("learner"); saveLR(); }
  return n;
}

  const rows=skillRows().filter(r=>r.ready); if(rows.length) lines.push("Skill accuracy: "+rows.map(r=>`${skName(r.id)} ${Math.round(r.a*100)}% (${r.n})`).join("; "));
  const conf=confusions(14); if(conf.length) lines.push("Repeated mix-ups (14 days): "+conf.slice(0,6).map(c=>`${confText(c.key)} ×${c.n}`).join("; "));
  const ww=weakWords(); if(ww.length) lines.push("Words often missed: "+ww.map(w=>`${w.v.t.s} (${w.v.en})`).join(", "));
  const n7=recentLog(7,e=>e.s!=="talk"); lines.push(`Answers in the last 7 days: ${n7.length}, correct ${n7.length?Math.round(100*n7.filter(e=>e.ok).length/n7.length):0}%.`);
  return lines.join("\n");
}
function diagHTML(d){ return `<p><b>${esc(d.headline||"")}</b></p>${(d.focus||[]).map(f=>`<div class="miss"><span><b>${esc(f.area)}</b> ${esc(f.why)}</span><span class="sub">${esc(f.how)}</span></div>`).join("")}${d.next?`<p>Next: ${esc(d.next)}</p>`:""}<p class="sub">From ${esc(d.date||"")}</p>`; }
async function getDiagnosis(){
  const sample=await getSample(), st=$("diagStatus"); if(!sample){ st.textContent="AI isn't available here."; return; }
  $("getDiag").disabled=true; st.textContent="Reading your record…";
  const prompt=`You are a ${C.name} coach for ${LEARNER}. The app is a path of units (${SOUND.title}, then ten levels, each followed by two sets of everyday words), each made of short lessons and a unit check, plus practice: reviews, listening, speaking, vocabulary, ${C.formSkill.title.toLowerCase()}, flashcards and AI conversations.
Learning record:
${learnerSummary()}

Diagnose the 2–3 things that would most improve their ${C.name} now. Be specific and grounded only in the record; if the data is thin, say so. No praise or filler.
Reply with only JSON: {"headline":"one sentence","focus":[{"area":"short name","why":"what the record shows, with numbers","how":"one concrete action in the app"}],"next":"the single next session to do"}`;
  try{ const o=await sample.json(prompt,{cache:false, modelTier:"default", effort:"low"});
    LR.diag={day:today(), date:new Date().toLocaleDateString(), headline:String(o.headline||""), focus:(Array.isArray(o.focus)?o.focus:[]).slice(0,3).map(f=>({area:String(f.area||""),why:String(f.why||""),how:String(f.how||"")})), next:String(o.next||"")};
    dirtyDocs.add("learner"); saveLR(); $("diag").innerHTML=diagHTML(LR.diag); st.textContent="";
  }catch(e){ st.textContent=aiError(e); } finally{ if($("getDiag")) $("getDiag").disabled=false; }
}
async function genPractice(skill, btn){
  const sample=await getSample(); if(!sample){ btn.textContent="AI isn't available here"; return; }
  const ex=LR.log.filter(e=>!e.ok && e.y && (itemOf(e.id)||{sk:[]}).sk.includes(skill)).slice(-4);
  const old=btn.textContent; btn.disabled=true; btn.textContent="Writing questions…";
  const prompt=`Write 8 multiple-choice practice questions for ${LEARNER}. Focus: ${skName(skill)}.
${ex.length?"Their recent mistakes:\n"+ex.map(e=>`- "${e.q}": they chose "${e.y}", correct "${e.r}"`).join("\n"):""}
Use only what they have studied:
${levelScope(curLevel())}
${RULES}
Each question is a ${C.name} sentence with ONE blank (___) and 4 options; exactly one option is correct and the others are clearly wrong to a native speaker.
Reply with only a JSON array of 8 objects: {"q":"sentence with ___","q_rom":"romanization with ___","en":"English of the full sentence","opts":[{"t":"…","rom":"…"}],"a":<index>,"why":"one-sentence rule"}`;
  try{
    const arr=await sample.json(prompt,{cache:false, modelTier:"default", effort:"low"});
    const units=(Array.isArray(arr)?arr:[]).map((x,i)=>{
      if(!x || typeof x.q!=="string" || !x.q.includes("___") || !Array.isArray(x.opts) || x.opts.length!==4 || !Number.isInteger(x.a) || x.a<0 || x.a>3) return null;
      const opts=x.opts.map(o=>T_(o&&o.t,o&&o.rom)); if(opts.some(o=>!o.s) || new Set(opts.map(o=>o.s)).size!==4) return null;
      const full=T_(x.q.replace("___",opts[x.a].s), String(x.q_rom||"").replace("___",opts[x.a].r));
      return {t:"gap", id:"ai:"+Date.now()+":"+i, q:T_(x.q, x.q_rom), en:String(x.en||""), opts, a:x.a, why:String(x.why||""), full, sk:[skill]};
    }).filter(Boolean);
    if(!units.length){ btn.textContent="Couldn't use the reply. Try again"; return; }
    launch({kind:"practice", title:"AI practice", units, noRecord:true, back:{name:"weak", tab:"practice"}, onEnd:endPractice});
  }catch(e){ btn.textContent=aiError(e)||old; } finally{ btn.disabled=false; }
}

/* ---------------- keys ---------------- */
document.addEventListener("keydown",e=>{
  if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || $("dlg").open) return;
  if((e.key==="p"||e.key==="P") && lastSay){ e.preventDefault(); speak(lastSay.text, lastSay.o); return; }
  if(view.name!=="run") return;
  if(/^[1-6]$/.test(e.key)){ const b=[...document.querySelectorAll("#ex .sh-opt:not(:disabled)")][+e.key-1]; if(b){ e.preventDefault(); b.click(); } }
  else if((e.key==="Enter"||e.key===" ") && !e.target.closest("button,a,summary")){ const b=$("next")||$("show"); if(b){ e.preventDefault(); b.click(); } }
});

/* ---------------- back up / move progress ---------------- */
function exportAll(){ const docs={}; DOCS.forEach(n=>docs[n]=docBody(n)); return JSON.stringify({app:"studyhall-"+C.course, v:1, at:Date.now(), docs}); }
function importAll(text){
  const o=JSON.parse(String(text).trim()); if(!o || o.app!=="studyhall-"+C.course || !o.docs) throw new Error("bad");
  let n=0; for(const k of DOCS){ if(o.docs[k]){ mergeLR(k,o.docs[k]); dirtyDocs.add(k); n++; } }
  store.set("progress",P); store.set("learner",LR); sync(); return n;
}

/* ---------------- start ---------------- */
const vocabReady = VOCAB.data ? Promise.resolve(VOCAB.data) : fetch(VOCAB.url).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
vocabReady.then(d=>{ addEveryday(d); syncSoon(2000); }).catch(()=>{ EV="failed"; }).then(()=>{ if(view.name!=="run" && view.name!=="talk") render(); });
function begin(){
  if(!P.placed && hasProgress()){ P.placed={at:today(), how:"carried"}; saveP(); }  // progress from the old pages: no placement
  if(P.placed) go({name:"learn"}); else firstVisit();
}
(async()=>{
  getSample();
  const linked=connect(); let late=false;
  await Promise.race([linked, new Promise(r=>setTimeout(()=>{ late=true; r(); },4000))]);  // an account copy decides whether this is a first visit
  begin();
  const have=await linked;  // an account that answered late can still show this isn't a first visit
  if(late && have && have.size && view.name==="place" && !view.retake && (P.placed || hasProgress())) begin();
})();
</script>
