<!doctype html>
<html lang="en" data-app="cantonese">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantonese</title>
<meta name="theme-color" content="#F2F3FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Noto+Sans+TC:wght@400;500;700&display=swap">

<style>
/* Cantonese and Korean, one engine. Learn = the path of units and lessons; Practice = reviews, skills, drills, cards,
   conversations; Settings. Colors, type and components come from shared/ui.css; this sheet adds only what the
   languages need: target-language text, tone contours, tiles, dialogue lines and the pronunciation guide. */
:root{--tg:var(--font-tc)}
main{flex:1;display:flex;flex-direction:column;gap:18px;min-width:0}
.sh-wrap{overflow-x:clip}  /* the slide-in between questions never widens the page */
h2.sect{font-size:19px;margin-top:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0;border:0;background:none;color:var(--ink-2);font:700 17px var(--font);text-decoration:none;cursor:pointer}
.back svg,.x svg{stroke-width:2.5}
.back svg{width:20px;height:20px}
.hero{display:flex;align-items:center;gap:16px}
.hero h1 .nat{font-family:var(--tg);font-weight:700;color:var(--accent-ink);margin-left:.25em;font-size:.8em}
.sub{font-size:15px;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.sh-tile .tx2{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sh-tile .t{font-weight:800}
.sh-tile .d{color:var(--ink-2);font-size:15px}
#pRev .sh-icon{flex:none}
.idle{display:flex;align-items:center;gap:14px;padding:14px;border:var(--bw) dashed var(--border);border-radius:20px;color:var(--ink-2)}
.idle .sh-icon{flex:none}
.idle>span{display:flex;flex-direction:column;gap:2px}
details.more>.stack{margin-top:16px}
details.more h2{display:inline}
.sh-tile:disabled{cursor:default;opacity:.6}
.sh-opt.pick{background:var(--accent-soft)}
.linkbtn{font:inherit;font-weight:700;color:var(--accent-ink);background:none;border:0;padding:0;min-height:44px;cursor:pointer;text-decoration:underline}
.astatus{border-radius:14px;padding:10px 14px;font-size:15px;background:var(--gold);color:var(--on-gold)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
label.c{display:flex;gap:10px;align-items:center;min-height:44px}
label.sh-voice{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
#s-picker{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#s-picker label{align-self:stretch}
.sh-voice-note{font-size:15px;color:var(--ink-2)}
/* target-language text */
.tx{display:inline-flex;flex-direction:column;gap:2px;vertical-align:top;min-width:0}
.tg{font-family:var(--tg);font-weight:500;overflow-wrap:anywhere}
.rom{font-size:.8em;font-weight:600;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:0 8px;align-items:flex-end}
.said{font-size:.8em;color:var(--ink-2)} .said .tg{font-weight:400}
.syl{display:inline-flex;align-items:flex-end;gap:1px;white-space:nowrap}
.syl sup{font-size:.72em;color:var(--accent-ink);font-weight:800;align-self:flex-start;line-height:1}
.syl svg{width:.9em;height:.75em;margin-bottom:.15em;flex:none}
svg line.st{stroke:var(--surface-2)} svg path.ct{stroke:var(--accent);fill:none}
.big .tg{font-size:clamp(40px,12vw,56px);font-weight:700;line-height:1.15} .big .rom{font-size:19px}
.mid .tg{font-size:28px;line-height:1.25} .mid .rom{font-size:16px}
.huge .tg{font-size:clamp(72px,24vw,104px);line-height:1.05}
.inl{display:inline;font-family:var(--tg)} .inl .r{font-size:.85em;color:var(--ink-2);margin-left:3px}
/* audio */
.play{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;min-width:36px;min-height:36px;padding:0 10px;border:var(--bw) solid var(--border);border-radius:999px;background:var(--surface);color:var(--accent-ink);font:700 15px var(--font);cursor:pointer;vertical-align:middle;white-space:nowrap}
.play::after{content:"";position:absolute;inset:-5px}
.play svg{width:15px;height:15px;margin:0 -1.5px}  /* the shared play glyph, drawn at the size the old 12px one had */
.listen{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.listen .sh-play{font:800 24px var(--font)}
.slow{min-height:44px}
/* question screen */
.qtop{display:flex;align-items:center;gap:12px}
.qtop .sh-progress{flex:1}
.x{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;margin-left:-10px;border:0;border-radius:12px;background:transparent;color:var(--ink-2);cursor:pointer}
.x svg{width:24px;height:24px}
.q{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.kind{font-size:15px;font-weight:700;color:var(--ink-2)}
.q>.sh-tag{align-self:flex-start}
.prompt{font-size:26px;font-weight:800;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.qen{font-size:17px;color:var(--ink-2)}
.gap{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--ink);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:0 4px}
.opts{display:flex;flex-direction:column;gap:14px}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.tones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opts.tones .sh-opt{flex-direction:column;justify-content:center;gap:2px;padding:10px 6px;text-align:center}
.sh-opt .tg{font-size:22px}
.sh-opt .n{font-size:24px;font-weight:800;color:var(--accent-ink)}
.sh-opt>svg{width:48px;height:30px;flex:none}
.sh-opt .sub{font-size:13px}
.pat{display:inline-flex;align-items:center;gap:4px}
.pat svg{width:36px;height:24px}
.built{min-height:64px;border-bottom:3px solid var(--surface-2);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.tile{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;min-height:52px;padding:6px 12px;border:var(--bw) solid var(--border);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .08s ease,box-shadow .08s ease}
.tile:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
.tile .tg{font-size:22px} .tile .rom{font-size:12px}
.tile.used{visibility:hidden}
.tile:disabled{cursor:default}
.ans{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ans>.tx{flex:1 1 200px}
.sh-seg>button.len{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 6px}
.sh-seg>button.len span{font-weight:500;font-size:14px}
.sh-tile[id^="talk-"] .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.why{color:inherit;font-size:16px}
.sh-sheet .exs{font-size:15px}
.wordhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordhead .tx{flex:1}
.exs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.exs li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:var(--bw) solid var(--border);border-radius:16px}
.exs li>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.exs .tg{font-size:19px}
.exs .en{font-size:15px}
.cta{position:sticky;bottom:0;z-index:5;display:flex;flex-direction:column;gap:12px;margin:auto calc(-1*var(--gx,20px)) calc(-1*var(--gb,0px));padding:12px var(--gx,20px) max(16px,env(safe-area-inset-bottom));background:var(--bg)}
.dl{display:flex;flex-direction:column;gap:10px}
.line{max-width:92%;border-radius:16px;padding:10px 14px;background:var(--surface);border:var(--bw) solid var(--border);display:flex;flex-direction:column;gap:4px}
.line .who{font-size:13px;font-weight:800;color:var(--ink-2)}
.line .en{color:var(--ink-2);font-size:15px}
.line.me{align-self:flex-end;background:var(--accent-soft)}
.line .row{flex-wrap:nowrap;align-items:flex-start}
.corr{font-size:15px;border-left:4px solid var(--gold);padding:4px 12px;align-self:flex-end;max-width:92%;display:flex;flex-direction:column;gap:4px}
.corr.good{border-color:var(--good)}
.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.answer input{flex:1 1 200px;min-width:0;font-family:var(--tg)}
.mic-sm{width:56px;height:56px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:var(--bw) solid var(--border);background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm);cursor:pointer}
.mic-sm svg{width:26px;height:26px;stroke-width:2.2}
.mic-sm.live{background:var(--ink);color:var(--bg)}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.micwrap .sh-bars{visibility:hidden}
.micwrap.live .sh-bars{visibility:visible}
.heard{font-family:var(--tg)}
mark.dmiss{background:var(--bad-soft);color:inherit;border-radius:4px;padding:0 2px;outline:2px solid var(--bad)}
mark.dextra{background:var(--gold);color:var(--on-gold);border-radius:4px;padding:0 2px;text-decoration:line-through}
.btns{display:flex;gap:12px}
.btns>.sh-btn{flex:1}
.goals{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.goals li{display:flex;gap:10px;align-items:baseline}
.goals li::before{content:"";width:14px;height:14px;border:var(--bw) solid var(--border);border-radius:4px;flex:none;transform:translateY(2px)}
.goals li.done::before{background:var(--good)}
.chat{display:flex;flex-direction:column;gap:10px}
.grades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.miss{border-top:var(--bw) solid var(--surface-2);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.miss:first-child{border-top:0;padding-top:0}
/* path */
.cont{gap:12px}
.cont .sh-label{display:block}
.cont h2{font-size:21px}
.sh-path-body .ut{display:flex;flex-direction:column;gap:2px;text-align:left;min-height:44px;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.sh-path-body .ut b{font-size:17px;font-weight:800}
.sh-path-body .ut span{font-size:14px;color:var(--ink-2)}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;text-align:left;border:var(--bw) solid var(--border);border-radius:14px;background:var(--surface);color:var(--ink);font:700 15px/1.3 var(--font);cursor:pointer}
.lesson .ck{flex:none;width:24px;height:24px;border-radius:50%;border:var(--bw) solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--surface)}
.lesson.done .ck{background:var(--good);color:var(--on-good)}
.lesson.next{background:var(--accent-soft);box-shadow:var(--shadow-sm)}
.lesson:disabled{cursor:default;color:var(--ink-2)}
.lesson span:last-child{flex:1;min-width:0;overflow-wrap:anywhere}
.ck svg{width:14px;height:14px;stroke-width:3}
.sh-node svg{width:22px;height:22px;stroke-width:3}
/* reference lists */
.words{list-style:none;margin:0;padding:0}
.words li{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.words li+li{border-top:1px solid var(--surface-2)}
.words li>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.words .tg{font-size:20px}
.words .exs{margin-top:6px}
.gram{display:flex;flex-direction:column;gap:8px}
.gram+.gram{border-top:var(--bw) solid var(--surface-2);padding-top:14px}
.tonechart{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tonechart>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:var(--bw) solid var(--border);border-radius:14px;background:var(--surface);text-align:center}
.tonechart b{font-size:22px;color:var(--accent-ink)} .tonechart svg{width:48px;height:30px} .tonechart span{font-size:13px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .play{min-height:44px;padding:0 12px}
.chips .play .tg{font-size:19px;color:var(--ink)}
.chips .play .r{color:var(--ink-2);font-weight:600}
.lt{font-size:30px;font-family:var(--tg)}
/* tables in weak spots */
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:8px 4px;border-bottom:1px solid var(--surface-2);vertical-align:middle}
td.num{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
/* pronunciation guide (from the original flashcard pages) */
.guide{display:flex;flex-direction:column;gap:18px}
.guide section{background:var(--surface);border:var(--bw) solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.guide h2{font-size:20px}
.guide ol,.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.guide .cjk{font-family:var(--tg);font-size:1.08em}
.guide code{font-weight:800;color:var(--accent-ink)}
.guide .tblwrap{overflow-x:auto;border:var(--bw) solid var(--border);border-radius:14px}
.guide table{min-width:420px}
.guide th,.guide td{text-align:left;padding:8px 10px}
.guide th{font-size:14px;color:var(--ink-2);background:var(--surface-2)}
.guide td.k{font-weight:800;color:var(--accent-ink);white-space:nowrap}
.guide td.h{font-family:var(--tg);font-size:1.3rem}
.guide .callout{border-left:4px solid var(--accent);padding:4px 0 4px 12px}
button.say{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:2px 12px 2px 10px;border:var(--bw) solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);font:600 15px var(--font);cursor:pointer;white-space:nowrap;vertical-align:middle}
button.say svg{width:14px;height:14px;margin:0 -1.5px;color:var(--accent)}
button.say .r{color:var(--ink-2)}
.guide .tones{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.guide .tone{border:var(--bw) solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.guide .tone .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.guide .tone .n{font-size:26px;font-weight:800;color:var(--accent-ink);line-height:1}
.guide .tone svg{width:72px;height:44px;flex:none}
.guide .blocks{display:flex;flex-wrap:wrap;gap:10px}
.guide .block{border:var(--bw) solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:110px}
.guide .block .tgs{font-family:var(--tg);font-size:2.4rem;line-height:1.1}
.guide .block .parts{font-family:var(--tg);color:var(--ink-2)}
:is(.play,.tile,.lesson,.linkbtn,button.say,.mic-sm,.x,.back,.ut,summary):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (max-width:380px){.prompt{font-size:23px}.opts.tones{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<script>
"use strict";
const C = {"course": "cantonese", "lang": "yue", "name": "Cantonese", "native": "廣東話", "htmlLang": "zh-HK", "voice": "zh-HK-HiuMaanNeural", "voice2": "zh-HK-WanLungNeural", "romName": "Jyutping", "ttsLang": "zh-HK", "voiceRe": "^(yue|zh[-_](HK|Hant[-_]HK))", "voiceNameRe": "cantonese|粵|粤", "talkOpen": {"s": "你好！", "r": "nei5 hou2!"}, "chars": true, "formSkill": {"title": "Grammar", "sub": "The levels' grammar, with {forms}"}, "soundAsk": "", "soundCheck": [], "forms": [{"k": "緊", "label": "Happening now", "hint": "gan2"}, {"k": "咗", "label": "Done", "hint": "zo2"}, {"k": "未", "label": "Not yet", "hint": "mei6"}, {"k": "過", "label": "Ever done", "hint": "gwo3"}], "audioBase": "https://wbrssohmepioxapwbcne.supabase.co/storage/v1/object/public/audio/cantonese/"};
const D = {"levels":[{"id":"L1","n":1,"title":"First words","goal":"Greet people, say thank you and sorry the Hong Kong way, ask someone to repeat or slow down, and use numbers up to a thousand.","notes":[{"h":"Two ways to say thank you","p":"Use {{{\"s\": \"唔該\", \"r\": \"m4 goi1\"}}} when someone does a small service for you: a waiter brings food, someone holds a door. It also means \"please\" when you ask for something. Use {{{\"s\": \"多謝\", \"r\": \"do1 ze6\"}}} for a gift, a treat, a compliment or a birthday wish. When someone says {{{\"s\": \"唔該\", \"r\": \"m4 goi1\"}}} to you, answer {{{\"s\": \"唔使唔該\", \"r\": \"m4 sai2 m4 goi1\"}}} (no need to thank me).","ex":[[{"s":"唔該晒","r":"m4 goi1 saai3"},"Thanks a lot (for your help)."],[{"s":"多謝","r":"do1 ze6"},"Thank you (for the present)."],[{"s":"唔使唔該","r":"m4 sai2 m4 goi1"},"Don't mention it."]]},{"h":"Sorry and excuse me","p":"{{{\"s\": \"唔好意思\", \"r\": \"m4 hou2 ji3 si1\"}}} is light: excuse me, sorry to bother you, can I get past. {{{\"s\": \"對唔住\", \"r\": \"deoi3 m4 zyu6\"}}} is a real apology: you stepped on someone's foot or broke something. If someone apologises to you and it's fine, say {{{\"s\": \"唔緊要\", \"r\": \"m4 gan2 jiu3\"}}} (never mind).","ex":[[{"s":"唔好意思","r":"m4 hou2 ji3 si1"},"Excuse me."],[{"s":"對唔住","r":"deoi3 m4 zyu6"},"Sorry."],[{"s":"唔緊要","r":"m4 gan2 jiu3"},"Never mind, it's fine."]]},{"h":"Yes, no, and saying \"not\"","p":"There is no single word for yes. {{{\"s\": \"係\", \"r\": \"hai6\"}}} means \"it is\" and {{{\"s\": \"唔係\", \"r\": \"m4 hai6\"}}} \"it isn't\". For most questions you answer with the verb itself: asked {{{\"s\": \"你識唔識講廣東話呀？\", \"r\": \"nei5 sik1 m4 sik1 gong2 gwong2 dung1 waa2 aa3\"}}} (do you speak Cantonese?), say {{{\"s\": \"識\", \"r\": \"sik1\"}}} (yes, I can) or {{{\"s\": \"唔識\", \"r\": \"m4 sik1\"}}} (no). Put {{{\"s\": \"唔\", \"r\": \"m4\"}}}, a low hummed \"m\", before a verb to say \"not\". {{{\"s\": \"冇問題\", \"r\": \"mou5 man6 tai4\"}}} (no problem) is a set 4,486,576,604]},{"id":"L1-dlg-04","t":"dlg","sk":["g:question","s:phrase","s:tones"],"title":"Too fast","turns":[{"who":"Mr Chan","s":{"s":"你好！你識唔識講廣東話呀？","r":"nei5 hou2! nei5 sik1 m4 sik1 gong2 gwong2 dung1 waa2 aa3"},"en":"Hello! Do you speak Cantonese?"},{"you":true,"opts":[{"s":"識，少少。","r":"sik1, siu2 siu2"},{"s":"食，少少。","r":"sik6, siu2 siu2"},{"s":"唔識，少少。","r":"m4 sik1, siu2 siu2"}],"a":0,"why":"Answer with the verb: {{{\"s\": \"識\", \"r\": \"sik1\"}}} = yes, I can. {{{\"s\": \"唔識\", \"r\": \"m4 sik1\"}}} and \"a little\" contradict each other.","sk":["g:question","s:tones"]},{"who":"Mr Chan","s":{"s":"好呀，咁我哋講廣東話啦！","r":"hou2 aa3, gam2 ngo5 dei6 gong2 gwong2 dung1 waa2 laa1"},"en":"(very fast) Great, then let's speak Cantonese!"},{"you":true,"opts":[{"s":"唔該講慢啲。","r":"m4 goi1 gong2 maan6 di1"},{"s":"唔該晒。","r":"m4 goi1 saai3"},{"s":"早晨。","r":"zou2 san4"}],"a":0,"why":"He spoke too fast, so ask him to slow down.","sk":["s:phrase"]},{"who":"Mr Chan","s":{"s":"好，冇問題。","r":"hou2, mou5 man6 tai4"},"en":"OK, no problem."}],"k":[2,292,448,490,563,566,937,1134]},{"id":"L1-dlg-05","t":"dlg","sk":["s:phrase","s:tones"],"title":"A birthday present","turns":[{"who":"Wing","s":{"s":"生日快樂！","r":"saang1 jat6 faai3 lok6"},"en":"Happy birthday! (hands you a present)"},{"you":true,"opts":[{"s":"多謝！","r":"do1 ze6"},{"s":"唔該！","r":"m4 goi1"},{"s":"唔緊要！","r":"m4 gan2 jiu3"}],"a":0,"why":"For a present or a wish, {{{\"s\": \"多謝\", \"r\": \"do1 ze6\"}}}.","sk":["s:phrase"]},{"who":"Wing","s":{"s":"好夜喇，早唞！","r":"hou2 je6 laa3, zou2 tau2"},"en":"It's late. Good night!"},{"you":true,"opts":[{"s":"早唞！拜拜！","r":"zou2 tau2! baai1 baai3"},{"s":"早晨！拜拜！","r":"zou2 san4! baai1 baai3"},{"s":"對唔住！拜拜！","r":"deoi3 m4 zyu6! baai1 baai3"}],"a":0,"why":"Good night back: {{{\"s\": \"早唞\", \"r\": \"zou2 tau2\"}}}. {{{\"s\": \"早晨\", \"r\": \"zou2 san4\"}}} is good morning.","sk":["s:tones","s:phrase"]}],"k":[3,11,42,273,828,1872]}],"roleplay":[{"title":"Morning in the building","setup":"You meet a friendly older neighbour in the lift of your Hong Kong building. Greet her, thank her when she holds the door, and say goodbye.","persona":"You are Auntie Wong, a friendly retired woman in Hong Kong. Speak simple colloquial Hong Kong Cantonese using only level 1 words: greetings (早晨, 你好, 拜拜), 唔該 / 多謝, 唔好意思 / 對唔住, 係 / 唔係, 識 / 唔識, and numbers. Use very short sentences. Say good morning, hold the lift door so the learner can say 唔該, and ask whether they speak Cantonese (你識唔識講廣東話呀？). If they ask you to repeat or slow down, do it. Never use English.","opening":{"s":"早晨！","r":"zou2 san4"},"opening_en":"Good morning!","goals":["Return the greeting","Say you speak a little Cantonese","Thank her when she holds the door","Say goodbye"]},{"title":"Numbers at the counter","setup":"You're at a counter in a Hong Kong post office. The clerk calls ticket numbers and reads out numbers quickly. Ask her to repeat or slow down, say the numbers back, and thank her.","persona":"You are Miss Lee, a busy but kind post office clerk in Hong Kong. Speak simple colloquial Hong Kong Cantonese using only level 1 words: numbers from zero to a thousand, 係 / 唔係, 唔該, 唔使唔該. Read out numbers quickly at first (for example 一百零八, 三百二十五, 六百零七). If the learner asks you to repeat (可唔可以講多次呀？) or slow down (唔該講慢啲), do it. When they say a number back, confirm with 係 or correct them with 唔係 and the right number.","opening":{"s":"一百零八號！","r":"jat1 baak3 ling4 baat3 hou6"},"opening_en":"Number one hundred and eight!","goals":["Ask her to say a number again","Ask her to slow down","Say a number back correctly","Thank her for her help"]}]},{"id":"L2","n":2,"title":"People","goal":"Introduce yourself and your family, and ask people their name, where they're from and what they do.","notes":[{"h":"I, you, he, she, and 哋 for plurals","p":"{{{\"s\": \"我\", \"r\": \"ngo5\"}}} = I / me, {{{\"s\": \"你\", \"r\": \"nei5\"}}} = you, {{{\"s\": \"佢\", \"r\": \"keoi5\"}}} = he, she or it (one word for all three). Add {{{\"s\": \"哋\", \"r\": \"dei6\"}}} to make any of them plural: {{{\"s\": \"我哋\", \"r\": \"ngo5 dei6\"}}} we, {{{\"s\": \"你哋\", \"r\": \"nei5 dei6\"}}} you all, {{{\"s\": \"佢哋\", \"r\": \"keoi5 dei6\"}}} they. Pronouns never change form, so \"me\" is also {{{\"s\": \"我\", \"r\": \"ngo5\"}}}. Many Hong Kongers say {{{\"s\": \"你\", \"r\": \"nei5\"}}} with an l sound (lei5) and drop the ng of {{{\"s\": \"我\", \"r\": \"ngo5\"}}}; both are fine.","ex":[[{"s":"佢係醫生","r":"keoi5 hai6 ji1 sang1"},"He's a doctor. / She's a doctor."],[{"s":"佢哋係我朋友","r":"keoi5 dei6 hai6 ngo5 pang4 jau5"},"They're my friends."],[{"s":"我哋住喺芝加哥","r":"ngo5 dei6 zyu6 hai2 zi1 gaa1 go1"},"We live in Chicago."]]},{"h":"係 \"is\", 叫 \"is called\", 喺 \"is at\"","p":"{{{\"s\": \"係\", \"r\": \"hai6\"}}} (low, level) links two things: I am a doctor, this is my wife. {{{\"s\": \"叫\", \"r\": \"giu3\"}}} gives a name. {{{\"s\": \"喺\", \"r\": \"hai2\"}}} (rising) means \"at / in\" a place, and on its own it already means \"is at\": {{{\"s\": \"我媽媽喺香港\", \"r\": \"ngo5 maa4 maa1 hai2 hoeng1 gong2\"}}} = my mom is in Hong Kong. Never put {{{\"s\": \"係\", \"r\": \"hai6\"}}} in front of a place to say where someone is. Listen for the tone: hai6 stays low, hai2 rises.","ex":[[{"s":"我係醫生","r":"ngo5 hai6 ji1 sang1"},"I'm a doctor."],[{"s":"我叫Dan","r":"ngo5 giu3 Dan"},"My name is Dan."],[{"s":"佢喺香港","r":"keoi5 hai2 hoeng1 gong2"},"She's in Hong Kong."]]},{"h":"嘅 for 's, and when to drop it","p":"{{{\"s\": \"嘅\", \"r\": \"ge3\"}}} works like English 's: {{{\"s\": \"Wing嘅家姐\", \"r\": \"Wing ge3 gaa1 ze1\"}}} = Wing's older sister. After a pronoun, people usually drop it for family and close friends: {{{\"s\": \"我老婆\", \"r\": \"ngo5 lou5 po4\"}}} = my wife, {{{\"s\": \"我媽媽\", \"r\": \"ngo5 maa4 maa1\"}}} = my mom. To introduce someone, point with {{{\"s\": \"呢個\", \"r\": \"ni1 go3\"}}} (this) or {{{\"s\": \"嗰個\", \"r\": \"go2 go3\"}}} (that): {{{\"s\": \"呢個係我老婆\", \"r\": \"ni1 go3 hai6 ngo5 lou5 po4\"}}}.","ex":[[{"s":"Wing嘅家姐","r":"Wing ge3 gaa1 ze1"},"Wing's older sister"],[{"s":"呢個係我老婆","r":"ni1 go3 hai6 ngo5 lou5 po4"},"This is my wife."],[{"s":"嗰個係我哥哥","r":"go2 go3 hai6 ngo5 go4 go1"},"That's my older brother."]]},{"h":"Question words stay where the answer goes","p":"Cantonese doesn't move question words to the front. Put the question word where the answer will go: {{{\"s\": \"你叫咩名呀？\", \"r\": \"nei5 giu3 me1 meng2 aa3\"}}} (you are called what name?) is answered {{{\"s\": \"我叫Dan\", \"r\": \"ngo5 giu3 Dan\"}}}. {{{\"s\": \"咩\", \"r\": \"me1\"}}} = what, {{{\"s\": \"邊個\", \"r\": \"bin1 go3\"}}} = who, {{{\"s\": \"邊度\", \"r\": \"bin1 dou6\"}}} = where, {{{\"s\": \"點\", \"r\": \"dim2\"}}} = how. Adding {{{\"s\": \"呀\", \"r\": \"aa3\"}}} at the end makes a question softer and friendlier. Note that {{{\"s\": \"名\", \"r\": \"meng2\"}}} is said meng2 in speech.","ex":[[{"s":"佢係邊個呀？","r":"keoi5 hai6 bin1 go3 aa3"},"Who is he?"],[{"s":"你住喺邊度呀？","r":"nei5 zyu6 hai2 bin1 dou6 aa3"},"Where do you live?"],[{"s":"你點呀？","r":"nei5 dim2 aa3"},"How are you?"]]},{"h":"Sounds to listen for","p":"{{{\"s\": \"呢\", \"r\": \"ni1\"}}} (this) is high and flat; the same character as a question particle, {{{\"s\": \"你呢？\", \"r\": \"nei5 ne1\"}}} (and you?), is ne1. {{{\"s\": \"嗰\", \"r\": \"go2\"}}} (that) rises. In {{{\"s\": \"男人\", \"r\": \"naam4 jan2\"}}} and {{{\"s\": \"女人\", \"r\": \"neoi5 jan2\"}}} the last syllable rises to jan2, but in {{{\"s\": \"美國人\", \"r\": \"mei5 gwok3 jan4\"}}} it stays low: jan4.","ex":[[{"s":"我幾好，你呢？","r":"ngo5 gei2 hou2, nei5 ne1"},"Pretty good, and you?"],[{"s":"嗰個男人","r":"go2 go3 naam4 jan2"},"that man"]]}],"vocab":[{"id":"L2-v-00","t":{"s":"我","r":"ngo5"},"en":"I / me","topic":"People","note":"Many Hong Kongers drop the ng and say \"o5\". Both are understood.","avoid":[],"old":"2c6f4848a1"},{"id":"L2-v-01","t":{"s":"你","r":"nei5"},"en":"you","topic":"People","note":"Often said \"lei5\" (n becomes l). Same word.","avoid":[4],"old":"2b46fdd88b"},{"id":"L2-v-02","t":{"s":"佢","r":"keoi5"}," :[{"s":"佢係我媽媽。","r":"keoi5 hai6 ngo5 maa4 maa1"},{"s":"佢係我爸爸。","r":"keoi5 hai6 ngo5 baa4 baa1"},{"s":"佢係我老公。","r":"keoi5 hai6 ngo5 lou5 gung1"}],"a":0,"why":"A woman: {{{\"s\": \"媽媽\", \"r\": \"maa4 maa1\"}}} = mom.","sk":["s:vocab"]},{"who":"Auntie","s":{"s":"佢喺邊度呀？","r":"keoi5 hai2 bin1 dou6 aa3"},"en":"Where is she?"},{"you":true,"opts":[{"s":"佢喺芝加哥。","r":"keoi5 hai2 zi1 gaa1 go1"},{"s":"佢係芝加哥。","r":"keoi5 hai6 zi1 gaa1 go1"},{"s":"佢叫芝加哥。","r":"keoi5 giu3 zi1 gaa1 go1"}],"a":0,"why":"Where someone is: {{{\"s\": \"喺\", \"r\": \"hai2\"}}} (rising).","sk":["g:place","s:tones"]},{"who":"Auntie","s":{"s":"呢個男人呢？","r":"ni1 go3 naam4 jan2 ne1"},"en":"And this man?"},{"you":true,"opts":[{"s":"佢係我哥哥。","r":"keoi5 hai6 ngo5 go4 go1"},{"s":"佢係我家姐。","r":"keoi5 hai6 ngo5 gaa1 ze1"},{"s":"佢係我媽媽。","r":"keoi5 hai6 ngo5 maa4 maa1"}],"a":0,"why":"A man: {{{\"s\": \"哥哥\", \"r\": \"go4 go1\"}}} = older brother. {{{\"s\": \"家姐\", \"r\": \"gaa1 ze1\"}}} is older sister.","sk":["s:vocab"]}],"k":[67,72,73,79,80,82,657,2031],"u":1},{"id":"L2-dlg-05","t":"dlg","sk":["s:phrase","s:tones","s:vocab"],"title":"At a party","turns":[{"who":"Miss Lee","s":{"s":"你好！你係Dan呀？","r":"nei5 hou2! nei5 hai6 Dan aa3"},"en":"Hello! You're Dan?"},{"you":true,"opts":[{"s":"係呀，我係Dan。","r":"hai6 aa3, ngo5 hai6 Dan"},{"s":"係呀，我喺Dan。","r":"hai6 aa3, ngo5 hai2 Dan"},{"s":"唔係，我係Dan。","r":"m4 hai6, ngo5 hai6 Dan"}],"a":0,"why":"Yes: {{{\"s\": \"係呀\", \"r\": \"hai6 aa3\"}}}, then {{{\"s\": \"我係Dan\", \"r\": \"ngo5 hai6 Dan\"}}} with the low {{{\"s\": \"係\", \"r\": \"hai6\"}}}.","sk":["s:tones","s:phrase"]},{"who":"Miss Lee","s":{"s":"我係Wing嘅家姐。","r":"ngo5 hai6 Wing ge3 gaa1 ze1"},"en":"I'm Wing's older sister."},{"you":true,"opts":[{"s":"好高興認識你！","r":"hou2 gou1 hing3 jing6 sik1 nei5"},{"s":"最近點呀？","r":"zeoi3 gan6 dim2 aa3"},{"s":"拜拜！","r":"baai1 baai3"}],"a":0,"why":"You're meeting her for the first time: {{{\"s\": \"好高興認識你\", \"r\": \"hou2 gou1 hing3 jing6 sik1 nei5\"}}}.","sk":["s:phrase"]},{"who":"Miss Lee","s":{"s":"你做咩工㗎？","r":"nei5 zou6 me1 gung1 gaa3"},"en":"What do you do for work?"},{"you":true,"opts":[{"s":"我係醫生。","r":"ngo5 hai6 ji1 sang1"},{"s":"我係美國人。","r":"ngo5 hai6 mei5 gwok3 jan4"},{"s":"我住喺芝加哥。","r":"ngo5 zyu6 hai2 zi1 gaa1 go1"}],"a":0,"why":"She asked about work: {{{\"s\": \"醫生\", \"r\": \"ji1 sang1\"}}} = doctor.","sk":["s:vocab"]}],"k":[83,495,589,880,1246,1296]}],"roleplay":[{"title":"Meeting someone at a party","setup":"You're at a friend's party in Hong Kong and someone you don't know comes over to say hello. Introduce yourself and find out about them.","persona":"You are Wing, a friendly Hong Konger in your thirties who works as a teacher and lives in Sha Tin with your husband and your older sister. Speak simple colloquial Hong Kong Cantonese using mostly words from levels 1 and 2: 你好, 叫, 係, 喺, 住, 邊度, 咩, 邊個, 點, 呀, family words (老公, 家姐, 爸爸, 媽媽). Use short sentences. Ask the learner's name, where they are from, where they live and what they do for work, and answer their questions about you. If they ask you to repeat or slow down, do it.","opening":{"s":"你好！我叫Wing。你叫咩名呀？","r":"nei5 hou2! ngo5 giu3 Wing. nei5 giu3 me1 meng2 aa3"},"opening_en":"Hi! I'm Wing. What's your name?","goals":["Say your name","Say where you're from and where you live","Say what you do for work","Ask her one question about her family"]},{"title":"Showing family photos","setup":"A friendly older neighbour wants to see the photos on your phone. Tell her who each person is and where they are.","persona":"You are Auntie Wong, a chatty retired Hong Kong woman. Speak simple colloquial Hong Kong Cantonese using mostly words from levels 1 and 2. Point at imaginary photos and ask short questions like 呢個係邊個呀？, 嗰個男人呢？, 佢喺邊度呀？, 佢係邊度人呀？, 佢做咩工㗎？. React warmly to the answers and gently model the right word if the learner mixes up 係 (is) and 喺 (is at), or 呢個 (this) and 嗰個 (that).","opening":{"s":"呢個係邊個呀？","r":"ni1 go3 hai6 bin1 go3 aa3"},"opening_en":"Who's this?","goals":["Say who someone in a photo is","Use this and that correctly","Say where a family member is","Say where someone is from"]}]},{"id":"L3","n":3,"title":"Food and drink","goal":"Order food and drinks at a cha chaan teng or dim sum, and say how it tastes.","notes":[{"h":"Measure words","p":"Between a number (or {{{\"s\": \"呢\", \"r\": \"ni1\"}}} this / {{{\"s\": \"嗰\", \"r\": \"go2\"}}} that) and a noun, Cantonese needs a measure word that fits the thing. {{{\"s\": \"個\", \"r\": \"go3\"}}} is the general one: buns, items you point at. Drinks take {{{\"s\": \"杯\", \"r\": \"bui1\"}}} (cup). A bowl is {{{\"s\": \"碗\", \"r\": \"wun2\"}}}, a plate {{{\"s\": \"碟\", \"r\": \"dip6\"}}}, a portion or order {{{\"s\": \"份\", \"r\": \"fan6\"}}}, a bottle {{{\"s\": \"樽\", \"r\": \"zeon1\"}}} or {{{\"s\": \"枝\", \"r\": \"zi1\"}}}, and people are counted politely with {{{\"s\": \"位\", \"r\": \"wai2\"}}}. Before a measure word, two is {{{\"s\": \"兩\", \"r\": \"loeng5\"}}}, never {{{\"s\": \"二\", \"r\": \"ji6\"}}}.","ex":[[{"s":"兩杯奶茶","r":"loeng5 bui1 naai5 caa4"},"two milk teas"],[{"s":"一碗飯","r":"jat1 wun2 faan6"},"a bowl of rice"],[{"s":"一碟炒麵","r":"jat1 dip6 caau2 min6"},"a plate of fried noodles"],[{"s":"三位","r":"saam1 wai2"},"three people (at a restaurant)"]]},{"h":"Want and would like","p":"{{{\"s\": \"要\", \"r\": \"jiu3\"}}} + a thing means \"I'll have / I want\", which is how you order. {{{\"s\": \"想\", \"r\": \"soeng2\"}}} means \"would like to\" and needs a verb after it: {{{\"s\": \"想飲\", \"r\": \"soeng2 jam2\"}}} would like to drink, {{{\"s\": \"想食\", \"r\": \"soeng2 sik6\"}}} would like to eat. Not wanting something is {{{\"s\": \"唔要\", \"r\": \"m4 jiu3\"}}}.","ex":[[{"s":"我要呢個","r":"ngo5 jiu3 ni1 go3"},"I want this one."],[{"s":"我想飲咖啡","r":"ngo5 soeng2 jam2 gaa3 fe1"},"I'd like to drink coffee."],[{"s":"唔該唔要辣","r":"m4 goi1 m4 jiu3 laat6"},"Not spicy, please."]]},{"h":"Asking, requesting, suggesting","p":"{{{\"s\": \"有冇…呀？\", \"r\": \"jau5 mou5 … aa3\"}}} asks \"do you have…?\". Answer by repeating th ,575,1953],"u":1}],"roleplay":[{"title":"Ordering at a cha chaan teng","setup":"You and a friend walk into a busy Hong Kong-style café at lunchtime. Get a table, order a drink and something to eat, then ask for the check.","persona":"You are a busy but friendly waiter at a cha chaan teng in Hong Kong. The menu has milk tea, iced lemon tea, coffee, toast, fried noodles, beef noodles and rice dishes. Ask how many people, then what they want to drink (hot or iced), then what they want to eat. Speak simple colloquial Hong Kong Cantonese using mostly words from levels 1-3, in short sentences. If the learner is stuck, say it again more slowly once, then offer two choices.","opening":{"s":"歡迎光臨！幾多位呀？","r":"fun1 jing4 gwong1 lam4! gei2 do1 wai2 aa3"},"opening_en":"Welcome! How many people?","goals":["Say how many people you are","Order a drink with the right measure word","Order something to eat","Ask for the check"]},{"title":"Dim sum with a friend","setup":"Your Hong Kong friend Wing has taken you out for dim sum. Decide what to eat, say how the food is, and toast.","persona":"You are Wing, a relaxed Hong Konger in your thirties, at dim sum with an American friend who is learning Cantonese. Suggest dishes (shrimp dumplings, siu mai, BBQ pork buns), ask what they would like to eat and drink, ask if they are hungry or full, and make a toast. Speak casual colloquial Hong Kong Cantonese using mostly words from levels 1-3, in short sentences, with natural sentence-final particles.","opening":{"s":"你想食咩呀？","r":"nei5 soeng2 sik6 me1 aa3"},"opening_en":"What would you like to eat?","goals":["Say what you'd like to eat","Say whether you're hungry or full","Say the food is delicious","Suggest eating or paying with a let's-sentence"]}]},{"id":"L4","n":4,"title":"Around town, shopping, time","goal":"Ask where things are and how to get there, ask prices and bargain, and talk about times and days.","notes":[{"h":"Where is it? How do I get there?","p":"Say the place first, then ask. {{{\"s\": \"喺邊度呀？\", \"r\": \"hai2 bin1 dou6 aa3\"}}} = where is it, and {{{\"s\": \"點去呀？\", \"r\": \"dim2 heoi3 aa3\"}}} = how do I get there. Directions put the verb first: {{{\"s\": \"轉左\", \"r\": \"zyun3 zo2\"}}} turn left, {{{\"s\": \"轉右\", \"r\": \"zyun3 jau6\"}}} turn right, {{{\"s\": \"一直行\", \"r\": \"jat1 zik6 haang4\"}}} go straight. Where something is uses {{{\"s\": \"喺\", \"r\": \"hai2\"}}} (at), not {{{\"s\": \"係\", \"r\": \"hai6\"}}} (is).","ex":[[{"s":"地鐵站點去呀？","r":"dei6 tit3 zaam6 dim2 heoi3 aa3"},"How do I get to the MTR station?"],[{"s":"喺嗰度轉右","r":"hai2 go2 dou6 zyun3 jau6"},"Turn right there."],[{"s":"洗手間喺左邊","r":"sai2 sau2 gaan1 hai2 zo2 bin6"},"The restroom is on the left."]]},{"h":"Yes-or-no questions: A-not-A","p":"Say the word, then {{{\"s\": \"唔\", \"r\": \"m4\"}}}, then the word again: {{{\"s\": \"遠唔遠\", \"r\": \"jyun5 m4 jyun5\"}}} = far or not far? With {{{\"s\": \"有\", \"r\": \"jau5\"}}} the question is {{{\"s\": \"有冇\", \"r\": \"jau5 mou5\"}}}. Answer by repeating the word: {{{\"s\": \"遠\", \"r\": \"jyun5\"}}} or {{{\"s\": \"唔遠\", \"r\": \"m4 jyun5\"}}}.","ex":[[{"s":"遠唔遠呀？","r":"jyun5 m4 jyun5 aa3"},"Is it far?"],[{"s":"收唔收卡呀？","r":"sau1 m4 sau1 kaat1 aa3"},"Do you take cards?"],[{"s":"唔遠，好近","r":"m4 jyun5, hou2 kan5"},"Not far, it's very close."]]},{"h":"Money and bargaining","p":"In {{{\"s\": \"幾多錢呀？\", \"r\": \"gei2 do1 cin2 aa3\"}}} the word for money rises to cin2. Prices in speech are a number + {{{\"s\": \"蚊\", \"r\": \"man1\"}}} (dollars). Two dollars is {{{\"s\": \"兩蚊\", \"r\": \"loeng5 man1\"}}}, but twenty is {{{\"s\": \"二十蚊\", \"r\": \"ji6 sap6 man1\"}}}. {{{\"s\": \"太\", \"r\": \"taai3\"}}} + word + {{{\"s\": \"喇\", \"r\": \"laa3\"}}} = \"too …!\", and word + {{{\"s\": \"啲\", \"r\": \"di1\"}}} = \"a bit more …\". Careful: {{{\"s\": \"買\", \"r\": \"maai5\"}}} buy rises, {{{\"s\": \"賣\", \"r\": \"maai6\"}}} sell is low and flat.","ex":[[{"s":"二十五蚊","r":"ji6 sap6 ng5 man1"},"twenty-five dollars"],[{"s":"太貴喇！","r":"taai3 gwai3 l o, too'. It goes after the person and before the verb: {{{\"s\": \"我都鍾意\", \"r\": \"ngo5 dou1 zung1 ji3\"}}}, never at the end like English 'too'.","ex":[[{"s":"今日好熱","r":"gam1 jat6 hou2 jit6"},"It's really hot today."],[{"s":"天氣幾好","r":"tin1 hei3 gei2 hou2"},"The weather's pretty nice."],[{"s":"我都好攰","r":"ngo5 dou1 hou2 gui6"},"I'm really tired too."]]},{"h":"Is that right? Are you free?","p":"{{{\"s\": \"係咪\", \"r\": \"hai6 mai6\"}}} is {{{\"s\": \"係唔係\", \"r\": \"hai6 m4 hai6\"}}} squeezed together. Put it before what you're checking: {{{\"s\": \"你係咪好攰呀？\", \"r\": \"nei5 hai6 mai6 hou2 gui6 aa3\"}}} 'Are you tired?' On its own, {{{\"s\": \"係咪呀？\", \"r\": \"hai6 mai6 aa3\"}}} = 'Is that right?' {{{\"s\": \"得閒\", \"r\": \"dak1 haan4\"}}} = free (not busy). Ask with {{{\"s\": \"得唔得閒\", \"r\": \"dak1 m4 dak1 haan4\"}}} and answer {{{\"s\": \"得閒\", \"r\": \"dak1 haan4\"}}} or {{{\"s\": \"唔得閒\", \"r\": \"m4 dak1 haan4\"}}}.","ex":[[{"s":"你今個週末得唔得閒呀？","r":"nei5 gam1 go3 zau1 mut6 dak1 m4 dak1 haan4 aa3"},"Are you free this weekend?"],[{"s":"呢個係咪你嘅呀？","r":"ni1 go3 hai6 mai6 nei5 ge3 aa3"},"Is this yours?"]]},{"h":"Little words at the end","p":"{{{\"s\": \"呀\", \"r\": \"aa3\"}}} softens a question or remark so it doesn't sound blunt. {{{\"s\": \"啦\", \"r\": \"laa1\"}}} makes a suggestion or a friendly push: 'let's', 'go ahead'. {{{\"s\": \"喇\", \"r\": \"laa3\"}}} marks a change: something is now so. {{{\"s\": \"㗎\", \"r\": \"gaa3\"}}} adds 'you know', explaining or insisting. Sound tip: {{{\"s\": \"啦\", \"r\": \"laa1\"}}} is high and level, {{{\"s\": \"喇\", \"r\": \"laa3\"}}} sits in the middle, so listen for the pitch.","ex":[[{"s":"我哋一齊去行街啦","r":"ngo5 dei6 jat1 cai4 heoi3 haang4 gaai1 laa1"},"Let's go shopping together."],[{"s":"好夜喇","r":"hou2 je6 laa3"},"It's late now."],[{"s":"呢個好好食㗎","r":"ni1 go3 hou2 hou2 sik6 gaa3"},"This is really tasty, you know."],[{"s":"你去邊度呀？","r":"nei5 heoi3 bin1 dou6 aa3"},"Where are you going?"]]}],"vocab":[{"id":"L5-v-00","t":{"s":"今日好熱"," days, whether they're busy, and whether they're free this weekend. You like watching movies and going shopping, and you don't like hot weather. Suggest doing something together with 啦. Speak simple colloquial Hong Kong Cantonese using mostly words from levels 1-5, with 緊, 鍾意, 得唔得閒, 都 and 幾. Short sentences.","opening":{"s":"好耐冇見！最近點呀？","r":"hou2 noi6 mou5 gin3! zeoi3 gan6 dim2 aa3"},"opening_en":"Long time no see! How have you been?","goals":["React to seeing your friend","Say what you're busy with","Say whether you're free this weekend","Agree on something you both like"]}]},{"id":"L6","n":6,"title":"Past, experience, plans","goal":"Say what you did, what you've done before and what you plan to do, and give reasons and opinions.","notes":[{"h":"Done, and 'yet?'","p":"{{{\"s\": \"咗\", \"r\": \"zo2\"}}} right after the verb means the action is done. To ask 'yet?', put {{{\"s\": \"未\", \"r\": \"mei6\"}}} at the end: {{{\"s\": \"你食咗飯未呀？\", \"r\": \"nei5 sik6 zo2 faan6 mei6 aa3\"}}} (a friendly greeting too). Say yes with the verb and {{{\"s\": \"咗\", \"r\": \"zo2\"}}}: {{{\"s\": \"食咗喇\", \"r\": \"sik6 zo2 laa3\"}}}. Say no with {{{\"s\": \"未呀\", \"r\": \"mei6 aa3\"}}}, or put {{{\"s\": \"未\", \"r\": \"mei6\"}}} before the verb and drop {{{\"s\": \"咗\", \"r\": \"zo2\"}}}: {{{\"s\": \"我未食\", \"r\": \"ngo5 mei6 sik6\"}}}.","ex":[[{"s":"我食咗飯喇","r":"ngo5 sik6 zo2 faan6 laa3"},"I've already eaten."],[{"s":"你食咗飯未呀？","r":"nei5 sik6 zo2 faan6 mei6 aa3"},"Have you eaten yet?"],[{"s":"我未食","r":"ngo5 mei6 sik6"},"I haven't eaten yet."]]},{"h":"Ever done (gwo3)","p":"{{{\"s\": \"過\", \"r\": \"gwo3\"}}} after a verb means you have done it at some time: experience. Compare {{{\"s\": \"佢去咗香港\", \"r\": \"keoi5 heoi3 zo2 hoeng1 gong2\"}}} 'she has gone to Hong Kong' (she's there now) with {{{\"s\": \"佢去過香港\", \"r\": \"keoi5 heoi3 gwo3 hoeng1 gong2\"}}} 'she has been to Hong Kong before'. Not yet: {{{\"s\": \"我未去過\", \"r\": \"ngo5 mei6 heoi3 gwo3\"}}}. Sound tip: {{{\"s\": \"咗\", \"r\": \"zo2\"}}} rises, {{{\"s\": \"過\", \"r\": \"gwo3\"}}} stays mid and level.","ex":[[{"s":"我去過香港","r":"ngo5 heoi3 gwo3 hoeng1 gong2"},"I've been to Hong Kong."],[{"s":"你去過香港未呀？","r":"nei5 heoi3 gwo3 hoeng1 gong2 mei6 aa3"},"Have you been to Hong Kong?"],[{"s":"佢去咗香港","r":"keoi5 heoi3 zo2 hoeng1 gong2"},"She has gone to Hong Kong (she's there now)."]]},{"h":"Future and plans","p":"{{{\"s\": \"會\", \"r\": \"wui5\"}}} = will, for predictions. {{{\"s\": \"想\", \"r\": \"soeng2\"}}} = want to. {{{\"s\": \"打算\", \"r\": \"daa2 syun3\"}}} = plan to. All three go straight before the verb. Cantonese has no tense: time words like {{{\"s\": \"聽日\", \"r\": \"ting1 jat6\"}}} tell you when.","ex":[[{"s":"聽日會落雨","r":"ting1 jat6 wui5 lok6 jyu5"},"It will rain tomorrow."],[{"s":"我想去香港","r":"ngo5 soeng2 heoi3 hoeng1 gong2"},"I want to go to Hong Kong."],[{"s":"我打算星期六去行街","r":"ngo5 daa2 syun3 sing1 kei4 luk6 heoi3 haang4 gaai1"},"I'm planning to go shopping on Saturday."]]},{"h":"Because, so, if, how about","p":"{{{\"s\": \"因為\", \"r\": \"jan1 wai6\"}}} = because and {{{\"s\": \"所以\", \"r\": \"so2 ji5\"}}} = so; use one or both, the reason comes first. {{{\"s\": \"如果\", \"r\": \"jyu4 gwo2\"}}} = if; in the second half, {{{\"s\": \"就\", \"r\": \"zau6\"}}} 'then' goes right before the verb. {{{\"s\": \"不如…啦\", \"r\": \"bat1 jyu4 … laa1\"}}} = 'how about…', a friendly suggestion.","ex":[[{"s":"因為落緊雨，所以我哋搭的士","r":"jan1 wai6 lok6 gan2 jyu5, so2 ji5 ngo5 dei6 daap3 dik1 si2"},"Because it's raining, we're taking a taxi."],[{"s":"如果落雨，我哋就搭的士","r":"jyu4 gwo2 lok6 jyu5, ngo5 dei6 zau6 daap3 dik1 si2"},"If it rains, we'll take a taxi."],[{"s":"不如我哋去食飯啦","r":"bat1 jyu4 ngo5 dei6 heoi3 sik6 faan6 laa1"},"How about we go eat?"]]},{"h":"Opinions, how well, with whom","p":"{{{\"s\": \"覺得\", \"r\": \"gok3 dak1\"}}} = think or feel (an opinion). {{{\"s\": \"得\", \"r\": \"dak1\"}}} after a verb is followed by how well it's done: {{{\"s\": \"講得好好\", \"r\": \"gong2 dak1 hou2 hou2\"}}}. {{{\"s\": \"同\", \"r\": \"tung4\"}}} = with; it goes before the verb, not at the end: {{{\"s\": \"我同朋友去咗飲茶\", \"r\": \"ngo5 tung4 pang4 jau5 heoi3 zo2 jam2 caa4\"}}}.","ex":[[{"s":"我覺得好好食","r":"ngo5 gok3 dak1 hou2 hou2 sik6"},"I think it's really tasty."],[{"s":"你廣東話講得好好","r":"nei5 gwong2 dung1 waa2 gong2 dak1 hou2 hou2"},"Your Cantonese is really good."],[{"s":"我同朋友去咗飲茶","r":"ngo5 tung4 pang4 jau5 heoi3 zo2 jam2 caa4"},"I went for dim sum with friends."]]}],"vocab":[{"id":"L6-v-00","t":{"s":"我食咗飯喇","r":"ngo5 sik6 zo2 faan6 laa3"},"en":"I've already eaten","topic":"Sentences","note":"咗 (zo2) after a verb = the action is done.","avoid":[],"old":"838d1451aa"},{"id":"L6-v-01","t":{"s":"你食咗飯未呀？","r":"nei5 sik6 zo2 faan6 mei6 aa3"},"en":"Have you eaten yet?","topic":"Sentences","note":"A friendly greeting, like \"how's it going?\". 未 (mei6) at the end = \"yet?\"","avoid":[],"old":"902154764d"},{"id":"L6-v-02","t":{"s":"未呀","r":"mei6 aa3"},"en":"Not yet","topic":"Sentences","note":"","avoid":[28],"old":"06f1fd2cdf"},{"id":"L6-v-03","t":{"s":"我去過香港","r":"ngo5 heoi3 gwo3 hoeng1 gong2"},"en":"I've been to Hong Kong","topic":"Sentences","note":"過 (gwo3) after a verb = \"have ever done\".","avoid":[],"old":"f7d34a880f"},{"id":"L6-v-04","t":{"s":"你去過香港未呀？","r":"nei5 heoi3 gwo3 hoeng1 gong2 mei6 aa3"},"en":"Have you been to Hong Kong?","topic":"Sentences","note":"","avoid":[],"old":"5195eb9983"},{"id":"L6-v-05","t":{"s":"我學緊廣東話","r":"ngo5 hok6 gan2 gwong2 dung1 waa2"},"en":"I'm learning Cantonese","topic":"Sentences","note":"","avoid":[],"old":"45a824146f"},{"id":"L6-v-06","t":{"s":"我想去香港","r":"ngo5 soeng2 heoi3 hoeng1 gong2"},"en":"I want to go to Hong Kong","topic":"Sentences","note":"","avoid":[],"old":"566d94cb17"},{"id":"L6-v-07","t":{"s":"聽日會落雨","r":"ting1 jat6 wui5 lok6 jyu5"},"en":"It will rain tomorrow","topic":"Sentences","note":"會 (wui5) = will.","avoid":[],"old":"8350d4e25b"},{"id":"L6-v-08","t":{"s":"我好攰，所以想返屋企","r":"ngo5 hou2 gui6, so2 ji5 soeng2 faan1 uk1 kei2"},"en":"I'm tired, so I wa ":{"s":"你打算同邊個去呀？","r":"nei5 daa2 syun3 tung4 bin1 go3 heoi3 aa3"},"en":"Who are you planning to go with?"},{"you":true,"opts":[{"s":"我打算同老婆去","r":"ngo5 daa2 syun3 tung4 lou5 po4 heoi3"},{"s":"我打算老婆同去","r":"ngo5 daa2 syun3 lou5 po4 tung4 heoi3"},{"s":"我同打算老婆去","r":"ngo5 tung4 daa2 syun3 lou5 po4 heoi3"}],"a":0,"why":"Same order as his question: {{{\"s\": \"打算\", \"r\": \"daa2 syun3\"}}} + {{{\"s\": \"同\", \"r\": \"tung4\"}}} + person + verb.","sk":["g:order","g:modal"]},{"who":"Mr Chan","s":{"s":"你廣東話講得好好！","r":"nei5 gwong2 dung1 waa2 gong2 dak1 hou2 hou2"},"en":"Your Cantonese is really good!"},{"you":true,"opts":[{"s":"多謝！我學緊廣東話","r":"do1 ze6! ngo5 hok6 gan2 gwong2 dung1 waa2"},{"s":"唔該！我學緊廣東話","r":"m4 goi1! ngo5 hok6 gan2 gwong2 dung1 waa2"},{"s":"多謝！我學過咗廣東話","r":"do1 ze6! ngo5 hok6 gwo3 zo2 gwong2 dung1 waa2"}],"a":0,"why":"Thank someone for a compliment with {{{\"s\": \"多謝\", \"r\": \"do1 ze6\"}}}. {{{\"s\": \"學緊\", \"r\": \"hok6 gan2\"}}} = learning right now.","sk":["s:phrase","g:aspect"]}],"k":[3,9,64,79,81,122,247,249,487,490,514,1134]},{"id":"L6-dlg-05","t":"dlg","sk":["g:aspect","g:order","g:question","g:time"],"title":"Plans for tomorrow","turns":[{"who":"Wing","s":{"s":"聽日你得唔得閒呀？","r":"ting1 jat6 nei5 dak1 m4 dak1 haan4 aa3"},"en":"Are you free tomorrow?"},{"you":true,"opts":[{"s":"得閒，點解呀？","r":"dak1 haan4, dim2 gaai2 aa3"},{"s":"得閒，點樣呀？","r":"dak1 haan4, dim2 joeng2 aa3"},{"s":"得閒，邊個呀？","r":"dak1 haan4, bin1 go3 aa3"}],"a":0,"why":"Ask why with {{{\"s\": \"點解\", \"r\": \"dim2 gaai2\"}}}. {{{\"s\": \"點樣\", \"r\": \"dim2 joeng2\"}}} is 'how'.","sk":["g:question"]},{"who":"Wing","s":{"s":"不如我哋去行街啦！","r":"bat1 jyu4 ngo5 dei6 heoi3 haang4 gaai1 laa1"},"en":"How about we go shopping?"},{"you":true,"opts":[{"s":"好呀！我哋幾點見呀？","r":"hou2 aa3! ngo5 dei6 gei2 dim2 gin3 aa3"},{"s":"好呀！我哋幾點見咗呀？","r":"hou2 aa3! ngo5 dei6 gei2 dim2 gin3 zo2 aa3"},{"s":"好呀！我哋幾多見呀？","r":"hou2 aa3! ngo5 dei6 gei2 do1 gin3 aa3"}],"a":0,"why":"{{{\"s\": \"幾點\", \"r\": \"gei2 dim2\"}}} = what time. The meeting is in the future, so no {{{\"s\": \"咗\", \"r\": \"zo2\"}}}.","sk":["g:question","g:time"]},{"who":"Wing","s":{"s":"三點啦。如果落雨，我哋就去睇戲。","r":"saam1 dim2 laa1. jyu4 gwo2 lok6 jyu5, ngo5 dei6 zau6 heoi3 tai2 hei3"},"en":"Three o'clock. If it rains, we'll go to a movie."},{"you":true,"opts":[{"s":"好，我晏啲打俾你","r":"hou2, ngo5 aan3 di1 daa2 bei2 nei5"},{"s":"好，我晏啲打咗俾你","r":"hou2, ngo5 aan3 di1 daa2 zo2 bei2 nei5"},{"s":"好，我晏啲俾打你","r":"hou2, ngo5 aan3 di1 bei2 daa2 nei5"}],"a":0,"why":"{{{\"s\": \"打俾你\", \"r\": \"daa2 bei2 nei5\"}}} = call you. A call you'll make later takes no {{{\"s\": \"咗\", \"r\": \"zo2\"}}}.","sk":["g:order","g:aspect"]}],"k":[9,159,162,209,210,213,215,243,253,487,498,505,510,519,561,597],"u":1}],"roleplay":[{"title":"Monday morning catch-up","setup":"It's Monday morning and a Hong Kong friend asks about your weekend. Tell her what you did, give your opinion, and suggest a plan.","persona":"You are Ka-yan, a friendly Hong Kong woman in her late twenties who works in an office. Ask what the learner did at the weekend, who they went with, what they thought of it, and whether they've ever been to places or tried foods you mention (dim sum, milk tea, BBQ pork buns). Say what you did yourself (you went for dim sum with your mum and watched a movie). React to their suggestions. Speak simple colloquial Hong Kong Cantonese using mostly words from levels 1-6: 咗, 過, 未, 覺得, 同, 不如…啦, 因為/所以. Keep sentences short and repeat or slow down when asked.","opening":{"s":"早晨！你週末做咗啲咩呀？","r":"zou2 san4! nei5 zau1 mut6 zou6 zo2 di1 me1 aa3"},"opening_en":"Morning! What did you do at the weekend?","goals":["Say what you did and who with","Give your opinion of it","Say whether you've ever done something she mentions","Suggest doing something together"]},{"title":"Planning a Hong Kong trip","setup":"A Hong Kong-born friend of the family in Chicago asks about your plans to visit Hong Kong. Talk about whether you've been, who you'll go with and what you want to do.","persona":"You are Mr Chan, a warm Hong Kong man in his fifties who has lived in Chicago for twenty years. Ask whether the learner has been to Hong Kong, who they plan to go with, what they want to do and eat there. Mention that Hong Kong will be hot and it will often rain in summer, and suggest going for dim sum. Ask why they are learning Cantonese. Speak simple colloquial Hong Kong Cantonese using mostly words from levels 1-6: 過, 未, 會, 想, 打算, 因為…所以…, 如果…就…, 不如…啦. Short sentences.","opening":{"s":"你去過香港未呀？","r":"nei5 heoi3 gwo3 hoeng1 gong2 mei6 aa3"},"opening_en":"Have you been to Hong Kong?","goals":["Say whether you've been before","Say who you plan to go with","Say what you want to do there","Give a reason with because or so"]}]},{"id":"L7","n":7,"title":"Making plans","goal":"Talk about dates and days, say what you can and have to do, and make, accept or politely decline plans by phone or message.","notes":[{"h":"Dates: month, then day","p":"Months are a counting number + {{{\"s\": \"月\", \"r\": \"jyut6\"}}}: {{{\"s\": \"一月\", \"r\": \"jat1 jyut6\"}}} January, {{{\"s\": \"二月\", \"r\": \"ji6 jyut6\"}}} February … {{{\"s\": \"十二月\", \"r\": \"sap6 ji6 jyut6\"}}} December. The day of the month is a number + {{{\"s\": \"號\", \"r\": \"hou6\"}}}. Say the bigger unit first: {{{\"s\": \"三月十號\", \"r\": \"saam1 jyut6 sap6 hou6\"}}} = March 10th. Careful: February is {{{\"s\": \"二月\", \"r\": \"ji6 jyut6\"}}}, but 'two months' is {{{\"s\": \"兩個月\", \"r\": \"loeng5 go3 jyut6\"}}}, with {{{\"s\": \"兩\", \"r\": \"loeng5\"}}} and a measure word. {{{\"s\": \"號\", \"r\": \"hou6\"}}} is low and flat; don't let it rise into {{{\"s\": \"好\", \"r\": \"hou2\"}}}.","ex":[[{"s":"今日幾號呀？","r":"gam1 jat6 gei2 hou6 aa3"},"What's the date today?"],[{"s":"三月十號","r":"saam1 jyut6 sap6 hou6"},"March 10th"],[{"s":"我二月生日","r":"ngo5 ji6 jyut6 saang1 jat6"},"My birthday is in February."],[{"s":"兩個月","r":"loeng5 go3 jyut6"},"two months"]]},{"h":"Weeks and days of the week","p":"{{{\"s\": \"星期\", \"r\": \"sing1 kei4\"}}} and {{{\"s\": \"禮拜\", \"r\": \"lai5 baai3\"}}} both mean 'week', and in everyday speech {{{\"s\": \"禮拜\", \"r\": \"lai5 baai3\"}}} is very common. Days are 'week' + a number: {{{\"s\": \"禮拜一\", \"r\": \"lai5 baai3 jat1\"}}} Monday … {{{\"s\": \"禮拜六\", \"r\": \"lai5 baai3 luk6\"}}} Saturday; Sunday is {{{\"s\": \"禮拜日\", \"r\": \"lai5 baai3 jat6\"}}}. 'Which day?' is {{{\"s\": \"星期幾\", \"r\": \"sing1 kei4 gei2\"}}}. 'Next' is {{{\"s\": \"下\", \"r\": \"haa6\"}}} and 'last' is {{{\"s\": \"上\", \"r\": \"soeng6\"}}}: {{{\"s\": \"下個禮拜\", \"r\": \"haa6 go3 lai5 baai3\"}}} next week, {{{\"s\": \"上個禮拜\", \"r\": \"soeng6 go3 lai5 baai3\"}}} last week, {{{\"s\": \"下個月\", \"r\": \"haa6 go3 jyut6\"}}} next month. You can also drop {{{\"s\": \"個\", \"r\": \"go3\"}}}: {{{\"s\": \"下星期\", \"r\": \"haa6 sing1 kei4\"}}}.","ex":[[{"s":"今日星期幾呀？","r":"gam1 jat6 sing1 kei4 gei2 aa3"},"What day is it today?"],[{"s":"下個禮拜六","r":"haa6 go3 lai5 baai3 luk6"},"next Saturday"],[{"s":"聽晚","r":"ting1 maan5"},"tomorrow night"]]},{"h":"Can, may, have to","p":"{{{\"s\": \"識\", \"r\": \"sik1\"}}} = know how to, for a learned skill: {{{\"s\": \"我唔識游水\", \"r\": \"ngo5 m4 sik1 jau4 seoi2\"}}}. Keep it high: {{{\"s\": \"食\", \"r\": \"sik6\"}}} with a low tone means 'eat'. {{{\"s\": \"可以\", \"r\": \"ho2 ji5\"}}} = can or may, when something is possible or allowed. {{{\"s\": \"得\", \"r\": \"dak1\"}}} = it works, I can make it: {{{\"s\": \"我聽日唔得\", \"r\": \"ngo5 ting1 jat6 m4 dak1\"}}}. {{{\"s\": \"會\", \"r\": \"wui5\"}}} still means 'will'. {{{\"s\": \"要\", \"r\": \"jiu3\"}}} before a verb = need to, have to.","ex":[[{"s":"你識唔識講英文呀？","r":"nei5 sik1 m4 sik1 gong2 jing1 man2 aa3"},"Do you speak English?"],[{"s":"呢度可唔可以影相呀？","r":"ni1 dou6 ho2 m4 ho2 ji5 jing2 soeng2 aa3"},"Can I take photos here?"],[{"s":"禮拜六得唔得呀？","r":"lai5 baai3 luk6 dak1 m4 dak1 aa3"},"Does Saturday work?"],[{"s":"我要早啲走","r":"ngo5 jiu3 zou2 di1 zau2"},"I need to leave early."]]},{"h":"Inviting, saying yes, saying no","p":"{{{\"s\": \"約\", \"r\": \"joek3\"}}} = to arrange to meet someone. Invite with {{{\"s\": \"你想唔想一齊去呀？\", \"r\": \"nei5 soeng2 m4 soeng2 jat1 cai4 heoi3 aa3\"}}} or with {{{\"s\": \"不如…啦\", \"r\": \"bat1 jyu4 … laa1\"}}} from Level 6. Say yes with {{{\"s\": \"好呀！\", \"r\": \"hou2 aa3\"}}}, and lock the plan in with {{{\"s\": \"就咁話啦\", \"r\": \"zau6 gam2 waa6 laa1\"}}} 'it's settled'. To say no politely: apologise, give a short reason, and leave the door open with {{{\"s\": \"下次先啦\", \"r\": \"haa6 ci3 sin1 laa1\"}}} or {{{\"s\": \"遲啲再約啦\", \"r\": \"ci4 di1 zoi3 joek3 laa1\"}}}.","ex":[[{"s":"唔好意思，我嗰日唔得閒","r":"m4 hou2 ji3 si1, ngo5 go2 jat6 m4 dak1 haan4"},"Sorry, I'm not free that day."],[{"s":"好可惜","r":"hou2 ho2 sik1"},"What a pity."],[{"s":"一言為定","r":"jat1 jin4 wai4 ding6"},"It's a deal."]]},{"h":"Phone, messages, before / after / first","p":"Call someone: {{{\"s\": \"打電話俾\", \"r\": \"daa2 din6 waa2 bei2\"}}} + the person. In {{{\"s\": \"電話\", \"r\": \"din6 waa2\"}}} the second syllable rises. Pick up the phone with {{{\"s\": \"喂？\", \"r\": \"wai2\"}}}. Hong Kongers mix in English: {{{\"s\": \"我send WhatsApp俾你\", \"r\": \"ngo5 send WhatsApp bei2 nei5\"}}}. {{{\"s\": \"覆\", \"r\": \"fuk1\"}}} = reply. {{{\"s\": \"遲啲\", \"r\": \"ci4 di1\"}}} = later on, some time soon; {{{\"s\": \"晏啲\", \"r\": \"aan3 di1\"}}} = a bit later today. {{{\"s\": \"之前\", \"r\": \"zi1 cin4\"}}} before and {{{\"s\": \"之後\", \"r\": \"zi1 hau6\"}}} after go AFTER the event: {{{\"s\": \"食飯之前\", \"r\": \"sik6 faan6 zi1 cin4\"}}}. {{{\"s\": \"先\", \"r\": \"sin1\"}}} 'first' often goes at the very end: {{{\"s\": \"等我問吓佢先\", \"r\": \"dang2 ngo5 man6 haa5 keoi5 sin1\"}}}.","ex":[[{"s":"我聽日打電話俾你","r":"ngo5 ting1 jat6 daa2 din6 waa2 bei2 nei5"},"I'll call you tomorrow."],[{"s":"我遲啲覆你","r":"ngo5 ci4 di1 fuk1 nei5"},"I'll get back to you later."],[{"s":"收工之後","r":"sau1 gung1 zi1 hau6"},"after work"]]}],"vocab":[{"id":"L7-v-00","t":{"s":"幾號","r":"gei2 hou6"},"en":"what date (which day of the month)","t am2 gaa3 fe1, ngo5 jam2 caa4"},"en":"I never drink coffee. I drink tea."},{"you":true,"opts":[{"s":"真係？你每日飲幾多杯呀？","r":"zan1 hai6? nei5 mui5 jat6 jam2 gei2 do1 bui1 aa3"},{"s":"真係？你每日飲幾多碗呀？","r":"zan1 hai6? nei5 mui5 jat6 jam2 gei2 do1 wun2 aa3"},{"s":"真係？你每日飲幾多位呀？","r":"zan1 hai6? nei5 mui5 jat6 jam2 gei2 do1 wai2 aa3"}],"a":0,"why":"Drinks are counted in cups: {{{\"s\": \"杯\", \"r\": \"bui1\"}}}. {{{\"s\": \"碗\", \"r\": \"wun2\"}}} is a bowl; {{{\"s\": \"位\", \"r\": \"wai2\"}}} counts people.","sk":["g:measure"]},{"who":"Miss Lee","s":{"s":"三杯！朝早一杯，晏晝兩杯","r":"saam1 bui1! ziu1 zou2 jat1 bui1, aan3 zau3 loeng5 bui1"},"en":"Three! One in the morning and two in the afternoon."}],"k":[8,20,84,87,101,166,316,329,331,547,935,963]},{"id":"L8-dlg-04","t":"dlg","sk":["g:place","s:phrase","s:vocab"],"title":"Meeting a neighbour","turns":[{"who":"Auntie","s":{"s":"早晨！你去邊度呀？","r":"zou2 san4! nei5 heoi3 bin1 dou6 aa3"},"en":"Morning! Where are you off to?"},{"you":true,"opts":[{"s":"我去超級市場","r":"ngo5 heoi3 ciu1 kap1 si5 coeng4"},{"s":"我喺超級市場","r":"ngo5 hai2 ciu1 kap1 si5 coeng4"},{"s":"我係超級市場","r":"ngo5 hai6 ciu1 kap1 si5 coeng4"}],"a":0,"why":"She asked where you're going: {{{\"s\": \"去\", \"r\": \"heoi3\"}}}. {{{\"s\": \"喺\", \"r\": \"hai2\"}}} = be at; {{{\"s\": \"係\", \"r\": \"hai6\"}}} = to be.","sk":["g:place"]},{"who":"Auntie","s":{"s":"你行路去呀？好遠㗎！","r":"nei5 haang4 lou6 heoi3 aa3? hou2 jyun5 gaa3"},"en":"Are you walking there? It's really far!"},{"you":true,"opts":[{"s":"唔係，我搭巴士","r":"m4 hai6, ngo5 daap3 baa1 si2"},{"s":"唔係，我揸巴士","r":"m4 hai6, ngo5 zaa1 baa1 si2"},{"s":"係，我搭咗巴士","r":"hai6, ngo5 daap3 zo2 baa1 si2"}],"a":0,"why":"Passengers {{{\"s\": \"搭\", \"r\": \"daap3\"}}} the bus. The third answer says 'yes, walking' and 'took the bus' at once.","sk":["s:vocab"]},{"who":"Auntie","s":{"s":"巴士站喺嗰度，一直行就到","r":"baa1 si2 zaam6 hai2 go2 dou6, jat1 zik6 haang4 zau6 dou3"},"en":"The bus stop is over there. Go straight and you're there."},{"you":true,"opts":[{"s":"唔該晒！","r":"m4 goi1 saai3"},{"s":"對唔住！","r":"deoi3 m4 zyu6"},{"s":"早唞！","r":"zou2 tau2"}],"a":0,"why":"She helped you: {{{\"s\": \"唔該晒\", \"r\": \"m4 goi1 saai3\"}}}. {{{\"s\": \"早唞\", \"r\": \"zou2 tau2\"}}} is 'good night'.","sk":["s:phrase"]}],"k":[1,2,8,80,134,143,358,362,487,496,511,572,647,873,941,1107,1973],"u":1},{"id":"L8-dlg-05","t":"dlg","sk":["g:aspect","g:connect","g:order","g:time"],"title":"Sundays","turns":[{"who":"Wing","s":{"s":"你禮拜日平時做咩呀？","r":"nei5 lai5 baai3 jat6 ping4 si4 zou6 me1 aa3"},"en":"What do you usually do on Sundays?"},{"you":true,"opts":[{"s":"我先執屋，然後去公園","r":"ngo5 sin1 zap1 uk1, jin4 hau6 heoi3 gung1 jyun2"},{"s":"我然後執屋，先去公園","r":"ngo5 jin4 hau6 zap1 uk1, sin1 heoi3 gung1 jyun2"},{"s":"我先執屋，之前去公園","r":"ngo5 sin1 zap1 uk1, zi1 cin4 heoi3 gung1 jyun2"}],"a":0,"why":"{{{\"s\": \"先\", \"r\": \"sin1\"}}} comes with the first action, {{{\"s\": \"然後\", \"r\": \"jin4 hau6\"}}} with the second.","sk":["g:connect","g:order"]},{"who":"Wing","s":{"s":"你成日去公園㗎？","r":"nei5 seng4 jat6 heoi3 gung1 jyun2 gaa3"},"en":"You go to the park a lot?"},{"you":true,"opts":[{"s":"係呀，每個禮拜日都去","r":"hai6 aa3, mui5 go3 lai5 baai3 jat6 dou1 heoi3"},{"s":"係呀，我好少去","r":"hai6 aa3, ngo5 hou2 siu2 heoi3"},{"s":"係呀，每個禮拜日都去咗","r":"hai6 aa3, mui5 go3 lai5 baai3 jat6 dou1 heoi3 zo2"}],"a":0,"why":"{{{\"s\": \"每個禮拜日都去\", \"r\": \"mui5 go3 lai5 baai3 jat6 dou1 heoi3\"}}} = I go every Sunday. A habit takes no {{{\"s\": \"咗\", \"r\": \"zo2\"}}}, and 'yes' + 'rarely' contradicts.","sk":["g:time","g:aspect"]},{"who":"Wing","s":{"s":"好呀，下次我同你一齊去！","r":"hou2 aa3, haa6 ci3 ngo5 tung4 nei5 jat1 cai4 heoi3"},"en":"Nice, next time I'll go with you!"}],"k":[263,330,336,341,354,487,495,575,917,949,1113,1280]}],"roleplay":[{"title":"Comparing daily routines","setup":"You're chatting with Wing, a Hong Kong office worker, about a normal weekday. Swap routines: when you get up, how you get to work, and what you do in the evening.","persona":"You are Wing, a friendly Hong Kong office worker in your late twenties. Your weekday: you get up at seven, shower, have breakfast at a cha chaan teng, take the MTR to work in Central (about thirty minutes), get off work around seven in the evening, rarely cook, often eat dinner with friends, and go to bed late, around one o'clock. Ask the learner about their routine one question at a time and react naturally, sharing your own. Speak simple colloquial Hong Kong Cantonese in short sentences, using mostly words from levels 1-8: routine verbs, how-often words (every day, often, sometimes, now and then, rarely), first-then, as-soon-as, and transport. If the learner struggles, rephrase more simply.","opening":{"s":"你平時幾點起身呀？","r":"nei5 ping4 si4 gei2 dim2 hei2 san1 aa3"},"opening_en":"What time do you usually get up?","goals":["Say when you get up","Say how you get to work","Say how often you cook","Ask about Wing's evenings"]},{"title":"Chatting with a neighbour","setup":"You meet Auntie Wong, your neighbour, outside your building in the morning. Tell her where you're going and how, and ask her about the local wet market.","persona":"You are Auntie Wong, a chatty retired Hong Kong woman in your sixties who lives next door. You go to the wet market almost every morning because the food is fresher than at the supermarket; it is a ten-minute walk, or two stops by bus. You cook every day for your family. Ask the learner where they are going and how they are getting there, recommend the wet market, and ask whether they cook at home. Speak simple colloquial Hong Kong Cantonese in short sentences, mostly with words from levels 1-8. Be warm and a little nosy; rephrase simply if the learner is stuck.","opening":{"s":"早晨！去邊度呀？","r":"zou2 san4! heoi3 bin1 dou6 aa3"},"opening_en":"Morning! Where are you off to?","goals":["Say where you are going","Say how you are getting there","Ask how often she goes to the wet market","Say whether you cook at home"]}]},{"id":"L9","n":9,"title":"Describing and comparing","goal":"Describe people, places and clothes, and compare two things.","notes":[{"h":"Describing words","p":"Put {{{\"s\": \"好\", \"r\": \"hou2\"}}} in front of a describing word. It means \"very\", but Cantonese uses it even where English says nothing, and no {{{\"s\": \"係\", \"r\": \"hai6\"}}} is needed: {{{\"s\": \"佢好高\", \"r\": \"keoi5 hou2 gou1\"}}} = he's tall. Two kinds of \"short\": {{{\"s\": \"矮\", \"r\": \"ai2\"}}} for height, {{{\"s\": \"短\", \"r\": \"dyun2\"}}} for length. Two kinds of \"old\": {{{\"s\": \"舊\", \"r\": \"gau6\"}}} for things, {{{\"s\": \"老\", \"r\": \"lou5\"}}} for people. Tone trap: {{{\"s\": \"舊\", \"r\": \"gau6\"}}} (old) is low and flat; {{{\"s\": \"九\", \"r\": \"gau2\"}}} (nine) rises.","ex":[[{"s":"佢好高","r":"keoi5 hou2 gou1"},"He's tall."],[{"s":"呢件衫好舊","r":"ni1 gin6 saam1 hou2 gau6"},"This top is really old."],[{"s":"呢度好嘈","r":"ni1 dou6 hou2 cou4"},"It's noisy here."],[{"s":"香港好多人","r":"hoeng1 gong2 hou2 do1 jan4"},"Hong Kong is crowded."]]},{"h":"Comparing with 'than'","p":"A {{{\"s\": \"比\", \"r\": \"bei2\"}}} B + describing word = A is more … than B. Drop {{{\"s\": \"好\", \"r\": \"hou2\"}}} here: say {{{\"s\": \"佢比我高\", \"r\": \"keoi5 bei2 ngo5 gou1\"}}}, never {{{\"s\": \"佢比我好高\", \"r\": \"keoi5 bei2 ngo5 hou2 gou1\"}}}. For \"much more\", add {{{\"s\": \"好多\", \"r\": \"hou2 do1\"}}} at the end. Add {{{\"s\": \"啲\", \"r\": \"di1\"}}} to a describing word for \"a bit more\", and to ask which one: {{{\"s\": \"邊個貴啲呀？\", \"r\": \"bin1 go3 gwai3 di1 aa3\"}}}. You will also hear {{{\"s\": \"佢高過我\", \"r\": \"keoi5 gou1 gwo3 ngo5\"}}}, which means the same.","ex":[[{"s":"佢比我高","r":"keoi5 bei2 ngo5 gou1"},"He's taller than me."],[{"s":"佢比我高好多","r":"keoi5 bei2 ngo5 gou1 hou2 do1"},"He's much taller than me."],[{"s":"呢個比嗰個貴","r":"ni1 go3 bei2 go2 go3 gwai3"},"This one is more expensive than that one."],[{"s":"有冇大啲嘅呀？","r":"jau5 mou5 daai6 di1 ge3 aa3"},"Do you have a bigger one?"]]},{"h":"Most, the same, not as","p":"{{{\"s\": \"最\", \"r\": \"zeoi3\"}}} before a describing wor op in Mong Kok. You have tops in black, white, blue and red. The red top is two hundred and eighty dollars, the blue one is two hundred dollars. Bigger and smaller sizes are available. Help the learner choose, let them try things on, and compliment them when something suits them. Speak simple colloquial Hong Kong Cantonese in short sentences, using mostly words from levels 1 to 9 (measure words 件 and 條, 大啲 / 細啲, 比, 最, 冇咁, 試吓, 好襯你).","opening":{"s":"歡迎光臨！想睇吓啲咩呀？","r":"fun1 jing4 gwong1 lam4! soeng2 tai2 haa5 di1 me1 aa3"},"opening_en":"Welcome! What would you like to look at?","goals":["Ask for a top in a colour you like","Ask for a bigger or smaller size","Ask to try it on","Compare two prices and choose one"]},{"title":"Hong Kong versus Chicago","setup":"Ka-yan, a new friend in Hong Kong, has never been to Chicago. Describe your city and compare it with Hong Kong.","persona":"You are Ka-yan, a friendly young Hong Konger who has never been to Chicago. Ask the learner what Chicago is like: is it big, is it crowded, is it hotter or colder than Hong Kong, is it convenient to get around, which city they like best. React naturally and share your own view of Hong Kong. Speak simple colloquial Hong Kong Cantonese in short sentences, using mostly words from levels 1 to 9, with comparisons using 比, 最, 冇咁 and 一樣.","opening":{"s":"芝加哥係點㗎？大唔大呀？","r":"zi1 gaa1 go1 hai6 dim2 gaa3? daai6 m4 daai6 aa3"},"opening_en":"What's Chicago like? Is it big?","goals":["Say whether Chicago is bigger or smaller than Hong Kong","Compare the weather in the two cities","Describe a place you like with two describing words","Say which city you like best"]}]},{"id":"L10","n":10,"title":"Real conversations","goal":"Ask for help, react and give opinions, link ideas, and visit and say goodbye politely.","notes":[{"h":"When something goes wrong","p":"{{{\"s\": \"咗\", \"r\": \"zo2\"}}} shows the change has already happened: {{{\"s\": \"唔見咗\", \"r\": \"m4 gin3 zo2\"}}} = gone missing, {{{\"s\": \"壞咗\", \"r\": \"waai6 zo2\"}}} = broken, {{{\"s\": \"蕩失咗路\", \"r\": \"dong6 sat1 zo2 lou6\"}}} = lost my way. {{{\"s\": \"有啲\", \"r\": \"jau5 di1\"}}} before something unpleasant = a bit: {{{\"s\": \"有啲唔舒服\", \"r\": \"jau5 di1 m4 syu1 fuk6\"}}}. To ask for help: {{{\"s\": \"你可唔可以幫我呀？\", \"r\": \"nei5 ho2 m4 ho2 ji5 bong1 ngo5 aa3\"}}} or {{{\"s\": \"唔該幫我\", \"r\": \"m4 goi1 bong1 ngo5\"}}} + what you need. Phones are counted with {{{\"s\": \"部\", \"r\": \"bou6\"}}}.","ex":[[{"s":"我唔見咗個銀包","r":"ngo5 m4 gin3 zo2 go3 ngan4 baau1"},"I've lost my wallet."],[{"s":"我部手機冇電","r":"ngo5 bou6 sau2 gei1 mou5 din6"},"My phone's battery is dead."],[{"s":"我有啲唔舒服","r":"ngo5 jau5 di1 m4 syu1 fuk6"},"I'm feeling a bit unwell."],[{"s":"我搵唔到地鐵站","r":"ngo5 wan2 m4 dou2 dei6 tit3 zaam6"},"I can't find the MTR station."]]},{"h":"Reacting","p":"{{{\"s\": \"係囉\", \"r\": \"hai6 lo1\"}}} = exactly, that's what I'm saying; {{{\"s\": \"囉\", \"r\": \"lo1\"}}} marks something obvious. {{{\"s\": \"唔係嘛\", \"r\": \"m4 hai6 maa3\"}}} = no way, you're kidding. {{{\"s\": \"真係？\", \"r\": \"zan1 hai6\"}}} = really? {{{\"s\": \"梗係啦\", \"r\": \"gang2 hai6 laa1\"}}} = of course. {{{\"s\": \"我都係\", \"r\": \"ngo5 dou1 hai6\"}}} = me too. Tone trap: {{{\"s\": \"嘛\", \"r\": \"maa3\"}}} in {{{\"s\": \"唔係嘛\", \"r\": \"m4 hai6 maa3\"}}} is mid and level; {{{\"s\": \"媽\", \"r\": \"maa1\"}}} (mom) is high.","ex":[[{"s":"係囉！","r":"hai6 lo1"},"Exactly!"],[{"s":"唔係嘛！","r":"m4 hai6 maa3"},"No way!"],[{"s":"梗係啦！","r":"gang2 hai6 laa1"},"Of course!"],[{"s":"我都係咁諗","r":"ngo5 dou1 hai6 gam2 nam2"},"I think so too."]]},{"h":"Joining ideas","p":"{{{\"s\": \"雖然\", \"r\": \"seoi1 jin4\"}}} … {{{\"s\": \"但係\", \"r\": \"daan6 hai6\"}}} … = although …, … Cantonese keeps both words, where English drops the \"but\". {{{\"s\": \"不過\", \"r\": \"bat1 gwo3\"}}} is a softer \"but\". {{{\"s\": \"仲\", \"r\": \"zung6\"}}} = still; {{{\"s\": \"仲未\", \"r\": \"zung6 mei6\"}}} = still not. {{{\"s\": \"已經\", \"r\": \"ji5 ging1\"}}} = already, usually with
