":"hung4 sik1","pat":"4 1","en":"red","lv":9},{"id":"P-L9-v-21","t":"tpat","s":"黑色","r":"hak1 sik1","pat":"1 1","en":"black","lv":9},{"id":"P-L9-v-22","t":"tpat","s":"白色","r":"baak6 sik1","pat":"6 1","en":"white","lv":9},{"id":"P-L9-v-23","t":"tpat","s":"藍色","r":"laam4 sik1","pat":"4 1","en":"blue","lv":9},{"id":"P-L9-v-24","t":"tpat","s":"綠色","r":"luk6 sik1","pat":"6 1","en":"green","lv":9},{"id":"P-L9-v-25","t":"tpat","s":"黃色","r":"wong4 sik1","pat":"4 1","en":"yellow","lv":9},{"id":"P-L9-v-33","t":"tpat","s":"眼鏡","r":"ngaan5 geng2","pat":"5 2","en":"glasses","lv":9},{"id":"P-L9-v-47","t":"tpat","s":"一樣","r":"jat1 joeng6","pat":"1 6","en":"the same","lv":9},{"id":"P-L9-v-49","t":"tpat","s":"唔同","r":"m4 tung4","pat":"4 4","en":"different","lv":9},{"id":"P-L9-v-51","t":"tpat","s":"好似","r":"hou2 ci5","pat":"2 5","en":"seems / looks like","lv":9},{"id":"P-L10-v-02","t":"tpat","s":"銀包","r":"ngan4 baau1","pat":"4 1","en":"wallet","lv":10},{"id":"P-L10-v-03","t":"tpat","s":"手機","r":"sau2 gei1","pat":"2 1","en":"mobile phone","lv":10},{"id":"P-L10-v-04","t":"tpat","s":"壞咗","r":"waai6 zo2","pat":"6 2","en":"broken (it's stopped working)","lv":10},{"id":"P-L10-v-06","t":"tpat","s":"冇電","r":"mou5 din6","pat":"5 6","en":"out of battery","lv":10},{"id":"P-L10-v-17","t":"tpat","s":"係囉","r":"hai6 lo1","pat":"6 1","en":"Exactly! / That's what I'm saying","lv":10},{"id":"P-L10-v-24","t":"tpat","s":"好彩","r":"hou2 coi2","pat":"2 2","en":"Luckily / that was lucky","lv":10},{"id":"P-L10-v-27","t":"tpat","s":"但係","r":"daan6 hai6","pat":"6 6","en":"but","lv":10},{"id":"P-L10-v-28","t":"tpat","s":"不過","r":"bat1 gwo3","pat":"1 3","en":"however (a softer \"but\")","lv":10},{"id":"P-L10-v-30","t":"tpat","s":"即係","r":"zik1 hai6","pat":"1 6","en":"that means / in other words","lv":10},{"id":"P-L10-v-34","t":"tpat","s":"已經","r":"ji5 ging1","pat":"5 1","en":"already","lv":10},{"id":"P-L10-v-36","t":"tpat","s":"歡迎","r":"fun1 jing4","pat":"1 4","en":"Welcome","lv":10},{"id":"P-L10-v-47","t":"tpat","s":"保重","r":"bou2 zung6","pat":"2 6","en":"Take care (of yourself)","lv":10}]}],"guide":"\n<section><h2>How to read the sound spelling</h2>\n<p>Every Chinese character is one syllable. The cards spell each syllable in <b>Jyutping</b>, the standard system used by Hong Kong dictionaries and phone keyboards. Each syllable is a start sound, a vowel part, and a tone number from 1 to 6.</p>\n<p>Example: <button class=\"say\" type=\"button\" data-say=\"你\"><span class=\"cjk\">你</span> <span class=\"r\" data-rom=\"nei5\">nei5</span> <span class=\"r\">you</span></button> is <code>n</code> + <code>ei</code> + tone <code>5</code>. You don't say the number. It tells you the pitch. Every syllable on the cards also has a small pitch line after it so you can see the tone at a glance.</p>\n<p class=\"callout\">Characters don't tell you how to say them. The Jyutping does. Read the Jyutping, play the audio, and copy it out loud.</p></section>\n\n<section><h2>The six tones</h2>\n<p>Tone changes meaning. The six syllables below are all “si”; only the pitch differs. Play them in order and copy each one.</p>\n<div class=\"tones\"><div class=\"tone\"><div class=\"top\"><span class=\"n\">1</span><span data-contour=\"1\"></span>\n      <button class=\"say\" type=\"button\" data-say=\"詩\"><span class=\"cjk\">詩</span> <span class=\"r\" data-rom=\"si1\">si1</span> <span class=\"r\">poem</span></button></div><p>High and flat. Hold a high note.</p></div><div class=\"tone\"><div class=\"top\"><span class=\"n\">2</span><span data-contour=\"2\"></span>\n      <button class=\"say\" type=\"button\" data-say=\"史\"><span class=\"cjk\">史</span> <span class=\"r\" data-rom=\"si2\">si2</span> <span class=\"r\">history</span></button></div><p>Rises from the middle to high, like a surprised “huh?”</p></div><div class=\"tone\"><div class=\"top\"><span class=\"n\">3</span><span data-contour=\"3\"></span>\n      <button class=\"say\" type=\"button\" data-say=\"試\"><span class=\"cjk\">試</span> <span class=\"r\" data-rom=\"si3\">si3</span> <span class=\"r\">try</span></button></div><p>Middle and flat. Your relaxed speaking pitch.</p></div><div class=\"tone\"><div class=\"top\"><span class=\"n\">4</span><span data-contour=\"4\"></span>\n      <button class=\"say\" type=\"button\" data-say=\"時\"><span class=\"cjk\">時</span> <span class=\"r\" data-rom=\"si4\">si4</span> <span class=\"r\">time</span></button></div><p>The lowest. Starts low and sinks a little.</p></div><div class=\"tone\"><div class=\"top\"><span class=\"n\">5</span><span data-contour=\"5\"></span>\n      <button class=\"say\" type=\"button\" data-say=\"市\"><span class=\"cjk\">市</span> <span class=\"r\" data-rom=\"si5\">si5</span> <span class=\"r\">market</span></button></div><p>Rises a little from low. A smaller rise than tone 2.</p></div><div class=\"tone\"><div class=\"top\"><span class=\"n\">6</span><span data-contour=\"6\"></span>\n      <button class=\"say\" type=\"button\" data-say=\"事\"><span class=\"cjk\">事</span> <span class=\"r\" data-rom=\"si6\">si6</span> <span class=\"r\">matter</span></button></div><p>Low and flat, between tone 3 and tone 4.</p></div></div>\n<p>Think of tones 3, 6 and 4 as three steps down a staircase: middle, low, lowest. Tones 2 and 5 both rise; 2 rises high, 5 rises only a little. Beginners most often mix up 3 with 6, and 2 with 5, so give those pairs extra attention.</p>\n<p>Pitch is relative to your own voice. What matters is the shape of each tone and the difference between them.</p></section>\n\n<section><h2>Start sounds</h2>\n<p>Hold your hand in front of your mouth. <code>p t k c</code> should puff air onto it; <code>b d g z</code> should not. English speakers puff by habit, so practice keeping b, d and g soft.</p>\n<div class=\"tblwrap\"><table><thead><tr><th>Jyutping</th><th>Close to</th><th>Example</th></tr></thead><tbody><tr><td class=\"k\">b</td><td>p in “spin” (no puff of air)</td><td><button class=\"say\" type=\"button\" data-say=\"杯\"><span class=\"cjk\">杯</span> <span class=\"r\" data-rom=\"bui1\">bui1</span></button></td></tr><tr><td class=\"k\">p</td><td>p in “pin” (with a puff)</td><td><button class=\"say\" type=\"button\" data-say=\"平\"><span class=\"cjk\">平</span> <span class=\"r\" data-rom=\"peng4\">peng4</span></button></td></tr><tr><td class=\"k\">m</td><td>m</td><td><button class=\"say\" type=\"button\" data-say=\"媽\"><span class=\"cjk\">媽</span> <span class=\"r\" data-rom=\"maa1\">maa1</span></button></td></tr><tr><td class=\"k\">f</td><td>f</td><td><button class=\"say\" type=\"button\" data-say=\"飯\"><span class=\"cjk\">飯</span> <span class=\"r\" data-rom=\"faan6\">faan6</span></button></td></tr><tr><td class=\"k\">d</td><td>t in “stop” (no puff)</td><td><button class=\"say\" type=\"button\" data-say=\"多\"><span class=\"cjk\">多</span> <span class=\"r\" data-rom=\"do1\">do1</span></button></td></tr><tr><td class=\"k\">t</td><td>t in “top” (with a puff)</td><td><button class=\"say\" type=\"button\" data-say=\"天\"><span class=\"cjk\">天</span> <span class=\"r\" data-rom=\"tin1\">tin1</span></button></td></tr><tr><td class=\"k\">n</td><td>n (many people say it as l)</td><td><button class=\"say\" type=\"button\" data-say=\"你\"><span class=\"cjk\">你</span> <span class=\"r\" data-rom=\"nei5\">nei5</span></button></td></tr><tr><td class=\"k\">l</td><td>l</td><td><button class=\"say\" type=\"button\" data-say=\"六\"><span class=\"cjk\">六</span> <span class=\"r\" data-rom=\"luk6\">luk6</span></button></td></tr><tr><td class=\"k\">g</td><td>k in “skin” (no puff)</td><td><button class=\"say\" type=\"button\" data-say=\"九\"><span class=\"cjk\">九</span> <span class=\"r\" data-rom=\"gau2\">gau2</span></button></td></tr><tr><td class=\"k\">k</td><td>k in “kin” (with a puff)</td><td><button class=\"say\" type=\"button\" data-say=\"球\"><span class=\"cjk\">球</span> <span class=\"r\" data-rom=\"kau4\">kau4</span></button></td></tr><tr><td class=\"k\">ng</td><td>ng in “sing”, but at the start</td><td><button class=\"say\" type=\"button\" data-say=\"我\"><span class=\"cjk\">我</span> <span class=\"r\" data-rom=\"ngo5\">ngo5</span></button></td></tr><tr><td class=\"k\">h</td><td>h</td><td><button class=\"say\" type=\"button\" data-say=\"好\"><span class=\"cjk\">好</span> <span class=\"r\" data-rom=\"hou2\">hou2</span></button></td></tr><tr><td class=\"k\">gw</td><td>gw in “Gwen” (no puff)</td><td><button class=\"say\" type=\"button\" data-say=\"貴\"><span class=\"cjk\">貴</span> <span class=\"r\" data-rom=\"gwai3\">gwai3</span></button></td></tr><tr><td class=\"k\">kw</td><td>qu in “queen”</td><td><button class=\"say\" type=\"button\" data-say=\"裙\"><span class=\"cjk\">裙</span> <span class=\"r\" data-rom=\"kwan4\">kwan4</span></button></td></tr><tr><td class=\"k\">w</td><td>w</td><td><button class=\"say\" type=\"button\" data-say=\"黃\"><span class=\"cjk\">黃</span> <span class=\"r\" data-rom=\"wong4\">wong4</span></button></td></tr><tr><td class=\"k\">z</td><td>ts in “cats”, or a soft j</td><td><button class=\"say\" type=\"button\" data-say=\"早\"><span class=\"cjk\">早</span> <span class=\"r\" data-rom=\"zou2\">zou2</span></button></td></tr><tr><td class=\"k\">c</td><td>ts with a puff, close to ch in “church”</td><td><button class=\"say\" type=\"button\" data-say=\"茶\"><span class=\"cjk\">茶</span> <span class=\"r\" data-rom=\"caa4\">caa4</span></button></td></tr><tr><td class=\"k\">s</td><td>s</td><td><button class=\"say\" type=\"button\" data-say=\"三\"><span class=\"cjk\">三</span> <span class=\"r\" data-rom=\"saam1\">saam1</span></button></td></tr><tr><td class=\"k\">j</td><td>y in “yes” (not English j)</td><td><button class=\"say\" type=\"button\" data-say=\"一\"><span class=\"cjk\">一</span> <span class=\"r\" data-rom=\"jat1\">jat1</span></button></td></tr></tbody></table></div>\n<p class=\"callout\">Jyutping <code>j</code> is the y in “yes”: <button class=\"say\" type=\"button\" data-say=\"飲\"><span class=\"cjk\">飲</span> <span class=\"r\" data-rom=\"jam2\">jam2</span> <span class=\"r\">drink</span></button> sounds like “yum”.</p></section>\n\n<section><h2>Vowel parts</h2>\n<div class=\"tblwrap\"><table><thead><tr><th>Jyutping</th><th>Close to</th><th>Example</th></tr></thead><tbody><tr><td class=\"k\">aa</td><td>a in “father”, held long</td><td><button class=\"say\" type=\"button\" data-say=\"茶\"><span class=\"cjk\">茶</span> <span class=\"r\" data-rom=\"caa4\">caa4</span></button></td></tr><tr><td class=\"k\">a</td><td>u in “cup”, short; always followed by another letter</td><td><button class=\"say\" type=\"button\" data-say=\"心\"><span class=\"cjk\">心</span> <span class=\"r\" data-rom=\"sam1\">sam1</span></button></td></tr><tr><td class=\"k\">e</td><td>e in “bed”, held long</td><td><button class=\"say\" type=\"button\" data-say=\"車\"><span class=\"cjk\">車</span> <span class=\"r\" data-rom=\"ce1\">ce1</span></button></td></tr><tr><td class=\"k\">i</td><td>ee in “see”</td><td><button class=\"say\" type=\"button\" data-say=\"詩\"><span class=\"cjk\">詩</span> <span class=\"r\" data-rom=\"si1\">si1</span></button></td></tr><tr><td class=\"k\">o</td><td>aw in “law”</td><td><button class=\"say\" type=\"button\" data-say=\"我\"><span class=\"cjk\">我</span> <span class=\"r\" data-rom=\"ngo5\">ngo5</span></button></td></tr><tr><td class=\"k\">u</td><td>oo in “food”</td><td><button class=\"say\" type=\"button\" data-say=\"苦\"><span class=\"cjk\">苦</span> <span class=\"r\" data-rom=\"fu2\">fu2</span></button></td></tr><tr><td class=\"k\">yu</td><td>say “ee” while rounding your lips (French u)</td><td><button class=\"say\" type=\"button\" data-say=\"書\"><span class=\"cjk\">書</span> <span class=\"r\" data-rom=\"syu1\">syu1</span></button></td></tr><tr><td class=\"k\">oe</td><td>e in “her”, with rounded lips</td><td><button class=\"say\" type=\"button\" data-say=\"香\"><span class=\"cjk\">香</span> <span class=\"r\" data-rom=\"hoeng1\">hoeng1</span></button></td></tr><tr><td class=\"k\">eo</td><td>a short oe; only in eoi, eon, eot</td><td><button class=\"say\" type=\"button\" data-say=\"去\"><span class=\"cjk\">去</span> <span class=\"r\" data-rom=\"heoi3\">heoi3</span></button></td></tr><tr><td class=\"k\">ei</td><td>ay in “day”</td><td><button class=\"say\" type=\"button\" data-say=\"四\"><span class=\"cjk\">四</span> <span class=\"r\" data-rom=\"sei3\">sei3</span></button></td></tr><tr><td class=\"k\">ou</td><td>o in “go”</td><td><button class=\"say\" type=\"button\" data-say=\"好\"><span class=\"cjk\">好</span> <span class=\"r\" data-rom=\"hou2\">hou2</span></button></td></tr><tr><td class=\"k\">oi</td><td>oy in “boy”</td><td><button class=\"say\" type=\"button\" data-say=\"開\"><span class=\"cjk\">開</span> <span class=\"r\" data-rom=\"hoi1\">hoi1</span></button></td></tr><tr><td class=\"k\">ai</td><td>i in “bite”, quick</td><td><button class=\"say\" type=\"button\" data-say=\"雞\"><span class=\"cjk\">雞</span> <span class=\"r\" data-rom=\"gai1\">gai1</span></button></td></tr><tr><td class=\"k\">aai</td><td>“eye”, held long</td><td><button class=\"say\" type=\"button\" data-say=\"買\"><span class=\"cjk\">買</span> <span class=\"r\" data-rom=\"maai5\">maai5</span></button></td></tr><tr><td class=\"k\">au</td><td>ow in “now”, quick</td><td><button class=\"say\" type=\"button\" data-say=\"九\"><span class=\"cjk\">九</span> <span class=\"r\" data-rom=\"gau2\">gau2</span></button></td></tr><tr><td class=\"k\">aau</td><td>ow in “now”, held long</td><td><button class=\"say\" type=\"button\" data-say=\"包\"><span class=\"cjk\">包</span> <span class=\"r\" data-rom=\"baau1\">baau1</span></button></td></tr><tr><td class=\"k\">iu</td><td>“ee-oo” run together</td><td><button class=\"say\" type=\"button\" data-say=\"小\"><span class=\"cjk\">小</span> <span class=\"r\" data-rom=\"siu2\">siu2</span></button></td></tr><tr><td class=\"k\">ui</td><td>“oo-ee” run together</td><td><button class=\"say\" type=\"button\" data-say=\"杯\"><span class=\"cjk\">杯</span> <span class=\"r\" data-rom=\"bui1\">bui1</span></button></td></tr><tr><td class=\"k\">eoi</td><td>“uh-ee” with rounded lips</td><td><button class=\"say\" type=\"button\" data-say=\"去\"><span class=\"cjk\">去</span> <span class=\"r\" data-rom=\"heoi3\">heoi3</span></button></td></tr></tbody></table></div>\n<p>Long <code>aa</code> and short <code>a</code> are different words: <button class=\"say\" type=\"button\" data-say=\"三\"><span class=\"cjk\">三</span> <span class=\"r\" data-rom=\"saam1\">saam1</span> <span class=\"r\">three</span></button> vs <button class=\"say\" type=\"button\" data-say=\"心\"><span class=\"cjk\">心</span> <span class=\"r\" data-rom=\"sam1\">sam1</span> <span class=\"r\">heart</span></button>.</p></section>\n\n<section><h2>Endings</h2>\n<p><code>-m -n -ng</code> work as in English.</p>\n<p><code>-p -t -k</code> are cut off: put your lips or tongue in place but don't release any air. These syllables sound short and clipped. <button class=\"say\" type=\"button\" data-say=\"十\"><span class=\"cjk\">十</span> <span class=\"r\" data-rom=\"sap6\">sap6</span> <span class=\"r\">ten</span></button> ends with closed lips, <button class=\"say\" type=\"button\" data-say=\"八\"><span class=\"cjk\">八</span> <span class=\"r\" data-rom=\"baat3\">baat3</span> <span class=\"r\">eight</span></button> with the tongue behind the teeth, <button class=\"say\" type=\"button\" data-say=\"六\"><span class=\"cjk\">六</span> <span class=\"r\" data-rom=\"luk6\">luk6</span> <span class=\"r\">six</span></button> with the back of the tongue raised.</p></section>\n\n<section><h2>Two syllables with no vowel</h2>\n<p><button class=\"say\" type=\"button\" data-say=\"唔\"><span class=\"cjk\">唔</span> <span class=\"r\" data-rom=\"m4\">m4</span> <span class=\"r\">not</span></button> is a hummed “m” on the lowest tone. <button class=\"say\" type=\"button\" data-say=\"五\"><span class=\"cjk\">五</span> <span class=\"r\" data-rom=\"ng5\">ng5</span> <span class=\"r\">five</span></button> is a hummed “ng” with a small rise. Both are very common.</p></section>\n\n<section><h2>Things that surprise beginners</h2>\n<ul>\n<li><b>Changed tones.</b> Some words rise to tone 2 in everyday speech: 話 is waa6 in the dictionary but <button class=\"say\" type=\"button\" data-say=\"廣東話\"><span class=\"cjk\">廣東話</span> <span class=\"r\" data-rom=\"gwong2 dung1 waa2\">gwong2 dung1 waa2</span> <span class=\"r\">Cantonese</span></button>. The cards always show the tone people actually say.</li>\n<li><b>Relaxed pronunciation.</b> Many Hong Kongers say n as l (你 lei5) and drop a starting ng (我 o5). Learn to recognize both; either is fine to use.</li>\n<li><b>Ending particles.</b> Small words at the end of a sentence, like <span class=\"cjk\">呀 啦 喇 㗎</span>, carry tone of voice: softening, suggesting, explaining. Leaving them out sounds blunt.</li>\n<li><b>Spoken vs written.</b> Spoken Cantonese is different from standard written Chinese. Characters like <span class=\"cjk\">唔 佢 冇 嘅 咗</span> only exist in spoken Cantonese. This app teaches the spoken language.</li>\n</ul></section>\n<section><h2>Character reference</h2>\n<p>You won't be tested on these. They're common characters you'll keep seeing on the cards and on signs. Tap one to hear it.</p>\n<div class=\"tblwrap\"><table><thead><tr><th>Character</th><th>Sound</th><th>Meaning</th><th>Where you'll see it</th></tr></thead><tbody><tr><td class=\"h\"><button class=\"say\" type=\"button\" data-say=\"一\"><span class=\"cjk\">一</span></button></td><td><span data-rom=\"jat1\">jat1</span></td><td>one</td><td></td></tr><tr><td class=\"h\"><button class=\"say\" type=\"button\" data-say=\"二\"><span class=\"cjk\">二</span></button></td><td><span data-rom=\"ji6\">ji6</span></td><td>two</td><td></td></tr><tr><td class=\"h\"><button class=\"say\" type=\"button\" data-say=\"三\"><span class=\"cjk\">三</span></button></td><td><span data-rom=\"saam1\">saam1</span></td><td>three</td><td></td></tr><tr><td class=\"h\"><button class=\"say\" type=\"button\" data-say=\"四\"><span class=\"cjk\">四</span></button></td><td><span data-rom=\"sei3\">sei3</span></td><td>fou   for(const d of by("dlg")){ if(pts+decisions(d)<=30){ units.push(d); pts+=decisions(d); } if(pts>=29) break; }
  const extra=by("gap").slice(6).concat(by("vm").slice(4));
  while(pts<30 && extra.length){ units.push(extra.shift()); pts++; }
  return shuffle(units);
}
function checkItems(u){
  if(u.k==="level") return buildTest(LV[u.id]);
  if(u.k==="drill") return shuffle(u.sets.flatMap(drillItems)).slice(0,20);
  const set=ES[u.id]; return shuffle(set.words).slice(0,20).map(w=>ALL[shuffle(set.items.filter(i=>ALL[i].it.v===w.id))[0]].it);
}
/* Tested out (placement, or a check passed ahead): the unit counts as done and its words (or sound cards) get a
   "known" review state, due in 20 to 60 days, so they come back now and then to confirm instead of every day. */
function markKnown(u){
  const d=today();
  const ids = u.k==="drill" ? u.sets.flatMap(s=>DS[s].items.map(x=>"d:"+x)) : u.ls.flatMap(L=>L.w).filter(w=>VOC[w]).map(w=>{ if(!LR.intro[w]) LR.intro[w]=d; return qid(VOC[w],"vm"); });
  ids.forEach(id=>{ if(!LR.srs[id]){ LR.srs[id]=[5, d+20+hash32(id)%41, 1, 1, d]; dirtyDocs.add(shardOf(id)); } });
  dirtyDocs.add("learner"); saveLR();
}
function testOut(upto){ UNITS.slice(0,upto).forEach(u=>{ if(!unitDone(u)){ P.checks[u.id]="t"; markKnown(u); } }); saveP(); }
/* Placement: walk the units in order, 5 questions from each tested unit (hear it, meaning, the word, one more, and a
   grammar or example-sentence question). 4-5 right: skip ahead 2 units (1 once near the boundary); 0-2: that unit is
   the boundary; 3: test the next unit once more (pass it and both count, otherwise stop at the 3). Ends at the boundary,
   after 60 questions, or after 15 minutes; units before the starting unit are tested out. */
function placeBlock(u){
  if(u.k==="drill") return shuffle(u.sets.flatMap(drillItems)).slice(0,5);
  const w=shuffle(u.k==="level" ? LV[u.id].vocab : ES[u.id].words);
  const out=["vl","vm","ve",Math.random()<.5?"vm":"vl"].map((k,i)=>itemOf(qid(w[i],k)));
  const g = u.k==="level" ? shuffle(LV[u.id].items.filter(i=>i.t==="gap"||i.t==="pick"))[0] : ALL[(w.slice(4).map(gapIds).find(ids=>ids.length)||[])[0]];
  return out.concat(u.k==="level" ? g : g ? g.it : itemOf(qid(w[4],"vm")));
}
function placer(start){
  const st={lo:start-1, hi:UNITS.length, cur:start, border:-1, near:false, t0:Date.now(), n:0};
  st.next = res => {
    const r=res.filter(x=>x.ok).length; st.n+=res.length;
    if(st.border>=0){ if(r>=4) st.lo=st.cur; else st.hi=st.border; st.border=-1; st.near=true; }
    else if(r>=4) st.lo=st.cur;
    else if(r<=2){ st.hi=st.cur; st.near=true; }
    else if(st.cur+1<st.hi) st.border=st.cur;
    else { st.hi=st.cur; st.near=true; }
    if(st.n>=60 || Date.now()-st.t0>15*60000) return null;
    if(st.border>=0) return (st.cur=st.border+1);
    if(st.hi-st.lo<=1) return null;
    return (st.cur = st.near ? st.lo+1 : Math.min(st.lo+2, st.hi-1));
  };
  return st;
}

/* A grammar note on a lesson card: the first sentences up to 45 words, and the rest (behind "More about this"). */
function noteSplit(p){

  let n=0, k=0;
  while(k<sents.length && (k===0 || n+sents[k].split(/\s+/).filter(Boolean).length<=45)){ n+=sents[k].split(/\s+/).filter(Boolean).length; k++; }
  return [back(sents.slice(0,k).join("")), back(sents.slice(k).join(""))];
}

// The small label over a question: its step in the lesson (or its kind in Practice); the question itself is the bold line.
const CAT = {vl:"Recognize", vm:"Recognize", ve:"Recognize", listen:"Recognize", sp:"Recall", wg:"Recall", gap:"Grammar", pick:"Grammar", dlg:"Grammar",
  cj:"Verbs", as:"Grammar", tiles:"Sentences", wt:"Sentences", say:"Sentences", shadow:"Sentences", tone:"Tones", tpat:"Tones",
  letter:"Hangul", trio:"Hangul", read:"Hangul", sound:"Hangul", km:"Characters", kh:"Characters", card:"Cards"};
const catOf = it => it.rev ? "Review" : CAT[it.t] || "";
// Distractor vocab: same level first, never near-synonyms (avoid) or identical text/English.
function vocabOptions(v, n){
  if(v.ev) return evOptions(v, n);
  const l=LV[v.lv], bad=new Set([v.i, ...(v.avoid||[])]); l.vocab.forEach((x,j)=>{ if((x.avoid||[]).includes(v.i)) bad.add(j); });
  const ok = x => x.id!==v.id && x.en.toLowerCase()!==v.en.toLowerCase() && x.t.s!==v.t.s;
  const pool=l.vocab.filter((x,j)=>!bad.has(j) && ok(x));
  let pick=shuffle(pool.filter(x=>x.topic===v.topic)).slice(0,2).concat(shuffle(pool.filter(x=>x.topic!==v.topic))).slice(0,n-1);
  if(pick.length<n-1) pick=pick.concat(shuffle(LEVELS.flatMap(L=>L.vocab).filter(x=>ok(x) && !pick.includes(x))).slice(0,n-1-pick.length));
  return shuffle([v,...pick]);
}
// Distractors never share a content word of the English gloss (no near-synonyms); same part of speech first; seeded.
const GSTOP = new Set("the and for with something someone polite casual formal very about from this that one thing also used".split(" "));
const gloss = en => new Set(String(en).toLowerCase().replace(/\([^)]*\)/g," ").split(/[^a-z']+/).filter(x=>x.length>2 && !GSTOP.has(x)));
const unlikeOf = v => { const mine=gloss(v.en), en=v.en.toLowerCase(); return x => x.id!==v.id && x.t.s!==v.t.s && x.en.toLowerCase()!==en && ![...gloss(x.en)].some(g=>mine.has(g)); };
function evOptions(v, n){
  const r=rng(v.set+"|"+v.id), words=ES[v.set].words.filter(unlikeOf(v));
  const pick=sshuffle(words.filter(x=>x.pos===v.pos),r).slice(0,3).concat(sshuffle(words.filter(x=>x.pos!==v.pos),r));
  return shuffle([v,...pick.slice(0,n-1)]);
}
const isPred = v => !YUE && /다$/.test(v.t.s) && /verb|adjective/.test(v.pos||"");
function gapOptions(v, it, ans){
  const r=rng((v.set||v.lv)+"|"+it.id), ok=unlikeOf(v), last=cps(ans.s).pop(), n=cps(ans.s).length;
  let cands;
  if(!v.ev) cands=LEVELS.flatMap(l=>l.vocab).filter(x=>ok(x) && !/___|…|\//.test(x.t.s)).map(x=>({o:{s:x.t.s, r:x.t.r}, near:x.lv===v.lv}));

function weightedPick(pool, n){
  const d=today();
  const w=pool.map(i=>{ const r=LR.srs[i.id]; if(!r) return 3; if(r[0]===0) return 4; if(r[1]<=d) return 3; return 1+2*(1-r[3]/Math.max(1,r[2])); });
  const out=[], idx=pool.map((_,i)=>i);
  while(out.length<n && idx.length){ const tot=idx.reduce((a,i)=>a+w[i],0); let r=Math.random()*tot, k=0; for(;k<idx.length;k++){ r-=w[idx[k]]; if(r<=0) break; } k=Math.min(k,idx.length-1); out.push(pool[idx[k]]); idx.splice(k,1); }
  return out;
}

/* A mic button: tap to record (the mic starts inside the tap, for iOS), tap again (or pause) to stop, then the transcript
   ("" = nothing heard) goes to o.onText. o = {onState(s), onText(text), onError(e)}; s = "rec" | "busy" | "idle".
   Taps while the mic is starting are ignored; once the button leaves the page the recording is dropped. */
function micButton(b, o){
  const alive=()=>b.isConnected, wrap=b.closest(".micwrap");
  const st=s=>{ if(!alive()) return; b.classList.toggle("live",s==="rec"); if(wrap) wrap.classList.toggle("live",s==="rec"); b.disabled=s==="busy"; b.setAttribute("aria-label", s==="rec"?"Stop recording":"Speak"); o.onState(s); };
  let busy=false;
  b.onclick=async()=>{
    if(REC){ REC.stop(); return; }
    if(busy) return; busy=true;
    try{
      stopAudio();
      const rec=await VOICE.mic.start({});
      if(!alive()) return rec.cancel();
      REC=rec; st("rec");
      const blob=await rec.done;
      if(REC===rec) REC=null;
      if(!blob || !alive()) return st("idle");
      st("busy");
      const text=(await VOICE.listen(blob)).text.trim();
      st("idle"); if(alive()) o.onText(text);
    }catch(e){ st("idle"); if(alive()) o.onError(e); }
    finally{ busy=false; }
  };
}

const ZD="零一二三四五六七八九", KS="영일이삼사오육칠팔구";
function zhNum(n){ if(n<10) return ZD[n]; if(n<100) return (n>=20?ZD[Math.floor(n/10)]:"")+"十"+(n%10?ZD[n%10]:""); if(n<1000) return ZD[Math.floor(n/100)]+"百"+(n%100?(n%100<10?"零":n%100<20?"一":"")+zhNum(n%100):""); if(n<10000) return ZD[Math.floor(n/1000)]+"千"+(n%1000?(n%1000<100?"零":"")+zhNum(n%1000):""); return String(n); }

const KN=["","하나","둘","셋","넷","다섯","여섯","일곱","여덟","아홉"], KA=["","한","두","세","네","다섯","여섯","일곱","여덟","아홉"], KT=["","열","스물","서른","마흔","쉰","예순","일흔","여든","아흔"];
const koNative = (n, attr) => n<1||n>99 ? "" : (attr && n===20 ? "스무" : KT[Math.floor(n/10)]+(attr?KA:KN)[n%10]);

function alignKeys(a, b){  // edit distance, and which characters line up (for the diff)
  const n=a.length, m=b.length, D=Array.from({length:n+1},(_,i)=>{ const r=new Array(m+1).fill(0); r[0]=i; return r; });
  for(let j=1;j<=m;j++) D[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) D[i][j]=Math.min(D[i-1][j]+1, D[i][j-1]+1, D[i-1][j-1]+(a[i-1]===b[j-1]?0:1));

  return Object.assign(best, {v: best.sc>=0.85 ? "ok" : best.sc>=(YUE?0.5:0.6) ? "close" : "no"});
}

function importOld(text){
  const o=JSON.parse(String(text).trim()); if(!o || !o.srs) throw new Error("bad");
  const byOld={}; Object.values(VOC).forEach(v=>{ if(v.old) byOld[v.old]=v; });
  let n=0;
  for(const key in o.srs){
    const dir=key.split("vocab-")[1]; if(!dir || !CDIRS.some(d=>d[0]===dir)) continue;
    for(const oid in o.srs[key]){
      const v=byOld[oid]; if(!v) continue; const rec=o.srs[key][oid], nid=cardId(dir,v.id), cur=LR.srs[nid];
      const box = !rec.reps ? 0 : rec.ivl<=1?1 : rec.ivl<=2?2 : rec.ivl<=5?3 : rec.ivl<=12?4 : rec.ivl<=30?5 : 6;
      const last=dayOf(rec.due ? rec.due - rec.ivl*864e5 : Date.now());
      if(cur && cur[4]>=last) continue;
      LR.srs[nid]=[box, Math.max(dayOf(rec.due||Date.now()), today()), (cur?cur[2]:0)+Math.max(1,rec.reps|0), (cur?cur[3]:0)+Math.max(0,(rec.reps|0)-(rec.lapses|0)), last];
      dirtyDocs.add("srs-C"); n++;

  if(n){ LR.mig.cards=true; dirtyDocs.add("learner"); saveLR(); }
  return n;
}

async function finishTalk(){
  const t=talk; if(t.busy) return;
  if(!t.lines.some(x=>x.who==="me")){ $("talkstatus").textContent="Write at least one reply first."; return; }
  const sample=await getSample(); if(!sample){ $("talkstatus").textContent="AI isn't available here."; return; }
  t.busy=true; $("talkstatus").textContent="Writing your feedback…"; $("stop").hidden=false; t.ctl=new AbortController();
  const prompt=`${LEARNER} (level ${t.l.n} "${t.l.title}") just finished this role-play: ${t.r.setup}
Goals: ${t.r.goals.join(" | ")}
Transcript:
${transcript()}

${RULES}
Give brief, specific feedback on the LEARNER's ${C.name} only. Reply with only JSON:
{"summary":"2 sentences in English","strengths":["…"],"fixes":[{"said":"what they wrote","better":"natural ${C.name}","better_rom":"…","why":"short English reason"}],"phrases":[{"t":"a useful phrase for this situation","rom":"…","en":"English"}]}
At most 4 fixes and 4 phrases, at this learner's level.`;
  try{
    const o=await sample.json(prompt,{signal:t.ctl.signal, cache:false, modelTier:"default", effort:"low"});
    $("summary").innerHTML=`<section class="sh-card"><h2>Feedback</h2><p>${esc(o.summary||"")}</p>
      ${(o.strengths||[]).length?`<h3>Went well</h3><ul>${o.strengths.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}
      ${(o.fixes||[]).length?`<h3>Fix these</h3>${o.fixes.map(f=>`<div class="miss"><span>You: <b lang="${C.htmlLang}">${esc(f.said)}</b></span><div class="row">${livePlay(f.better)}${tx(T_(f.better,f.better_rom),{said:false})}</div><span class="sub">${esc(f.why)}</span></div>`).join("")}`:""}
      ${(o.phrases||[]).length?`<h3>Phrases to keep</h3>${o.phrases.map(p=>`<div class="row">${livePlay(p.t)}${tx(T_(p.t,p.rom),{said:false})}<span class="sub">${esc(p.en)}</span></div>`).join("")}`:""}</section>`;
    $("talkstatus").textContent="";
  }catch(e){ const st=$("talkstatus"); if(st) st.textContent=aiError(e); }  // the chat may have been left meanwhile
  finally{ t.busy=false; if($("stop")) $("stop").hidden=true; }
}
function steerText(){ const w=weakSkills().slice(0,3).map(r=>skName(r.id)); return w.length?`\nThe learner's weak spots: ${w.join("; ")}. Where it fits naturally, steer the conversation so they practise these. Never mention this.`:""; }
function learnerSummary(){
  const u=curUnit(), lines=[];
  lines.push(`Path: ${UNITS.filter(unitDone).length} of ${UNITS.length} units done; ${u?`now on ${unitLabel(u)} (${u.title}), ${lessonsOf(u).filter(lessonDone).length} of ${lessonsOf(u).length} lessons done`:"finished"}.`);
  lines.push(`Words met: ${Object.keys(LR.intro).length}; learned (right on 3 different days): ${Object.keys(LR.ld).filter(learned).length}.`);
  const rows=skillRows().filter(r=>r.ready); if(rows.length) lines.push("Skill accuracy: "+rows.map(r=>`${skName(r.id)} ${Math.round(r.a*100)}% (${r.n})`).join("; "));
  const conf=confusions(14); if(conf.length) lines.push("Repeated mix-ups (14 days): "+conf.slice(0,6).map(c=>`${confText(c.key)} ×${c.n}`).join("; "));
  const ww=weakWords(); if(ww.length) lines.push("Words often missed: "+ww.map(w=>`${w.v.t.s} (${w.v.en})`).join(", "));
  const n7=recentLog(7,e=>e.s!=="talk"); lines.push(`Answers in the last 7 days: ${n7.length}, correct ${n7.length?Math.round(100*n7.filter(e=>e.ok).length/n7.length):0}%.`);
  return lines.join("\n");
}
function diagHTML(d){ return `<p><b>${esc(d.headline||"")}</b></p>${(d.focus||[]).map(f=>`<div class="miss"><span><b>${esc(f.area)}</b> ${esc(f.why)}</span><span class="sub">${esc(f.how)}</span></div>`).join("")}${d.next?`<p>Next: ${esc(d.next)}</p>`:""}<p class="sub">From ${esc(d.date||"")}</p>`; }
async function getDiagnosis(){
  const sample=await getSample(), st=$("diagStatus"); if(!sample){ st.textContent="AI isn't available here."; return; }
  $("getDiag").disabled=true; st.textContent="Reading your record…";
  const prompt=`You are a ${C.name} coach for ${LEARNER}. The app is a path of units (${SOUND.title}, then ten levels, each followed by two sets of everyday words), each made of short lessons and a unit check, plus practice: reviews, listening, speaking, vocabulary, ${C.formSkill.title.toLowerCase()}, flashcards and AI conversations.
Learning record:
${learnerSummary()}

Diagnose the 2–3 things that would most improve their ${C.name} now. Be specific and grounded only in the record; if the data is thin, say so. No praise or filler.
Reply with only JSON: {"headline":"one sentence","focus":[{"area":"short name","why":"what the record shows, with numbers","how":"one concrete action in the app"}],"next":"the single next session to do"}`;
  try{ const o=await sample.json(prompt,{cache:false, modelTier:"default", effort:"low"});
    LR.diag={day:today(), date:new Date().toLocaleDateString(), headline:String(o.headline||""), focus:(Array.isArray(o.focus)?o.focus:[]).slice(0,3).map(f=>({area:String(f.area||""),why:String(f.why||""),how:String(f.how||"")})), next:String(o.next||"")};
    dirtyDocs.add("learner"); saveLR(); $("diag").innerHTML=diagHTML(LR.diag); st.textContent="";
  }catch(e){ st.textContent=aiError(e); } finally{ if($("getDiag")) $("getDiag").disabled=false; }
}
async function genPractice(skill, btn){
  const sample=await getSample(); if(!sample){ btn.textContent="AI isn't available here"; return; }
  const ex=LR.log.filter(e=>!e.ok && e.y && (itemOf(e.id)||{sk:[]}).sk.includes(skill)).slice(-4);
  const old=btn.textContent; btn.disabled=true; btn.textContent="Writing questions…";
  const prompt=`Write 8 multiple-choice practice questions for ${LEARNER}. Focus: ${skName(skill)}.
${ex.length?"Their recent mistakes:\n"+ex.map(e=>`- "${e.q}": they chose "${e.y}", correct "${e.r}"`).join("\n"):""}
Use only what they have studied:
${levelScope(curLevel())}
${RULES}
Each question is a ${C.name} sentence with ONE blank (___) and 4 options; exactly one option is correct and the others are clearly wrong to a native speaker.
Reply with only a JSON array of 8 objects: {"q":"sentence with ___","q_rom":"romanization with ___","en":"English of the full sentence","opts":[{"t":"…","rom":"…"}],"a":<index>,"why":"one-sentence rule"}`;
  try{
    const arr=await sample.json(prompt,{cache:false, modelTier:"default", effort:"low"});
    const units=(Array.isArray(arr)?arr:[]).map((x,i)=>{
      if(!x || typeof x.q!=="string" || !x.q.includes("___") || !Array.isArray(x.opts) || x.opts.length!==4 || !Number.isInteger(x.a) || x.a<0 || x.a>3) return null;
      const opts=x.opts.map(o=>T_(o&&o.t,o&&o.rom)); if(opts.some(o=>!o.s) || new Set(opts.map(o=>o.s)).size!==4) return null;
      const full=T_(x.q.replace("___",opts[x.a].s), String(x.q_rom||"").replace("___",opts[x.a].r));
      return {t:"gap", id:"ai:"+Date.now()+":"+i, q:T_(x.q, x.q_rom), en:String(x.en||""), opts, a:x.a, why:String(x.why||""), full, sk:[skill]};
    }).filter(Boolean);
    if(!units.length){ btn.textContent="Couldn't use the reply. Try again"; return; }
    launch({kind:"practice", title:"AI practice", units, noRecord:true, back:{name:"weak", tab:"practice"}, onEnd:endPractice});
  }catch(e){ btn.textContent=aiError(e)||old; } finally{ btn.disabled=false; }
}

/* ---------------- keys ---------------- */
document.addEventListener("keydown",e=>{
  if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || $("dlg").open) return;
  if((e.key==="p"||e.key==="P") && lastSay){ e.preventDefault(); speak(lastSay.text, lastSay.o); return; }
  if(view.name!=="run") return;
  if(/^[1-6]$/.test(e.key)){ const b=[...document.querySelectorAll("#ex .sh-opt:not(:disabled)")][+e.key-1]; if(b){ e.preventDefault(); b.click(); } }
  else if((e.key==="Enter"||e.key===" ") && !e.target.closest("button,a,summary")){ const b=$("next")||$("show"); if(b){ e.preventDefault(); b.click(); } }
});

/* ---------------- back up / move progress ---------------- */
function exportAll(){ const docs={}; DOCS.forEach(n=>docs[n]=docBody(n)); return JSON.stringify({app:"studyhall-"+C.course, v:1, at:Date.now(), docs}); }
function importAll(text){
  const o=JSON.parse(String(text).trim()); if(!o || o.app!=="studyhall-"+C.course || !o.docs) throw new Error("bad");
  let n=0; for(const k of DOCS){ if(o.docs[k]){ mergeLR(k,o.docs[k]); dirtyDocs.add(k); n++; } }
  store.set("progress",P); store.set("learner",LR); sync(); return n;
}

/* ---------------- start ---------------- */
const vocabReady = VOCAB.data ? Promise.resolve(VOCAB.data) : fetch(VOCAB.url).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
vocabReady.then(d=>{ addEveryday(d); syncSoon(2000); }).catch(()=>{ EV="failed"; }).then(()=>{ if(view.name!=="run" && view.name!=="talk") render(); });
function begin(){
  if(!P.placed && hasProgress()){ P.placed={at:today(), how:"carried"}; saveP(); }  // progress from the old pages: no placement
  if(P.placed) go({name:"learn"}); else firstVisit();
}
(async()=>{
  getSample();
  const linked=connect(); let late=false;
  await Promise.race([linked, new Promise(r=>setTimeout(()=>{ late=true; r(); },4000))]);  // an account copy decides whether this is a first visit
  begin();
  const have=await linked;  // an account that answered late can still show this isn't a first visit
  if(late && have && have.size && view.name==="place" && !view.retake && (P.placed || hasProgress())) begin();
})();
