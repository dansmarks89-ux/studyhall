scribe habits: {{{\"s\": \"일어나요\", \"r\": \"ireonayo\", \"p\": \"이러나요\"}}} (I get up), {{{\"s\": \"씻어요\", \"r\": \"ssiseoyo\", \"p\": \"씨서요\"}}} (I wash up), {{{\"s\": \"출근해요\", \"r\": \"chulgeunhaeyo\"}}} (I go to work), {{{\"s\": \"퇴근해요\", \"r\": \"toegeunhaeyo\"}}} (I get off work), {{{\"s\": \"요리해요\", \"r\": \"yorihaeyo\"}}} (I cook), {{{\"s\": \"자요\", \"r\": \"jayo\"}}} (I go to bed). To say \"and then\", take the first verb's stem (the dictionary form without {{{\"s\": \"-다\", \"r\": \"-da\"}}}) and add {{{\"s\": \"-고\", \"r\": \"-go\"}}}: {{{\"s\": \"씻다\", \"r\": \"ssitta\", \"p\": \"씯따\"}}} becomes {{{\"s\": \"씻고\", \"r\": \"ssitkko\", \"p\": \"씯꼬\"}}}. Only the last verb carries the tense and the polite ending. Frequency words go before the verb: {{{\"s\": \"매일\", \"r\": \"maeil\"}}} (every day), {{{\"s\": \"자주\", \"r\": \"jaju\"}}} (often), {{{\"s\": \"가끔\", \"r\": \"gakkeum\"}}} (sometimes), {{{\"s\": \"보통\", \"r\": \"botong\"}}} (usually). {{{\"s\": \"별로\", \"r\": \"byeollo\"}}} goes with {{{\"s\": \"안\", \"r\": \"an\"}}} to mean \"not really\": {{{\"s\": \"별로 안 바빠요\", \"r\": \"byeollo an bappayo\"}}}.","ex":[[{"s":"씻고 아침을 먹어요.","r":"ssitkko achimeul meogeoyo","p":"씯꼬 아치믈 머거요"},"I wash up and then eat breakfast."],[{"s":"보통 일곱 시에 일어나요.","r":"botong ilgop ssie ireonayo","p":"보통 일곱 씨에 이러나요"},"I usually get up at seven."],[{"s":"커피를 별로 안 마셔요.","r":"keopireul byeollo an masyeoyo"},"I don't drink much coffee."]]},{"h":"Before and after","p":"\"Before doing\" is the verb stem plus {{{\"s\": \"-기 전에\", \"r\": \"-gi jeone\", \"p\": \"-기 저네\"}}}: {{{\"s\": \"자기 전에\", \"r\": \"jagi jeone\", \"p\": \"자기 저네\"}}} (before going to bed). \"After doing\" is the stem plus {{{\"s\": \"-ㄴ 후에\", \"r\": \"-n hue\"}}} after a vowel ({{{\"s\": \"퇴근한 후에\", \"r\": \"toegeunhan hue\"}}}) or {{{\"s\": \"-은 후에\", \"r\": \"-eun hue\"}}} after a consonant ({{{\"s\": \"먹은 후에\", \"r\": \"meogeun hue\", \"p\": \"머근 후에\"}}}). The main verb comes last and carries the tense.","ex":[[{"s":"자기 전에 샤워해요.","r":"jagi jeone syawohaeyo","p":"자기 저네 샤워해요"},"I shower before bed."],[{"s":"퇴근한 후에 운동해요.","r":"toegeunhan hue undonghaeyo"},"I work out after work."],[{"s":"밥 먹은 후에 커피 마셔요.","r":"bam meogeun hue keopi masyeoyo","p":"밤 머근 후에 커피 마셔요"},"I have coffee after I eat."]]},{"h":"At or in: two different particles","p":"Both can translate as \"at\" or \"in\", but they do different jobs. {{{\"s\": \"에\", \"r\": \"e\"}}} marks a time ({{{\"s\": \"일곱 시에\", \"r\": \"ilgop ssie\", \"p\": \"일곱 씨에\"}}}), a destination ({{{\"s\": \"회사에 가요\", \"r\": \"hoesae gayo\"}}}) and where something simply is ({{{\"s\": \"저기에 있어요\", \"r\": \"jeogie isseoyo\", \"p\": \"저기에 이써요\"}}}). {{{\"s\": \"에서\", \"r\": \"eseo\"}}} marks the place where an action happens ({{{\"s\": \"회사에서 일해요\", \"r\": \"hoesaeseo ilhaeyo\"}}}, {{{\"s\": \"집에서 요리해요\", \"r\": \"jibeseo yorihaeyo\", \"p\": \"지베서 요리해요\"}}}). {{{\"s\": \"에서\", \"r\": \"eseo\"}}} can also mean \"from\", paired with {{{\"s\": \"까지\", \"r\": \"kkaji\"}}} (to): {{{\"s\": \"집에서 회사까지\", \"r\": \"jibeseo hoesakkaji\", \"p\": \"지베서 회사까지\"}}}.","ex":[[{"s":"회사에서 일해요.","r":"hoesaeseo ilhaeyo"},"I work at a company."],[{"s":"집에서 요리해요.","r":"jibeseo yorihaeyo","p":"지베서 요리해요"},"I cook at home."],[{"s":"집에서 회사까지 멀어요.","r":"jibeseo hoesakkaji meoreoyo","p":"지베서 회사까지 머러요"},"It's far from my home to the office."]]},{"h":"From, until, around, and getting there","p":"{{{\"s\": \"부터\", \"r\": \"buteo\"}}} (from) and {{{\"s\": \"까지\", \"r\": \"kkaji\"}}} (until) attach to times: {{{\"s\": \"아홉 시부터 다섯 시까지\", \"r\": \"ahop ssibuteo daseot ssikkaji\", \"p\": \"아홉 씨부터 다섣 씨까지\"}}}. {{{\"s\": \"쯤\", \"r\": \"jjeum\"}}} (about, around) attaches to a time or amount with no space: {{{\"s\": \"세 시쯤\", \"r\": \"se sijjeum\"}}}, {{{\"s\": \"삼십 분쯤\", \"r\": \"samsip ppunjjeum\", \"p\": \"삼십 뿐쯤\"}}}. You {{{\"s\": \"타다\", \"r\": \"tada\"}}} (ride) a bus, subway or taxi, and the vehicle takes {{{\"s\": \"을\", \"r\": \"eul\"}}}/{{{\"s\": \"를\", \"r\": \"reul\"}}}: {{{\"s\": \"버스를 타요\", \"r\": \"beoseureul tayo\"}}}. To say \"by\", use {{{\"s\": \"로\", \"r\": \"ro\"}}} after a vowel or ㄹ and {{{\"s\": \"으로\", \"r\": \"euro\"}}} after other consonants: {{{\"s\": \"지하철로 가요\", \"r\": \"jihacheollo gayo\"}}}. On foot is {{{\"s\": \"걸어가요\", \"r\": \"georeogayo\", \"p\": \"거러가요\"}}} (walk there) or {{{\"s\": \"걸어서\", \"r\": \"georeoseo\", \"p\": \"거러서\"}}} (by walking).","ex":[[{"s":"아홉 시부터 다섯 시까지 일해요.","r":"ahop ssibuteo daseot ssikkaji ilhaeyo","p":"아홉 씨부터 다섣 씨까지 일해요"},"I work from nine to five."],[{"s":"지하철로 삼십 분쯤 걸려요.","r":"jihacheollo samsip ppunjjeum geollyeoyo","p":"지하철로 삼십 뿐쯤 걸려요"},"It takes about thirty minutes by subway."],[{"s":"버스를 타고 회사에 가요.","r":"beoseureul tago hoesae gayo"},"I take the bus to work."]]},{"h":"Sound points","p":"A final consonant slides into a following vowel: {{{\"s\": \"일어나요\", \"r\": \"ireonayo\", \"p\": \"이러나요\"}}} sounds like {{{\"s\": \"이러나요\", \"r\": \"ireonayo\"}}}, and {{{\"s\": \"씻어요\", \"r\": \"ssiseoyo\", \"p\": \"씨서요\"}}} like {{{\"s\": \"씨서요\", \"r\": \"ssiseoyo\"}}}. Before another consonant, a final ㅅ or ㅈ is said as a stopped t, and the next consonant turns tense: {{{\"s\": \"씻고\", \"r\": \"ssitkko\", \"p\": \"씯꼬\"}}} is said {{{\"s\": \"씯꼬\", \"r\": \"ssitkko\"}}} and {{{\"s\": \"늦게\", \"r\": \"neutkke\", \"p\": \"늗께\"}}} is said {{{\"s\": \"늗께\", \"r\": \"neutkke\"}}}. Station names gain a sound: {{{\"s\": \"역\", \"r\": \"yeok\"}}} after a word ending in ㄹ is said {{{\"s\": \"력\", \"r\": \"ryeok\"}}}, so {{{\"s\": \"지하철역\", \"r\": \"jihacheollyeok\", \"p\": \"지하철력\"}}} is {{{\"s\": \"지하철력\", \"r\": \"jihacheollyeok\"}}} and {{{\"s\": \"서울역\", \"r\": \"seoullyeok\", \"p\": \"서울력\"}}} is {{{\"s\": \"서울력\", \"r\": \"seoullyeok\"}}}. In {{{\"s\": \"정류장\", \"r\": \"jeongnyujang\", \"p\": \"정뉴장\"}}} (stop) the ㄹ is said as ㄴ: {{{\"s\": \"정뉴장\", \"r\": \"jeongnyujang\"}}}.","ex":[[{"s":"일어나요","r":"ireonayo","p":"이러나요"},"I get up"],[{"s":"지하철역","r":"jihacheollyeok","p":"지하철력"},"subway station"],[{"s":"버스 정류장","r":"beoseu jeongnyujang","p":"버스 정뉴장"},"bus stop"]]}],"vocab":[{"id":"L8-v-00","t":{"s":"일어나요","r":"ireonayo","p":"이러나요"},"en":"I get up","topic":"Routine","note":"Said {{{\"s\": \"이러나요\", \"r\": \"ireonayo\"}}}.","avoid":[]},{"id":"L8-v-01","t":{"s":"보통 일곱 시에 일어나요","r":"botong ilgop ssie ireonayo","p":"보통 일곱 씨에 이러나요"},"en":"I usually get up at seven","topic":"Routine","note":"","avoid":[]},{"id":"L8-v-02","t":{"s":"일찍","r":"iljjik"},"en":"early","topic":"Routine","note":"","avoid":[]},{"id":"L8-v-03","t":{"s":"늦게","r":"neutkke","p":"늗께"},"en":"late","topic":"Routine","note":"Said {{{\"s\": \"늗께\", \"r\": \"neutkke\"}}}.","avoid":[]},{"id":"L8-v-04","t":{"s":"주말에는 늦게 일어나요","r":"jumareneun neutkke ireonayo","p":"주마레는 늗께 이러나요"},"en":"On weekends I get up late","topic":"Routine","note":"","avoid":[]},{"id":"L8-v-05","t":{"s":"씻어요","r":"ssiseoyo","p":"씨서요"},"en":"I wash up","topic":"Routine","note":"Said {{{\"s\": \"씨서요\", \"r\": \"ssiseoyo\"}}}.","avoid":[]},{"id":"L8-v-06","t":{"s":"샤워해요","r":"syawohaeyo"},"en":"I take a shower","topic":"Routine","note":"","avoid":[]},{"id":"L8-v-07","t":{"s":"아침을 먹어요","r":"achimeul meogeoyo","p":"아치믈 머거요"},"en":"I eat breakfast","topic":"Routine","note":"{{{\"s\": \"아침\", \"r\": \"achim\"}}} is both morning and breakfast.","avoid":[]},{"id":"L8-v-08","t":{"s":"점심","r":"jeomsim"},"en":"lunch","topic":"Routine","note":"","avoid":[]},{"id":"L8-v-09","t":{"s":"점심 먹었어요?","r":"jeomsim meogeosseoyo","p":"점심 머거써요"},"en":"Have you had lunch?","topic":"Routine","note":"A friendly midday greeting.","avoid":[]},{"id":"L8-v-10","t":{"s":"저녁을 먹어요","r":"jeonyeogeul meogeoyo","p":"저녀글 머거요"},"en":"I eat dinner","topic":"Routine","note":"","avoid":[]},{"id":"L8-v-11","t":{"s":"퇴근해요","r":"toegeunhaeyo"},"en":"I get off work","topic":"Routine","note":"The opposite of {{{\"s\": \"출근해요\", \"r\": \"chulgeunhaeyo\"}}}.","avoid":[]},{"id":"L8-v-12","t":{"s":"몇 시에 퇴근해요?","r":"myeot ssie toegeunhaeyo","p":"멷 씨에 퇴근해요"},"en":"What time do you get ean friend Minji is curious about your daily routine. Tell her about your day and ask about hers.","persona":"You are Minji, a Korean office worker in her thirties. You get up at 6:30, wash up and eat breakfast, take the subway to work (about forty minutes), work from nine to six, and sometimes cook at home after work. You go to bed around eleven. Speak simple polite Korean (해요체) using mostly words from levels 1–8: routine verbs, 매일, 자주, 가끔, 보통, 별로 안, -고, -기 전에, -(으)ㄴ 후에, 부터, 까지, 쯤. Ask one question at a time and react briefly with -네요.","opening":{"s":"보통 몇 시에 일어나요?","r":"botong myeot ssie ireonayo","p":"보통 멷 씨에 이러나요"},"opening_en":"What time do you usually get up?","goals":["Say what time you get up and go to bed","Describe two things in order with -고","Say how you get to work and how long it takes","Say how often you exercise or cook"]},{"title":"Getting around Seoul","setup":"You're at a hotel front desk in Seoul and want to go to Myeongdong. Ask the staff member how to get there.","persona":"You are a friendly front-desk clerk at a hotel in Seoul. The learner wants to go to Myeongdong (명동). It takes about fifteen minutes by subway from the station next to the hotel, about twenty minutes by bus from the bus stop out front, or about ten minutes by taxi for roughly 8,000 won. Walking takes about forty minutes. Speak simple polite Korean (해요체, with -세요 forms toward the guest) using mostly words from levels 1–8, and repeat slowly if asked.","opening":{"s":"안녕하세요. 어디 가세요?","r":"annyeonghaseyo eodi gaseyo"},"opening_en":"Hello. Where are you headed?","goals":["Say where you want to go","Ask how to get there","Ask how long it takes by subway or bus","Ask about taking a taxi and the price"]}]},{"id":"L9","n":9,"title":"Describing and comparing","goal":"Describe people, places, colours and clothes, and compare things.","notes":[{"h":"Describing a noun: a big house, a good person","p":"To put a describing word in front of a noun, change its ending. {{{\"s\": \"커요\", \"r\": \"keoyo\"}}} (it's big) becomes {{{\"s\": \"큰\", \"r\": \"keun\"}}}: {{{\"s\": \"큰 집\", \"r\": \"keun jip\"}}}. After a final consonant add {{{\"s\": \"은\", \"r\": \"eun\"}}}: {{{\"s\": \"작아요\", \"r\": \"jagayo\", \"p\": \"자가요\"}}} becomes {{{\"s\": \"작은\", \"r\": \"jageun\", \"p\": \"자근\"}}}, {{{\"s\": \"좋아요\", \"r\": \"joayo\", \"p\": \"조아요\"}}} becomes {{{\"s\": \"좋은\", \"r\": \"joeun\", \"p\": \"조은\"}}}. Words ending in {{{\"s\": \"해요\", \"r\": \"haeyo\"}}} become {{{\"s\": \"한\", \"r\": \"han\"}}}: {{{\"s\": \"조용해요\", \"r\": \"joyonghaeyo\"}}} becomes {{{\"s\": \"조용한\", \"r\": \"joyonghan\"}}}. Words built on {{{\"s\": \"있어요\", \"r\": \"isseoyo\", \"p\": \"이써요\"}}} or {{{\"s\": \"없어요\", \"r\": \"eopsseoyo\", \"p\": \"업써요\"}}} take {{{\"s\": \"는\", \"r\": \"neun\"}}}: {{{\"s\": \"맛있는\", \"r\": \"masinneun\", \"p\": \"마신는\"}}}, {{{\"s\": \"재미있는\", \"r\": \"jaemiinneun\", \"p\": \"재미인는\"}}}. Words that change ㅂ to {{{\"s\": \"워\", \"r\": \"wo\"}}} (like {{{\"s\": \"매워요\", \"r\": \"maewoyo\"}}}, {{{\"s\": \"추워요\", \"r\": \"chuwoyo\"}}}) end in {{{\"s\": \"운\", \"r\": \"un\"}}}: {{{\"s\": \"매운 음식\", \"r\": \"maeun eumsik\"}}}.","ex":[[{"s":"큰 집","r":"keun jip"},"a big house"],[{"s":"좋은 사람","r":"joeun saram","p":"조은 사람"},"a good person"],[{"s":"맛있는 음식","r":"masinneun eumsik","p":"마신는 음식"},"delicious food"],[{"s":"매운 음식","r":"maeun eumsik"},"spicy food"]]},{"h":"Colours","p":"Colour words end in {{{\"s\": \"색\", \"r\": \"saek\"}}} (colour): {{{\"s\": \"빨간색\", \"r\": \"ppalgansaek\"}}}, {{{\"s\": \"파란색\", \"r\": \"paransaek\"}}}, {{{\"s\": \"검은색\", \"r\": \"geomeunsaek\", \"p\": \"거믄색\"}}}. Right before a noun you can drop {{{\"s\": \"색\", \"r\": \"saek\"}}}: {{{\"s\": \"빨간 차\", \"r\": \"ppalgan cha\"}}}. When the colour stands alone, as in asking for one, keep {{{\"s\": \"색\", \"r\": \"saek\"}}}: {{{\"s\": \"검은색 주세요\", \"r\": \"geomeunsaek jjuseyo\", \"p\": \"거믄색 쭈세요\"}}}.","ex":[[{"s":"빨간 차","r":"ppalgan cha"},"a red car"],[{"s":"검은색 주세요","r":"geomeunsaek jjuseyo","p":"거믄색 쭈세요"},"The black one, please."],[{"s":"무슨 색 좋아해요?","r":"museun saek jjoahaeyo","p":"무슨 색 쪼아해요"},"What colour do you like?"]]},{"h":"Three verbs for \"wear\"","p":"English uses \"wear\" for everything; Korean picks the verb by what you put on. {{{\"s\": \"입어요\", \"r\": \"ibeoyo\", \"p\": \"이버요\"}}} for clothes on your body, {{{\"s\": \"신어요\", \"r\": \"sineoyo\", \"p\": \"시너요\"}}} for shoes and socks, {{{\"s\": \"써요\", \"r\": \"sseoyo\"}}} for hats and glasses. These verbs mean \"put on\", so \"is wearing\" is {{{\"s\": \"-고 있어요\", \"r\": \"-go isseoyo\", \"p\": \"-고 이써요\"}}}: {{{\"s\": \"모자를 쓰고 있어요\", \"r\": \"mojareul sseugo isseoyo\", \"p\": \"모자를 쓰고 이써요\"}}}.","ex":[[{"s":"옷을 입어요","r":"oseul ibeoyo","p":"오슬 이버요"},"I put on clothes."],[{"s":"신발을 신어요","r":"sinbareul sineoyo","p":"신바를 시너요"},"I put on my shoes."],[{"s":"안경을 써요","r":"angyeongeul sseoyo"},"I wear glasses."],[{"s":"모자를 쓰고 있어요","r":"mojareul sseugo isseoyo","p":"모자를 쓰고 이써요"},"I'm wearing a hat."]]},{"h":"Comparing: than, more, the most, the same, like","p":"{{{\"s\": \"보다\", \"r\": \"boda\"}}} means \"than\" and goes right after the thing you compare against: {{{\"s\": \"이게 저거보다 더 싸요\", \"r\": \"ige jeogeoboda deo ssayo\"}}} = this one is cheaper than that one. {{{\"s\": \"더\", \"r\": \"deo\"}}} = more, {{{\"s\": \"제일\", \"r\": \"jeil\"}}} = the most. {{{\"s\": \"같아요\", \"r\": \"gatayo\", \"p\": \"가타요\"}}} = it's the same, {{{\"s\": \"달라요\", \"r\": \"dallayo\"}}} = it's different. {{{\"s\": \"처럼\", \"r\": \"cheoreom\"}}} = like, in the same way as.","ex":[[{"s":"오늘은 어제보다 더 추워요.","r":"oneureun eojeboda deo chuwoyo","p":"오느른 어제보다 더 추워요"},"It's colder today than yesterday."],[{"s":"여기 뭐가 제일 맛있어요?","r":"yeogi mwoga jeil masisseoyo","p":"여기 뭐가 제일 마시써요"},"What's the most delicious thing here?"],[{"s":"한국 사람처럼 말하고 싶어요.","r":"hanguk ssaramcheoreom malhago sipeoyo","p":"한국 싸람처럼 말하고 시퍼요"},"I want to speak like a Korean."]]},{"h":"Sounds: silent ㅎ, sliding letters, double final consonants","p":"{{{\"s\": \"같아요\", \"r\": \"gatayo\", \"p\": \"가타요\"}}} is said {{{\"s\": \"가타요\", \"r\": \"gatayo\"}}}: the final ㅌ slides into the next syllable. ㅎ goes silent between sounds: {{{\"s\": \"좋은\", \"r\": \"joeun\", \"p\": \"조은\"}}} sounds like {{{\"s\": \"조은\", \"r\": \"joeun\"}}}, and {{{\"s\": \"많이\", \"r\": \"mani\", \"p\": \"마니\"}}} like {{{\"s\": \"마니\", \"r\": \"mani\"}}}. Before ㄴ, the ㅆ in {{{\"s\": \"있\", \"r\": \"it\", \"p\": \"읻\"}}} turns into ㄴ: {{{\"s\": \"맛있는\", \"r\": \"masinneun\", \"p\": \"마신는\"}}} is said {{{\"s\": \"마신는\", \"r\": \"masinneun\"}}}. With two final letters, the second slides over: {{{\"s\": \"짧아요\", \"r\": \"jjalbayo\", \"p\": \"짤바요\"}}} is said {{{\"s\": \"짤바요\", \"r\": \"jjalbayo\"}}}, {{{\"s\": \"넓어요\", \"r\": \"neolbeoyo\", \"p\": \"널버요\"}}} is said {{{\"s\": \"널버요\", \"r\": \"neolbeoyo\"}}}.","ex":[[{"s":"같아요","r":"gatayo","p":"가타요"},"It's the same."],[{"s":"좋은 사람","r":"joeun saram","p":"조은 사람"},"a good person"],[{"s":"머리가 짧아요","r":"meoriga jjalbayo","p":"머리가 짤바요"},"She has short hair."]]}],"vocab":[{"id":"L9-v-00","t":{"s":"큰 집","r":"keun jip"},"en":"a big house","topic":"Describing","note":"{{{\"s\": \"커요\", \"r\": \"keoyo\"}}} becomes {{{\"s\": \"큰\", \"r\": \"keun\"}}} before a noun.","avoid":[]},{"id":"L9-v-01","t":{"s":"작은 가방","r":"jageun gabang","p":"자근 가방"},"en":"a small bag","topic":"Describing","note":"{{{\"s\": \"가방\", \"r\": \"gabang\"}}} = bag.","avoid":[]},{"id":"L9-v-02","t":{"s":"좋은 사람","r":"joeun saram","p":"조은 사람"},"en":"a good person","topic":"Describing","note":"The ㅎ is silent: said {{{\"s\": \"조은\", \"r\": \"joeun\"}}}.","avoid":[]},{"id":"L9-v-03","t":{"s":"맛있는 음식","r":"masinneun eumsik","p":"마신는 음식"},"en":"delicious food","topic":"Describing","note":"{{{\"s\": \"있어요\", \"r\": \"isseoyo\", \"p\": \"이써요\"}}} words take {{{\"s\": \"는\", \"r\": \"neun\"}}} before a noun.","avoid":[]},{"id":"L9-v-04","t":{"s":"커요","r":"keoyo"},"en":"It's big","topic":"Describing","note":"","avoid":[]},{"id":"L9-v-05","t":{"s":"작아요","r":"j mal gakkawoyo georeoseo o bun geollyeoyo","p":"네 정말 가까워요 거러서 오 분 걸려요"},{"s":"네, 정말 가까워요. 걸어서 다섯 분 걸려요.","r":"ne jeongmal gakkawoyo georeoseo daseot ppun geollyeoyo","p":"네 정말 가까워요 거러서 다섣 뿐 걸려요"},{"s":"네, 정말 멀어요. 걸어서 오 분 걸려요.","r":"ne jeongmal meoreoyo georeoseo o bun geollyeoyo","p":"네 정말 머러요 거러서 오 분 걸려요"}],"a":0,"why":"Minutes use Sino-Korean numbers: {{{\"s\": \"오 분\", \"r\": \"o bun\"}}}. And five minutes on foot is close, not far.","sk":["g:numbers","s:vocab"]},{"who":"Minji","s":{"s":"좋네요! 다음에 놀러 갈게요.","r":"jonneyo daeume nolleo galkkeyo","p":"존네요 다으메 놀러 갈께요"},"en":"Nice! I'll come and visit sometime."}],"k":[131,174,250,330,386,684,816],"u":7}],"roleplay":[{"title":"Shopping for a coat","setup":"You're in a clothing shop in Seoul looking for a winter coat. Find one in a colour you like and in the right size.","persona":"You are a friendly clerk in a clothing shop in Seoul. You sell coats in black, white, grey and blue; the black and blue ones come in small, medium and large. A coat costs 89,000 won (팔만 구천 원). Speak simple polite Korean (해요체 and -세요 forms) using mostly words from levels 1-9: colours (검은색, 하얀색, 파란색), 큰 거 / 작은 거, 더, 입어 보세요, 잘 어울려요, 어떠세요?. Keep every sentence short. If the learner seems lost, say it again more simply.","opening":{"s":"어서 오세요. 뭐 찾으세요?","r":"eoseo oseyo mwo chajeuseyo","p":"어서 오세요 뭐 차즈세요"},"opening_en":"Welcome. What are you looking for?","goals":["Say what you want to buy","Ask for a different colour","Ask to try it on","Ask for a bigger or smaller one","Ask how much it is"]},{"title":"Talking about people and places","setup":"A friendly Korean coworker asks about your family and about Chicago.","persona":"You are Ms Kim, a friendly Korean coworker in her forties who has never been to Chicago. Ask the learner about their spouse or a friend (tall or short? long or short hair? what kind of person?), then ask them to compare Chicago and Seoul (which is colder, which is bigger, which they like more) and ask their favourite food. Answer their questions about Seoul too. Speak simple polite Korean (해요체) using mostly words from levels 1-9: 키가 커요, 머리가 길어요, 친절해요, 보다, 더, 제일, 같아요, 달라요. Keep every sentence short.","opening":{"s":"가족 사진 있어요?","r":"gajok ssajin isseoyo","p":"가족 싸진 이써요"},"opening_en":"Do you have a family photo?","goals":["Describe someone's height and hair","Say what kind of person they are","Compare Chicago and Seoul","Say your favourite food"]}]},{"id":"L10","n":10,"title":"Real conversations","goal":"Handle problems, give opinions, link your sentences, and get through a phone call and a home visit.","notes":[{"h":"When something goes wrong","p":"Korean describes most problems in the past tense, because the thing has already happened: {{{\"s\": \"잃어버렸어요\", \"r\": \"ireobeoryeosseoyo\", \"p\": \"이러버려써요\"}}} (I lost it), {{{\"s\": \"고장 났어요\", \"r\": \"gojang nasseoyo\", \"p\": \"고장 나써요\"}}} (it broke, so it's broken now), {{{\"s\": \"길을 잃었어요\", \"r\": \"gireul ireosseoyo\", \"p\": \"기를 이러써요\"}}} (I lost the way, so I'm lost). {{{\"s\": \"도와주세요\", \"r\": \"dowajuseyo\"}}} = please help me. Sound point: in {{{\"s\": \"무슨 일\", \"r\": \"museun nil\", \"p\": \"무슨 닐\"}}} an extra ㄴ sound appears before {{{\"s\": \"일\", \"r\": \"il\"}}}, so it is said {{{\"s\": \"무슨 닐\", \"r\": \"museun nil\"}}}.","ex":[[{"s":"지갑을 잃어버렸어요.","r":"jigabeul ireobeoryeosseoyo","p":"지가블 이러버려써요"},"I lost my wallet."],[{"s":"휴대폰이 고장 났어요.","r":"hyudaeponi gojang nasseoyo","p":"휴대포니 고장 나써요"},"My phone is broken."],[{"s":"무슨 일이에요?","r":"museun nirieyo","p":"무슨 니리에요"},"What's wrong?"]]},{"h":"Have to: -아야 / -어야 돼요","p":"Take the polite form, drop the final {{{\"s\": \"요\", \"r\": \"yo\"}}}, and add {{{\"s\": \"야 돼요\", \"r\": \"ya dwaeyo\"}}}: {{{\"s\": \"가요\", \"r\": \"gayo\"}}} becomes {{{\"s\": \"가야 돼요\", \"r\": \"gaya dwaeyo\"}}}, {{{\"s\": \"벗어요\", \"r\": \"beoseoyo\", \"p\": \"버서요\"}}} becomes {{{\"s\": \"벗어야 돼요\", \"r\": \"beoseoya dwaeyo\", \"p\": \"버서야 돼요\"}}}, {{{\"s\": \"해요\", \"r\": \"haeyo\"}}} becomes {{{\"s\": \"해야 돼요\", \"r\": \"haeya dwaeyo\"}}}. Ask it as a question for \"do I have to?\" or \"do I need to?\".","ex":[[{"s":"지금 가야 돼요.","r":"jigeum gaya dwaeyo"},"I have to go now."],[{"s":"내일 일찍 일어나야 돼요.","r":"naeil iljjik ireonaya dwaeyo","p":"내일 일찍 이러나야 돼요"},"I have to get up early tomorrow."],[{"s":"예약해야 돼요?","r":"yeyakaeya dwaeyo","p":"예야캐야 돼요"},"Do I need a reservation?"],[{"s":"신발 벗어야 돼요?","r":"sinbal beoseoya dwaeyo","p":"신발 버서야 돼요"},"Do I have to take off my shoes?"]]},{"h":"But: -지만 and -는데","p":"{{{\"s\": \"-지만\", \"r\": \"-jiman\"}}} is a plain \"but\": {{{\"s\": \"비싸지만 맛있어요\", \"r\": \"bissajiman masisseoyo\", \"p\": \"비싸지만 마시써요\"}}}. {{{\"s\": \"-는데\", \"r\": \"-neunde\"}}} sets the scene before a question or a request and makes it softer: {{{\"s\": \"길을 잃었는데 좀 도와주실 수 있어요?\", \"r\": \"gireul ireonneunde jom dowajusil ssu isseoyo\", \"p\": \"기를 이런는데 좀 도와주실 쑤 이써요\"}}} = I'm lost; could you help me? Action words, {{{\"s\": \"있어요\", \"r\": \"isseoyo\", \"p\": \"이써요\"}}} words and the past take {{{\"s\": \"는데\", \"r\": \"neunde\"}}} ({{{\"s\": \"있는데\", \"r\": \"inneunde\", \"p\": \"인는데\"}}}, {{{\"s\": \"잃었는데\", \"r\": \"ireonneunde\", \"p\": \"이런는데\"}}}). Describing words take {{{\"s\": \"은데\", \"r\": \"eunde\"}}} or just {{{\"s\": \"ㄴ데\", \"r\": \"nde\"}}} ({{{\"s\": \"좋은데\", \"r\": \"joeunde\", \"p\": \"조은데\"}}}, {{{\"s\": \"바쁜데\", \"r\": \"bappeunde\"}}}). Ending a sentence with {{{\"s\": \"-는데요\", \"r\": \"-neundeyo\"}}} trails off politely: {{{\"s\": \"지금 좀 바쁜데요\", \"r\": \"jigeum jom bappeundeyo\"}}}.","ex":[[{"s":"비싸지만 맛있어요.","r":"bissajiman masisseoyo","p":"비싸지만 마시써요"},"It's expensive, but it's delicious."],[{"s":"길을 잃었는데 좀 도와주실 수 있어요?","r":"gireul ireonneunde jom dowajusil ssu isseoyo","p":"기를 이런는데 좀 도와주실 쑤 이써요"},"I'm lost. Could you help me?"],[{"s":"지금 좀 바쁜데요.","r":"jigeum jom bappeundeyo"},"I'm a bit busy right now..."]]},{"h":"Linking sentences and reacting","p":"{{{\"s\": \"그래서\", \"r\": \"geuraeseo\"}}} = so, that's why. {{{\"s\": \"그런데\", \"r\": \"g 10-v-01","t":"sound","s":"무슨 일이에요?","p":"무슨 니리에요","wrong":["무슨 일이에요","무슨 니이에요","무슨 일리에요"],"en":"What's wrong? / What's going on?"},{"id":"P-L10-v-02","t":"sound","s":"괜찮으세요?","p":"괜차느세요","wrong":["괜찮으세요","괜차으세요","괜찮느세요"],"en":"Are you all right?"},{"id":"P-L10-v-07","t":"sound","s":"고장 났어요","p":"고장 나써요","wrong":["고장 났어요","고장 나어요","고장 났써요"],"en":"It's broken / It's not working"},{"id":"P-L10-v-08","t":"sound","s":"몸이 안 좋아요","p":"모미 안 조아요","wrong":["몸이 안 좋아요","모미 안 좋아요","모이 안 조아요"],"en":"I don't feel well"},{"id":"P-L10-v-09","t":"sound","s":"큰일 났어요","p":"큰닐 라써요","wrong":["큰일 났어요","큰닐 났써요","큰닐 났어요"],"en":"Oh no, this is bad!"},{"id":"P-L10-v-14","t":"sound","s":"어떻게 해야 돼요?","p":"어떠케 해야 돼요","wrong":["어떻게 해야 돼요","어떠게 해야 돼요","어떻케 해야 돼요"],"en":"What should I do?"},{"id":"P-L10-v-15","t":"sound","s":"예약해야 돼요?","p":"예야캐야 돼요","wrong":["예약해야 돼요","예야해야 돼요","예약캐야 돼요"],"en":"Do I need a reservation?"},{"id":"P-L10-v-16","t":"sound","s":"신발 벗어야 돼요?","p":"신발 버서야 돼요","wrong":["신발 벗어야 돼요","신발 버어야 돼요","신발 벗서야 돼요"],"en":"Do I have to take off my shoes?"},{"id":"P-L10-v-17","t":"sound","s":"갈아타야 돼요","p":"가라타야 돼요","wrong":["갈아타야 돼요","가아타야 돼요","갈라타야 돼요"],"en":"I have to transfer"},{"id":"P-L10-v-18","t":"sound","s":"비싸지만 맛있어요","p":"비싸지만 마시써요","wrong":["비싸지만 맛있어요","비싸지만 마시어요","비싸지만 마있써요"],"en":"It's expensive, but it's delicious"},{"id":"P-L10-v-27","t":"sound","s":"비가 올 것 같아요","p":"비가 올 껃 까타요","wrong":["비가 올 것 같아요","비가 올 것 같타요","비가 올 것 까아요"],"en":"I think it's going to rain"},{"id":"P-L10-v-28","t":"sound","s":"좋은 것 같아요","p":"조은 걷 까타요","wrong":["좋은 것 같아요","조은 걷 같아요","조은 걷 같타요"],"en":"I think it's good"},{"id":"P-L10-v-30","t":"sound","s":"어떻게 생각해요?","p":"어떠케 생가캐요","wrong":["어떻게 생각해요","어떠게 생가캐요","어떠게 생가해요"],"en":"What do you think?"},{"id":"P-L10-v-31","t":"sound","s":"저도 그렇게 생각해요","p":"저도 그러케 생가캐요","wrong":["저도 그렇게 생각해요","저도 그러게 생가캐요","저도 그러게 생가해요"],"en":"I think so too"},{"id":"P-L10-v-32","t":"sound","s":"좋은 생각이에요","p":"조은 생가기에요","wrong":["좋은 생각이에요","조은 생가이에요","조은 생각기에요"],"en":"That's a good idea"},{"id":"P-L10-v-33","t":"sound","s":"그렇죠","p":"그러쵸","wrong":["그렇죠","그러죠","그렇쵸"],"en":"Right, exactly"},{"id":"P-L10-v-35","t":"sound","s":"그렇군요","p":"그러쿤뇨","wrong":["그렇군요","그러군뇨","그러군요"],"en":"I see (now I understand)"},{"id":"P-L10-v-36","t":"sound","s":"축하해요","p":"추카해요","wrong":["축하해요","추하해요","축카해요"],"en":"Congratulations"},{"id":"P-L10-v-43","t":"sound","s":"들어오세요","p":"드러오세요","wrong":["들어오세요","드어오세요","들러오세요"],"en":"Please come in"},{"id":"P-L10-v-44","t":"sound","s":"편하게 앉으세요","p":"편하게 안즈세요","wrong":["편하게 앉으세요","편하게 안으세요","편하게 앉즈세요"],"en":"Please sit and make yourself comfortable"},{"id":"P-L10-v-46","t":"sound","s":"많이 드세요","p":"마니 드세요","wrong":["많이 드세요","마이 드세요","많니 드세요"],"en":"Help yourself / Eat a lot"},{"id":"P-L10-v-48","t":"sound","s":"다음에 또 봐요","p":"다으메 또 봐요","wrong":["다음에 또 봐요","다으에 또 봐요","다음메 또 봐요"],"en":"See you next time"},{"id":"P-L10-v-49","t":"sound","s":"오늘 정말 즐거웠어요","p":"오늘 정말 즐거워써요","wrong":["오늘 정말 즐거웠어요","오늘 정말 즐거워어요","오늘 정말 즐거웠써요"],"en":"I had a really good time today"},{"id":"P-L10-v-50","t":"sound","s":"연락할게요","p":"열라칼께요","wrong":["연락할게요","연라칼게요","연라칼께요"],"en":"I'll be in touch"}]}],"guide":"\n<section><h2>How Hangul works</h2>\n<p>Hangul is an alphabet with 24 basic letters. Letters stack into square blocks, and each block is one syllable. A block always starts with a consonant; when a syllable starts with a vowel, the silent letter <span class=\"cjk\">ㅇ</span> holds the place.</p>\n<p>Tall vowels sit to the right of the consonant. Flat vowels sit underneath. A final consonant, if there is one, goes at the bottom.</p>\n<div class=\"blocks\"><div class=\"block\"><span class=\"tgs\">가</span><span class=\"parts\">ㄱ + ㅏ</span><button class=\"say\" type=\"button\" data-say=\"가\"><span class=\"cjk\">가</span> <span class=\"r\" data-rom=\"ga\">ga</span></button></div><div class=\"block\"><span class=\"tgs\">고</span><span class=\"parts\">ㄱ + ㅗ</span><button class=\"say\" type=\"button\" data-say=\"고\"><span class=\"cjk\">고</span> <span class=\"r\" data-rom=\"go\">go</span></button></div><div class=\"block\"><span class=\"tgs\">한</span><span class=\"parts\">ㅎ + ㅏ + ㄴ</span><button class=\"say\" type=\"button\" data-say=\"한\"><span class=\"cjk\">한</span> <span class=\"r\" data-rom=\"han\">han</span></button></div><div class=\"block\"><span class=\"tgs\">국</span><span class=\"parts\">ㄱ + ㅜ + ㄱ</span><button class=\"say\" type=\"button\" data-say=\"국\"><span class=\"cjk\">국</span> <span class=\"r\" data-rom=\"guk\">guk</span></button></div></div>\n<p>Put the last two together: <button class=\"say\" type=\"button\" data-say=\"한국\"><span class=\"cjk\">한국</span> <span class=\"r\" data-rom=\"hanguk\">hanguk</span> <span class=\"r\">Korea</span></button>.</p></section>\n\n<section><h2>Consonants come in three kinds</h2>\n<p>The hardest consonant skill in Korean is telling three versions of the same sound apart. Hold your hand in front of your mouth.</p>\n<div class=\"tblwrap\"><table><thead><tr><th>Plain: light, small breath</th><th>Puffed: strong burst of air</th><th>Tight: no air, tense throat</th></tr></thead><tbody><tr><td><button class=\"say\" type=\"button\" data-say=\"가\"><span class=\"cjk\">가</span></button></td><td><button class=\"say\" type=\"button\" data-say=\"카\"><span class=\"cjk\">카</span></button></td><td><button class=\"say\" type=\"button\" data-say=\"까\"><span class=\"cjk\">까</span></button></td></tr><tr><td><button class=\"say\" type=\"button\" data-say=\"다\"><span class=\"cjk\">다</span></button></td><td><button class=\"say\" type=\"button\" data-say=\"타\"><span class=\"cjk\">타</span></button></td><td><button class=\"say\" type=\"button\" data-say=\"따\"><span class=\"cjk\">따</span></button></td></tr><tr><td><button class=\"say\" type=\"button\" data-say=\"바\"><span class=\"cjk\">바</span></button></td><td><button class=\"say\" type=\"button\" data-say=\"파\"><span class=\"cjk\">파</span></button></td><td><button class=\"say\" type=\"button\" data-say=\"빠\"><span class=\"cjk\">빠</span></button></td></tr><tr><td><button class=\"say\" type=\"button\" data-say=\"자\"><span class=\"cjk\">자</span></button></td><td><button class=\"say\" type=\"button\" data-say=\"차\"><span class=\"cjk\">차</span></button></td><td><button class=\"say\" type=\"button\" data-say=\"짜\"><span class=\"cjk\">짜</span></button></td></tr><tr><td><button class=\"say\" type=\"button\" data-say=\"사\"><span class=\"cjk\">사</span></button></td><td>–</td><td><button class=\"say\" type=\"button\" data-say=\"싸\"><span class=\"cjk\">싸</span></button></td></tr></tbody></table></div>\n<p>At the start of a word, plain <span class=\"cjk\">ㄱ ㄷ ㅂ ㅈ</span> sound close to k, t, p, ch to English ears. Between vowels they soften to g, d, b, j. That's why <button class=\"say\" type=\"button\" data-say=\"고기\"><span class=\"cjk\">고기</span> <span class=\"r\" data-rom=\"gogi\">gogi</span> <span class=\"r\">meat</span></button> has two different-sounding g's.</p>\n<p>The rest are easy: <span class=\"cjk\">ㄴ</span> n, <span class=\"cjk\">ㅁ</span> m, <span class=\"cjk\">ㅎ</span> h, <span class=\"cjk\">ㅇ</span> silent at the start and “ng” at the end. <span class=\"cjk\">ㄹ</span> is a quick tap between vowels (like the tt in American “butter”) and an “l” at the end of a syllable.</p></section>\n\n<section><h2>Vowels</h2>\n<p><button class=\"say\" type=\"button\" data-say=\"아\"><span class=\"cjk\">아</span> <span class=\"r\" data-rom=\"a\">a</span></button> <button class=\"say\" type=\"button\" data-say=\"어\"><span class=\"cjk\">어</span> <span class=\"r\" data-rom=\"eo\">eo</span></button> <button class=\"say\" type=\"button\" data-say=\"오\"><span class=\"cjk\">오</span> <span class=\"r\" data-rom=\"o\">o</span></button> <button class=\"say\" type=\"button\" data-say=\"우\"><span class=\"cjk\">우</span> <span class=\"r\" data-rom=\"u\">u</span></button> <button class=\"say\" type=\"button\" data-say=\"으\"><span class=\"cjk\">으</span> <span class=\"r\" data-rom=\"eu\">eu</span></button> <button class=\"say\" type=\"button\" data-say=\"이\"><span class=\"cjk\">이</span> <span class=\"r\" data-rom=\"i\">i</span></button> <button class=\"say\" type=\"button\" data-say=\"애\"><span class=\"cjk\">애</span> <span class=\"r\" data-rom=\"ae\">ae</span></button></p>\n<p>Add a short stroke and a vowel gains a y-sound: <span class=\"cjk\">ㅏ→ㅑ, ㅓ→ㅕ, ㅗ→ㅛ, ㅜ→ㅠ</span>. Combine two and you get a w-sound: <span class=\"cjk\">ㅗ+ㅏ = ㅘ</span> (wa), <span class=\"cjk\">ㅜ+ㅓ = ㅝ</span> (wo).</p>\n<p class=\"callout\">Two need care. <span class=\"cjk\">ㅓ</span> (written eo) is an open “uh”, like the u in “but”. It is not “e-o”. <span class=\"cjk\">ㅡ</span> (eu) is “oo” said with your lips spread flat.</p>\n<p>Most people today say <span class=\"cjk\">ㅐ</span> and <span class=\"cjk\">ㅔ</span> the same way, like the e in “bed”. Likewise <span class=\"cjk\">ㅙ ㅚ ㅞ</span> all sound like “we” in “wet”.</p></section>\n\n<section><h2>Final consonants: only seven sounds</h2>\n<p>At the end of a syllable every consonant is said as one of seven sounds, and the ending is held, not released.</p>\n<div class=\"tblwrap\"><table><thead><tr><th>Written at the end</th><th>Said as</th></tr></thead><tbody>\n<tr><td class=\"h\">ㄱ ㅋ ㄲ</td><td>k (held)</td></tr><tr><td class=\"h\">ㄴ</td><td>n</td></tr>\n<tr><td class=\"h\">ㄷ ㅅ ㅆ ㅈ ㅊ ㅌ ㅎ</td><td>t (held)</td></tr><tr><td class=\"h\">ㄹ</td><td>l</td></tr>\n<tr><td class=\"h\">ㅁ</td><td>m</td></tr><tr><td class=\"h\">ㅂ ㅍ</td><td>p (held)</td></tr><tr><td class=\"h\">ㅇ</td><td>ng</td></tr></tbody></table></div>\n<ul><li><button class=\"say\" type=\"button\" data-say=\"옷\"><span class=\"cjk\">옷</span></button> → <span class=\"cjk\">옫</span> <span class=\"sub\">(clothes)</span></li><li><button class=\"say\" type=\"button\" data-say=\"부엌\"><span class=\"cjk\">부엌</span></button> → <span class=\"cjk\">부억</span> <span class=\"sub\">(kitchen)</span></li><li><button class=\"say\" type=\"button\" data-say=\"닭\"><span class=\"cjk\">닭</span></button> → <span class=\"cjk\">닥</span> <span class=\"sub\">(chicken; two final letters, only one is said)</span></li></ul></section>\n\n<section><h2>Spelling vs speech</h2>\n<p>Korean spelling shows the parts of a word; speech smooths them together. Cards show a “said like” line whenever the sound differs from the spelling. It shows normal connected speech, so some changes cross word gaps too: <button class=\"say\" type=\"button\" data-say=\"한국 사람\"><span class=\"cjk\">한국 사람</span> <span class=\"r\" data-rom=\"hanguk ssaram\">hanguk ssaram</span> <span class=\"r\">Korean person</span></button> sounds like <span class=\"cjk\">한국 싸람</span>. You don't need to memorize these rules now. Notice them as they come up.</p>\n<ol>\n<li><b>Linking.</b> A final consonant slides into a next syllable that starts with <span class=\"cjk\">ㅇ</span>.<ul><li><button class=\"say\" type=\"button\" data-say=\"한국어\"><span class=\"cjk\">한국어</span></button> → <span class=\"cjk\">한구거</span> <span class=\"sub\">(Korean language)</span></li><li><button class=\"say\" type=\"button\" data-say=\"음악\"><span class=\"cjk\">음악</span></button> → <span class=\"cjk\">으막</span> <span class=\"sub\">(music)</span></li></ul></li>\n<li><b>Nasal change.</b> A p, t or k ending before <span class=\"cjk\">ㄴ</span> or <span class=\"cjk\">ㅁ</span> becomes m, n or ng.<ul><li><button class=\"say\" type=\"button\" data-say=\"감사합니다\"><span class=\"cjk\">감사합니다</span></button> → <span class=\"cjk\">감사함니다</span> <span class=\"sub\">(thank you)</span></li><li><button class=\"say\" type=\"button\" data-say=\"한국말\"><span class=\"cjk\">한국말</span></button> → <span class=\"cjk\">한궁말</span> <span class=\"sub\">(Korean language)</span></li></ul></li>\n<li><b>ㅎ.</b> Next to <span class=\"cjk\">ㄱ ㄷ ㅂ ㅈ</span> it turns them into puffed sounds. Between vowels it usually disappears.<ul><li><button class=\"say\" type=\"button\" data-say=\"못해요\"><span class=\"cjk\">못해요</span></button> → <span class=\"cjk\">모태요</span> <span class=\"sub\">(can't)</span></li><li><button class=\"say\" type=\"button\" data-say=\"좋아요\"><span class=\"cjk\">좋아요</span></button> → <span class=\"cjk\">조아요</span> <span class=\"sub\">(good)</span></li></ul></li>\n<li><b>Tightening.</b> After a k, t or p ending, the next plain consonant becomes tight.<ul><li><button class=\"say\" type=\"button\" data-say=\"학교\"><span class=\"cjk\">학교</span></button> → <span class=\"cjk\">학꾜</span> <span class=\"sub\">(school)</span></li><li><button class=\"say\" type=\"button\" data-say=\"맥주\"><span class=\"cjk\">맥주</span></button> → <span class=\"cjk\">맥쭈</span> <span class=\"sub\">(beer)</span></li></ul></li>\n<li><b>ㄴ next to ㄹ</b> becomes ㄹㄹ.<ul><li><button class=\"say\" type=\"button\" data-say=\"설날\"><span class=\"cjk\">설날</span></button> → <span class=\"cjk\">설랄</span> <span class=\"sub\">(Lunar New Year)</span></li><li><button class=\"say\" type=\"button\" data-say=\"연락\"><span class=\"cjk\">연락</span></button> → <span class=\"cjk\">열락</span> <span class=\"sub\">(contact)</span></li></ul></li>\n<li><b>ㄷ or ㅌ before 이</b> becomes ㅈ or ㅊ.<ul><li><button class=\"say\" type=\"button\" data-say=\"같이\"><span class=\"cjk\">같이</span></button> → <span class=\"cjk\">가치</span> <span class=\"sub\">(together)</span></li></ul></li>\n</ol></section>\n\n<section><h2>Polite speech</h2>\n<p>Korean changes verb endings depending on politeness. The cards use the <b>-요</b> style: polite and friendly, the normal choice with adults you don't know well. A few fixed phrases, like <span class=\"cjk\">감사합니다</span> and <span class=\"cjk\">죄송합니다</span>, use the more formal <span class=\"cjk\">-ㅂ니다</span> ending because that's how everyone says them. Dropping <span class=\"cjk\">-요</span> is casual speech for close friends; wait until someone invites you to.</p></section>\n\n<section><h2>Two sets of numbers</h2>\n<p><b>Native Korean</b> numbers (<span class=\"cjk\">하나, 둘, 셋</span>…) count things and people, and give the hour. <b>Sino-Korean</b> numbers (<span class=\"cjk\">일, 이, 삼</span>…) are for money, minutes, dates and phone numbers. So 3:30 is <button class=\"say\" type=\"button\" data-say=\"세 시 삼십 분\"><span class=\"cjk\">세 시 삼십 분</span> <span class=\"r\" data-rom=\"se si samsip bun\">se si samsip bun</span></button>: native for the hour, Sino-Korean for the minutes.</p></section>","audio":{"ko-KR-SunHi:DragonHDLatestNeural|감사합니다":"a97f290d84f41e71d5dc6295f81e0957","ko-KR-SunHi:DragonHDLatestNeural|죄송합니다":"35f6c5c6e074540a47081f5a797bf0a9","ko-KR-SunHi:DragonHDLatestNeural|고마워요":"63d748b9e2dafe3da68c79abecf7e695","ko-KR-SunHi:DragonHDLatestNeural|미안해요":"ba52c28c0fdb20861c1f09897614d0ab","ko-KR-SunHi:DragonHDLatestNeural|안녕히 가세요":"e8e65f01dc41ebfc2420145169411139","ko-KR-SunHi:DragonHDLatestNeural|안녕히 계세요":"4773d01d51c4d4f0723b22ce8b0a934b","ko-KR-SunHi:DragonHDLatestNeural|하나":"bb8c93fa3eaa1b5a85df679593feb4e2","ko-KR-SunHi:DragonHDLatestNeural|둘":"4ef7e5a7b55ba458bc25445c2ba702ce","ko-KR-SunHi:DragonHDLatestNeural|셋":"421f147302702da975b98f6716bb6137","ko-KR-SunHi:DragonHDLatestNeural|열":"aa5b40b657443252718bc8ef193220b9","ko-KR-SunHi:DragonHDLatestNeural|일":"1a73737301bdf02f3d578d1f62365871","ko-KR-SunHi:DragonHDLatestNeural|이":"8d6b63522c4a4029171602f6a82b0053","ko-KR-SunHi:DragonHDLatestNeural|삼":"3f5bc2af4a5e5c908ba10854247de0d2","ko-KR-SunHi:DragonHDLatestNeural|십오":"15f1d3072667ff583d05ecc91300fb97","ko-KR-SunHi:DragonHDLatestNeural|이십":"4e78fca492ec53675ec941ebd4f5cefc","ko-KR-SunHi:DragonHDLatestNeural|만":"8568dc2a08ed014e15a3e566f5104785","ko-KR-SunHi:DragonHDLatestNeural|만 오천":"95e5ceacb213f1313e80ca042fd1255b","ko-KR-SunHi:DragonHDLatestNeural|백":"f6353f2392dd7c6c8479e89a76a0f991","ko-KR-SunHi:DragonHDLatestNeural|천":"e1c871fb28af03b05acdd56c462124a6","ko-KR-SunHi:DragonHDLatestNeural|하나, 둘, 셋":"28a9fc3b1da1d7a018e91a79b5a8fe6a","ko-KR-SunHi:DragonHDLatestNeural|이만":"13bf399b8850b721560b32cc9132f830","ko-KR-SunHi:DragonHDLatestNeural|주세요":"51a64fc18a4b41951cb5fe56e66f9788","ko-KR-SunHi:DragonHDLatestNeural|이거 하나 주세요":"4de5409441981c23dfdb0d34edea4d78","ko-KR-Su /* Read the account copy and merge it into this device. Runs before every write, so a page left open on one device

async function pull(){

  qs.docs.forEach(doc=>{ if(doc.id!=="stats") docs[doc.id]=doc.data()||{}; });
  const ra=Math.max(0, ...Object.values(docs).map(d=>d.ra||0));
  if(ra>RA) wipe(ra);
  for(const n in docs){
    if((docs[n].ra||0)<RA){ dirtyDocs.add(n); continue; }
    if(mergeLR(n, docs[n]) && n!=="course") dirtyDocs.add(n);

async function sync(){

    await pull(); names=[...dirtyDocs]; dirtyDocs.clear();
    for(const n of names) await db.collection("data/users/"+uid).doc(n).set(docBody(n));
    const s2=statsDoc(), k2=JSON.stringify(s2);

    if(d.diag && (!LR.diag || d.diag.day>LR.diag.day)) LR.diag=d.diag; else if(LR.diag && (!d.diag || LR.diag.day>d.diag.day)) ch=true;
    const dm=d.mig||{};

    const di=d.in||{}; for(const k in di) if(!LR.intro[k] || di[k]<LR.intro[k]) LR.intro[k]=di[k];
    if(Object.keys(LR.intro).some(k=>!di[k])) ch=true;
    const dl=d.ld||{}; for(const k in dl){ const a=LR.ld[k], b=dl[k]; if(!a || b[0]>a[0] || (b[0]===a[0] && b[1]>a[1])) LR.ld[k]=b; }

    if(LR.log.some(e=>!seen.has(e.t+"|"+e.id))) ch=true;

  else cont=`<div class="sh-card cont"><span class="sh-label">${esc(unitName(u))}</span><h2>Unit check</h2><p class="sub">${u.k==="level"?"30 questions, 90%":"20 questions, 80%"} to pass. Passing opens the next unit and earns 50 points.</p><button class="sh-btn primary block" type="button" id="continue">Take the unit check</button></div>`;
  const news = P.placed && P.placed.how==="carried" && !P.nw ? `<section class="sh-card"><span class="sh-tag gold">New</span><p>Thousands of everyday words were added to your path. Take a quick level check so you don't repeat what you know.</p>
    <div class="btns"><button class="sh-btn primary" type="button" id="nwFind">Find my level</button><button class="sh-btn" type="button" id="nwNo">Not now</button></div></section>` : "";
  const rows = UNITS.map(x=>{
    const done=unitDone(x), cur=u===x, nd=cur&&nextLesson(x);
    const ls=lessonsOf(x), st = done ? (P.checks[x.id]==="t" ? "Tested out" : "Done") : cur ? `${ls.filter(lessonDone).length} of ${ls.length} lessons` : `${ls.length} lessons`;
    let more="";
    if(cur) more=`<ol class="lessons">${ls.map(Lx=>{ const d=lessonDone(Lx); return `<li><button class="lesson${d?" done":""}${Lx===nd?" next":""}" type="button" data-lesson="${Lx.id}"${d||Lx===nd?"":" disabled"}><span class="ck" aria-hidden="true">${d?SHUI.icon("check"):Lx.k+1}</span><span>${lessonT(Lx)}</span></button></li>`; }).join("")}
      <li><button class="lesson${nd?"":" next"}" type="button" data-check="${x.id}"${nd?" disabled":""}><span class="ck" aria-hidden="true">${ls.length+1}</span><span>Unit check</span></button></li></ol>${nd?`<button class="sh-btn ghost sm" type="button" data-test="${x.id}">Test out: take the check now</button>`:""}`;
    return `<li class="${done?"done":cur?"current":"locked"}"><span class="sh-node" aria-hidden="true">${done?SHUI.icon("check"):x.i+1}</span><div class="sh-path-body"><button class="ut" type="button" data-unit="${x.id}"><b>${esc(unitName(x))}</b><span>${st}</span></button>${more}</div></li>`;
  }).join("");
  V().innerHTML = topBar() + `<div class="hero">${SHUI.ring(lv.level, lv.pct)}<div><h1>${esc(C.name)}<span class="nat" lang="${C.htmlLang}">${esc(C.native)}</span></h1><p class="sub">${lv.need-lv.into} points to level ${lv.level+1}</p></div></div>
    ${news}${cont}<h2 class="sect">Your path</h2><ol class="sh-path">${rows}</ol>`;
  on("toPractice", ()=>go({name:"practice"}));
  on("continue", ()=>L ? startLesson(L) : startCheck(u));
  on("nwFind", ()=>{ P.nw=1; saveP(); go({name:"place", step:"know", retake:"learn"}); });
  on("nwNo", ()=>{ P.nw=1; saveP(); renderLearn(); });
  wireLen();
  V().querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>startLesson(LBY[b.dataset.lesson]));
  V().querySelectorAll("[data-check],[data-test]").forEach(b=>b.onclick=()=>startCheck(UBY[b.dataset.check||b.dataset.test]));
  V().querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>go({name:"unit", id:b.dataset.unit, tab:"learn"}));
}
function startLesson(L){
  if(L.w && L.w.some(w=>!VOC[w])) return astatus("The words for this lesson are still loading. Try again in a moment.");
  launch({kind:"lesson", title:L.t, L, units:buildLesson(L), onEnd:endLesson, back:{name:"learn"}});
}
function startCheck(u){
  if(u.k==="words" && EV!=="ready") return astatus("The words for this unit are still loading. Try again in a moment.");
  launch({kind:"check", test:true, u, title:`${unitLabel(u)} check`, units:checkItems(u), onEnd:endCheck, back:{name:"learn"}});
}

function renderUnit(){

  else if(u.k==="words") ref = EV==="ready" ? `<section class="sh-card"><h2>Words</h2><p class="sub">${ES[u.id].words.filter(w=>learned(w.id)).length} of ${ES[u.id].words.length} learned</p>${wordList(ES[u.id].words)}</section>` : `<p class="sub">${EV==="loading"?"Loading the words…":"The words couldn't load. Check your connection and reload the page."}</p>`;
  else ref=u.sets.map(s=>`<section class="sh-card"><h2>${esc(DS[s].title)}</h2><p class="sub">${esc(DS[s].sub)}</p>${drillStudy(s, DS[s].items)}</section>`).join("");
  V().innerHTML = topBar(back) + `<div class="stack"><span class="sh-label">${unitLabel(u)}${done?(P.checks[u.id]==="t"?", tested out":", done"):cur?", in progress":", locked"}</span><h1>${esc(u.title)}</h1><p class="sub">${esc(u.sub)}</p></div>

    <button class="sh-btn block" type="button" id="uCheck">${done?"Take the check again":nd?"Test out: take the check now":"Take the unit check"}</button></div>
    <h2 class="sect">Lessons</h2><ol class="lessons">${lessonsOf(u).map(L=>{ const d=lessonDone(L), nx=cur&&L===nd; return `<li><button class="lesson${d?" done":""}${nx?" next":""}" type="button" data-lesson="${L.id}"${d||nx?"":" disabled"}><span class="ck" aria-hidden="true">${d?SHUI.icon("check"):L.k+1}</span><span>${lessonT(L)}</span></button></li>`; }).join("")}</ol>${ref}`;
  wireBack(back);
  on("uPractice", ()=>startPractice(u.title, weightedPick(pool,12), {name:"unit", id:u.id, tab:"learn"}));

function unitPool(u){
  if(u.k==="level") return unitOpen(u) ? lvItems(u.id) : [];
  if(u.k==="drill") return u.sets.flatMap(drillItems);
  return EV==="ready" ? ES[u.id].items.filter(id=>introduced(ALL[id].it.v)).map(id=>ALL[id].it) : [];
}
const noteHTML = v => v.ev||v.old ? esc(v.note) : prose(v.note);
const wordList = ws => `<ul class="words">${ws.map(v=>`<li>${playBtn(v.t.s)}<div>${tx(v.t)}<span>${esc(v.en)}${v.pos?` <span class="sub">${esc(v.pos)}</span>`:""}</span>${v.note?`<span class="sub">${noteHTML(v)}</span>`:""}${(v.ex||[]).length?`<details><summary>Examples</summary>${exList(v.ex)}</details>`:""}</div></li>`).join("")}</ul>`;
const fixSayButtons = () => document.querySelectorAll("button.say").forEach(b=>{ if(!b.querySelector("svg")) b.insertAdjacentHTML("afterbegin",SHUI.icon("play")); });

/* Practice: reviews, weak spots, skills, conversations, drills, cards, characters, the guide */
function skillPool(k){
  const all=()=>Object.values(ALL).map(a=>a.it).filter(it=>itemAvailable(it.id));
  if(k==="listen") return all().filter(it=>(it.sk||[]).includes("s:listen"));
  if(k==="vocab") return all().filter(it=>(it.sk||[]).includes("s:vocab")).concat(Object.values(VOC).filter(v=>introduced(v.id) && spellParts(v)).map(v=>itemOf(qid(v,"sp"))));
  if(k==="sound") return SOUND.sets.flatMap(drillItems);
  if(k==="speak"){ const a=sayUnits(4), b=shadowUnits(4); return a.flatMap((x,i)=>[x,b[i]]).filter(Boolean); }
  // grammar forms (verb endings / aspect markers) on words met, plus the open levels' grammar questions
  const on=new Set(formsAt(posO()).map(f=>f.k)), words=Object.values(VOC).filter(v=>introduced(v.id));
  const forms = !on.size ? [] : words.flatMap(v=>[...Object.keys(v.cj||{}).filter(f=>on.has(f)).map(f=>"cj:"+v.id+":"+f), ...(v.ex||[]).map((x,i)=>x.a && on.has(cps(x.s)[x.a[0]]) ? "as:"+v.id+":"+i : null).filter(Boolean)]).map(id=>Object.assign(itemOf(id), id.startsWith("cj:") ? {mode:Math.random()<.5?"pick":"tiles"} : {}));
  return forms.concat(all().filter(it=>it.t==="gap"||it.t==="pick"));
}

function startPractice(title, units, back){

function noteSplit(p){

  while(k<sents.length && (k===0 || n+sents[k].split(/\s+/).filter(Boolean).length<=45)){ n+=sents[k].split(/\s+/).filter(Boolean).length; k++; }
  return [back(sents.slice(0,k).join("")), back(sents.slice(k).join(""))];
}

// The small label over a question: its step in the lesson (or its kind in Practice); the question itself is the bold line.
const CAT = {vl:"Recognize", vm:"Recognize", ve:"Recognize", listen:"Recognize", sp:"Recall", wg:"Recall", gap:"Grammar", pick:"Grammar", dlg:"Grammar",
  cj:"Verbs", as:"Grammar", tiles:"Sentences", wt:"Sentences", say:"Sentences", shadow:"Sentences", tone:"Tones", tpat:"Tones",
  letter:"Hangul", trio:"Hangul", read:"Hangul", sound:"Hangul", km:"Characters", kh:"Characters", card:"Cards"};
const catOf = it => it.rev ? "Review" : CAT[it.t] || "";
// Distractor vocab: same level first, never near-synonyms (avoid) or identical text/English.
function vocabOptions(v, n){
  if(v.ev) return evOptions(v, n);
  const l=LV[v.lv], bad=new Set([v.i, ...(v.avoid||[])]); l.vocab.forEach((x,j)=>{ if((x.avoid||[]).includes(v.i)) bad.add(j); });
  const ok = x => x.id!==v.id && x.en.toLowerCase()!==v.en.toLowerCase() && x.t.s!==v.t.s;
  const pool=l.vocab.filter((x,j)=>!bad.has(j) && ok(x));
  let pick=shuffle(pool.filter(x=>x.topic===v.topic)).slice(0,2).concat(shuffle(pool.filter(x=>x.topic!==v.topic))).slice(0,n-1);
  if(pick.length<n-1) pick=pick.concat(shuffle(LEVELS.flatMap(L=>L.vocab).filter(x=>ok(x) && !pick.includes(x))).slice(0,n-1-pick.length));
  return shuffle([v,...pick]);
}
// Distractors never share a content word of the English gloss (no near-synonyms); same part of speech first; seeded.
const GSTOP = new Set("the and for with something someone polite casual formal very about from this that one thing also used".split(" "));
const gloss = en => new Set(String(en).toLowerCase().replace(/\([^)]*\)/g," ").split(/[^a-z']+/).filter(x=>x.length>2 && !GSTOP.has(x)));
const unlikeOf = v => { const mine=gloss(v.en), en=v.en.toLowerCase(); return x => x.id!==v.id && x.t.s!==v.t.s && x.en.toLowerCase()!==en && ![...gloss(x.en)].some(g=>mine.has(g)); };
function evOptions(v, n){

  const pick=sshuffle(words.filter(x=>x.pos===v.pos),r).slice(0,3).concat(sshuffle(words.filter(x=>x.pos!==v.pos),r));
  return shuffle([v,...pick.slice(0,n-1)]);
}
const isPred = v => !YUE && /다$/.test(v.t.s) && /verb|adjective/.test(v.pos||"");
function gapOptions(v, it, ans){
  const r=rng((v.set||v.lv)+"|"+it.id), ok=unlikeOf(v), last=cps(ans.s).pop(), n=cps(ans.s).length;
  let cands;
  if(!v.ev) cands=LEVELS.flatMap(l=>l.vocab).filter(x=>ok(x) && !/___|…|\//.test(x.t.s)).map(x=>({o:{s:x.t.s, r:x.t.r}, near:x.lv===v.lv}));
  else if(isPred(v)) cands=ESETS.flatMap(s=>s.words).filter(x=>ok(x) && isPred(x)).flatMap(x=>x.ex.filter(e=>e.g).map(e=>{ const s=cps(e.s).slice(e.g[0],e.g[1]).join(""); return {o:{s, r:e.g[4]}, near:cps(s).pop()===last}; }));
  else cands=ESETS.flatMap(s=>s.words).filter(x=>ok(x) && x.pos===v.pos).map(x=>({o:{s:x.t.s, r:x.t.r}, near:x.set===v.set}));
  const key=c=>(YUE && cps(c.o.s).length!==n ? 2 : 0)+(c.near?0:1);
  const out=[ans], have=new Set([ans.s]);
  for(const c of sshuffle(cands,r).sort((a,b)=>key(a)-key(b))){ if(out.length>=4) break; if(!have.has(c.o.s) && !c.o.s.includes(ans.s) && !ans.s.includes(c.o.s)){ have.add(c.o.s); out.push(c.o); } }
  return out;
}
function wgUnit(it){

  const q={s:ch.slice(0,g[0]).join("")+"___"+ch.slice(g[1]).join(""), r:g[2]<0?"":[...rt.slice(0,g[2]),"___",...rt.slice(g[3])].join(" ")};
  return {t:"gap", id:it.id, sk:it.sk, w:it.w, v:it.v, q, en:x.en, opts:gapOptions(v,it,ans), a:0, why:"", full:x};

const CJKRE=/[㐀-䶿一-鿿\u{20000}-\u{3FFFF}]/gu, NONWORD=/[^0-9A-Za-z㐀-䶿一-鿿\u{20000}-\u{3FFFF}]/gu, KO_PUNCT=/[?!,.…~"'“”‘’()]/g;
function wtUnit(it){

  if(YUE){ const s=cps(x.s.replace(NONWORD,"")); let o=0, so=0;
    a=v.tl[1].map(n=>{ const t=s.slice(o,o+n).join(""), c=(t.match(CJKRE)||[]).length, r=rt.slice(so,so+c).join(" "); o+=n; so+=c; return {s:t, r}; }); }

const TONE_NAME = {1:"high flat",2:"rises high",3:"middle flat",4:"lowest, falls",5:"rises a little",6:"low flat"};
const NEAR = {1:[3,2],2:[5,1],3:[6,1,2],4:[6,5],5:[2,6],6:[3,4]};
function patOptions(pat){
  const t=pat.split(" ").map(Number), set=new Set([pat]), cands=[];
  t.forEach((x,i)=>NEAR[x].forEach(y=>{ const c=t.slice(); c[i]=y; cands.push(c.join(" ")); }));
  NEAR[t[0]].forEach(a=>NEAR[t[1]].forEach(b=>cands.push(a+" "+b)));
  for(const c of shuffle(cands)){ if(set.size>=4) break; set.add(c); }
  return shuffle([...set]);
}

function weightedPick(pool, n){
  const d=today();
  const w=pool.map(i=>{ const r=LR.srs[i.id]; if(!r) return 3; if(r[0]===0) return 4; if(r[1]<=d) return 3; return 1+2*(1-r[3]/Math.max(1,r[2])); });
  const out=[], idx=pool.map((_,i)=>i);
  while(out.length<n && idx.length){ const tot=idx.reduce((a,i)=>a+w[i],0); let r=Math.random()*tot, k=0; for(;k<idx.length;k++){ r-=w[idx[k]]; if(r<=0) break; } k=Math.min(k,idx.length-1); out.push(pool[idx[k]]); idx.splice(k,1); }
  return out;
}

/* A mic button: tap to record (the mic starts inside the tap, for iOS), tap again (or pause) to stop, then the transcript

   Taps while the mic is starting are ignored; once the button leaves the page the recording is dropped. */
function micButton(b, o){
  const alive=()=>b.isConnected, wrap=b.closest(".micwrap");
  const st=s=>{ if(!alive()) return; b.classList.toggle("live",s==="rec"); if(wrap) wrap.classList.toggle("live",s==="rec"); b.disabled=s==="busy"; b.setAttribute("aria-label", s==="rec"?"Stop recording":"Speak"); o.onState(s); };
  let busy=false;
  b.onclick=async()=>{
    if(REC){ REC.stop(); return; }
    if(busy) return; busy=true;
    try{
      stopAudio();
      const rec=await VOICE.mic.start({});
      if(!alive()) return rec.cancel();
      REC=rec; st("rec");
      const blob=await rec.done;
      if(REC===rec) REC=null;
      if(!blob || !alive()) return st("idle");
      st("busy");
      const text=(await VOICE.listen(blob)).text.trim();

}

function aiError(e){
  const code=e&&e.code;
  if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled") return (e&&e.message&&window.SH_HOSTED)?e.message:"AI isn't available on this page. The rest of the course works without it.";
  if(code==="rate_limited") return (e&&e.message)||"Too many requests right now. Try again in a little while.";
  if(code==="session_expired") return "You were signed out. Reload the page to sign in again.";
  if(code==="invalid_json"||code==="empty_completion") return "The reply came back in an unexpected form. Try again.";
  if(code==="cancelled") return "";
  return ((e&&e.message)||"Something went wrong.")+" Try again.";
}
const LEARNER = YUE ? "an American adult learning colloquial Hong Kong Cantonese from scratch" : "an American adult learning Korean from scratch";

const livePlay = s => playBtn(s,"",C.voice2).replace("<button","<button data-live=\"1\"");

function transcript(){ return talk.lines.map(x=>x.who==="them"?`OTHER PERSON: ${x.t.s}`:`LEARNER: ${x.text}`).join("\n"); }
const T_ = (s,r) => ({s:String(s||""), r:String(r||"")});
async function sendTalk(){
  const t=talk; if(t.busy) return; const inp=$("msg"), text=inp.value.trim(); if(!text) return;
  const sample=await getSample(); if(!sample){ $("talkstatus").textContent="AI isn't available here."; return; }
  t.lines.push({who:"me", text}); inp.value=""; drawChat();
  t.busy=true; $("send").disabled=true; $("stop").hidden=false; $("talkstatus").textContent="Thinking…";
  const r=t.r, l=t.l;
  const prompt=`You are a role-play partner for ${LEARNER}. They are a beginner.
Course level ${l.n} "${l.title}". What they have studied so far:
${levelScope(l)}
Scenario shown to the learner: ${r.setup}
Your character: ${r.persona}
Learner's goals: ${r.goals.map((g,i)=>i+": "+g).join(" | ")}${steerText()}

Rules:
- ${RULES}
- Stay in character. Reply in 1–2 short, simple sentences using mostly vocabulary from the levels above.
- The learner may write in ${YUE?"Chinese characters, Jyutping (tone numbers optional) or English":"Hangul, romanization or English"}. If they wrote English or romanization, show them how to say it in "corrected".
- Evaluate ONLY the learner's last message. If it has an error (grammar, word choice, particle, tone, politeness) or isn't in ${C.name}, set ok=false and give "corrected" (the natural ${C.name} version of their whole message) with "corrected_rom", and "note" = one short English sentence naming the main fix. If it is correct, ok=true and corrected="".
- "goals_done": indices of goals now accomplished.
- "errs": for each distinct error, {"skill": one of ${Object.keys(SKILLS).join(", ")}, "said":"their words","fix":"corrected words","why":"a few English words"}. Empty if none.

Conversation so far:
${transcript()}

Reply with only JSON: {"reply":"…","reply_rom":"…","reply_en":"…","ok":true,"corrected":"","corrected_rom":"","note":"","goals_done":[0],"errs":[]}`;
  t.ctl=new AbortController();
  try{
    const o=await sample.json(prompt,{signal:t.ctl.signal, cache:false, modelTier:"default", effort:"low"});
    const last=t.lines[t.lines.length-1];
    last.fb={ok:!!o.ok, c:o.corrected?T_(o.corrected,o.corrected_rom):null, note:String(o.note||"")};
    (Array.isArray(o.goals_done)?o.goals_done:[]).forEach(i=>{ if(Number.isInteger(+i)&&+i>=0&&+i<r.goals.length) t.done.add(+i); });
    if(!o.ok && Array.isArray(o.errs) && o.errs.length) logTalk(o.errs.slice(0,3));
    if(o.reply) t.lines.push({who:"them", t:T_(o.reply,o.reply_rom), en:String(o.reply_en||"")});
    if(t.limit && t.lines.filter(x=>x.who==="me").length>=t.limit) renderTalk(); else { $("talkstatus").textContent=""; drawChat(); document.querySelectorAll("#goals li").forEach((li,i)=>li.classList.toggle("done",t.done.has(i))); }
    if(o.reply && (S.auto || t.voice)) speak(String(o.reply),{voice:C.voice2});
  }catch(e){ const st=$("talkstatus"); if(st) st.textContent=aiError(e); }  // the chat may have been left meanwhile
  finally{ t.busy=false; if($("send")){ $("send").disabled=false; $("stop").hidden=true; $("msg").focus({preventScroll:true}); } }
}

async function genPractice(skill, btn){
  const sample=await getSample(); if(!sample){ btn.textContent="AI isn't available here"; return; }
  const ex=LR.log.filter(e=>!e.ok && e.y && (itemOf(e.id)||{sk:[]}).sk.includes(skill)).slice(-4);
  const old=btn.textContent; btn.disabled=true; btn.textContent="Writing questions…";
  const prompt=`Write 8 multiple-choice practice questions for ${LEARNER}. Focus: ${skName(skill)}.
${ex.length?"Their recent mistakes:\n"+ex.map(e=>`- "${e.q}": they chose "${e.y}", correct "${e.r}"`).join("\n"):""}
Use only what they have studied:
${levelScope(curLevel())}
${RULES}
Each question is a ${C.name} sentence with ONE blank (___) and 4 options; exactly one option is correct and the others are clearly wrong to a native speaker.
Reply with only a JSON array of 8 objects: {"q":"sentence with ___","q_rom":"romanization with ___","en":"English of the full sentence","opts":[{"t":"…","rom":"…"}],"a":<index>,"why":"one-sentence rule"}`;
  try{
    const arr=await sample.json(prompt,{cache:false, modelTier:"default", effort:"low"});
    const units=(Array.isArray(arr)?arr:[]).map((x,i)=>{
      if(!x || typeof x.q!=="string" || !x.q.includes("___") || !Array.isArray(x.opts) || x.opts.length!==4 || !Number.isInteger(x.a) || x.a<0 || x.a>3) return null;
      const opts=x.opts.map(o=>T_(o&&o.t,o&&o.rom)); if(opts.some(o=>!o.s) || new Set(opts.map(o=>o.s)).size!==4) return null;
      const full=T_(x.q.replace("___",opts[x.a].s), String(x.q_rom||"").replace("___",opts[x.a].r));
      return {t:"gap", id:"ai:"+Date.now()+":"+i, q:T_(x.q, x.q_rom), en:String(x.en||""), opts, a:x.a, why:String(x.why||""), full, sk:[skill]};
    }).filter(Boolean);
    if(!units.length){ btn.textContent="Couldn't use the reply. Try again"; return; }
    launch({kind:"practice", title:"AI practice", units, noRecord:true, back:{name:"weak", tab:"practice"}, onEnd:endPractice});
  }catch(e){ btn.textContent=aiError(e)||old; } finally{ btn.disabled=false; }
}

  if((e.key==="p"||e.key==="P") && lastSay){ e.preventDefault(); speak(lastSay.text, lastSay.o); return; }
  if(view.name!=="run") return;
  if(/^[1-6]$/.test(e.key)){ const b=[...document.querySelectorAll("#ex .sh-opt:not(:disabled)")][+e.key-1]; if(b){ e.preventDefault(); b.click(); } }
  else if((e.key==="Enter"||e.key===" ") && !e.target.closest("button,a,summary")){ const b=$("next")||$("show"); if(b){ e.preventDefault(); b.click(); } }
});

/* ---------------- back up / move progress ---------------- */
function exportAll(){ const docs={}; DOCS.forEach(n=>docs[n]=docBody(n)); return JSON.stringify({app:"studyhall-"+C.course, v:1, at:Date.now(), docs}); }
function importAll(text){
  const o=JSON.parse(String(text).trim()); if(!o || o.app!=="studyhall-"+C.course || !o.docs) throw new Error("bad");
  let n=0; for(const k of DOCS){ if(o.docs[k]){ mergeLR(k,o.docs[k]); dirtyDocs.add(k); n++; } }
  store.set("progress",P); store.set("learner",LR); sync(); return n;
}

/* ---------------- start ---------------- */
const vocabReady = VOCAB.data ? Promise.resolve(VOCAB.data) : fetch(VOCAB.url).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
vocabReady.then(d=>{ addEveryday(d); syncSoon(2000); }).catch(()=>{ EV="failed"; }).then(()=>{ if(view.name!=="run" && view.name!=="talk") render(); });
function begin(){
  if(!P.placed && hasProgress()){ P.placed={at:today(), how:"carried"}; saveP(); }  // progress from the old pages: no placement
  if(P.placed) go({name:"learn"}); else firstVisit();
}
(async()=>{
  getSample();
  const linked=connect(); let late=false;
  await Promise.race([linked, new Promise(r=>setTimeout(()=>{ late=true; r(); },4000))]);  // an account copy decides whether this is a first visit
  begin();
  const have=await linked;  // an account that answered late can still show this isn't a first visit
  if(late && have && have.size && view.name==="place" && !view.retake && (P.placed || hasProgress())) begin();
})();
</script>
