<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korean</title>
<meta name="theme-color" content="#F2F3FB">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Noto+Sans+KR:wght@400;500;700&display=swap">

<style>
/* Cantonese and Korean, one engine. Learn = the path of units and lessons; Practice = reviews, skills, drills, cards,
   conversations; Settings. Colors, type and components come from shared/ui.css; this sheet adds only what the
   languages need: target-language text, tone contours, tiles, dialogue lines and the pronunciation guide. */
:root{--tg:var(--font-kr)}
main{flex:1;display:flex;flex-direction:column;gap:18px;min-width:0}
.sh-wrap{overflow-x:clip}  /* the slide-in between questions never widens the page */
h2.sect{font-size:19px;margin-top:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0;border:0;background:none;color:var(--ink-2);font:700 17px var(--font);text-decoration:none;cursor:pointer}
.back svg,.x svg{stroke-width:2.5}
.back svg{width:20px;height:20px}
.hero{display:flex;align-items:center;gap:16px}
.hero h1 .nat{font-family:var(--tg);font-weight:700;color:var(--accent-ink);margin-left:.25em;font-size:.8em}
.sub{font-size:15px;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.sh-tile .tx2{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sh-tile .t{font-weight:800}
.sh-tile .d{color:var(--ink-2);font-size:15px}
#pRev .sh-icon{flex:none}
.idle{display:flex;align-items:center;gap:14px;padding:14px;border:var(--bw) dashed var(--border);border-radius:20px;color:var(--ink-2)}
.idle .sh-icon{flex:none}
.idle>span{display:flex;flex-direction:column;gap:2px}
details.more>.stack{margin-top:16px}
details.more h2{display:inline}
.sh-tile:disabled{cursor:default;opacity:.6}
.sh-opt.pick{background:var(--accent-soft)}
.linkbtn{font:inherit;font-weight:700;color:var(--accent-ink);background:none;border:0;padding:0;min-height:44px;cursor:pointer;text-decoration:underline}
.astatus{border-radius:14px;padding:10px 14px;font-size:15px;background:var(--gold);color:var(--on-gold)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
label.c{display:flex;gap:10px;align-items:center;min-height:44px}
label.sh-voice{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
#s-picker{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#s-picker label{align-self:stretch}
.sh-voice-note{font-size:15px;color:var(--ink-2)}
/* target-language text */
.tx{display:inline-flex;flex-direction:column;gap:2px;vertical-align:top;min-width:0}
.tg{font-family:var(--tg);font-weight:500;overflow-wrap:anywhere}
.rom{font-size:.8em;font-weight:600;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:0 8px;align-items:flex-end}
.said{font-size:.8em;color:var(--ink-2)} .said .tg{font-weight:400}
.syl{display:inline-flex;align-items:flex-end;gap:1px;white-space:nowrap}
.syl sup{font-size:.72em;color:var(--accent-ink);font-weight:800;align-self:flex-start;line-height:1}
.syl svg{width:.9em;height:.75em;margin-bottom:.15em;flex:none}
svg line.st{stroke:var(--surface-2)} svg path.ct{stroke:var(--accent);fill:none}
.big .tg{font-size:clamp(40px,12vw,56px);font-weight:700;line-height:1.15} .big .rom{font-size:19px}
.mid .tg{font-size:28px;line-height:1.25} .mid .rom{font-size:16px}
.huge .tg{font-size:clamp(72px,24vw,104px);line-height:1.05}
.inl{display:inline;font-family:var(--tg)} .inl .r{font-size:.85em;color:var(--ink-2);margin-left:3px}
/* audio */
.play{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;min-width:36px;min-height:36px;padding:0 10px;border:var(--bw) solid var(--border);border-radius:999px;background:var(--surface);color:var(--accent-ink);font:700 15px var(--font);cursor:pointer;vertical-align:middle;white-space:nowrap}
.play::after{content:"";position:absolute;inset:-5px}
.play svg{width:15px;height:15px;margin:0 -1.5px}  /* the shared play glyph, drawn at the size the old 12px one had */
.listen{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.listen .sh-play{font:800 24px var(--font)}
.slow{min-height:44px}
/* question screen */
.qtop{display:flex;align-items:center;gap:12px}
.qtop .sh-progress{flex:1}
.x{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;margin-left:-10px;border:0;border-radius:12px;background:transparent;color:var(--ink-2);cursor:pointer}
.x svg{width:24px;height:24px}
.q{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.kind{font-size:15px;font-weight:700;color:var(--ink-2)}
.q>.sh-tag{align-self:flex-start}
.prompt{font-size:26px;font-weight:800;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.qen{font-size:17px;color:var(--ink-2)}
.gap{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--ink);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:0 4px}
.opts{display:flex;flex-direction:column;gap:14px}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.tones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opts.tones .sh-opt{flex-direction:column;justify-content:center;gap:2px;padding:10px 6px;text-align:center}
.sh-opt .tg{font-size:22px}
.sh-opt .n{font-size:24px;font-weight:800;color:var(--accent-ink)}
.sh-opt>svg{width:48px;height:30px;flex:none}
.sh-opt .sub{font-size:13px}
.pat{display:inline-flex;align-items:center;gap:4px}
.pat svg{width:36px;height:24px}
.built{min-height:64px;border-bottom:3px solid var(--surface-2);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.tile{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;min-height:52px;padding:6px 12px;border:var(--bw) solid var(--border);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .08s ease,box-shadow .08s ease}
.tile:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
.tile .tg{font-size:22px} .tile .rom{font-size:12px}
.tile.used{visibility:hidden}
.tile:disabled{cursor:default}
.ans{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ans>.tx{flex:1 1 200px}
.sh-seg>button.len{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 6px}
.sh-seg>button.len span{font-weight:500;font-size:14px}
.sh-tile[id^="talk-"] .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.why{color:inherit;font-size:16px}
.sh-sheet .exs{font-size:15px}
.wordhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordhead .tx{flex:1}
.exs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.exs li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:var(--bw) solid var(--border);border-radius:16px}
.exs li>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.exs .tg{font-size:19px}
.exs .en{font-size:15px}
.cta{position:sticky;bottom:0;z-index:5;display:flex;flex-direction:column;gap:12px;margin:auto calc(-1*var(--gx,20px)) calc(-1*var(--gb,0px));padding:12px var(--gx,20px) max(16px,env(safe-area-inset-bottom));background:var(--bg)}
.dl{display:flex;flex-direction:column;gap:10px}
.line{max-width:92%;border-radius:16px;padding:10px 14px;background:var(--surface);border:var(--bw) solid var(--border);display:flex;flex-direction:column;gap:4px}
.line .who{font-size:13px;font-weight:800;color:var(--ink-2)}
.line .en{color:var(--ink-2);font-size:15px}
.line.me{align-self:flex-end;background:var(--accent-soft)}
.line .row{flex-wrap:nowrap;align-items:flex-start}
.corr{font-size:15px;border-left:4px solid var(--gold);padding:4px 12px;align-self:flex-end;max-width:92%;display:flex;flex-direction:column;gap:4px}
.corr.good{border-color:var(--good)}
.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.answer input{flex:1 1 200px;min-width:0;font-family:var(--tg)}
.mic-sm{width:56px;height:56px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:var(--bw) solid var(--border);background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm);cursor:pointer}
.mic-sm svg{width:26px;height:26px;stroke-width:2.2}
.mic-sm.live{background:var(--ink);color:var(--bg)}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.micwrap .sh-bars{visibility:hidden}
.micwrap.live .sh-bars{visibility:visible}
.heard{font-family:var(--tg)}
mark.dmiss{background:var(--bad-soft);color:inherit;border-radius:4px;padding:0 2px;outline:2px solid var(--bad)}
mark.dextra{background:var(--gold);color:var(--on-gold);border-radius:4px;padding:0 2px;text-decoration:line-through}
.btns{display:flex;gap:12px}
.btns>.sh-btn{flex:1}
.goals{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.goals li{display:flex;gap:10px;align-items:baseline}
.goals li::before{content:"";width:14px;height:14px;border:var(--bw) solid var(--border);border-radius:4px;flex:none;transform:translateY(2px)}
.goals li.done::before{background:var(--good)}
.chat{display:flex;flex-direction:column;gap:10px}
.grades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.miss{border-top:var(--bw) solid var(--surface-2);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.miss:first-child{border-top:0;padding-top:0}
/* path */
.cont{gap:12px}
.cont .sh-label{display:block}
.cont h2{font-size:21px}
.sh-path-body .ut{display:flex;flex-direction:column;gap:2px;text-align:left;min-height:44px;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.sh-path-body .ut b{font-size:17px;font-weight:800}
.sh-path-body .ut span{font-size:14px;color:var(--ink-2)}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;text-align:left;border:var(--bw) solid var(--border);border-radius:14px;background:var(--surface);color:var(--ink);font:700 15px/1.3 var(--font);cursor:pointer}
.lesson .ck{flex:none;width:24px;height:24px;border-radius:50%;border:var(--bw) solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--surface)}
.lesson.done .ck{background:var(--good);color:var(--on-good)}
.lesson.next{background:var(--accent-soft);box-shadow:var(--shadow-sm)}
.lesson:disabled{cursor:default;color:var(--ink-2)}
.lesson span:last-child{flex:1;min-width:0;overflow-wrap:anywhere}
.ck svg{width:14px;height:14px;stroke-width:3}
.sh-node svg{width:22px;height:22px;stroke-width:3}
/* reference lists */
.words{list-style:none;margin:0;padding:0}
.words li{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.words li+li{border-top:1px solid var(--surface-2)}
.words li>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.words .tg{font-size:20px}
.words .exs{margin-top:6px}
.gram{display:flex;flex-direction:column;gap:8px}
.gram+.gram{border-top:var(--bw) solid var(--surface-2);padding-top:14px}
.tonechart{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tonechart>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:var(--bw) solid var(--border);border-radius:14px;background:var(--surface);text-align:center}
.tonechart b{font-size:22px;color:var(--accent-ink)} .tonechart svg{width:48px;height:30px} .tonechart span{font-size:13px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .play{min-height:44px;padding:0 12px}
.chips .play .tg{font-size:19px;color:var(--ink)}
.chips .play .r{color:var(--ink-2);font-weight:600}
.lt{font-size:30px;font-family:var(--tg)}
/* tables in weak spots */
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:8px 4px;border-bottom:1px solid var(--surface-2);vertical-align:middle}
td.num{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
/* pronunciation guide (from the original flashcard pages) */
.guide{display:flex;flex-direction:column;gap:18px}
.guide section{background:var(--surface);border:var(--bw) solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.guide h2{font-size:20px}
.guide ol,.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.guide .cjk{font-family:var(--tg);font-size:1.08em}
.guide code{font-weight:800;color:var(--accent-ink)}
.guide .tblwrap{overflow-x:auto;border:var(--bw) solid var(--border);border-radius:14px}
.guide table{min-width:420px}
.guide th,.guide td{text-align:left;padding:8px 10px}
.guide th{font-size:14px;color:var(--ink-2);background:var(--surface-2)}
.guide td.k{font-weight:800;color:var(--accent-ink);white-space:nowrap}
.guide td.h{font-family:var(--tg);font-size:1.3rem}
.guide .callout{border-left:4px solid var(--accent);padding:4px 0 4px 12px}
button.say{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:2px 12px 2px 10px;border:var(--bw) solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);font:600 15px var(--font);cursor:pointer;white-space:nowrap;vertical-align:middle}
button.say svg{width:14px;height:14px;margin:0 -1.5px;color:var(--accent)}
button.say .r{color:var(--ink-2)}
.guide .tones{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.guide .tone{border:var(--bw) solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.guide .tone .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.guide .tone .n{font-size:26px;font-weight:800;color:var(--accent-ink);line-height:1}
.guide .tone svg{width:72px;height:44px;flex:none}
.guide .blocks{display:flex;flex-wrap:wrap;gap:10px}
.guide .block{border:var(--bw) solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:110px}
.guide .block .tgs{font-family:var(--tg);font-size:2.4rem;line-height:1.1}
.guide .block .parts{font-family:var(--tg);color:var(--ink-2)}
:is(.play,.tile,.lesson,.linkbtn,button.say,.mic-sm,.x,.back,.ut,summary):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (max-width:380px){.prompt{font-size:23px}.opts.tones{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<script>
"use strict";
const C = {"course": "korean", "lang": "ko", "name": "Korean", "native": "한국어", "htmlLang": "ko", "voice": "ko-KR-SunHi:DragonHDLatestNeural", "voice2": "ko-KR-Hyunsu:DragonHDLatestNeural", "romName": "romanization", "ttsLang": "ko-KR", "voiceRe": "^ko", "voiceNameRe": "korean|한국", "talkOpen": {"s": "안녕하세요!", "r": "annyeonghaseyo"}, "chars": false, "formSkill": {"title": "Verbs", "sub": "Verb endings ({forms}) on the verbs you know, and the levels' grammar"}, "soundAsk": "Can you read Hangul, the Korean alphabet?", "soundCheck": ["H1", "H3"], "forms": [{"k": "present", "label": "Present", "hint": "-아요 / -어요"}, {"k": "neg", "label": "Not", "hint": "안 + verb"}, {"k": "please", "label": "Please do", "hint": "-(으)세요"}, {"k": "want", "label": "Want to", "hint": "-고 싶어요"}, {"k": "past", "label": "Past", "hint": "-았어요 / -었어요"}, {"k": "future", "label": "Future", "hint": "-(으)ㄹ 거예요"}], "audioBase": "https://wbrssohmepioxapwbcne.supabase.co/storage/v1/object/public/audio/korean/"};
const D = {"levels":[{"id":"L1","n":1,"title":"First words","goal":"Greet people, say thank you, sorry and goodbye, ask people to repeat or slow down, and count to ten thousand.","notes":[{"h":"Two ways to say thank you and sorry","p":"{{{\"s\": \"감사합니다\", \"r\": \"gamsahamnida\", \"p\": \"감사함니다\"}}} and {{{\"s\": \"죄송합니다\", \"r\": \"joesonghamnida\", \"p\": \"죄송함니다\"}}} are the formal versions: the safe choice with strangers, staff and older people. {{{\"s\": \"고마워요\", \"r\": \"gomawoyo\"}}} and {{{\"s\": \"미안해요\", \"r\": \"mianhaeyo\"}}} are softer and friendlier but still polite. When in doubt, use the formal ones.","ex":[[{"s":"감사합니다","r":"gamsahamnida","p":"감사함니다"},"Thank you (formal)."],[{"s":"고마워요","r":"gomawoyo"},"Thanks (softer)."],[{"s":"죄송합니다","r":"joesonghamnida","p":"죄송함니다"},"I'm sorry (formal)."],[{"s":"미안해요","r":"mianhaeyo"},"Sorry (everyday)."]]},{"h":"Goodbye depends on who is leaving","p":"Korean has two goodbyes. If the other person is leaving, say {{{\"s\": \"안녕히 가세요\", \"r\": \"annyeonghi gaseyo\"}}} (go in peace). If you are leaving and they stay, say {{{\"s\": \"안녕히 계세요\", \"r\": \"annyeonghi gyeseyo\"}}} (stay in peace). If you both walk off in different directions, use {{{\"s\": \"안녕히 가세요\", \"r\": \"annyeonghi gaseyo\"}}}.","ex":[[{"s":"안녕히 가세요","r":"annyeonghi gaseyo"},"Goodbye (to someone who is leaving)."],[{"s":"안녕히 계세요","r":"annyeonghi gyeseyo"},"Goodbye (when you leave and they stay)."]]},{"h":"Two sets of numbers","p":"Korean has two number systems. Native Korean numbers ({{{\"s\": \"하나\", \"r\": \"hana\"}}}, {{{\"s\": \"둘\", \"r\": \"dul\"}}}, {{{\"s\": \"셋\", \"r\": \"set\", \"p\": \"섿\"}}} … {{{\"s\": \"열\", \"r\": \"yeol\"}}}) are for counting things and people. Sino-Korean numbers ({{{\"s\": \"일\", \"r\": \"il\"}}}, {{{\"s\": \"이\", \"r\": \"i\"}}}, {{{\"s\": \"삼\", \"r\": \"sam\"}}} …) are for money, prices, dates and phone numbers, and they build like a calculator: {{{\"s\": \"십오\", \"r\": \"sibo\", \"p\": \"시보\"}}} is 10 + 5 and {{{\"s\": \"이십\", \"r\": \"isip\"}}} is 2 × 10. Big numbers go in ten-thousands: {{{\"s\": \"만\", \"r\": \"man\"}}} is 10,000, so 15,000 is {{{\"s\": \"만 오천\", \"r\": \"man ocheon\"}}}. {{{\"s\": \"백\", \"r\": \"baek\"}}}, {{{\"s\": \"천\", \"r\": \"cheon\"}}} and {{{\"s\": \"만\", \"r\": \"man\"}}} need no 'one' in front. Never mix the two systems inside one number.","ex":[[{"s":"하나, 둘, 셋","r":"hana dul set","p":"하나 둘 섿"},"one, two, three (native)"],[{"s":"십오","r":"sibo","p":"시보"},"fifteen"],[{"s":"이만","r":"iman"},"twenty thousand"],[{"s":"만 오천","r":"man ocheon"},"fifteen thousand"]]},{"h":"Asking for things and favours","p":"{{{\"s\": \"주세요\", \"r\": \"juseyo\"}}} means 'please give me'. Put a thing in front of it to ask for it: {{{\"s\": \"이거 하나 주세요\", \"r\": \"igeo hana juseyo\"}}} (one of these, please). Put an action in front to ask for a favour: {{{\"s\": \"말해 주세요\", \"r\": \"malhae juseyo\"}}} (please say it), {{{\"s\": \"천천히 말해 주세요\", \"r\": \"cheoncheonhi malhae juseyo\"}}} (please speak slowly).","ex":[[{"s":"이거 하나 주세요","r":"igeo hana juseyo"},"One of these, please."],[{"s":"천천히 말해 주세요","r":"cheoncheonhi malhae juseyo"},"Please speak slowly."],[{"s":"다시 한 번 말해 주세요","r":"dasi han beon malhae juseyo"},"Please say that once more."]]},{"h":"Spelling versus sound","p":"Korean is not always said the way it is spelled, and the 'said like' line under each phrase shows the change. A final ㅂ before ㄴ is said as ㅁ, so {{{\"s\": \"감사합니다\", \"r\": \"gamsahamnida\", \"p\": \"감사함니다\"}}} sounds like {{{\"s\": \"감사함니다\", \"r\": \"gamsahamnida\"}}}. A final consonant slides onto a following vowel, so {{{\"s\": \"한국어\", \"r\": \"hangugeo\", \"p\": \"한구거\"}}} sounds like {{{\"s\": \"한구거\", \"r\": \"hangugeo\"}}}. In {{{\"s\": \"여덟\", \"r\": \"yeodeol\", \"p\": \"여덜\"}}} the final ㄹㅂ is said as just ㄹ.","ex":[[{"s":"감사합니다","r":"gamsahamnida","p":"감사함니다"},"Thank you."],[{"s":"한국어","r":"hangugeo","p":"한구거"},"Korean (the language)"],[{"s":"여덟","r":"yeodeol","p":"여덜"},"eight"]] oleplay":[{"title":"Hello and goodbye at a shop","setup":"You walk into a small corner shop in Seoul. Greet the owner, ask for something by pointing, and leave politely.","persona":"You are a friendly middle-aged shop owner in Seoul. Speak only very simple polite Korean from level 1: 어서 오세요, 안녕하세요, 이거요?, 네, 감사합니다, 괜찮아요, 안녕히 가세요, and numbers. The learner is a complete beginner. If they ask you to slow down or repeat, do it, slowly. When the learner leaves, say 감사합니다. 안녕히 가세요. and expect 안녕히 계세요 back; if they say 안녕히 가세요, gently model 안녕히 계세요.","opening":{"s":"어서 오세요!","r":"eoseo oseyo"},"opening_en":"Welcome!","goals":["Greet the owner","Point at something and ask for one","Ask the owner to speak slowly or say it again","Say thank you and the right goodbye as you leave"]},{"title":"Numbers with a friend","setup":"Your friend Junho helps you practise Korean numbers.","persona":"You are Junho, a patient Korean friend in his 30s. Help a complete beginner practise numbers using very simple polite Korean from level 1. Say a short run of numbers and let them say the next one, or ask them to count. Alternate native numbers (하나 to 열) and Sino-Korean numbers (일 to 십, then tens, 백, 천, 만, e.g. 만 오천). Keep praise short, correct gently, and slow down when asked.","opening":{"s":"안녕하세요! 하나, 둘…","r":"annyeonghaseyo hana dul"},"opening_en":"Hi! One, two…","goals":["Count from one to ten with native numbers","Count from one to ten with Sino-Korean numbers","Say a big number such as 15,000","Ask Junho to repeat or slow down"]}]},{"id":"L2","n":2,"title":"People","goal":"Introduce yourself and your family, say where you are from and what you do, and ask the same of others.","notes":[{"h":"I and my","p":"With people you don't know well, 'I' is {{{\"s\": \"저\", \"r\": \"jeo\"}}} and 'my' is {{{\"s\": \"제\", \"r\": \"je\"}}}: {{{\"s\": \"저는 의사예요\", \"r\": \"jeoneun uisayeyo\"}}} (I'm a doctor), {{{\"s\": \"제 이름\", \"r\": \"je ireum\"}}} (my name), {{{\"s\": \"제 아내\", \"r\": \"je anae\"}}} (my wife). The casual words {{{\"s\": \"나\", \"r\": \"na\"}}} and {{{\"s\": \"내\", \"r\": \"nae\"}}} are for close friends, so leave them for now.","ex":[[{"s":"저는 의사예요","r":"jeoneun uisayeyo"},"I'm a doctor."],[{"s":"제 이름은 댄이에요","r":"je ireumeun daenieyo","p":"제 이르믄 대니에요"},"My name is Dan."],[{"s":"제 아내예요","r":"je anaeyeyo"},"This is my wife."]]},{"h":"Am, is, are, and is not","p":"Add {{{\"s\": \"이에요\", \"r\": \"ieyo\"}}} or {{{\"s\": \"예요\", \"r\": \"yeyo\"}}} to a noun to say 'it is / I am'. After a final consonant use {{{\"s\": \"이에요\", \"r\": \"ieyo\"}}} ({{{\"s\": \"사람이에요\", \"r\": \"saramieyo\", \"p\": \"사라미에요\"}}}); after a vowel use {{{\"s\": \"예요\", \"r\": \"yeyo\"}}} ({{{\"s\": \"의사예요\", \"r\": \"uisayeyo\"}}}). For 'is not', the noun takes {{{\"s\": \"이\", \"r\": \"i\"}}} or {{{\"s\": \"가\", \"r\": \"ga\"}}} and then {{{\"s\": \"아니에요\", \"r\": \"anieyo\"}}}: {{{\"s\": \"학생이 아니에요\", \"r\": \"hakssaengi anieyo\", \"p\": \"학쌩이 아니에요\"}}}, {{{\"s\": \"의사가 아니에요\", \"r\": \"uisaga anieyo\"}}}. Same rule: {{{\"s\": \"이\", \"r\": \"i\"}}} after a consonant, {{{\"s\": \"가\", \"r\": \"ga\"}}} after a vowel.","ex":[[{"s":"저는 미국 사람이에요","r":"jeoneun miguk ssaramieyo","p":"저는 미국 싸라미에요"},"I'm American."],[{"s":"저는 의사예요","r":"jeoneun uisayeyo"},"I'm a doctor."],[{"s":"저는 학생이 아니에요","r":"jeoneun hakssaengi anieyo","p":"저는 학쌩이 아니에요"},"I'm not a student."],[{"s":"저는 의사가 아니에요","r":"jeoneun uisaga anieyo"},"I'm not a doctor."]]},{"h":"The topic marker","p":"{{{\"s\": \"은\", \"r\": \"eun\"}}} or {{{\"s\": \"는\", \"r\": \"neun\"}}} after a word marks what you are talking about, like 'as for …': {{{\"s\": \"저는\", \"r\": \"jeoneun\"}}} (as for me), {{{\"s\": \"제 이름은\", \"r\": \"je ireumeun\", \"p\": \"제 이르믄\"}}} (as for my name). Use {{{\"s\": \"은\", \"r\": \"eun\"}}} after a consonant and {{{\"s\": \"는\", \"r\": \"neun\"}}} after a vowel. Asking someone's name uses {{{\"s\": \"이\", \"r\": \"i\"}}} instead: {{{\"s\": \"이름이 뭐예요?\", \"r\": \"ireumi mwoyeyo\", \"p\": \"이르미 뭐예요\"}}}","ex":[[{"s":"저는 미국 사람이에요","r":"jeoneun miguk ssaramieyo","p":"저는 미국 싸라미에요"},"I'm American."],[{"s":"제 이름은 댄이에요","r":"je ireumeun daenieyo","p":"제 이르믄 대니에요"},"My name is Dan."],[{"s":"제 친구는 선생님이에요","r":"je chinguneun seonsaengnimieyo","p":"제 친구는 선생니미에요"},"My friend is a teacher."]]},{"h":"This, that, and that over there","p":"Korean has three pointing words. {{{\"s\": \"이\", \"r\": \"i\"}}} = this, near me. {{{\"s\": \"그\", \"r\": \"geu\"}}} = that, near you, or the one we just mentioned. {{{\"s\": \"저\", \"r\": \"jeo\"}}} = that over there, far from both of us. Put them before a noun ({{{\"s\": \"이 사람\", \"r\": \"i saram\"}}}, {{{\"s\": \"저 사람\", \"r\": \"jeo saram\"}}}) or use the 'thing' forms {{{\"s\": \"이거\", \"r\": \"igeo\"}}}, {{{\"s\": \"그거\", \"r\": \"geugeo\"}}}, {{{\"s\": \"저거\", \"r\": \"jeogeo\"}}}. Ask about things with {{{\"s\": \"뭐예요?\", \"r\": \"mwoyeyo\"}}} (what is it?) and about people with {{{\"s\": \"누구예요?\", \"r\": \"nuguyeyo\"}}} (who is it?). Careful: {{{\"s\": \"저\", \"r\": \"jeo\"}}} also means 'I'; the context tells you which.","ex":[[{"s":"이거 뭐예요?","r":"igeo mwoyeyo"},"What is this?"],[{"s":"그거 뭐예요?","r":"geugeo mwoyeyo"},"What is that (near you)?"],[{"s":"저 사람은 누구예요?","r":"jeo sarameun nuguyeyo","p":"저 사라믄 누구예요"},"Who is that person over there?"]]},{"h":"Sounds: linking and tensing","p":"When a syllable ends in a consonant and the next one starts with a vowel, the consonant slides over: {{{\"s\": \"사람이에요\", \"r\": \"saramieyo\", \"p\": \"사라미에요\"}}} sounds like {{{\"s\": \"사라미에요\", \"r\": \"saramieyo\"}}}, and {{{\"s\": \"이름은\", \"r\": \"ireumeun\", \"p\": \"이르믄\"}}} like {{{\"s\": \"이르믄\", \"r\": \"ireumeun\"}}}. After a final ㄱ sound, a following ㅅ is said tense, like ㅆ: {{{\"s\": \"한국 사람\", \"r\": \"hanguk ssaram\", \"p\": \"한국 싸람\"}}} sounds like {{{\"s\": \"한국 싸람\", \"r\": \"hanguk ssaram\"}}}. Watch the 'said like' line.","ex":[[{"s":"저는 미국 사람이에요","r":"jeoneun miguk ssaramieyo","p":"저는 미국 싸라미에요"},"I'm American."],[{"s":"제 이름은 댄이에요","r":"je ireumeun daenieyo","p":"제 이르믄 대니에요"},"My name is Dan."],[{"s":"한국 사람","r":"hanguk ssaram","p":"한국 싸람"},"a Korean"]]}],"vocab":[{"id":"L2-v-00","t":{"s":"저","r":"jeo"},"en":"I / me (polite)","topic":"People","note":"Use 저 with people you don't know well. 나 is casual.","avoid":[],"old":"d9caa03129"},{"id":"L2-v-01","t":{"s":"제 이름은 댄이에요","r":"je ireumeun daenieyo","p":"제 이르믄 대니에요"},"en":"My name is Dan","topic":"People","note":"제 = my (polite). 이에요 / 예요 = \"am / is\".","avoid":[],"old":"ddcf8f5b15"},{"id":"L2-v-02","t":{"s":"이름이 뭐예요?","r":"ireumi mwoyeyo","p":"이르미 뭐예요"},"en":"What's your name?","topic":"People","note":"","avoid":[],"old":"cfa3e137cc"},{"id":"L2-v-03","t":{"s":"만나서 반가워요","r":"mannaseo bangawoyo"},"en":"Nice to meet you","topic":"People","note":"","avoid":[26],"old":"5444e55a12"},{"id":"L2-v-04","t":{"s":"어디에서 왔어요?","r":"eodieseo wasseoyo","p":"어디에서 와써요"},"en":"Where are you from?","topic":"People","note":"","avoid":[],"old":"9ff1729a16"},{"id":"L2-v-05","t":{"s":"미국에서 왔어요","r":"migugeseo wasseoyo","p":"미구게서 와써요"},"en":"I'm from the US","topic":"People","note":"","avoid":[],"old":"1f8d8658d3"},{"id":"L2-v-06","t":{"s":"저는 미국 사람이에요","r":"jeoneun miguk ssaramieyo","p":"저는 미국 싸라미에요"},"en":"I'm American","topic":"People","note":"사람 = person.","avoid":[],"old":"985d598837"},{"id":"L2-v-07","t":{"s":"저는 의사예요","r":"jeoneun uisayeyo"},"en":"I'm a doctor","topic":"People","note":"","avoid":[],"old":"7434e24b20"},{"id":"L2-v-08","t":{"s":"시카고에 살아요","r":"sikagoe sarayo","p":"시카고에 사라요"},"en":"I live in Chicago","topic":"People","note":"에 = in / at.","avoid":[],"old":"196eaaf53f"},{"id":"L2-v-09","t":{"s":"잘 지내요?","r":"jal jinaeyo"},"en":"How are you doing?","topic":"People","note":"Literally \"are you living well?\"","avoid":[10],"old":"1beaed8cb7"},{"id":"L2-v-10","t":{"s":"잘 지내요","r":"jal jinaeyo"},"en":"I'm doing well","topic":"People","note":"Same words; your tone of voice makes it a statement.","avoid":[9],"old":"1eadbbae37"},{"id":"L2-v-11","t":{"s": "annyeonghi gyeseyo je anaeyeyo"}],"a":0,"why":"Greet with {{{\"s\": \"안녕하세요\", \"r\": \"annyeonghaseyo\"}}} and introduce her with {{{\"s\": \"제\", \"r\": \"je\"}}} (my): {{{\"s\": \"제 아내예요\", \"r\": \"je anaeyeyo\"}}}.","sk":["g:honor","s:phrase"]},{"who":"Mr Park","s":{"s":"아, 반가워요! 아내분은 한국 사람이에요?","r":"a bangawoyo anaebuneun hanguk ssaramieyo","p":"아 반가워요 아내부는 한국 싸라미에요"},"en":"Oh, nice to meet you! Is your wife Korean?"},{"you":true,"opts":[{"s":"아니요, 미국 사람이에요.","r":"aniyo miguk ssaramieyo","p":"아니요 미국 싸라미에요"},{"s":"아니요, 미국 사람예요.","r":"aniyo miguk ssaramyeyo","p":"아니요 미국 싸라몌요"},{"s":"아니요, 미국에서 사람이에요.","r":"aniyo migugeseo saramieyo","p":"아니요 미구게서 사라미에요"}],"a":0,"why":"{{{\"s\": \"사람\", \"r\": \"saram\"}}} ends in a consonant, so {{{\"s\": \"사람이에요\", \"r\": \"saramieyo\", \"p\": \"사라미에요\"}}}. Country + {{{\"s\": \"사람\", \"r\": \"saram\"}}} needs no particle in between.","sk":["g:endings"]},{"who":"Mr Park","s":{"s":"네, 만나서 반가워요!","r":"ne mannaseo bangawoyo"},"en":"Well, it's nice to meet you!"}],"k":[0,6,51,61,67,68,73],"u":3},{"id":"L2-dlg-03","t":"dlg","sk":["g:particles","g:question"],"title":"Who's that?","turns":[{"who":"Minji","s":{"s":"저 사람은 제 친구예요.","r":"jeo sarameun je chinguyeyo","p":"저 사라믄 제 친구예요"},"en":"That person over there is my friend."},{"you":true,"opts":[{"s":"아, 이름이 뭐예요?","r":"a ireumi mwoyeyo","p":"아 이르미 뭐예요"},{"s":"아, 이름을 뭐예요?","r":"a ireumeul mwoyeyo","p":"아 이르믈 뭐예요"},{"s":"아, 이름이 뭐이에요?","r":"a ireumi mwoieyo","p":"아 이르미 뭐이에요"}],"a":0,"why":"The set question is {{{\"s\": \"이름이 뭐예요?\", \"r\": \"ireumi mwoyeyo\", \"p\": \"이르미 뭐예요\"}}} {{{\"s\": \"뭐\", \"r\": \"mwo\"}}} ends in a vowel, so {{{\"s\": \"예요\", \"r\": \"yeyo\"}}}.","sk":["g:question","g:particles"]},{"who":"Minji","s":{"s":"준호예요. 한국 사람이에요.","r":"junhoyeyo hanguk ssaramieyo","p":"준호예요 한국 싸라미에요"},"en":"It's Junho. He's Korean."},{"you":true,"opts":[{"s":"준호 씨는 무슨 일 해요?","r":"junho ssineun museun nil haeyo","p":"준호 씨는 무슨 닐 해요"},{"s":"준호 씨를 무슨 일 해요?","r":"junho ssireul museun nil haeyo","p":"준호 씨를 무슨 닐 해요"},{"s":"준호 씨는 무슨 일이에요?","r":"junho ssineun museun nirieyo","p":"준호 씨는 무슨 니리에요"}],"a":0,"why":"{{{\"s\": \"준호 씨는\", \"r\": \"junho ssineun\"}}} = as for Junho. {{{\"s\": \"무슨 일이에요?\", \"r\": \"museun nirieyo\", \"p\": \"무슨 니리에요\"}}} means 'What's the matter?', not 'What's his job?'.","sk":["g:question","g:particles"]},{"who":"Minji","s":{"s":"회사원이에요.","r":"hoesawonieyo","p":"회사워니에요"},"en":"He's an office worker."}],"k":[50,59,65,72,73,76],"u":1},{"id":"L2-dlg-04","t":"dlg","sk":["g:endings","g:place","g:question"],"title":"What's this?","turns":[{"who":"Shop owner","s":{"s":"어서 오세요!","r":"eoseo oseyo"},"en":"Welcome! (You pick up a jar and want to know what is in it.)"},{"you":true,"opts":[{"s":"저기요, 이거 뭐예요?","r":"jeogiyo igeo mwoyeyo"},{"s":"저기요, 이거 누구예요?","r":"jeogiyo igeo nuguyeyo"},{"s":"저기요, 이거 뭐이에요?","r":"jeogiyo igeo mwoieyo"}],"a":0,"why":"Ask about things with {{{\"s\": \"뭐\", \"r\": \"mwo\"}}} (what); {{{\"s\": \"누구\", \"r\": \"nugu\"}}} is for people. {{{\"s\": \"뭐\", \"r\": \"mwo\"}}} ends in a vowel, so {{{\"s\": \"뭐예요\", \"r\": \"mwoyeyo\"}}}.","sk":["g:question","g:endings"]},{"who":"Shop owner","s":{"s":"그거요? 김치예요.","r":"geugeoyo gimchiyeyo"},"en":"That? It's kimchi."},{"you":true,"opts":[{"s":"아, 이거 김치예요?","r":"a igeo gimchiyeyo"},{"s":"아, 이거 김치이에요?","r":"a igeo gimchiieyo"},{"s":"아, 저거 김치예요?","r":"a jeogeo gimchiyeyo"}],"a":0,"why":"The jar is in your hand, so for you it is {{{\"s\": \"이거\", \"r\": \"igeo\"}}}, even though the owner calls it {{{\"s\": \"그거\", \"r\": \"geugeo\"}}}. {{{\"s\": \"김치\", \"r\": \"gimchi\"}}} ends in a vowel: {{{\"s\": \"예요\", \"r\": \"yeyo\"}}}.","sk":["g:place","g:endings"]},{"who":"Shop owner","s":{"s":"네, 한국 김치예요.","r":"ne hanguk kkimchiyeyo","p":"네 한국 낌치예요"},"en":"Yes, it's Korean kimchi."}],"k":[10,43,46,77,79],"u":4},{"id":"L2-dlg-05","t":"dlg","sk":["g:endings","g:honor","g:particles","s:phrase"],"title":"Catching up with Junho","turns":[{"who":"Junho","s":{"s":"댄 씨, 잘 지내요?","r":"daen ssi jal jinaeyo"},"en":"Dan, how are you doing?"},{"you":true,"opts":[{"s":"네, 잘 지내요.","r":"ne jal jinaeyo"},{"s":"네, 잘 지내세요.","r":"ne jal jinaeseyo"},{"s":"아니요, 잘 지내요.","r":"aniyo jal jinaeyo"}],"a":0,"why":"Talk about yourself without the respectful {{{\"s\": \"시\", \"r\": \"si\"}}}: {{{\"s\": \"잘 지내요\", \"r\": \"jal jinaeyo\"}}}. {{{\"s\": \"잘 지내세요\", \"r\": \"jal jinaeseyo\"}}} is respectful talk about someone else, or 'take care'.","sk":["g:honor","s:phrase"]},{"who":"Junho","s":{"s":"결혼했어요?","r":"gyeolhonhaesseoyo","p":"결혼해써요"},"en":"Are you married?"},{"you":true,"opts":[{"s":"네, 결혼했어요. 아내는 미국 사람이에요.","r":"ne gyeolhonhaesseoyo anaeneun miguk ssaramieyo","p":"네 결혼해써요 아내는 미국 싸라미에요"},{"s":"네, 결혼했어요. 아내는 미국 사람예요.","r":"ne gyeolhonhaesseoyo anaeneun miguk ssaramyeyo","p":"네 결혼해써요 아내는 미국 싸라몌요"},{"s":"네, 결혼했어요. 아내를 미국 사람이에요.","r":"ne gyeolhonhaesseoyo anaereul miguk ssaramieyo","p":"네 결혼해써요 아내를 미국 싸라미에요"}],"a":0,"why":"{{{\"s\": \"아내는\", \"r\": \"anaeneun\"}}} = as for my wife (topic {{{\"s\": \"는\", \"r\": \"neun\"}}}), and {{{\"s\": \"사람\", \"r\": \"saram\"}}} ends in a consonant, so {{{\"s\": \"사람이에요\", \"r\": \"saramieyo\", \"p\": \"사라미에요\"}}}.","sk":["g:endings","g:particles"]},{"who":"Junho","s":{"s":"와, 진짜요?","r":"wa jinjjayo"},"en":"Wow, really?"}],"k":[18,57,61,67,69,944]}],"roleplay":[{"title":"Meeting a new neighbour","setup":"A Korean woman has just moved in next door in your Chicago building. Introduce yourselves.","persona":"You are Kim Minji, a Korean office worker in her 30s from Seoul who has just moved to Chicago with her husband. Speak simple polite Korean using mostly words from levels 1-2 (저는 … 이에요/예요, 이름이 뭐예요?, 어디에서 왔어요?, 무슨 일 해요?, 결혼했어요?, 만나서 반가워요). Use short sentences and one question at a time. If the learner gets 이에요/예요 or 은/는 wrong, repeat their sentence back correctly in a friendly way.","opening":{"s":"안녕하세요. 처음 뵙겠습니다. 저는 김민지예요.","r":"annyeonghaseyo cheoeum boepkketsseumnida jeoneun gimminjiyeyo","p":"안녕하세요 처음 뵙껟씀니다 저는 김민지예요"},"opening_en":"Hello. How do you do? I'm Kim Minji.","goals":["Say hello and give your name","Say where you are from and that you live in Chicago","Say what you do for work","Ask her name, where she is from and what she does"]},{"title":"Introducing your family","setup":"You run into your Korean colleague Mr Park while you are out with your spouse. Introduce them and chat a little.","persona":"You are Park Junho, a friendly Korean colleague in his 40s. You are married to a teacher and have one child. Speak simple polite Korean from levels 1-2. Ask who the person with the learner is, ask about their family (아내, 남편, 아이), and answer questions about your own family. Use 이 사람, 저 사람 and 누구예요? naturally. Keep sentences very short.","opening":{"s":"안녕하세요! 이분은 누구세요?","r":"annyeonghaseyo ibuneun nuguseyo","p":"안녕하세요 이부는 누구세요"},"opening_en":"Hello! And who is this?","goals":["Introduce your spouse","Say your spouse's job and where they are from","Ask whether Mr Park is married and about his family","Say goodbye politely"]}]},{"id":"L3","n":3,"title":"Food and drink","goal":"Order food and drinks, count things and people, and say what you like to eat.","notes":[{"h":"Asking for things","p":"Say the thing first and put {{{\"s\": \"주세요\", \"r\": \"juseyo\"}}} (\"please give me\") last. Adding {{{\"s\": \"좀\", \"r\": \"jom\"}}} before {{{\"s\": \"주세요\", \"r\": \"juseyo\"}}} makes the request softer, like \"could I have some\". To ask for the bill, say {{{\"s\": \"계산해 주세요\", \"r\": \"gyesanhae juseyo\"}}}.","ex":[[{"s":"물 좀 주세요","r":"mul jom juseyo"},"Some water, please."],[{"s":"이거 주세요","r":"igeo juseyo"},"This one, please."],[{"s":"메뉴 좀 주세요","r":"menyu jom juseyo"},"The menu, please."]]},{"h":"Counting with native numbers","p":"To count, say the thing, then a native Korean number, then a counter word: {{{\"s\": \"커피 두 잔\", \"r\": \"keopi du jan\"}}} is \"coffee, two, cups\". Right before a counter, four numbers get shorter: {{{\"s\": \"하나\", \"r\": \"hana\"}}} becomes {{{\"s\": \"한\", \"r\": \"han\"}}}, {{{\"s\": \"둘\", \"r\": \"dul\"}}} becomes {{{\"s\": \"두\", \"r\": \"du\"}}}, {{{\"s\": \"셋\", \"r\": \"set\", \"p\": \"섿\"}}} becomes {{{\"s\": \"세\", \"r\": \"se\"}}}, {{{\"s\": \"넷\", \"r\": \"net\", \"p\": \"넫\"}}} becomes {{{\"s\": \"네\", \"r\": \"ne\"}}}. Common counters: {{{\"s\": \"개\", \"r\": \"gae\"}}} for things, {{{\"s\": \"명\", \"r\": \"myeong\"}}} for people, {{{\"s\": \"잔\", \"r\": \"jan\"}}} for cups and glasses, {{{\"s\": \"병\", \"r\": \"byeong\"}}} for bottles. Sino-Korean numbers never go here: {{{\"s\": \"삼 잔\", \"r\": \"sam jan\"}}} is wrong. Staff ask how many you are with the respectful {{{\"s\": \"몇 분이세요?\", \"r\": \"myeot ppuniseyo\", \"p\": \"멷 뿌니세요\"}}}, but you answer about yourselves with {{{\"s\": \"명\", \"r\": \"myeong\"}}}.","ex":[[{"s":"커피 두 잔 주세요","r":"keopi du jan juseyo"},"Two coffees, please."],[{"s":"맥주 세 병 주세요","r":"maekjju se byeong juseyo","p":"맥쭈 세 병 주세요"},"Three bottles of beer, please."],[{"s":"두 명이에요","r":"du myeongieyo"},"There are two of us."],[{"s":"이거 한 개 주세요","r":"igeo han gae juseyo"},"One of these, please."]]},{"h":"Eating, drinking and \"I'll have\"","p":"The thing you eat or drink is marked with {{{\"s\": \"을\", \"r\": \"eul\"}}} after a consonant and {{{\"s\": \"를\", \"r\": \"reul\"}}} after a vowel: {{{\"s\": \"밥을\", \"r\": \"babeul\", \"p\": \"바블\"}}}, {{{\"s\": \"커피를\", \"r\": \"keopireul\"}}}. In casual speech it is often dropped, but never swap the two. Polite verbs end in {{{\"s\": \"요\", \"r\": \"yo\"}}}: {{{\"s\": \"먹어요\", \"r\": \"meogeoyo\", \"p\": \"머거요\"}}} (eat), {{{\"s\": \"마셔요\", \"r\": \"masyeoyo\"}}} (drink). To say what you'll have, or to ask what someone would like, add {{{\"s\": \"-ㄹ래요\", \"r\": \"-rraeyo\"}}} after a vowel and {{{\"s\": \"-을래요\", \"r\": \"-eullaeyo\"}}} after a consonant: {{{\"s\": \"마실래요\", \"r\": \"masillaeyo\"}}}, {{{\"s\": \"먹을래요\", \"r\": \"meogeullaeyo\", \"p\": \"머글래요\"}}}. {{{\"s\": \"뭐\", \"r\": \"mwo\"}}} means \"what\".","ex":[[{"s":"커피를 마셔요","r":"keopireul masyeoyo"},"I drink coffee."],[{"s":"밥을 먹어요","r":"babeul meogeoyo","p":"바블 머거요"},"I eat rice."],[{"s":"뭐 먹을래요?","r":"mwo meogeullaeyo","p":"뭐 머글래요"},"What would you like to eat?"],[{"s":"저는 맥주 마실래요","r":"jeoneun maekjju masillaeyo","p":"저는 맥쭈 마실래요"},"I'll have a beer."]]},{"h":"Have, don't have, and \"not\"","p":"{{{\"s\": \"있어요\", \"r\": \"isseoyo\", \"p\": \"이써요\"}}} means \"there is / I have\" and {{{\"s\": \"없어요\", \"r\": \"eopsseoyo\", \"p\": \"업써요\"}}} means \"there isn't / I don't have\". They are a pair, so never say {{{\"s\": \"안 있어요\", \"r\": \"an isseoyo\", \"p\": \"안 이써요\"}}}. {{{\"s\": \"맛있어요\", \"r\": \"masisseoyo\", \"p\": \"마시써요\"}}} (delicious) is literally \"taste exists\" and {{{\"s\": \"맛없어요\", \"r\": \"madeopsseoyo\", \"p\": \"마덥써요\"}}} is \"no taste\". For other verbs, put {{{\"s\": \"안\", \"r\": \"an\"}}} right before the verb to mean \"not\": {{{\"s\": \"안 먹어요\", \"r\": \"an meogeoyo\", \"p\": \"안 머거요\"}}}, {{{\"s\": \"안 매워요\", \"r\": \"an maewoyo\"}}}.","ex":[[{"s":"소고기 있어요?","r":"sogogi isseoyo","p":"소고기 이써요"},"Do you have beef?"],[{"s":"죄송합니다. 소고기는 없어요.","r":"joesonghamnida sogogineun eopsseoyo","p":"죄송함니다 소고기는 업써요"},"Sorry, we don't have beef."],[{"s":"저는 고기를 안 먹어요","r":"jeoneun gogireul an meogeoyo","p":"저는 고기를 안 머거요"},"I don't eat meat."]]},{"h":"Sounds: linking and hidden changes","p":"A final consonant slides into a following vowel: {{{\"s\": \"먹어요\", \"r\": \"meogeoyo\", \"p\": \"머거요\"}}} is said {{{\"s\": \"머거요\", \"r\": \"meogeoyo\"}}} and {{{\"s\": \"맛있어요\", \"r\": \"masisseoyo\", \"p\": \"마시써요\"}}} is said {{{\"s\": \"마시써요\", \"r\": \"masisseoyo\"}}}. After a final k, t or p sound, the next plain consonant becomes tense: {{{\"s\": \"맥주\", \"r\": \"maekjju\", \"p\": \"맥쭈\"}}} sounds like {{{\"s\": \"맥쭈\", \"r\": \"maekjju\"}}}, {{{\"s\": \"숟가락\", \"r\": \"sutkkarak\", \"p\": \"숟까락\"}}} like {{{\"s\": \"숟까락\", \"r\": \"sutkkarak\"}}}. When a syllable ends in two consonant letters, only one is said: {{{\"s\": \"닭고기\", \"r\": \"dakko o eat?","goals":["Say whether you're hungry","Say what you'll eat and drink","Say something you don't eat","Say whether the food is delicious or spicy"]}]},{"id":"L4","n":4,"title":"Around town, shopping, time","goal":"Ask where things are, get a taxi, shop and pay in won, and tell the time and day.","notes":[{"h":"Where is it? Here, there, over there","p":"{{{\"s\": \"어디예요?\", \"r\": \"eodiyeyo\"}}} asks where something is. Answer with {{{\"s\": \"여기\", \"r\": \"yeogi\"}}} (here, near me), {{{\"s\": \"거기\", \"r\": \"geogi\"}}} (there, near you) or {{{\"s\": \"저기\", \"r\": \"jeogi\"}}} (over there, away from both of us), plus {{{\"s\": \"예요\", \"r\": \"yeyo\"}}}. Directions are polite commands ending in {{{\"s\": \"-세요\", \"r\": \"-seyo\"}}}: {{{\"s\": \"쭉 가세요\", \"r\": \"jjuk kkaseyo\", \"p\": \"쭉 까세요\"}}} (go straight).","ex":[[{"s":"화장실이 어디예요?","r":"hwajangsiri eodiyeyo","p":"화장시리 어디예요"},"Where's the restroom?"],[{"s":"저기예요","r":"jeogiyeyo"},"It's over there."],[{"s":"오른쪽으로 가세요","r":"oreunjjogeuro gaseyo","p":"오른쪼그로 가세요"},"Go to the right."]]},{"h":"To, at and by","p":"{{{\"s\": \"에\", \"r\": \"e\"}}} marks where you are going and when something happens: {{{\"s\": \"한국에 가요\", \"r\": \"hanguge gayo\", \"p\": \"한구게 가요\"}}}, {{{\"s\": \"월요일에\", \"r\": \"woryoire\", \"p\": \"워료이레\"}}}, {{{\"s\": \"세 시에\", \"r\": \"se sie\"}}}. Never add {{{\"s\": \"에\", \"r\": \"e\"}}} to {{{\"s\": \"오늘\", \"r\": \"oneul\"}}}, {{{\"s\": \"내일\", \"r\": \"naeil\"}}}, {{{\"s\": \"어제\", \"r\": \"eoje\"}}} or {{{\"s\": \"지금\", \"r\": \"jigeum\"}}}. {{{\"s\": \"으로\", \"r\": \"euro\"}}} / {{{\"s\": \"로\", \"r\": \"ro\"}}} means \"toward\" or \"by (a way of travel)\": {{{\"s\": \"공항으로\", \"r\": \"gonghangeuro\"}}}, {{{\"s\": \"지하철로\", \"r\": \"jihacheollo\"}}}, {{{\"s\": \"택시로\", \"r\": \"taekssiro\", \"p\": \"택씨로\"}}}. Use {{{\"s\": \"로\", \"r\": \"ro\"}}} after a vowel or after ㄹ, and {{{\"s\": \"으로\", \"r\": \"euro\"}}} after any other consonant. {{{\"s\": \"에서\", \"r\": \"eseo\"}}} means \"from\" a place: {{{\"s\": \"여기에서\", \"r\": \"yeogieseo\"}}}.","ex":[[{"s":"내일 한국에 가요","r":"naeil hanguge gayo","p":"내일 한구게 가요"},"I'm going to Korea tomorrow."],[{"s":"공항으로 가 주세요","r":"gonghangeuro ga juseyo"},"To the airport, please."],[{"s":"지하철로 가요","r":"jihacheollo gayo"},"I'm going by subway."]]},{"h":"Money","p":"Prices use Sino-Korean numbers plus {{{\"s\": \"원\", \"r\": \"won\"}}}. Korean groups big numbers in ten-thousands ({{{\"s\": \"만\", \"r\": \"man\"}}}), not thousands: 10,000 is {{{\"s\": \"만\", \"r\": \"man\"}}}, 50,000 is {{{\"s\": \"오만\", \"r\": \"oman\"}}}, 15,000 is {{{\"s\": \"만 오천\", \"r\": \"man ocheon\"}}}. For 100, 1,000 and 10,000 just say {{{\"s\": \"백\", \"r\": \"baek\"}}}, {{{\"s\": \"천\", \"r\": \"cheon\"}}}, {{{\"s\": \"만\", \"r\": \"man\"}}} with no \"one\" in front. Ask the price with {{{\"s\": \"얼마예요?\", \"r\": \"eolmayeyo\"}}}","ex":[[{"s":"이거 얼마예요?","r":"igeo eolmayeyo"},"How much is this?"],[{"s":"오천 원이에요","r":"ocheon wonieyo","p":"오천 워니에요"},"It's 5,000 won."],[{"s":"만 오천 원이에요","r":"man ocheon wonieyo","p":"만 오천 워니에요"},"It's 15,000 won."]]},{"h":"Telling time and days","p":"Hours use native numbers (shortened before {{{\"s\": \"시\", \"r\": \"si\"}}}: {{{\"s\": \"한 시\", \"r\": \"han si\"}}}, {{{\"s\": \"두 시\", \"r\": \"du si\"}}}, {{{\"s\": \"세 시\", \"r\": \"se si\"}}}, {{{\"s\": \"네 시\", \"r\": \"ne si\"}}}), and minutes use Sino-Korean: {{{\"s\": \"세 시 삼십 분\", \"r\": \"se si samsip ppun\", \"p\": \"세 시 삼십 뿐\"}}} is 3:30. {{{\"s\": \"반\", \"r\": \"ban\"}}} means half past: {{{\"s\": \"세 시 반\", \"r\": \"se si ban\"}}}. Eleven and twelve o'clock are {{{\"s\": \"열한 시\", \"r\": \"yeolhan si\"}}} and {{{\"s\": \"열두 시\", \"r\": \"yeoldu si\"}}}. The days of the week all end in {{{\"s\": \"요일\", \"r\": \"yoil\"}}}, from {{{\"s\": \"월요일\", \"r\": \"woryoil\", \"p\": \"워료일\"}}} (Monday) to {{{\"s\": \"일요일\", \"r\": \"iryoil\", \"p\": \"이료일\"}}} (Sunday).","ex":[[{"s":"지금 몇 시예요?","r":"jigeum myeot ssiyeyo","p":"지금 멷 씨예요"},"What time is it now?"],[{"s":"두 시 십 분이에요","r":"du si sip ppunieyo","p":"두 시 십 뿌니에요"},"It's 2:10."],[{"s":"토요일에 가요","r":"toyoire gayo","p":"토요이레 가요"},"I'm going on Saturday."]]},{"h":"Wanting, and sounds to watch","p":"Add {{{\"s\": \"-고 싶어요\", \"r\": \"-go sipeoyo\", \"p\": \"-고 시퍼요\"}}} to a verb stem to say you want to do it: {{{\"s\": \"가다\", \"r\": \"gada\"}}} becomes {{{\"s\": \"가고 싶어요\", \"r\": \"gago sipeoyo\", \"p\": \"가고 시퍼요\"}}}, {{{\"s\": \"사다\", \"r\": \"sada\"}}} becomes {{{\"s\": \"사고 싶어요\", \"r\": \"sago sipeoyo\", \"p\": \"사고 시퍼요\"}}}. Listen for the tense ㅆ: {{{\"s\": \"싸요\", \"r\": \"ssayo\"}}} (it's cheap) and {{{\"s\": \"사요\", \"r\": \"sayo\"}}} (I buy) differ only in that sound. A final consonant links into the next vowel: {{{\"s\": \"월요일\", \"r\": \"woryoil\", \"p\": \"워료일\"}}} is said {{{\"s\": \"워료일\", \"r\": \"woryoil\"}}} and {{{\"s\": \"목요일\", \"r\": \"mogyoil\", \"p\": \"모교일\"}}} is said {{{\"s\": \"모교일\", \"r\": \"mogyoil\"}}}. After a final t or p sound, the next consonant tenses: {{{\"s\": \"몇 시\", \"r\": \"myeot ssi\", \"p\": \"멷 씨\"}}} sounds like {{{\"s\": \"멷 씨\", \"r\": \"myeot ssi\"}}} and {{{\"s\": \"십 분\", \"r\": \"sip ppun\", \"p\": \"십 뿐\"}}} like {{{\"s\": \"십 뿐\", \"r\": \"sip ppun\"}}}.","ex":[[{"s":"이거 사고 싶어요","r":"igeo sago sipeoyo","p":"이거 사고 시퍼요"},"I'd like to buy this."],[{"s":"이거 싸요","r":"igeo ssayo"},"This is cheap."],[{"s":"목요일에 가고 싶어요","r":"mogyoire gago sipeoyo","p":"모교이레 가고 시퍼요"},"I want to go on Thursday."]]}],"vocab":[{"id":"L4-v-00","t":{"s":"어디예요?","r":"eodiyeyo"},"en":"Where is it?","topic":"Getting around","note":"","avoid":[],"old":"1dfeb39974"},{"id":"L4-v-01","t":{"s":"화장실이 어디예요?","r":"hwajangsiri eodiyeyo","p":"화장시리 어디예요"},"en":"Where's the restroom?","topic":"Getting around","note":"","avoid":[],"old":"35c65d0721"},{"id":"L4-v-02","t":{"s":"여기","r":"yeogi"},"en":"here","topic":"Getting around","note":"","avoid":[],"old":"9dfe5efcc7"},{"id":"L4-v-03","t":{"s":"거기","r":"geogi"},"en":"there (near you)","topic":"Gettin uk ssi bane mannayo","p":"육 씨 바네 만나요"},{"s":"여섯 시 삼십에 만나요.","r":"yeoseot ssi samsibe mannayo","p":"여섣 씨 삼시베 만나요"}],"a":0,"why":"Hours are native ({{{\"s\": \"여섯 시\", \"r\": \"yeoseot ssi\", \"p\": \"여섣 씨\"}}}), and {{{\"s\": \"반\", \"r\": \"ban\"}}} = half past. Minutes would need {{{\"s\": \"분\", \"r\": \"bun\"}}}.","sk":["g:numbers","g:particles"]},{"who":"Junho","s":{"s":"좋아요. 토요일에 봐요!","r":"joayo toyoire bwayo","p":"조아요 토요이레 봐요"},"en":"Great. See you on Saturday!"}],"k":[85,107,146,154,165,250],"u":10},{"id":"L4-dlg-05","t":"dlg","sk":["g:honor","g:place","s:phrase","s:vocab"],"title":"Giving directions","turns":[{"who":"Stranger","s":{"s":"저기요, 지하철이 어디예요?","r":"jeogiyo jihacheori eodiyeyo","p":"저기요 지하처리 어디예요"},"en":"Excuse me, where's the subway?"},{"you":true,"opts":[{"s":"저기예요. 쭉 가세요.","r":"jeogiyeyo jjuk kkaseyo","p":"저기예요 쭉 까세요"},{"s":"저기예요. 쭉 가요 주세요.","r":"jeogiyeyo jjuk kkayo juseyo","p":"저기예요 쭉 까요 주세요"},{"s":"저기예요. 쭉 갔어요.","r":"jeogiyeyo jjuk kkasseoyo","p":"저기예요 쭉 까써요"}],"a":0,"why":"Directions use the polite command {{{\"s\": \"가세요\", \"r\": \"gaseyo\"}}}: {{{\"s\": \"쭉 가세요\", \"r\": \"jjuk kkaseyo\", \"p\": \"쭉 까세요\"}}} = go straight.","sk":["g:place","g:honor"]},{"who":"Stranger","s":{"s":"멀어요?","r":"meoreoyo","p":"머러요"},"en":"Is it far?"},{"you":true,"opts":[{"s":"아니요, 가까워요.","r":"aniyo gakkawoyo"},{"s":"아니요, 멀어요.","r":"aniyo meoreoyo","p":"아니요 머러요"},{"s":"네, 가까워요.","r":"ne gakkawoyo"}],"a":0,"why":"{{{\"s\": \"아니요\", \"r\": \"aniyo\"}}} (no, it isn't far) goes with {{{\"s\": \"가까워요\", \"r\": \"gakkawoyo\"}}} (it's close). The other two contradict themselves.","sk":["s:vocab"]},{"who":"Stranger","s":{"s":"감사합니다!","r":"gamsahamnida","p":"감사함니다"},"en":"Thank you!"},{"you":true,"opts":[{"s":"안녕히 가세요.","r":"annyeonghi gaseyo"},{"s":"안녕히 계세요.","r":"annyeonghi gyeseyo"},{"s":"잘 먹겠습니다.","r":"jal meokketsseumnida","p":"잘 먹껟씀니다"}],"a":0,"why":"The stranger is walking off, so you say {{{\"s\": \"안녕히 가세요\", \"r\": \"annyeonghi gaseyo\"}}}.","sk":["s:phrase"]}],"k":[6,8,10,118,122,125,127,130,131,623]}],"roleplay":[{"title":"Taxi ride","setup":"You flag down a taxi in Seoul. Tell the driver where to go and sort out the trip and payment.","persona":"You are a friendly Seoul taxi driver. The learner wants to go somewhere in the city or to the airport. The airport is far: about forty minutes and around 50,000 won (오만 원). Card payment is fine. Answer questions about time and price with native numbers for hours and Sino-Korean numbers for minutes and money. Speak simple polite Korean (-요 endings; -세요 for requests) using mostly words from levels 1-4, short sentences.","opening":{"s":"어서 오세요. 어디로 가세요?","r":"eoseo oseyo eodiro gaseyo"},"opening_en":"Hello. Where are you headed?","goals":["Tell the driver where to go","Ask how long it takes","Ask how much it is","Ask if you can pay by card"]},{"title":"Shopping at a market","setup":"You are browsing at a stall in a Seoul market. Find something you like, ask the price, and haggle a little.","persona":"You are a cheerful stall owner at a Seoul market selling cups, chopsticks and small souvenirs. Prices range from 3,000 won (삼천 원) to 20,000 won (이만 원). If the learner asks for a discount, take off 1,000 or 2,000 won. Card is fine. Say prices in Sino-Korean numbers with 원 and count items with native numbers plus 개. Speak simple polite Korean (-요 endings) using mostly words from levels 1-4.","opening":{"s":"어서 오세요. 뭐 찾으세요?","r":"eoseo oseyo mwo chajeuseyo","p":"어서 오세요 뭐 차즈세요"},"opening_en":"Welcome. What are you looking for?","goals":["Ask the price of something","Understand a price in won","Ask for a discount","Say you want to buy two of something","Ask if you can pay by card"]}]},{"id":"L5","n":5,"title":"Small talk and likes","goal":"Chat about the weather, say what you like, and say what you're doing right now.","notes":[{"h":"Liking things: two different words","p":"{{{\"s\": \"좋아해요\", \"r\": \"joahaeyo\", \"p\": \"조아해요\"}}} is an action word, \"to like\". The thing you like takes the object marker {{{\"s\": \"을\", \"r\": \"eul\"}}} / {{{\"s\": \"를\", \"r\": \"reul\"}}}: {{{\"s\": \"커피를 좋아해요\", \"r\": \"keopireul joahaeyo\", \"p\": \"커피를 조아해요\"}}}. {{{\"s\": \"좋아요\", \"r\": \"joayo\", \"p\": \"조아요\"}}} is a describing word, \"is good\". The thing that is good takes the subject marker {{{\"s\": \"이\", \"r\": \"i\"}}} / {{{\"s\": \"가\", \"r\": \"ga\"}}}: {{{\"s\": \"날씨가 좋아요\", \"r\": \"nalssiga joayo\", \"p\": \"날씨가 조아요\"}}}. In everyday talk Koreans also say {{{\"s\": \"커피가 좋아요\", \"r\": \"keopiga joayo\", \"p\": \"커피가 조아요\"}}} to mean \"I like coffee\", but once the thing takes {{{\"s\": \"을\", \"r\": \"eul\"}}} / {{{\"s\": \"를\", \"r\": \"reul\"}}} you must use {{{\"s\": \"좋아해요\", \"r\": \"joahaeyo\", \"p\": \"조아해요\"}}}. On its own, {{{\"s\": \"좋아요\", \"r\": \"joayo\", \"p\": \"조아요\"}}} is also how you accept an invitation: \"sounds good\". The ㅎ in {{{\"s\": \"좋\", \"r\": \"jot\", \"p\": \"졷\"}}} goes silent before a vowel, so {{{\"s\": \"좋아요\", \"r\": \"joayo\", \"p\": \"조아요\"}}} sounds like \"jo-a-yo\".","ex":[[{"s":"커피를 좋아해요","r":"keopireul joahaeyo","p":"커피를 조아해요"},"I like coffee."],[{"s":"날씨가 좋아요","r":"nalssiga joayo","p":"날씨가 조아요"},"The weather is nice."],[{"s":"좋아요!","r":"joayo","p":"조아요"},"Sounds good!"]]},{"h":"The subject marker (i / ga) and the topic marker (eun / neun)","p":"{{{\"s\": \"이\", \"r\": \"i\"}}} / {{{\"s\": \"가\", \"r\": \"ga\"}}} points at who or what does something or is something, often new information: {{{\"s\": \"비가 와요\", \"r\": \"biga wayo\"}}}, {{{\"s\": \"날씨가 좋아요\", \"r\": \"nalssiga joayo\", \"p\": \"날씨가 조아요\"}}}. Use {{{\"s\": \"이\", \"r\": \"i\"}}} after a consonant and {{{\"s\": \"가\", \"r\": \"ga\"}}} after a vowel. {{{\"s\": \"은\", \"r\": \"eun\"}}} / {{{\"s\": \"는\", \"r\": \"neun\"}}} sets the topic, \"as for …\", and often contrasts: {{{\"s\": \"오늘은 추워요\", \"r\": \"oneureun chuwoyo\", \"p\": \"오느른 추워요\"}}} hints that other days are not. A question word that is the subject takes {{{\"s\": \"이\", \"r\": \"i\"}}} / {{{\"s\": \"가\", \"r\": \"ga\"}}}, never {{{\"s\": \"은\", \"r\": \"eun\"}}} / {{{\"s\": \"는\", \"r\": \"neun\"}}}: {{{\"s\": \"뭐가 맛있어요?\", \"r\": \"mwoga masisseoyo\", \"p\": \"뭐가 마시써요\"}}} One special form: {{{\"s\": \"저\", \"r\": \"jeo\"}}} + {{{\"s\": \"가\", \"r\": \"ga\"}}} becomes {{{\"s\": \"제가\", \"r\": \"jega\"}}}.","ex":[[{"s":"비가 와요","r":"biga wayo"},"It's raining."],[{"s":"오늘은 추워요","r":"oneureun chuwoyo","p":"오느른 추워요"},"Today (at least) it's cold."],[{"s":"여기 뭐가 맛있어요?","r":"yeogi mwoga masisseoyo","p":"여기 뭐가 마시써요"},"What's good here?"]]},{"h":"Weather words and the b to w change","p":"Many describing words end in ㅂ: {{{\"s\": \"덥다\", \"r\": \"deoptta\", \"p\": \"덥따\"}}} (hot), {{{\"s\": \"춥다\", \"r\": \"chuptta\", \"p\": \"춥따\"}}} (cold). Before {{{\"s\": \"어요\", \"r\": \"eoyo\"}}}, the ㅂ turns into {{{\"s\": \"워\", \"r\": \"wo\"}}}: {{{\"s\": \"더워요\", \"r\": \"deowoyo\"}}}, {{{\"s\": \"추워요\", \"r\": \"chuwoyo\"}}}. You already know two more: {{{\"s\": \"매워요\", \"r\": \"maewoyo\"}}} (spicy) and {{{\"s\": \"가까워요\", \"r\": \"gakkawoyo\"}}} (close). Rain and snow \"come\" ({{{\"s\": \"오다\", \"r\": \"oda\"}}}): {{{\"s\": \"비가 와요\", \"r\": \"biga wayo\"}}}, {{{\"s\": \"눈이 와요\", \"r\": \"nuni wayo\", \"p\": \"누니 와요\"}}}. {{{\"s\": \"따뜻해요\", \"r\": \"ttatteutaeyo\", \"p\": \"따뜨태요\"}}} (warm) and {{{\"s\": \"시원해요\", \"r\": \"siwonhaeyo\"}}} (cool) end in {{{\"s\": \"해요\", \"r\": \"haeyo\"}}} and never change.","ex":[[{"s":"오늘 더워요","r":"oneul deowoyo"},"It's hot today."],[{"s":"추워요","r":"chuwoyo"},"It's cold."],[{"s":"눈이 와요","r":"nuni wayo","p":"누니 와요"},"It's snowing."]]},{"h":"Doing it right now: -go isseoyo","p":"Take an action word, drop {{{\"s\": \"다\", \"r\": \"da\"}}}, and add {{{\"s\": \"고 있어요\", \"r\": \"go isseoyo\", \"p\": \"고 이써요\"}}}: {{{\"s\": \"마시다\", \"r\": \"masida\"}}} becomes {{{\"s\": \"마시고 있어요\", \"r\": \"masigo isseoyo\", \"p\": \"마시고 이써요\"}}}, \"I'm drinking\". Use it for something happening at this moment. Describing words like {{{\"s\": \"바빠요\", \"r\": \"bappayo\"}}} or {{{\"s\": \"추워요\", \"r\": \"chuwoyo\"}}} never take it. Plain {{{\"s\": \"뭐 해요?\", \"r\": \"mwo haeyo\"}}} can also mean \"what are you doing?\"; {{{\"s\": \"뭐 하고 있어요?\", \"r\": \"mwo hago isseoyo\", \"p\": \"뭐 하고 이써요\"}}} stresses \"right now\".","ex":[[{"s":"지금 커피를 마시고 있어요","r":"jigeum keopireul masigo isseoyo","p":"지금 커피를 마시고 이써요"},"I'm drinking coffee right now."],[{"s":"지금 뭐 하고 있어요?","r":"jigeum mwo hago isseoyo","p":"지금 뭐 하고 이써요"},"What are you doing right now?"],[{"s":"지금 비가 오고 있어요","r":"jigeum biga ogo isseoyo","p":"지금 비가 오고 이써요"},"It's raining right now."]]},{"h":"Reacting with -neyo, and \"also\" with do","p":"Swap the {{{\"s\": \"아요\", \"r\": \"ayo\"}}} / {{{\"s\": \"어요\", \"r\": \"eoyo\"}}} ending for {{{\"s\": \"네요\", \"r\": \"neyo\"}}} when you notice or react to something right now: \"oh, it's …!\". It goes straight onto the stem with no ㅂ change: {{{\"s\": \"덥다\", \"r\": \"deoptta\", \"p\": \"덥따\"}}} becomes {{{\"s\": \"덥네요\", \"r\": \"deomneyo\", \"p\": \"덤네요\"}}}. Sound point: ㅎ, ㅅ or ㅆ before ㄴ is said as ㄴ, so {{{\"s\": \"좋네요\", \"r\": \"jonneyo\", \"p\": \"존네요\"}}} sounds like \"jon-ne-yo\" and {{{\"s\": \"맛있네요\", \"r\": \"masinneyo\", \"p\": \"마신네요\"}}} like \"ma-sin-ne-yo\". {{{\"s\": \"도\", \"r\": \"do\"}}} means \"also / too\". It takes the place of {{{\"s\": \"은\", \"r\": \"eun\"}}} / {{{\"s\": \"는\", \"r\": \"neun\"}}}, {{{\"s\": \"이\", \"r\": \"i\"}}} / {{{\"s\": \"가\", \"r\": \"ga\"}}} or {{{\"s\": \"을\", \"r\": \"eul\"}}} / {{{\"s\": \"를\", \"r\": \"reul\"}}} instead of joining them: {{{\"s\": \"저도 좋아해요\", \"r\": \"jeodo joahaeyo\", \"p\": \"저도 조아해요\"}}}, {{{\"s\": \"음악도 좋아해요\", \"r\": \"eumaktto joahaeyo\", \"p\": \"으막또 조아해요\"}}}.","ex":[[{"s":"오늘 덥네요!","r":"oneul deomneyo","p":"오늘 덤네요"},"It's hot today!"],[{"s":"맛있네요!","r":"masinneyo","p":"마신네요"},"This is tasty!"],[{"s":"저도 좋아해요","r":"jeodo joahaeyo","p":"저도 조아해요"},"I like it too."]]}],"vocab":[{"id":"L5-v-00","t":{"s":"날씨","r":"nalssi"},"en ,"s:phrase","s:vocab"],"title":"Hobbies","turns":[{"who":"Ms Kim","s":{"s":"취미가 뭐예요?","r":"chwimiga mwoyeyo"},"en":"What's your hobby?"},{"you":true,"opts":[{"s":"운동을 좋아해요.","r":"undongeul joahaeyo","p":"운동을 조아해요"},{"s":"운동이 좋아해요.","r":"undongi joahaeyo","p":"운동이 조아해요"},{"s":"운동을 좋아요.","r":"undongeul joayo","p":"운동을 조아요"}],"a":0,"why":"{{{\"s\": \"좋아해요\", \"r\": \"joahaeyo\", \"p\": \"조아해요\"}}} takes an object: {{{\"s\": \"운동을\", \"r\": \"undongeul\"}}}.","sk":["g:particles","g:endings"]},{"who":"Ms Kim","s":{"s":"아, 저도요! 운동 재미있어요.","r":"a jeodoyo undong jaemiisseoyo","p":"아 저도요 운동 재미이써요"},"en":"Oh, me too! Working out is fun."},{"you":true,"opts":[{"s":"맞아요, 재미있어요.","r":"majayo jaemiisseoyo","p":"마자요 재미이써요"},{"s":"맞아요, 재미있어해요.","r":"majayo jaemiisseohaeyo","p":"마자요 재미이써해요"},{"s":"맞아요, 재미없어요.","r":"majayo jaemieopsseoyo","p":"마자요 재미업써요"}],"a":0,"why":"Agree with {{{\"s\": \"맞아요\", \"r\": \"majayo\", \"p\": \"마자요\"}}} and repeat {{{\"s\": \"재미있어요\", \"r\": \"jaemiisseoyo\", \"p\": \"재미이써요\"}}}. {{{\"s\": \"재미없어요\", \"r\": \"jaemieopsseoyo\", \"p\": \"재미업써요\"}}} would contradict your {{{\"s\": \"맞아요\", \"r\": \"majayo\", \"p\": \"마자요\"}}}.","sk":["s:phrase","s:vocab"]},{"who":"Ms Kim","s":{"s":"음악도 좋아해요?","r":"eumaktto joahaeyo","p":"으막또 조아해요"},"en":"Do you like music too?"},{"you":true,"opts":[{"s":"네, 음악도 좋아해요.","r":"ne eumaktto joahaeyo","p":"네 으막또 조아해요"},{"s":"네, 음악을도 좋아해요.","r":"ne eumageuldo joahaeyo","p":"네 으마글도 조아해요"},{"s":"네, 음악도 좋아요해요.","r":"ne eumaktto joayohaeyo","p":"네 으막또 조아요해요"}],"a":0,"why":"{{{\"s\": \"도\", \"r\": \"do\"}}} takes the place of {{{\"s\": \"을\", \"r\": \"eul\"}}}; the two never go together.","sk":["g:particles"]}],"k":[163,169,175,186,189,190,191],"u":1}],"roleplay":[{"title":"Small talk with a coworker","setup":"It's a cold morning and a Korean coworker joins you by the coffee machine. Chat about the weather and what you like.","persona":"You are Minji, a friendly Korean coworker in Chicago. It is a cold winter morning. You like Korean movies and working out; you don't like the cold. Speak simple polite Korean (해요 style) using mostly words from levels 1-5: weather words, 좋아해요 / 좋아요, 재미있어요, -고 있어요, -네요, 도. Keep sentences short, ask one question at a time, and never use casual speech.","opening":{"s":"오늘 춥네요!","r":"oneul chumneyo","p":"오늘 춤네요"},"opening_en":"It's cold today, isn't it!","goals":["Agree about the weather","Say something you like and something you don't","Ask what she likes","Say \"me too\" at least once"]},{"title":"Catching up with a friend","setup":"You bump into a Korean friend you haven't seen in a long time. Catch up and see if you can meet.","persona":"You are Junho, a Korean friend the learner hasn't seen in months. You're busy at work these days but free this weekend. Speak simple polite Korean (해요 style) using mostly words from levels 1-5. Ask how they are, what they're doing these days, and whether they have time. Keep sentences short.","opening":{"s":"오랜만이에요! 잘 지내요?","r":"oraenmanieyo jal jinaeyo","p":"오랜마니에요 잘 지내요"},"opening_en":"Long time no see! How are you?","goals":["Say how you're doing","Say what you're doing right now","Ask if he has time this weekend","Say goodbye naturally"]}]},{"id":"L6","n":6,"title":"Past and future","goal":"Say what you did and what you will do, give reasons, say \"if\" and \"can't\", and suggest doing things together.","notes":[{"h":"Past tense: -asseoyo, -eosseoyo, haesseoyo","p":"Look at the last vowel of the stem. If it is ㅏ or ㅗ, add {{{\"s\": \"았어요\", \"r\": \"asseoyo\", \"p\": \"아써요\"}}}; otherwise add {{{\"s\": \"었어요\", \"r\": \"eosseoyo\", \"p\": \"어써요\"}}}; {{{\"s\": \"하다\", \"r\": \"hada\"}}} becomes {{{\"s\": \"했어요\", \"r\": \"haesseoyo\", \"p\": \"해써요\"}}}. Vowels often merge: {{{\"s\": \"가다\", \"r\": \"gada\"}}} becomes {{{\"s\": \"갔어요\", \"r\": \"gasseoyo\", \"p\": \"가써요\"}}}, {{{\"s\": \"오다\", \"r\": \"oda\"}}} becomes {{{\"s\": \"왔어요\", \"r\": \"wasseoyo\", \"p\": \"와써요\"}}}, {{{\"s\": \"보다\", \"r\": \"boda\"}}} becomes {{{\"s\": \"봤어요\", \"r\": \"bwasseoyo\", \"p\": \"봐써요\"}}}, {{{\"s\": \"마시다\", \"r\": \"masida\"}}} becomes {{{\"s\": \"마셨어요\", \"r\": \"masyeosseoyo\", \"p\": \"마셔써요\"}}}. Korean also uses the past for \"I'm late\" ({{{\"s\": \"늦었어요\", \"r\": \"neujeosseoyo\", \"p\": \"느저써요\"}}}): the being-late has already happened. Sound point: the ㅆ carries over to the next vowel, so {{{\"s\": \"갔어요\", \"r\": \"gasseoyo\", \"p\": \"가써요\"}}} sounds like \"ga-sseo-yo\".","ex":[[{"s":"어제 친구를 만났어요","r":"eoje chingureul mannasseoyo","p":"어제 친구를 만나써요"},"I met a friend yesterday."],[{"s":"주말에 뭐 했어요?","r":"jumare mwo haesseoyo","p":"주마레 뭐 해써요"},"What did you do on the weekend?"],[{"s":"미안해요, 조금 늦었어요","r":"mianhaeyo jogeum neujeosseoyo","p":"미안해요 조금 느저써요"},"Sorry, I'm a bit late."]]},{"h":"Future: -(eu)l geoyeyo","p":"After a vowel, add ㄹ and {{{\"s\": \"거예요\", \"r\": \"geoyeyo\"}}}: {{{\"s\": \"가다\", \"r\": \"gada\"}}} becomes {{{\"s\": \"갈 거예요\", \"r\": \"gal kkeoyeyo\", \"p\": \"갈 꺼예요\"}}}. After a consonant, add {{{\"s\": \"을 거예요\", \"r\": \"eul geoyeyo\"}}}: {{{\"s\": \"먹을 거예요\", \"r\": \"meogeul kkeoyeyo\", \"p\": \"머글 꺼예요\"}}}. Words ending in ㅂ change again: {{{\"s\": \"덥다\", \"r\": \"deoptta\", \"p\": \"덥따\"}}} becomes {{{\"s\": \"더울 거예요\", \"r\": \"deoul kkeoyeyo\", \"p\": \"더울 꺼예요\"}}}. Spelling trap: it is always written {{{\"s\": \"거예요\", \"r\": \"geoyeyo\"}}} with ㅖ, even though many Koreans misspell it with ㅔ. Sound point: {{{\"s\": \"거\", \"r\": \"geo\"}}} is said with a tight k, so {{{\"s\": \"갈 거예요\", \"r\": \"gal kkeoyeyo\", \"p\": \"갈 꺼예요\"}}} sounds like \"gal kkeo-ye-yo\".","ex":[[{"s":"내일 비가 올 거예요","r":"naeil biga ol kkeoyeyo","p":"내일 비가 올 꺼예요"},"It will rain tomorrow."],[{"s":"내일 뭐 할 거예요?","r":"naeil mwo hal kkeoyeyo","p":"내일 뭐 할 꺼예요"},"What are you going to do tomorrow?"],[{"s":"한국 음식을 먹을 거예요","r":"hanguk eumsigeul meogeul kkeoyeyo","p":"한국 음시글 머글 꺼예요"},"I'm going to eat Korean food."]]},{"h":"So and if: -aseo / -eoseo and -(eu)myeon","p":"{{{\"s\": \"아서\", \"r\": \"aseo\"}}} / {{{\"s\": \"어서\", \"r\": \"eoseo\"}}} ({{{\"s\": \"해서\", \"r\": \"haeseo\"}}} for {{{\"s\": \"하다\", \"r\": \"hada\"}}} words) joins a reason to its result: {{{\"s\": \"바빠서 못 가요\", \"r\": \"bappaseo mot kkayo\", \"p\": \"바빠서 몯 까요\"}}}, \"I'm busy, so I can't go\". The reason part never takes its own past ending; the last verb shows the time: {{{\"s\": \"어제 바빠서 못 갔어요\", \"r\": \"eoje bappaseo mot kkasseoyo\", \"p\": \"어제 바빠서 몯 까써요\"}}}. Koreans don't use it before \"let's\" or \"shall we\". {{{\"s\": \"면\", \"r\": \"myeon\"}}} after a vowel and {{{\"s\": \"으면\", \"r\": \"eumyeon\"}}} after a consonant means \"if\": {{{\"s\": \"비가 오면\", \"r\": \"biga omyeon\"}}}, {{{\"s\": \"시간 있으면\", \"r\": \"sigan isseumyeon\", \"p\": \"시간 이쓰면\"}}}.","ex":[[{"s":"피곤해서 집에 가고 싶어요","r":"pigonhaeseo jibe gago sipeoyo","p":"피곤해서 지베 가고 시퍼요"},"I'm tired, so I want to go home."],[{"s":"어제 바빠서 못 갔어요","r":"eoje bappaseo mot kkasseoyo","p":"어제 바빠서 몯 까써요"},"I was busy yesterday, so I couldn't go."],[{"s":"시간 있으면 같이 밥 먹어요","r":"sigan isseumyeon gachi bam meogeoyo","p":"시간 이쓰면 가치 밤 머거요"},"If you have time, let's eat together."]]},{"h":"Can't: mot vs an","p":"{{{\"s\": \"안\", \"r\": \"an\"}}} means you don't or won't, by choice. {{{\"s\": \"못\", \"r\": \"mot\", \"p\": \"몯\"}}} means you can't, even if you'd like to. Both go right before the verb: {{{\"s\": \"못 가요\", \"r\": \"mot kkayo\", \"p\": \"몯 까요\"}}}. {{{\"s\": \"잘 못해요\", \"r\": \"jal motaeyo\", \"p\": \"잘 모태요\"}}} means \"I'm not good at it\". Sound point: {{{\"s\": \"못\", \"r\": \"mot\", \"p\": \"몯\"}}} changes the sound after it. {{{\"s\": \"못 가요\", \"r\": \"mot kkayo\", \"p\": \"몯 까요\"}}} sounds like \"mot kka-yo\", {{{\"s\": \"못해요\", \"r\": \"motaeyo\", \"p\": \"모태요\"}}} like \"mo-tae-yo\", and {{{\"s\": \"못 먹어요\", \"r\": \"mon meogeoyo\", \"p\": \"몬 머거요\"}}} like \"mon meo-geo-yo\".","ex":[[{"s":"돼지고기를 못 먹어요","r":"dwaejigogireul mon meogeoyo","p":"돼지고기를 몬 머거요"},"I can't eat pork."],[{"s":"바빠서 못 가요","r":"bappaseo mot kkayo","p" }.","sk":["g:tense","s:phrase"]},{"who":"Minji","s":{"s":"괜찮아요. 저도 방금 도착했어요. 뭐 마실래요?","r":"gwaenchanayo jeodo banggeum dochakaesseoyo mwo masillaeyo","p":"괜차나요 저도 방금 도차캐써요 뭐 마실래요"},"en":"That's okay. I just got here too. What would you like to drink?"},{"you":true,"opts":[{"s":"커피 마실래요.","r":"keopi masillaeyo"},{"s":"커피 마셨어요.","r":"keopi masyeosseoyo","p":"커피 마셔써요"},{"s":"커피 마시러요.","r":"keopi masireoyo"}],"a":0,"why":"{{{\"s\": \"ㄹ래요\", \"r\": \"rraeyo\"}}} = I'll have. {{{\"s\": \"마셨어요\", \"r\": \"masyeosseoyo\", \"p\": \"마셔써요\"}}} is past, and {{{\"s\": \"러\", \"r\": \"reo\"}}} needs {{{\"s\": \"가요\", \"r\": \"gayo\"}}} after it.","sk":["g:want"]},{"who":"Minji","s":{"s":"좋아요. 저도요.","r":"joayo jeodoyo","p":"조아요 저도요"},"en":"Okay. Me too."}],"k":[4,7,90,106,165,186,206,1196],"u":4},{"id":"L6-dlg-04","t":"dlg","sk":["g:neg","g:tense","g:want","s:phrase"],"title":"Weekend plans","turns":[{"who":"Junho","s":{"s":"내일 뭐 할 거예요?","r":"naeil mwo hal kkeoyeyo","p":"내일 뭐 할 꺼예요"},"en":"What are you going to do tomorrow?"},{"you":true,"opts":[{"s":"친구를 만날 거예요.","r":"chingureul mannal kkeoyeyo","p":"친구를 만날 꺼예요"},{"s":"친구를 만났어요.","r":"chingureul mannasseoyo","p":"친구를 만나써요"},{"s":"친구를 만나 본 적 있어요.","r":"chingureul manna bon jeok isseoyo","p":"친구를 만나 본 적 이써요"}],"a":0,"why":"He asks about tomorrow, so use the future: {{{\"s\": \"만날 거예요\", \"r\": \"mannal kkeoyeyo\", \"p\": \"만날 꺼예요\"}}}.","sk":["g:tense"]},{"who":"Junho","s":{"s":"일요일에는 시간 있어요?","r":"iryoireneun sigan isseoyo","p":"이료이레는 시간 이써요"},"en":"Do you have time on Sunday?"},{"you":true,"opts":[{"s":"네, 있어요. 왜요?","r":"ne isseoyo waeyo","p":"네 이써요 왜요"},{"s":"네, 없어요. 왜요?","r":"ne eopsseoyo waeyo","p":"네 업써요 왜요"},{"s":"아니요, 있어요. 왜요?","r":"aniyo isseoyo waeyo","p":"아니요 이써요 왜요"}],"a":0,"why":"Yes, I have time: {{{\"s\": \"네, 있어요\", \"r\": \"ne isseoyo\", \"p\": \"네 이써요\"}}}.","sk":["g:neg","s:phrase"]},{"who":"Junho","s":{"s":"한국 영화 보러 갈까요?","r":"hanguk yeonghwa boreo galkkayo"},"en":"Shall we go see a Korean movie?"},{"you":true,"opts":[{"s":"좋아요! 몇 시에 만날까요?","r":"joayo myeot ssie mannalkkayo","p":"조아요 멷 씨에 만날까요"},{"s":"좋아요! 몇 시에 만났어요?","r":"joayo myeot ssie mannasseoyo","p":"조아요 멷 씨에 만나써요"},{"s":"좋아요! 몇 시에 만나러 가요?","r":"joayo myeot ssie mannareo gayo","p":"조아요 멷 씨에 만나러 가요"}],"a":0,"why":"Suggest a plan with {{{\"s\": \"만날까요?\", \"r\": \"mannalkkayo\"}}}; {{{\"s\": \"만났어요?\", \"r\": \"mannasseoyo\", \"p\": \"만나써요\"}}} asks about the past.","sk":["g:want","g:tense"]}],"k":[65,108,155,165,166,208,224,225],"u":2},{"id":"L6-dlg-05","t":"dlg","sk":["g:neg","g:tense","g:want"],"title":"Talking about Korea","turns":[{"who":"Ms Kim","s":{"s":"한국에 가 본 적 있어요?","r":"hanguge ga bon jeok isseoyo","p":"한구게 가 본 적 이써요"},"en":"Have you ever been to Korea?"},{"you":true,"opts":[{"s":"아니요, 아직 없어요.","r":"aniyo ajik eopsseoyo","p":"아니요 아직 업써요"},{"s":"아니요, 아직 있어요.","r":"aniyo ajik isseoyo","p":"아니요 아직 이써요"},{"s":"네, 아직 없어요.","r":"ne ajik eopsseoyo","p":"네 아직 업써요"}],"a":0,"why":"Never been: {{{\"s\": \"아니요, 없어요\", \"r\": \"aniyo eopsseoyo\", \"p\": \"아니요 업써요\"}}}. {{{\"s\": \"아직\", \"r\": \"ajik\"}}} adds \"not yet\".","sk":["g:neg"]},{"who":"Ms Kim","s":{"s":"한국에 가고 싶어요?","r":"hanguge gago sipeoyo","p":"한구게 가고 시퍼요"},"en":"Do you want to go to Korea?"},{"you":true,"opts":[{"s":"네, 정말 가고 싶어요.","r":"ne jeongmal gago sipeoyo","p":"네 정말 가고 시퍼요"},{"s":"네, 정말 갔어요.","r":"ne jeongmal gasseoyo","p":"네 정말 가써요"},{"s":"네, 정말 가 봤어요.","r":"ne jeongmal ga bwasseoyo","p":"네 정말 가 봐써요"}],"a":0,"why":"Answer {{{\"s\": \"가고 싶어요?\", \"r\": \"gago sipeoyo\", \"p\": \"가고 시퍼요\"}}} with {{{\"s\": \"가고 싶어요\", \"r\": \"gago sipeoyo\", \"p\": \"가고 시퍼요\"}}}. You just said you have never been.","sk":["g:want","g:tense"]},{"who":"Ms Kim","s":{"s":"한국에 가면 뭐 할 거예요?","r":"hanguge gamyeon mwo hal kkeoyeyo","p":"한구게 가면 뭐 할 꺼예요"},"en":"If you go to Korea, what will you do?"},{"you":true,"opts":[{"s":"한국 음식을 먹을 거예요.","r":"hanguk eumsigeul meogeul kkeoyeyo","p":"한국 음시글 머글 꺼예요"},{"s":"한국 음식을 먹었어요.","r":"hanguk eumsigeul meogeosseoyo","p":"한국 음시글 머거써요"},{"s":"한국 음식을 먹으면요.","r":"hanguk eumsigeul meogeumyeonnyo","p":"한국 음시글 머그면뇨"}],"a":0,"why":"She asks about the future, so {{{\"s\": \"먹을 거예요\", \"r\": \"meogeul kkeoyeyo\", \"p\": \"머글 꺼예요\"}}}.","sk":["g:tense"]}],"k":[6,109,197,199],"u":7}],"roleplay":[{"title":"Monday catch-up","setup":"It's Monday morning. A Korean friend asks about your weekend. Tell her what you did and ask about hers.","persona":"You are Minji, a friendly Korean friend in Chicago. On the weekend you went to a Korean restaurant with friends on Saturday and stayed home on Sunday because it rained. Speak simple polite Korean (해요 style) using mostly words from levels 1-6: past -았/었어요, future -(으)ㄹ 거예요, -아서/어서, 못. Ask follow-up questions like 재미있었어요? and 뭐 먹었어요? Keep sentences short and never use casual speech.","opening":{"s":"주말에 뭐 했어요?","r":"jumare mwo haesseoyo","p":"주마레 뭐 해써요"},"opening_en":"What did you do on the weekend?","goals":["Say two things you did on the weekend","Say whether it was fun","Ask what she did","Say what you will do this evening"]},{"title":"Making a plan","setup":"A Korean friend wants to see a movie with you tomorrow. Accept, or say you can't and why, then agree on a time.","persona":"You are Junho, a Korean friend. You want to see a Korean movie tomorrow evening; showings are at six and eight o'clock. If the learner can't come, suggest another day. Speak simple polite Korean (해요 style) using mostly words from levels 1-6, including -(으)ㄹ까요?, -(으)러 가요, -(으)면 and 못. Keep sentences short.","opening":{"s":"내일 시간 있어요? 같이 영화 보러 갈까요?","r":"naeil sigan isseoyo gachi yeonghwa boreo galkkayo","p":"내일 시간 이써요 가치 영화 보러 갈까요"},"opening_en":"Are you free tomorrow? Shall we go see a movie together?","goals":["Accept, or say you can't and give a reason with -aseo / -eoseo","Suggest a time with -(eu)lkkayo","Say what else you will do tomorrow with -(eu)l geoyeyo","Ask if he has ever been to Korea"]}]},{"id":"L7","n":7,"title":"Making plans","goal":"Set a date and time, invite and decline politely, and keep in touch by phone and message.","notes":[{"h":"Months and dates","p":"Months are a Sino-Korean number plus {{{\"s\": \"월\", \"r\": \"wol\"}}}: {{{\"s\": \"일월\", \"r\": \"irwol\", \"p\": \"이뤌\"}}}, {{{\"s\": \"이월\", \"r\": \"iwol\"}}}, {{{\"s\": \"삼월\", \"r\": \"samwol\", \"p\": \"사뭘\"}}} and so on. Two months are irregular: June is {{{\"s\": \"유월\", \"r\": \"yuwol\"}}} (not six + {{{\"s\": \"월\", \"r\": \"wol\"}}}) and October is {{{\"s\": \"시월\", \"r\": \"siwol\"}}} (not ten + {{{\"s\": \"월\", \"r\": \"wol\"}}}). Days of the month are a Sino-Korean number plus {{{\"s\": \"일\", \"r\": \"il\"}}}: {{{\"s\": \"십오 일\", \"r\": \"sibo il\", \"p\": \"시보 일\"}}} is the 15th. To ask the date, say {{{\"s\": \"몇 월 며칠이에요?\", \"r\": \"myeodwol myeochirieyo\", \"p\": \"며둴 며치리에요\"}}} The word for \"which day\" is always spelled {{{\"s\": \"며칠\", \"r\": \"myeochil\"}}}. Sound point: {{{\"s\": \"몇 월\", \"r\": \"myeodwol\", \"p\": \"며둴\"}}} is said {{{\"s\": \"며둴\", \"r\": \"myeodwol\"}}}, because the final consonant of {{{\"s\": \"몇\", \"r\": \"myeot\", \"p\": \"멷\"}}} carries over as a d sound.","ex":[[{"s":"오늘 몇 월 며칠이에요?","r":"oneul myeodwol myeochirieyo","p":"오늘 며둴 며치리에요"},"What's the date today?"],[{"s":"유월 십오 일이에요.","r":"yuwol sibo irieyo","p":"유월 시보 이리에요"},"It's June 15th."],[{"s":"제 생일은 시월 이십 일이에요.","r":"je saengireun siwol isip irieyo","p":"제 생이른 시월 이십 이리에요"},"My birthday is October 20th."]]},{"h":"Can and can't","p":"Add {{{\"s\": \"-ㄹ 수 있어요\", \"r\": \"-r ssu isseoyo\", \"p\": \"-ㄹ 쑤 이써요\"}}} to a verb stem ending in a vowel ({{{\"s\": \"가다\", \"r\": \"gada\"}}} becomes {{{\"s\": \"갈 수 있어요\", \"r\": \"gal ssu isseoyo\", \"p\": \"갈 쑤 이써요\"}}}) and {{{\"s\": \"-을 수 있어요\", \"r\": \"-eul ssu isseoyo\", \"p\": \"-을 쑤 이써요\"}}} to a stem ending in a consonant ({{{\"s\": \"먹다\", \"r\": \"meoktta\", \"p\": \"먹따\"}}} becomes {{{\"s\": \"먹을 수 있어요\", \"r\": \"meogeul ssu isseoyo\", \"p\": \"머글 쑤 이써요\"}}}). Swap {{{\"s\": \"있어요\", \"r\": \"isseoyo\", \"p\": \"이써요\"}}} for {{{\"s\": \"없어요\", \"r\": \"eopsseoyo\", \"p\": \"업써요\"}}} to say you can't. Never put {{{\"s\": \"못\", \"r\": \"mot\", \"p\": \"몯\"}}} or {{{\"s\": \"안\", \"r\": \"an\"}}} in front of {{{\"s\": \"있어요\", \"r\": \"isseoyo\", \"p\": \"이써요\"}}} here. Sound point: the {{{\"s\": \"수\", \"r\": \"su\"}}} is said with a tense s, {{{\"s\": \"쑤\", \"r\": \"ssu\"}}}: {{{\"s\": \"갈 수 있어요\", \"r\": \"gal ssu isseoyo\", \"p\": \"갈 쑤 이써요\"}}} sounds like {{{\"s\": \"갈 쑤 이써요\", \"r\": \"gal ssu isseoyo\"}}}.","ex":[[{"s":"내일 갈 수 있어요.","r":"naeil gal ssu isseoyo","p":"내일 갈 쑤 이써요"},"I can go tomorrow."],[{"s":"오늘은 갈 수 없어요.","r":"oneureun gal ssu eopsseoyo","p":"오느른 갈 쑤 업써요"},"I can't go today."],[{"s":"몇 시에 올 수 있어요?","r":"myeot ssie ol ssu isseoyo","p":"멷 씨에 올 쑤 이써요"},"What time can you come?"]]},{"h":"I'll do it: promises and offers","p":"Use {{{\"s\": \"-ㄹ게요\", \"r\": \"-rkkeyo\", \"p\": \"-ㄹ께요\"}}} (after a vowel) or {{{\"s\": \"-을게요\", \"r\": \"-eulkkeyo\", \"p\": \"-을께요\"}}} (after a consonant) when you promise or offer to do something for the other person: \"I'll text you\", \"I'll wait\". It is only for things you yourself will do. Compare {{{\"s\": \"-ㄹ까요?\", \"r\": \"-rkkayo\"}}}, which asks \"shall we / shall I?\", and {{{\"s\": \"-세요\", \"r\": \"-seyo\"}}}, which asks the other person to do it. Sound point: the {{{\"s\": \"게\", \"r\": \"ge\"}}} is said tense, {{{\"s\": \"께\", \"r\": \"kke\"}}}: {{{\"s\": \"보낼게요\", \"r\": \"bonaelkkeyo\", \"p\": \"보낼께요\"}}} sounds like {{{\"s\": \"보낼께요\", \"r\": \"bonaelkkeyo\"}}}.","ex":[[{"s":"제가 문자 보낼게요.","r":"jega munjja bonaelkkeyo","p":"제가 문짜 보낼께요"},"I'll text you."],[{"s":"곧 갈게요.","r":"got kkalkkeyo","p":"곧 깔께요"},"I'll be there soon."],[{"s":"저는 이거 먹을게요.","r":"jeoneun igeo meogeulkkeyo","p":"저는 이거 머글께요"},"I'll have this one."]]},{"h":"Inviting, saying no, and decided plans","p":"Invite with {{{\"s\": \"같이\", \"r\": \"gachi\", \"p\": \"가치\"}}} (together) and {{{\"s\": \"-ㄹ래요?\", \"r\": \"-rraeyo\"}}} or {{{\"s\": \"-ㄹ까요?\", \"r\": \"-rkkayo\"}}}: {{{\"s\": \"같이 영화 볼래요?\", \"r\": \"gachi yeonghwa bollaeyo\", \"p\": \"가치 영화 볼래요\"}}} To say no kindly, apologize, give a reason with {{{\"s\": \"약속이 있어요\", \"r\": \"yakssogi isseoyo\", \"p\": \"약쏘기 이써요\"}}} (I have plans), and offer another time: {{{\"s\": \"다음에 같이 가요\", \"r\": \"daeume gachi gayo\", \"p\": \"다으메 가치 가요\"}}}. When a plan is settled, use {{{\"s\": \"-기로 했어요\", \"r\": \"-giro haesseoyo\", \"p\": \"-기로 해써요\"}}} \"(we) decided / agreed to\": {{{\"s\": \"만나기로 했어요\", \"r\": \"mannagiro haesseoyo\", \"p\": \"만나기로 해써요\"}}}. Sound point: {{{\"s\": \"같이\", \"r\": \"gachi\", \"p\": \"가치\"}}} is said {{{\"s\": \"가치\", \"r\": \"gachi\"}}}.","ex":[[{"s":"같이 영화 볼래요?","r":"gachi yeonghwa bollaeyo","p":"가치 영화 볼래요"},"Want to see a movie together?"],[{"s":"미안해요, 그날은 약속이 있어요.","r":"mianhaeyo geunareun yakssogi isseoyo","p":"미안해요 그나른 약쏘기 이써요"},"Sorry, I have plans that day."],[{"s":"토요일에 만나기로 했어요.","r":"toyoire mannagiro haesseoyo","p":"토요이레 만나기로 해써요"},"We decided to meet on Saturday."]]},{"h":"Phone and messages","p":"{{{\"s\": \"전화\", \"r\": \"jeonhwa\"}}} is a phone call, {{{\"s\": \"문자\", \"r\": \"munjja\", \"p\": \"문짜\"}}} a text message, {{{\"s\": \"카톡\", \"r\": \"katok\"}}} a KakaoTalk message (the app almost every Korean uses), and {{{\"s\": \"답장\", \"r\": \"dapjjang\", \"p\": \"답짱\"}}} a reply. You {{{\"s\": \"보내다\", \"r\": \"bonaeda\"}}} (send) a text and {{{\"s\": \"주다\", \"r\": \"juda\"}}} (give) someone a call: {{{\"s\": \"전화 주세요\", \"r\": \"jeonhwa juseyo\"}}}. Phone numbers are read digit by digit with Sino-Korean numbers, and zero is {{{\"s\": \"공\", \"r\": \"gong\"}}}. Sound points: {{{\"s\": \"문자\", \"r\": \"munjja\", \"p\": \"문짜\"}}} is said {{{\"s\": \"문짜\", \"r\": \"munjja\"}}}, {{{\"s\": \"약속\", \"r\": \"yakssok\", \"p\": \"약쏙\"}}} is said {{{\"s\": \"약쏙\", \"r\": \"yakssok\"}}} and {{{\"s\": \"답장\", \"r\": \"dapjjang\", \"p\": \"답짱\"}}} is said {{{\"s\": \"답짱\", \"r\": \"dapjjang\"}}}.","ex":[[{"s":"전화번호가 뭐예요?","r":"jeonhwabeonhoga mwoyeyo"},"What's your phone number?"],[{"s":"카톡 주세요.","r":"katok jjuseyo","p":"카톡 쭈세요"},"Message me on KakaoTalk."],[{"s":"아직 답장이 없어요.","r":"ajik ttapjjangi eopsseoyo","p":"아직 땁짱이 업써요"},"There's no reply yet."]]}],"vocab":[{"id":"L7-v-00","t":{"s":"일월","r":"irwol","p":"이뤌"},"en":"January","topic":"Dates","note":"Months are Sino-Korean numbers plus {{{\"s\": \"월\", \"r\": \"wol\"}}}.","avoid":[]},{"id":"L7-v-01","t":{"s":"이월","r":"iwol"},"en":"February","topic":"Dates","note":"","avoid":[]},{"id":"L7-v-02","t":{"s":"삼월","r":"samwol","p":"사뭘"},"en":"March","topic":"Dates","note":"","avoid":[]},{"id":"L7-v-03","t":{"s":"사월","r":"sawol"},"en":"April","topic":"Dates","note":"","avoid":[]},{"id":"L7-v-04","t":{"s":"오월","r":"owol"},"en":"May","topic":"Dates","note":"","avoid":[]},{"id":"L7-v-05","t":{"s":"유월","r":"yuwol"},"en":"June","topic":"Dates","note":"Irregular: not {{{\"s\": \"육월\", \"r\": \"yugwol\", \"p\": \"유궐\"}}}.","avoid":[]},{"id":"L7-v-06","t":{"s":"칠월","r":"chirwol","p":"치뤌"},"en":"July","topic":"Dates","note":"","avoid":[]},{"id":"L7-v-07","t":{"s":"팔월","r":"parwol","p":"파뤌"},"en":"August","topic":"Dates","note":"","avoid":[]},{"id":"L7-v-08","t":{"s":"구월","r":"guwol"},"en":"September","topic":"Dates","note":"","avoid":[]},{"id":"L7-v-09","t":{"s":"시월","r":"siwol"},"en":"October","topic":"Dates","note":"Irregular: not {{{\"s\": \"십월\", \"r\": \"sibwol\", \"p\": \"시붤\"}}}.","avoid":[]},{"id":"L7-v-10","t":{"s":"십일월","r":"sibirwol","p":"시비뤌"},"en":"November","topic":"Dates","note":"","avoid":[]},{"id":"L7-v-11","t":{"s":"십이월","r":"sibiwol","p":"시비월"},"en":"December","topic":"Dates","note":"","avoid":[]},{"id":"L7-v-12","t":{"s":"오늘 몇 월 며칠이에요?","r":"oneul myeodwol myeochirieyo","p":"오늘 며둴 며치리에요"},"en":"What's the date today?","topic":"Dates","note":"{{{\"s\": \"며칠\", \"r\": \"myeochil\"}}} = which day of the month. {{{\"s\": \"몇 월\", \"r\": \"myeodwol\", \"p\": \"며둴\"}}} is said {{{\"s\": \"며둴\", \"r\": \"myeodwol\"}}}.","avoid":[]},{"id":"L7-v-13","t":{"s
