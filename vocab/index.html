<script>
"use strict";
/* ============ helpers ============ */
const $ = id => document.getElementById(id);
const esc = SHUI.esc;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickN = (a, n) => shuffle(a).slice(0, n);
const getJSON = url => fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const nowMin = () => Math.floor(Date.now() / 60000);
const DAY = 1440;
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => ymd(new Date());
const hash = s => { let a = 2166136261; for (let i = 0; i < s.length; i++) { a ^= s.charCodeAt(i); a = Math.imul(a, 16777619); } return a >>> 0; };
const playBtn = (say, mini) => `<button class="sh-play${mini ? " mini" : ""}" type="button" data-say="${esc(say)}" aria-label="Play: ${esc(say)}">${SHUI.icon("play")}</button>`;
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

/* ============ content ============ */
const DATA_URL = "data.796a0509a3.json", GLOSS_URL = "gloss.53d1e78192.json"; // file names filled in by build.py
let DATA = [];
const BY = {};
const TR = {
  vocab:     { name: "Vocabulary",       min: -2, max: 10, icon: "words", blurb: "Words from everyday to rare, ranked with real word-frequency data." },
  roots:     { name: "Word roots",       min: 1, max: 5,  icon: "blocks", blurb: "Prefixes, roots and suffixes that unlock thousands of words." },
  idioms:    { name: "Idioms & phrases", min: 1, max: 5,  icon: "chat", blurb: "Expressions, set phrases and foreign phrases used in English." },
  refs:      { name: "References",       min: 1, max: 5,  icon: "columns", blurb: "Allusions from myth, scripture, literature, history, science and film." },
  knowledge: { name: "Knowledge",        min: 1, max: 5,  icon: "globe", blurb: "Core ideas from science, health, history, law, money and the arts." },
  reasoning: { name: "Reasoning",        min: 1, max: 5,  icon: "bulb", blurb: "Spot faulty arguments and biases; solve language and logic problems." }
};
const TORDER = ["vocab", "roots", "idioms", "refs", "knowledge", "reasoning"];
const LIST = {}, PROB = {}, PAS = {}, PASLV = {}; // PAS: reading passages by id (not cards); PASLV: passage ids by level
TORDER.forEach(t => { LIST[t] = {}; });
function index(d) {
  DATA = d.items;
  DATA.forEach(x => {
    BY[x.id] = x;
    if (x.id.startsWith("p-")) { (PROB[x.level] = PROB[x.level] || []).push(x.id); return; }
    (LIST[x.track][x.level] = LIST[x.track][x.level] || []).push(x.id);
  });
  d.passages.forEach(g => { PAS[g.id] = g; (PASLV[g.level] = PASLV[g.level] || []).push(g.id); });
  TORDER.forEach(t => { for (const l in LIST[t]) LIST[t][l].sort((a, b) => hash(a) - hash(b)); });
  for (const l in PROB) PROB[l].sort((a, b) => hash(a) - hash(b));
}
const VNAMES = { "-2": ["Starter 1", "S1"], "-1": ["Starter 2", "S2"], 0: ["Foundations", "F"] };
const lvName = (t, l) => t === "vocab" && VNAMES[l] ? VNAMES[l][0] : "Stage " + l; // "Level" is the points level
const lvIcon = (t, l) => t === "vocab" && VNAMES[l] ? VNAMES[l][1] : String(l);
const isProb = id => id.startsWith("p-");
const isConcept = id => id.startsWith("c-");
/* syn/ant only for vocabulary: other tracks' wrong options are long phrases, so a one-word answer would stand out. */
const canAsk = (x, qt) => qt === "syn" || qt === "ant" ? x.track === "vocab" && !!(x[qt] && x[qt].length) : qt === "also" ? !!x.also : true;
const formsOf = x => [x.term, x.cloze && x.cloze.a, ...(x.forms || []).map(f => f.replace(/\s*\(.*\)\s*/, ""))].filter(Boolean).map(f => f.trim().toLowerCase());
const INFL = /^(?:s|es|ed|ing|er|est|ly|en|ies|ied|ier|iest|ily)$/;
const WORD = /(\p{L}+(?:['’-]\p{L}+)*)/gu; // a word: letters with internal apostrophes or hyphens (captured, so split() keeps the words)
/* Is the single word w (any case) the item's term or one of its forms, allowing regular endings
   (cut → cuts, notice → noticed, carry → carried, stop → stopped)? Terms under 3 letters only match exactly. */
function isFormOf(w, x) {
  w = w.toLowerCase().replace(/’/g, "'");
  return formsOf(x).some(f => w === f || f.length > 2 && [f, f.replace(/[ey]$/, ""), f + f.slice(-1)].some(b => w.startsWith(b) && INFL.test(w.slice(b.length))));
}
const countTrack = t => Object.values(LIST[t]).reduce((s, a) => s + a.length, 0) + (t === "reasoning" ? Object.values(PROB).reduce((s, a) => s + a.length, 0) : 0);
const kindWord = x => x.track === "vocab" ? "word" : x.track === "idioms" ? "phrase" : x.track === "refs" ? "reference" : x.track === "knowledge" ? "term" : x.track === "roots" ? "word part" : "idea";

/* ============ progress state ============ */
const DEF_SET = { goal: 5, mix: "focus", typed: "some", tracks: { roots: true, idioms: true, refs: true, knowledge: true, reasoning: true }, ts: 0 };
function freshState() { return { v: 1, set: JSON.parse(JSON.stringify(DEF_SET)), pl: null, lv: {}, day: { d: "", n: 0, r: 0 }, hist: {}, streak: { last: "", n: 0 }, ret: [0, 0], cred: {}, pts: 0 }; }
let ST = Object.assign(freshState(), store.get("wp:state", {}));
function normSet() { ST.set = Object.assign(JSON.parse(JSON.stringify(DEF_SET)), ST.set || {}); ST.set.tracks = Object.assign({}, DEF_SET.tracks, ST.set.tracks || {}); }
normSet();
let R = store.get("wp:srs", {});         // id -> [stage, due (minutes), seen, right, last (minutes)]
let RUN = store.get("wp:run", null);     // placement test in progress
let RUNCLR = store.get("wp:runclr", 0);  // when the last placement run was finished or abandoned
const DEV = Object.assign({ voice: "", rate: "0.95", auto: true }, store.get("wp:device", {}));
const saveDev = () => store.set("wp:device", DEV);

let db = null, uid = null, dirty = new Set(), writing = false, wt = null;
function setSync(t) { $("sync").textContent = t; const a = $("s-sync"); if (a) a.textContent = t; }
function save(...names) {
  if (names.includes("state")) store.set("wp:state", ST);
  if (names.includes("srs")) store.set("wp:srs", R);
  if (names.includes("run")) { store.set("wp:run", RUN); store.set("wp:runclr", RUNCLR); }
  names.forEach(n => dirty.add(n));
  if (db) { clearTimeout(wt); wt = setTimeout(flush, 1500); }
}
function docBody(n) {
  if (n === "state") return ST;
  if (n === "srs") return { r: R, v: 1, resetAt: ST.resetAt || 0 };
  return { run: RUN, v: 1, ts: RUN ? RUN.ts : RUNCLR, resetAt: ST.resetAt || 0 };
}
/* Read the account copy and merge it into this device before writing, so a page left open
   on one device never overwrites work done on another. */
async function pull() {
  const qs = await db.collection("data/users/" + uid).get();
  const docs = {}; qs.docs.forEach(d => { docs[d.id] = d.data(); });
  applyServer(docs);
  store.set("wp:state", ST); store.set("wp:srs", R); store.set("wp:run", RUN); store.set("wp:runclr", RUNCLR);
}
function applyServer(docs) {
  const sv = docs.state, ss = docs.srs, sr = docs.run;
  const srvReset = (sv && sv.resetAt) || 0, locReset = ST.resetAt || 0;
  const placing = SESSION && SESSION.kind === "place";
  if (srvReset > locReset) { // progress was reset on another device: take the account copy as it is
    ST = Object.assign(freshState(), sv); normSet();
    R = ss && (ss.resetAt || 0) >= srvReset ? (ss.r || {}) : {};
    if (!placing) { RUN = sr && sr.run && (sr.run.ts || 0) > srvReset ? sr.run : null; RUNCLR = Math.max(RUNCLR, srvReset); }
    return;
  }
  if (sv && srvReset === locReset) mergeState(sv);
  if (ss && (ss.resetAt || 0) >= locReset) mergeR(ss.r);
  if (sr && !placing && (sr.ts || 0) > locReset) {
    if (sr.run && (sr.run.ts || 0) > Math.max(RUN ? RUN.ts || 0 : 0, RUNCLR)) RUN = sr.run;
    else if (!sr.run && (sr.ts || 0) > (RUN ? RUN.ts || 0 : 0)) { RUN = null; RUNCLR = Math.max(RUNCLR, sr.ts || 0); }
  }
  if (!placing && RUN && ST.pl && (ST.pl.at || 0) > (RUN.ts || 0)) { RUN = null; RUNCLR = Math.max(RUNCLR, ST.pl.at); }
}
async function flush() {
  if (!db || writing || !dirty.size) return;
  writing = true;
  let names = [];
  try {
    await pull();
    names = [...dirty]; dirty.clear();
    for (const n of names) await db.collection("data/users/" + uid).doc(n).set(docBody(n));
    const sd = statsDoc(), key = JSON.stringify(sd);
    if (key !== statsSent) { await db.collection("data/users/" + uid).doc("stats").set(Object.assign(sd, { at: Date.now() })); statsSent = key; }
    setSync("Progress saved to your account");
  }
  catch (e) { names.forEach(n => dirty.add(n)); setSync("Couldn't reach your account just now; progress is kept on this device"); }
  finally { writing = false; if (dirty.size) wt = setTimeout(flush, 5000); }
}
/* The small summary the Study Hall home page shows: points, level, the next thing to do and reviews due. */
let statsSent = "";
function statsDoc() {
  const nToday = ST.day.d === today() ? ST.day.n : 0;
  const next = RUN ? `Placement test, part ${RUN.sec + 1} of ${PSECS.length}` : !ST.pl ? "Placement test"
    : nToday < ST.set.goal ? `Today's set, ${ST.set.goal - nToday} new` : "Read a passage";
  return { pts: ST.pts, level: SHUI.points.levelOf(ST.pts).level, next, due: dueList().length };
}
const TABVIEWS = ["today", "tracks", "progress", "settings"];
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "hidden") return flush();
  if (!db || writing) return;
  try { await pull(); if (!SESSION && TABVIEWS.includes(VIEW.name)) render(); } catch (e) {}
});
window.addEventListener("pagehide", () => flush());

function mergeState(o) {
  if (!o || !o.v) return;
  if ((o.set && o.set.ts || 0) > (ST.set.ts || 0)) { ST.set = Object.assign(JSON.parse(JSON.stringify(DEF_SET)), o.set); ST.set.tracks = Object.assign({}, DEF_SET.tracks, o.set.tracks || {}); }
  if (o.pl && (!ST.pl || (o.pl.at || 0) > (ST.pl.at || 0))) ST.pl = o.pl;
  for (const t in o.lv || {}) {
    ST.lv[t] = ST.lv[t] || {};
    for (const l in o.lv[t]) {
      const a = ST.lv[t][l] || {}, b = o.lv[t][l];
      ST.lv[t][l] = { best: Math.max(a.best || 0, b.best || 0), passed: !!(a.passed || b.passed), n: Math.max(a.n || 0, b.n || 0), at: Math.max(a.at || 0, b.at || 0) };
    }
  }
  for (const d in o.hist || {}) { const a = ST.hist[d] || [0, 0, 0, 0, 0], b = o.hist[d]; ST.hist[d] = a.map((v, i) => Math.max(v, b[i] || 0)); }
  if (o.day) { if (o.day.d === ST.day.d) { ST.day.n = Math.max(ST.day.n, o.day.n); ST.day.r = Math.max(ST.day.r, o.day.r); } else if (o.day.d > ST.day.d) ST.day = o.day; }
  if (o.streak && (o.streak.last > ST.streak.last || (o.streak.last === ST.streak.last && o.streak.n > ST.streak.n))) ST.streak = o.streak;
  if (o.ret) ST.ret = [Math.max(ST.ret[0], o.ret[0]), Math.max(ST.ret[1], o.ret[1])];
  if (o.cred && !Object.keys(ST.cred || {}).length) ST.cred = o.cred;
  if ((o.pts || 0) > (ST.pts || 0)) ST.pts = o.pts; // points only ever grow
}
function mergeR(o) { let ch = false; for (const id in o || {}) { if (!R[id] || (o[id][4] || 0) > (R[id][4] || 0)) R[id] = o[id]; else if ((R[id][4] || 0) > (o[id][4] || 0)) ch = true; } return ch; }

async function connect() {
  try {
    if (!window.claude || !window.claude.use) return;
    const user = await window.claude.use("user"), d = await window.claude.use("db");
    if (!user || !d) return;
    const id = await user.id(); if (!id) return;
    db = d; uid = id;
    await pull();
    ["state", "srs", "run"].forEach(n => dirty.add(n));
    setSync("Progress saved to your account");
    flush();
    if (!SESSION && TABVIEWS.includes(VIEW.name)) render();
  } catch (e) { setSync("Progress saved on this device (account sync unavailable)"); }
}

/* ============ audio (device voices) ============ */
let voices = [], speakSeq = 0;
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
function astatus(msg) { const el = $("astatus"); el.hidden = !msg; el.innerHTML = msg ? `<div class="spread"><span>${esc(msg)}</span><button class="linkbtn" type="button" id="astx">Dismiss</button></div>` : ""; if (msg) $("astx").onclick = () => astatus(""); }
function loadVoices() {

function newRun() {

    const qs = [];
    for (let l = TR[t].min; l <= TR[t].max; l++) {
      if (t === "reasoning") { pickN(PROB[l] || [], 3).forEach(id => qs.push(id)); pickN(LIST.reasoning[l] || [], 1).forEach(id => qs.push(id)); }

/* Vocabulary placement. A level passes at 80% of the words asked there: 4 of 5 for a lone block, 12 of 15 once confirmed.

   Then 5-word blocks probe upward from P + 2 while the level below scored at least 40%.

    return;
  }
  const doneGoal = nToday >= goal;
  h += `<section class="sh-card"><div class="spread"><h2>${doneGoal && !due ? "Done for today" : "Today"}</h2>${streak ? `<span class="sh-tag gold">${streak}-day streak</span>` : ""}</div>
    <div class="sh-progress grow" role="progressbar" aria-label="New items today" aria-valuemin="0" aria-valuemax="${+goal || 0}" aria-valuenow="${+nToday || 0}"><i style="width:${+pct || 0}%"></i></div>
    <p class="sub">${nToday} of ${goal} new today. ${due} review${due === 1 ? "" : "s"} due. ${rToday} answered today.</p>
    ${(!doneGoal || due) ? `<button class="sh-btn primary block" type="button" id="daily">${!doneGoal ? `Start today's session` : `Review ${due} due`}</button>` : ""}
    <p class="sub">Want more? Learn</p>
    <div class="three"><button class="sh-btn sm" type="button" data-more="5">5 more</button><button class="sh-btn sm" type="button" data-more="10">10 more</button><button class="sh-btn sm" type="button" data-more="20">20 more</button></div>
  </section>
  <ul class="list"><li><button class="sh-tile" type="button" id="read"><span class="sh-ic">${SHUI.icon("book")}</span><span class="tx"><span class="t">Read a passage</span><span class="d">3 questions</span></span></button></li>
    ${trackOn("reasoning") ? `<li><button class="sh-tile" type="button" id="workout"><span class="sh-ic">${SHUI.icon(TR.reasoning.icon)}</span><span class="tx"><span class="t">Reasoning workout</span><span class="d">5 problems</span></span></button></li>` : ""}</ul>`;
  h += `<section class="sh-card">${searchBox()}</section>`;
  $("main").innerHTML = h;
  bindSearch();
  if ($("pres")) $("pres").onclick = () => startPlacement(true);
  if ($("daily")) $("daily").onclick = () => { const s = buildDaily(); if (!s.length) return toast("Nothing due right now. Try “Learn 5 more”."); startSession("daily", s, "Today"); };
  document.querySelectorAll("[data-more]").forEach(b => b.onclick = () => { const s = buildDaily(+b.dataset.more); if (!s.length) return toast("You've studied everything in your switched-on tracks."); startSession("more", s, "More"); });
  $("read").onclick = () => { const g = pickPassage(); if (!g) return toast("You've read every passage. Ones you missed come back after a day."); startReading(g); };
  if ($("workout")) $("workout").onclick = () => { const p = pickProblems(5); if (!p.length) return toast("You've solved every problem. Wrong ones come back after a day."); startSession("practice", p.map(id => ({ t: "q", id, src: "prob" })), "Workout"); };
}
function toast(msg) { astatus(msg); setTimeout(() => astatus(""), 4000); }
function trackCounts(t) {
  let learned = 0, total = 0, mastered = 0;
  for (const l in LIST[t]) for (const id of LIST[t][l]) { total++; const s = statusOf(id); if (s === "l" || s === "k" || s === "m") learned++; if (s === "m") mastered++; }
  if (t === "reasoning") for (const l in PROB) for (const id of PROB[l]) { total++; if (R[id] && R[id][0] >= 1) learned++; }
  return { learned, total, mastered };
}
function trackLi(t) {
  const c = trackCounts(t); const l = cur(t);
  return `<li><button class="sh-tile" type="button" data-track="${t}"><span class="sh-ic">${SHUI.icon(TR[t].icon)}</span><span class="tx"><span class="t">${esc(TR[t].name)}</span><span class="d">${esc(lvName(t, l))}: ${c.learned} of ${c.total} learned</span><span class="sh-progress thin"><i style="width:${Math.round(100 * c.learned / c.total)}%"></i></span></span></button></li>`;
}
function viewTracks() {
  $("main").innerHTML = `<div class="head"><h1>Tracks</h1><p class="sub">Vocabulary is the core. The other tracks build the knowledge and reasoning that strong readers draw on. Switch tracks on or off in Settings.</p></div>
    <ul class="list">${TORDER.map(t => trackLi(t)).join("")}</ul><section class="sh-card">${searchBox()}</section>`;
  document.querySelectorAll("[data-track]").forEach(b => b.onclick = () => go("tracks", { t: b.dataset.track }));
  bindSearch();
}
function viewTrack(t) {
  const c = cur(t);
  let rows = "";
  for (let l = TR[t].min; l <= TR[t].max; l++) {
    const ids = idsAt(t, l); let learned = 0; ids.forEach(id => { const s = statusOf(id); if (s === "l" || s === "k" || s === "m" || (isProb(id) && R[id] && R[id][0] >= 1)) learned++; });
    const rec = lvRec(t, l);
    const tag = rec && rec.passed ? `<span class="sh-tag good">Passed ${+rec.best || 0}%</span>` : l === c ? `<span class="sh-tag gold">Current</span>` : l < c ? `<span class="sh-tag mute">Placed</span>` : rec ? `<span class="sh-tag mute">Best ${+rec.best || 0}%</span>` : "";
    rows += `<li><button class="sh-tile" type="button" data-lv="${l}"><span class="sh-ic">${esc(lvIcon(t, l))}</span><span class="tx"><span class="t">${esc(lvName(t, l))} ${tag}</span><span class="d">${learned} of ${ids.length} learned</span><span class="sh-progress thin"><i style="width:${Math.round(100 * learned / ids.length)}%"></i></span></span></button></li>`;
  }
  $("main").innerHTML = `<div class="head"><button class="linkbtn" type="button" id="back">← All tracks</button><h1>${esc(TR[t].name)}</h1><p class="sub">${esc(TR[t].blurb)}</p>
    <p class="sub">New items come from your current stage first. Pass a stage's test with <b>above 90%</b> to move up. You can open, study or test any stage.</p>
    ${trackOn(t) ? "" : `<p class="note">This track is switched off, so it isn't in your daily sessions. Turn it on in Settings.</p>`}</div>
    <ul class="list">${rows}</ul>`;
  $("back").onclick = () => go("tracks");
  document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => go("tracks", { t, l: +b.dataset.lv }));
}
function viewLevel(t, l) {
  const ids = idsAt(t, l); const rec = lvRec(t, l);
  const unseen = ids.filter(id => !isProb(id) && !seen(id));
  $("main").innerHTML = `<section class="sh-card"><button class="linkbtn" type="button" id="back">← ${esc(TR[t].name)}</button>
    <h3>${esc(TR[t].name)}</h3><h2>${esc(lvName(t, l))}</h2>
    <p class="sub">${ids.length} items${rec ? `. Best test score ${+rec.best || 0}%${rec.passed ? " (passed)" : ""}` : ""}</p>
    <div class="row"><button class="sh-btn primary" type="button" id="ltest">Take the stage test (${Math.min(testSize(t), ids.length)} questions)</button>
    ${unseen.length ? `<button class="sh-btn" type="button" id="lstudy">Learn ${Math.min(10, unseen.length)} new from this stage</button>` : ""}</div>
    <p class="hint legend"><span><span class="dot"></span> new</span><span><span class="dot l"></span> learning</span><span><span class="dot k"></span> known</span><span><span class="dot m"></span> mastered</span></p>
    <ul class="words">${ids.map(itemLi).join("")}</ul></section>`;
  bindItemLis();
  $("back").onclick = () => go("tracks", { t });
  $("ltest").onclick = () => startTest(t, l);
  if ($("lstudy")) $("lstudy").onclick = () => {
    const pick = unseen.slice(0, 10); const steps = [];
    for (let g = 0; g < pick.length; g += 3) { const grp = pick.slice(g, g + 3); grp.forEach(id => steps.push({ t: "learn", id })); grp.forEach(id => steps.push({ t: "q", id, src: "new", qt: "mean" })); }
    startSession("more", steps, "Level study");
  };
}
function viewProgress() {
  let learned = 0, known = 0, mastered = 0;
  for (const id in R) { if (!BY[id] || isProb(id)) continue; const s = statusOf(id); if (s === "l" || s === "k" || s === "m") learned++; if (s === "k" || s === "m") known++; if (s === "m") mastered++; }
  const ret = ST.ret[1] ? Math.round(100 * ST.ret[0] / ST.ret[1]) + "%" : "–";
  const days = []; for (let i = 13; i >= 0; i--) { const dd = new Date(Date.now() - i * 864e5); days.push([ymd(dd), dd]); }
  const vals = days.map(([k]) => { const h = ST.hist[k] || [0, 0, 0]; return h[0] + h[1]; }); const mx = Math.max(1, ...vals);
  const hard = Object.keys(R).filter(id => BY[id] && !isProb(id) && R[id][2] - R[id][3] >= 2).sort((a, b) => (R[b][2] - R[b][3]) - (R[a][2] - R[a][3])).slice(0, 15);
  const vocabWords = Object.keys(R).filter(id => id.startsWith("v-") && (statusOf(id) === "k" || statusOf(id) === "m")).length;
  const read = Object.keys(R).filter(id => PAS[id]).length;
  $("main").innerHTML = `<h1>Progress</h1><section class="sh-card">
    <div class="stats"><div class="sh-stat"><b>${learned}</b><span>items studied</span></div><div class="sh-stat"><b>${known}</b><span>known</span></div><div class="sh-stat"><b>${mastered}</b><span>mastered</span></div><div class="sh-stat"><b>${ret}</b><span>remembered after a week or more</span></div><div class="sh-stat"><b>${read}</b><span>passages read</span></div></div>
    <p class="hint"><b>Known</b> means answered correctly at spaced intervals for a week or more. <b>Mastered</b> means still correct after more than a month. <b>Remembered</b> is the share of answers that were right on items last seen at least a week before.</p>
    <p class="sub">Vocabulary words known: <b>${vocabWords}</b> of ${countTrack("vocab")}.</p></section>
  <section class="sh-card"><h3>Last 14 days (answers + new items)</h3><div class="chart" aria-label="Activity chart">${vals.map(v => `<div style="height:${Math.round(100 * v / mx)}%" title="${v}"></div>`).join("")}</div>
    <div class="chartx">${days.map(([, dd]) => `<span>${dd.getDate()}</span>`).join("")}</div></section>
  <section class="sh-card"><h3>By track</h3><table><thead><tr><th>Track</th><th>Stage</th><th>Learned</th><th>Tests passed</th></tr></thead><tbody>
    ${TORDER.map(t => { const c = trackCounts(t); const p = Object.values(ST.lv[t] || {}).filter(r => r.passed).length; return `<tr><td>${esc(TR[t].name)}</td><td class="nw">${esc(lvName(t, cur(t)))}</td><td>${c.learned}/${c.total}</td><td>${p}</td></tr>`; }).join("")}</tbody></table></section>
  ${hard.length ? `<section class="sh-card"><h3>Hardest for you</h3><ul class="words">${hard.map(itemLi).join("")}</ul><button class="sh-btn" type="button" id="hardgo">Practice these</button></section>` : ""}
  <section class="sh-card"><h3>Placement</h3>${ST.pl ? `<p>${ST.pl.manual ? "You chose your starting stage" : "Taken " + new Date(ST.pl.at).toLocaleDateString()}.</p><div class="row"><button class="sh-btn" type="button" id="seeres">See results</button>${ST.pl.manual ? `<button class="sh-btn" type="button" id="chstart">Change starting stage</button>` : ""}<button class="sh-btn" type="button" id="retake">${ST.pl.manual ? "Take the test" : "Retake the test"}</button></div>` : `<p>Not taken yet.</p><button class="sh-btn primary" type="button" id="retake">Take the placement test</button>`}</section>`;
  bindItemLis();
  if ($("hardgo")) $("hardgo").onclick = () => startSession("practice", hard.map(id => ({ t: "q", id, src: "rev" })), "Practice");
  if ($("seeres")) $("seeres").onclick = () => showResults(false);
  if ($("chstart")) $("chstart").onclick = () => chooseStart();
  if ($("retake")) $("retake").onclick = () => ST.pl && !ST.pl.manual ? confirmRetake() : startPlacement(false);
}
function viewSettings() {
  const s = ST.set;
  $("main").innerHTML = `<h1>Settings</h1><section class="sh-card"><h2>Lessons</h2>
    <label class="f">New items per day
      <select id="s-goal">${[1, 2, 3, 5, 8, 10, 15, 20, 30, 50].map(n => `<option value="${n}"${n === s.goal ? " selected" : ""}>${n}</option>`).join("")}</select></label>
    <p class="hint">Reviews of things you've already learned always come first and don't count toward this number. After you reach your goal, use “Learn more” on Today to keep going.</p>
    <label class="f">New items come from
      <select id="s-mix"><option value="focus"${s.mix === "focus" ? " selected" : ""}>Mostly vocabulary</option>
      <option value="balanced"${s.mix === "balanced" ? " selected" : ""}>All tracks equally</option>
      <option value="vocab"${s.mix === "vocab" ? " selected" : ""}>Vocabulary only</option></select></label>
    <p class="hint">“Mostly vocabulary” makes about 2 in 3 new items words, with the other tracks mixed in.</p>
    <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px"><legend class="sub" style="margin-bottom:6px">Tracks in your daily sessions</legend>
      <label class="c"><input type="checkbox" checked disabled> Vocabulary (always on)</label>
      ${TORDER.slice(1).map(t => `<label class="c"><input type="checkbox" data-tr="${t}"${s.tracks[t] ? " checked" : ""}> ${esc(TR[t].name)}</label>`).join("")}</fieldset>
    <label class="f">Typed answers
      <select id="s-typed"><option value="off"${s.typed === "off" ? " selected" : ""}>Off (multiple choice only)</option>
      <option value="some"${s.typed === "some" ? " selected" : ""}>Sometimes (recommended)</option>
      <option value="often"${s.typed === "often" ? " selected" : ""}>Often (the hardest)</option></select></label>
    <p class="hint">Typed answers are checked by AI and use your daily AI allowance; without AI you grade yourself.</p></section>
  <section class="sh-card"><h2>Color scheme</h2><p class="hint">One choice for all of Study Hall on this device.</p><div id="s-theme"></div></section>
  <section class="sh-card"><h2>Voice</h2>
    <div id="s-shvoice"></div>
    <label class="f">Speed<select id="s-rate">${[["0.75", "Slow"], ["0.95", "Normal"], ["1.1", "Fast"]].map(([v, l]) => `<option value="${v}"${v === DEV.rate ? " selected" : ""}>${l}</option>`).join("")}</select></label>
    <label class="c"><input type="checkbox" id="s-auto"${DEV.auto ? " checked" : ""}> Say new words out loud automatically</label></section>
  <section class="sh-card"><h2>Account</h2><p class="sub" id="s-sync">${esc($("sync").textContent)}</p><div class="row" id="s-who"></div></section>
  <details class="sh-card"><summary>Advanced</summary><div style="display:flex;flex-direction:column;gap:14px">
    <label class="f">Device voice<select id="s-voice"></select></label>
    <button class="sh-btn" type="button" id="s-test">Test the device voice</button>
    <p class="hint">Study Hall voices are natural recordings and sound the same on every device. The device voice plays when they can't, or when you pick “Device voice” above, and sounds different on each device. Audio settings are saved on this device only. If you hear nothing on iPhone, check the silent switch. For a better device voice, go to Settings → Accessibility → Spoken Content → Voices → English and download an “Enhanced” U.S. voice.</p></div></details>
  <section class="sh-card"><h2>Reset my progress</h2><p class="sub">Erase all Word Power progress on every device. This can't be undone.</p><button class="sh-btn" type="button" id="s-reset">Erase my progress</button></section>`;
  const touch = () => { ST.set.ts = Date.now(); save("state"); };
  $("s-goal").onchange = e => { ST.set.goal = +e.target.value; touch(); };
  $("s-mix").onchange = e => { ST.set.mix = e.target.value; touch(); };
  $("s-typed").onchange = e => { ST.set.typed = e.target.value; touch(); };
  document.querySelectorAll("[data-tr]").forEach(c => c.onchange = () => { ST.set.tracks[c.dataset.tr] = c.checked; touch(); });
  SHUI.theme.picker($("s-theme"));
  SH.currentUser().then(u => {
    if (!u || !$("s-who")) return;
    $("s-who").innerHTML = `<span>${esc(u.email)}</span><button class="sh-btn sm" type="button" id="s-signout">Sign out</button>`;
    $("s-signout").onclick = async () => { await SH.sb.auth.signOut(); location.replace(SH.root); };
  }).catch(() => {});
  fillVoices($("s-voice"));
  if (SV) SV.picker($("s-shvoice"), { sample: "Learning a new word is easier when you hear it used in a sentence." });
  $("s-voice").onchange = e => { DEV.voice = e.target.value; saveDev(); };
  $("s-rate").onchange = e => { DEV.rate = e.target.value; saveDev(); };
  $("s-auto").onchange = e => { DEV.auto = e.target.checked; saveDev(); };
  $("s-test").onclick = () => deviceSpeak("Ubiquitous: present, appearing, or found everywhere.");
  $("s-reset").onclick = () => {
    $("dlgin").innerHTML = `<h2>Reset all progress?</h2><p>Type <b>reset</b> to confirm.</p><input type="text" id="rconf" autocomplete="off"><div class="row"><button class="sh-btn" type="button" id="rgo2">Erase everything</button><button class="sh-btn primary" type="button" id="rno">Cancel</button></div>`;
    $("dlg").showModal(); $("rno").onclick = () => $("dlg").close();
    $("rgo2").onclick = () => { if ($("rconf").value.trim().toLowerCase() !== "reset") return; const t0 = Date.now(); ST = freshState(); ST.set.ts = t0; ST.resetAt = t0; R = {}; RUN = null; RUNCLR = t0; save("state", "srs", "run"); flush(); $("dlg").close(); go("today"); };
  };
}

/* ============ start ============ */
document.querySelector(".back").insertAdjacentHTML("afterbegin", SHUI.icon("back", 20));
function start() {
  $("main").innerHTML = `<section class="sh-card center"><p class="sub" role="status">Loading…</p></section>`;
  getJSON(DATA_URL).then(d => { index(d); render(); connect(); }, () => {
    $("main").innerHTML = `<section class="sh-card center"><h2>Word Power didn't load</h2><p>The word list couldn't be downloaded. Check your internet connection, then try again.</p><button class="sh-btn primary" type="button" id="retry">Try again</button></section>`;
    $("retry").onclick = start;
  });
}
start();
/* On a first visit the service worker takes control after the data has loaded, so fetch it once more through the
   worker, which saves it for offline use (if that fails, the next visit saves it). */
if ("serviceWorker" in navigator && !navigator.serviceWorker.controller)
  navigator.serviceWorker.addEventListener("controllerchange", () => fetch(DATA_URL).catch(() => {}), { once: true });
setTimeout(() => { if (synth && !voices.length) loadVoices(); }, 1500);
</script>
